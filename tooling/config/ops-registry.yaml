version: 1
policy:
  opsDiagrams: ephemeral
  notes:
    - Executable ops truth lives in package scripts, hooks, workflows, Gradle tasks, and tooling scripts.
    - docs/ops/diagrams/** are human sketches only and must not be used as validation inputs.
packageScripts:
  verify:cleanup:
    lifecycle: blocking
    lane: local_structural
    command: bash tooling/scripts/gates/check-cleanup-gate.sh
  verify:ops:
    lifecycle: blocking
    lane: ops_wiring
    command: pnpm repo:tooling:check && pnpm repo:ops:sync --check && node tooling/scripts/gates/check-ops-config.mjs
  verify:tdd:
    lifecycle: blocking
    lane: local_tdd
    command: bash tooling/scripts/gates/check-tdd-gate.sh
  verify:backend:static:
    lifecycle: blocking
    lane: backend_static
    command: ./gradlew --no-daemon :services:api:spotlessCheck :services:api:checkstyleMain :services:api:checkstyleTest :services:api:pmdMain :services:api:pmdTest
  verify:backend:
    lifecycle: blocking
    lane: backend_quality
    command: pnpm verify:backend:static && ./gradlew --no-daemon :services:api:check :services:api:jacocoTestCoverageVerification :services:api:openApiValidate
  verify:backend:slice:
    lifecycle: manual
    lane: backend_quality
    command: ./gradlew --no-daemon :services:api:jacocoSliceReport :services:api:jacocoSliceCoverageVerification
  verify:i18n:
    lifecycle: blocking
    lane: frontend_quality
    command: python3 tooling/scripts/governance/validate-i18n.py
  verify:frontend:
    lifecycle: blocking
    lane: frontend_quality
    command: pnpm verify:i18n && turbo run lint typecheck test
  verify:frontend:affected:
    lifecycle: blocking
    lane: frontend_quality
    command: pnpm verify:i18n && turbo run lint typecheck test --affected
  verify:scenario:smoke:
    lifecycle: blocking
    lane: scenario_smoke
    command: python3 tooling/scripts/governance/validate-prd-scenario-links.py && ./gradlew --no-daemon :services:api:gateSmoke
  verify:scenario:fidelity:
    lifecycle: report_only
    lane: scenario_fidelity
    command: python3 tooling/skills/scenario-fidelity/scripts/find_weak_coverage.py
  verify:drift:
    lifecycle: blocking
    lane: drift
    command: pnpm contract:sdk:drift && ./gradlew --no-daemon :services:api:architectureTest
  verify:prepush:
    lifecycle: blocking
    lane: local_main_prepush
    command: pnpm verify:cleanup && pnpm verify:ops && pnpm verify:tdd && pnpm verify:backend && pnpm verify:frontend && pnpm verify:scenario:smoke && pnpm verify:drift
  contract:openapi:bundle:
    lifecycle: manual
    lane: contract
    command: node tooling/scripts/contracts/bundle-openapi.mjs
  contract:openapi:check:
    lifecycle: blocking
    lane: contract
    command: node tooling/scripts/contracts/validate-openapi-phase.mjs && node tooling/scripts/contracts/bundle-openapi.mjs --check && python3 tooling/scripts/contracts/validate-openapi-backend-contracts.py
  contract:sdk:generate:
    lifecycle: manual
    lane: contract
    command: turbo run generate --filter=@tasky/sdk
  contract:sdk:drift:
    lifecycle: blocking
    lane: contract
    command: bash tooling/scripts/contracts/validate-sdk-contract-drift.sh
  repo:docs:claims:
    lifecycle: blocking
    lane: docs
    command: python3 tooling/scripts/governance/validate-doc-claims.py
  repo:docs:claims:triage:
    lifecycle: manual
    lane: docs
    command: python3 tooling/skills/doc-claims-remediation/scripts/triage_doc_claims.py
  repo:docs:claims:audit:
    lifecycle: report_only
    lane: docs
    command: python3 tooling/skills/doc-claims-remediation/scripts/audit_unclaimed_refs.py
  repo:prd:diff-ids:
    lifecycle: report_only
    lane: docs
    command: python3 tooling/skills/intake-to-prd/scripts/extract_prd_diff_ids.py
  repo:design:check:
    lifecycle: blocking
    lane: docs
    command: python3 tooling/skills/design-surface-drift/scripts/check_screen_graph.py && python3 tooling/skills/design-surface-drift/scripts/check_journeys.py && python3 tooling/skills/design-surface-drift/scripts/check_lifecycles.py
  repo:docs:check:
    lifecycle: blocking
    lane: docs
    command: python3 tooling/scripts/governance/check-doc-governance.py && python3 tooling/scripts/governance/validate-doc-references.py && python3 tooling/scripts/governance/validate-prd-scenario-links.py && python3 tooling/scripts/governance/validate-requirement-references.py && python3 tooling/scripts/governance/validate-assistance-vocabulary.py && python3 tooling/scripts/governance/validate-doc-claims.py && python3 tooling/scripts/governance/validate-design-contracts.py && python3 tooling/scripts/governance/validate-screen-spec-traceability.py && pnpm repo:design:check && pnpm contract:openapi:check
  repo:ops:sync:
    lifecycle: blocking
    lane: ops_wiring
    command: node tooling/scripts/gates/sync-ops-registry.mjs
  repo:tooling:check:
    lifecycle: blocking
    lane: tooling
    command: find tooling/scripts -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n && find tooling/scripts -type f -name '*.py' -print0 | xargs -0 -n1 python3 -m py_compile && node --test tooling/tests/*.test.mjs && node tooling/scripts/gates/check-tooling-surface.mjs
  repo:workspace:boundaries:
    lifecycle: blocking
    lane: repo
    command: node tooling/scripts/governance/validate-workspace-boundaries.mjs
  repo:graph:setup:
    lifecycle: manual
    lane: graph
    command: bash tooling/scripts/manual/graphify-setup.sh
  repo:graph:update:
    lifecycle: manual
    lane: graph
    command: bash tooling/scripts/manual/graphify-update.sh
  repo:graph:query:
    lifecycle: manual
    lane: graph
    command: bash tooling/scripts/manual/graphify-query.sh
  build:
    lifecycle: manual
    lane: workspace
    command: turbo build
  test:
    lifecycle: manual
    lane: workspace
    command: turbo test
  test:coverage:
    lifecycle: manual
    lane: workspace
    command: turbo run test:coverage --filter=@tasky/web --filter=@tasky/mobile --filter=@tasky/core
  lint:
    lifecycle: manual
    lane: workspace
    command: turbo lint
  format:
    lifecycle: manual
    lane: workspace
    command: turbo format
  format:check:
    lifecycle: manual
    lane: workspace
    command: turbo format:check
  typecheck:
    lifecycle: manual
    lane: workspace
    command: turbo typecheck
  pack:
    lifecycle: manual
    lane: context_pack
    command: repomix --split-output 2mb
  pack:backend:
    lifecycle: manual
    lane: context_pack
    command: repomix --include 'services/api/**,docs/openapi/**,docs/API.yaml,docs/architecture/common.md,services/api/AGENTS.md,AGENTS.md,tests/**,tooling/config/**,build.gradle.kts,settings.gradle.kts,gradle.properties' -o repomix-backend.xml
  pack:web:
    lifecycle: manual
    lane: context_pack
    command: repomix --include 'apps/web/**,packages/core/**,packages/design-tokens/**,packages/sdk/**,packages/test-utils/**,docs/openapi/**,docs/API.yaml,docs/architecture/common.md,docs/architecture/web.md,docs/architecture/shared-frontend.md,apps/web/AGENTS.md,AGENTS.md,packages/core/AGENTS.md,packages/design-tokens/AGENTS.md,packages/sdk/AGENTS.md,packages/test-utils/AGENTS.md,tsconfig.json' -o repomix-web.xml
  pack:mobile:
    lifecycle: manual
    lane: context_pack
    command: repomix --include 'apps/mobile/**,packages/core/**,packages/design-tokens/**,packages/sdk/**,packages/test-utils/**,docs/openapi/**,docs/API.yaml,docs/architecture/common.md,docs/architecture/mobile.md,docs/architecture/shared-frontend.md,apps/mobile/AGENTS.md,AGENTS.md,packages/core/AGENTS.md,packages/design-tokens/AGENTS.md,packages/sdk/AGENTS.md,packages/test-utils/AGENTS.md' -o repomix-mobile.xml
  prepare:
    lifecycle: manual
    lane: package_lifecycle
    command: husky
hooks:
  .husky/pre-commit:
    lifecycle: blocking
    requiredFragments:
      - gitleaks git --pre-commit --staged --config .gitleaks.toml
      - python3 tooling/scripts/governance/validate-prd-scenario-links.py
      - pnpm exec lint-staged
  .husky/pre-push:
    lifecycle: blocking
    requiredFragments:
      - git diff --quiet
      - git diff --cached --quiet
      - pnpm verify:prepush
      - pnpm verify:cleanup
      - pnpm verify:ops
  .husky/commit-msg:
    lifecycle: blocking
    requiredFragments:
      - feat|fix|refactor|test|docs|chore|perf|security
  .husky/post-checkout:
    lifecycle: manual
    requiredFragments:
      - pnpm install --frozen-lockfile
workflows:
  .github/workflows/dependabot-auto-merge.yml:
    lifecycle: manual
    jobs:
      - auto-merge
    requiredCommands: []
  .github/workflows/build-and-push.yml:
    lifecycle: blocking
    jobs:
      - build-backend
      - build-web
      - scan-images
      - generate-sbom
    requiredCommands:
      - short_sha=${GITHUB_SHA::7}
      - steps.tag.outputs.short_sha
      - aquasecurity/trivy-action
  .github/workflows/deploy-production.yml:
    lifecycle: deploy
    jobs:
      - release-gate
      - verify-image
      - deploy
      - post-deploy-smoke
    requiredCommands:
      - ./.github/workflows/release-gate.yml
      - docker manifest inspect
      - docker compose -f docker-compose.production.yml up -d --no-build --remove-orphans
  .github/workflows/deploy-staging.yml:
    lifecycle: deploy
    jobs:
      - pre-deploy-checks
      - deploy
      - smoke-test
    requiredCommands:
      - python3 tooling/scripts/governance/validate-migrations.py
      - docker compose -f docker-compose.private-staging.yml up -d --no-build --remove-orphans
  .github/workflows/nightly-mobile.yml:
    lifecycle: manual
    jobs:
      - e2e-android
    requiredCommands:
      - pnpm --filter @tasky/mobile test:e2e
  .github/workflows/nightly-regression.yml:
    lifecycle: manual
    jobs:
      - full-regression
      - web-e2e-regression
    requiredCommands:
      - :services:api:gateRegression
      - :services:api:dependencyCheckAnalyze
      - pnpm --filter @tasky/web test:e2e
  .github/workflows/quality-gates.yml:
    lifecycle: blocking
    jobs:
      - structural-gate
      - backend-quality
      - frontend-quality
      - e2e-web
      - e2e-android
      - contracts
      - security
    requiredCommands:
      - pnpm verify:cleanup
      - pnpm verify:ops
      - pnpm verify:backend
      - pnpm verify:scenario:smoke
      - pnpm verify:frontend:affected
      - pnpm verify:drift
      - bash tooling/scripts/governance/check-gitleaks-secret-scan.sh
  .github/workflows/release-gate.yml:
    lifecycle: deploy
    jobs:
      - migration-safety
      - rollback-readiness
      - performance-smoke
      - web-e2e-smoke
      - mobile-e2e-smoke
      - security-scan
      - scenario-regression
      - release-readiness-checklist
    requiredCommands:
      - python3 tooling/scripts/governance/validate-migrations.py
      - :services:api:dependencyCheckAnalyze
      - :services:api:gateRegression
      - bash tooling/scripts/deploy/performance-smoke.sh
  .github/workflows/qodana_code_quality.yml:
    lifecycle: manual
    jobs:
      - qodana
    requiredCommands: []
  .github/workflows/security-review.yml:
    lifecycle: blocking
    jobs:
      - security-critical-guard
    requiredCommands:
      - 'Security-critical files changed:'
composeFiles:
  - docker-compose.yml
  - docker-compose.web.yml
  - docker-compose.observability.yml
  - docker-compose.private-staging.yml
  - docker-compose.production.yml
toolingScripts:
  contracts/bundle-openapi.mjs:
    lifecycle: blocking
  contracts/validate-openapi-backend-contracts.py:
    lifecycle: blocking
  contracts/validate-openapi-phase.mjs:
    lifecycle: blocking
  contracts/validate-sdk-contract-drift.sh:
    lifecycle: blocking
  deploy/bootstrap-private-staging-vps.sh:
    lifecycle: manual
  deploy/deploy-private-staging.sh:
    lifecycle: called_by_script
  deploy/performance-smoke.sh:
    lifecycle: blocking
  deploy/push-private-staging.sh:
    lifecycle: manual
  deploy/push-production.sh:
    lifecycle: manual
  deploy/smoke-private-staging.sh:
    lifecycle: manual
  gates/check-cleanup-gate.sh:
    lifecycle: blocking
  gates/check-gates.sh:
    lifecycle: blocking
  gates/lib/ops-registry.mjs:
    lifecycle: called_by_script
    referencePatterns:
      - ./lib/ops-registry.mjs
  gates/check-ops-config.mjs:
    lifecycle: blocking
  gates/check-tdd-gate.sh:
    lifecycle: blocking
  gates/check-tooling-surface.mjs:
    lifecycle: blocking
  gates/sync-ops-registry.mjs:
    lifecycle: blocking
  generate-licenses.sh:
    lifecycle: manual
  governance/check-doc-governance.py:
    lifecycle: blocking
  governance/check-gitleaks-secret-scan.sh:
    lifecycle: blocking
  governance/check-trivyignore-expiry.sh:
    lifecycle: blocking
  governance/validate-assistance-vocabulary.py:
    lifecycle: blocking
  governance/validate-design-contracts.py:
    lifecycle: report_only
  governance/validate-doc-claims.py:
    lifecycle: blocking
  governance/validate-doc-references.py:
    lifecycle: blocking
  governance/validate-i18n.py:
    lifecycle: blocking
  governance/validate-migrations.py:
    lifecycle: blocking
  governance/validate-prd-scenario-links.py:
    lifecycle: blocking
  governance/validate-requirement-references.py:
    lifecycle: blocking
  governance/validate-screen-spec-traceability.py:
    lifecycle: blocking
  governance/validate-schema-parity.py:
    lifecycle: blocking
  governance/validate-workspace-boundaries.mjs:
    lifecycle: blocking
  manual/graphify-query.sh:
    lifecycle: manual
  manual/graphify-setup.sh:
    lifecycle: manual
  manual/graphify-update.sh:
    lifecycle: manual
  observability/start-alertmanager.sh:
    lifecycle: manual
