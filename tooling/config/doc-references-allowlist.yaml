java_class_false_positives:
  - Tasky
  - Ulaanbaatar
  - Mongolia
  - PostgreSQL
  - RabbitMQ
  - MinIO
  - Firebase
  - React
  - NativeWind
  - Tailwind
  - Docker
  - GitHub
  - PgBouncer
  - Mongolian
  - Facebook
  - OAuth
  - MessageSource
  - SimpMessagingTemplate
  - IllegalArgumentException
  - Phase
  - Launch
  - Product
  - Shared
  - Route
  - Screen
  - ScreenA
  - ScreenB
  - Section
  - Module
  - Design
  - Feature

env_var_false_positives:
  - PATH
  - HOME
  - USER
  - CI

intentional:
  - kind: java-class
    value: ExpoPushProvider
    reason: architecture and module docs cite the retired provider class to document deprecation history
    expires: 2026-09-01

per_file:
  - file: docs/architecture/mobile.md
    suppress:
      - kind: java-class
        value: CustomerTaskDetail
      - kind: java-class
        value: CustomerTasks
  - file: docs/architecture/api.md
    suppress:
      - kind: db-table
        value: jti
  - file: docs/maintenance/PII_INVENTORY.md
    suppress:
      - kind: db-table
        value: actor_user_id
  - file: docs/maintenance/PRODUCTION_RUNBOOK.md
    suppress:
      - kind: env-var
        value: DOCKER_CONFIG
      - kind: env-var
        value: TASKY_APP_IMAGE_TAG
      - kind: env-var
        value: TASKY_BLIND_INDEX_KEY_NEW
      - kind: env-var
        value: NEW_JWT_SECRET
      - kind: env-var
        value: NEW_ENCRYPTION_KEY
      - kind: flyway
        value: V4__revert_X.sql
      - kind: java-fqn
        value: com.tasky.BlindIndexBackfill
      - kind: java-fqn
        value: com.tasky.EncryptionKeyRotation
      - kind: workflow
        value: alertmanager.yml
