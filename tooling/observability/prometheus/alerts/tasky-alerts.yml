groups:
  # ── Operational alerts (section 12) ──────────────────────────────────
  - name: tasky-operational
    rules:
      - alert: APIHealthDown
        expr: up{job="tasky-api"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: 'Tasky API is down'
          description: >-
            The Tasky API health endpoint has been unreachable for 2 consecutive
            checks. Treat as SEV-1: freeze deploys and investigate immediately.
          runbook_url: 'https://github.com/norbu/tasky/blob/main/docs/maintenance/PRODUCTION_READINESS.md'

      - alert: High5xxRate
        expr: >-
          (
            sum(rate(http_server_requests_seconds_count{status=~"5..",uri=~"/api/v1/.*"}[15m]))
            /
            sum(rate(http_server_requests_seconds_count{uri=~"/api/v1/.*"}[15m]))
          ) * 100 > 5
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: 'High 5xx error rate on API routes'
          description: >-
            More than 5% of requests to /api/v1/* are returning 5xx errors for
            the last 15 minutes. Current rate: {{ $value | printf "%.1f" }}%.
            Treat as SEV-1: roll back unless the cause is isolated and quickly reversible.
          runbook_url: 'https://github.com/norbu/tasky/blob/main/docs/maintenance/PRODUCTION_READINESS.md'

      - alert: FacebookAuthFailures
        expr: >-
          sum(rate(http_server_requests_seconds_count{uri=~"/api/v1/auth/facebook",status=~"5.."}[10m]))
          /
          sum(rate(http_server_requests_seconds_count{uri=~"/api/v1/auth/facebook"}[10m]))
          > 0.3
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: 'Sustained Facebook auth failures'
          description: >-
            Facebook authentication endpoint is returning errors at {{ $value | printf "%.0f" }}%%
            of requests over the last 10 minutes. If real sign-in is unavailable for
            launch users, treat as SEV-1.
          runbook_url: 'https://github.com/norbu/tasky/blob/main/docs/maintenance/PRODUCTION_READINESS.md'

