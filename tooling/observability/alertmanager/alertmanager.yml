global:
  resolve_timeout: 5m

route:
  receiver: webhook
  group_by: [severity, alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - match:
        severity: critical
      receiver: webhook
      repeat_interval: 1h

receivers:
  - name: webhook
    webhook_configs:
      - url: '__ALERT_WEBHOOK_URL__'
        send_resolved: true

