spring:
  application:
    name: tasky-server
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:tasky}
    # Runtime app user: least-privilege account created by docker/init-db.sql
    username: ${APP_DB_USER:tasky_app}
    password: ${APP_DB_PASSWORD:tasky_app}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL:10}
      minimum-idle: ${HIKARI_MIN_IDLE:2}
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 600000
      pool-name: tasky-hikari
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    # Migration owner: separate from the runtime app user to preserve least-privilege
    user: ${POSTGRES_USER:tasky}
    password: ${POSTGRES_PASSWORD:tasky}
    placeholders:
      tasky_blind_index_key: ${TASKY_BLIND_INDEX_KEY:}
  messages:
    basename: i18n/messages
    encoding: UTF-8
    fallback-to-system-locale: false

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
      group:
        readiness:
          include: db,facebook,outbox
        liveness:
          include: ping
    prometheus:
      access: read_only
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  prometheus:
    metrics:
      export:
        enabled: true

tasky:
  api:
    version: v1
  runtime:
    public-api:
      enabled: ${TASKY_RUNTIME_PUBLIC_API_ENABLED:true}
      base-path: ${TASKY_RUNTIME_PUBLIC_API_BASE_PATH:/api}
    admin-api:
      enabled: ${TASKY_RUNTIME_ADMIN_API_ENABLED:true}
      base-path: ${TASKY_RUNTIME_ADMIN_API_BASE_PATH:/api/admin}
    worker:
      enabled: ${TASKY_RUNTIME_WORKER_ENABLED:true}
    scheduler:
      enabled: ${TASKY_RUNTIME_SCHEDULER_ENABLED:true}
  otp:
    enabled: ${TASKY_OTP_ENABLED:false}
  facebook:
    app-id: ${TASKY_FACEBOOK_APP_ID:}
    app-secret: ${TASKY_FACEBOOK_APP_SECRET:}
    graph-api-base-url: ${TASKY_FACEBOOK_GRAPH_API_BASE_URL:https://graph.facebook.com}
  auth:
    otp-ttl-seconds: ${TASKY_OTP_TTL_SECONDS:300}
    otp-test-code: ${TASKY_OTP_TEST_CODE:}
  dev-auth:
    enabled: ${TASKY_DEV_AUTH_ENABLED:false}
  rate-limit:
    trusted-proxy-depth: ${TASKY_RATE_LIMIT_TRUSTED_PROXY_DEPTH:0}
  security:
    jwt-secret: ${TASKY_JWT_SECRET}
    encryption-key: ${TASKY_ENCRYPTION_KEY}
    blind-index-key: ${TASKY_BLIND_INDEX_KEY}
    access-token-ttl-seconds: ${TASKY_ACCESS_TOKEN_TTL_SECONDS:900}
    refresh-token-ttl-seconds: ${TASKY_REFRESH_TOKEN_TTL_SECONDS:1209600}
  qpay:
    webhook-secret: ${TASKY_QPAY_WEBHOOK_SECRET}
  features:
    monetization-enabled: ${TASKY_FEATURE_MONETIZATION_ENABLED:false}
  cors:
    allowed-origins: ${TASKY_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  websocket:
    allowed-origins: ${TASKY_WEBSOCKET_ALLOWED_ORIGINS:http://localhost:5173}
  storage:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:tasky-local}
    upload-ttl-seconds: ${TASKY_STORAGE_UPLOAD_TTL_SECONDS:900}
    download-ttl-seconds: ${TASKY_STORAGE_DOWNLOAD_TTL_SECONDS:3600}
  push:
    provider: ${TASKY_PUSH_PROVIDER:logging}
    # Options:
    #   logging   — dev default; logs pushes to console, no real delivery
    #   firebase  — production; requires FIREBASE_SERVICE_ACCOUNT_JSON env var
    #   expo      — DEPRECATED; retained in config history only, class removed
