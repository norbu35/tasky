# CI profile — used by E2E jobs (e2e-web, e2e-android, e2e-ios)
# Expects: docker-compose Postgres on localhost:5432, MinIO on localhost:9000
# Expects: secrets via environment variables from GitHub Actions

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/tasky
    username: ${APP_DB_USER:tasky_app}
    password: ${APP_DB_PASSWORD:tasky_app}

  flyway:
    url: jdbc:postgresql://localhost:5432/tasky
    user: ${POSTGRES_USER:tasky}
    password: ${POSTGRES_PASSWORD:tasky}

tasky:
  dev-auth:
    enabled: true

  facebook:
    app-id: ${FACEBOOK_TEST_APP_ID:}
    app-secret: ${FACEBOOK_TEST_APP_SECRET:}

  auth:
    jwt-secret: ${TASKY_JWT_SECRET}
    encryption-key: ${TASKY_ENCRYPTION_KEY}
    blind-index-key: ${TASKY_BLIND_INDEX_KEY}

  qpay:
    webhook-secret: ${TASKY_QPAY_WEBHOOK_SECRET}

  storage:
    endpoint: http://localhost:9000
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:tasky-local}
    upload-ttl-seconds: 900
    download-ttl-seconds: 3600

  cors:
    allowed-origins: http://localhost:4173,http://localhost:5173

  push:
    provider: logging

  feature:
    monetization-enabled: false

  automation:
    broker:
      enabled: false
