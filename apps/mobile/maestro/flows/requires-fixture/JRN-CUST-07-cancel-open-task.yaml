appId: mn.tasky.mobile
---
# Journey JRN-CUST-07: Cancel Open Task
# Source: docs/design/journey-catalog.yaml
# Covered states: SCR-CUST-009, SCR-CUST-010, SCR-CUST-001
# Actor: customer
# Flow type: happy path
# Precondition: Logged in as customer; open task (no applicants) exists

- launchApp:
    clearState: true

- runFlow: ../_support/login-customer.yaml

- extendedWaitUntil:
    visible:
      id: "SCR-CUST-001"
    timeout: 5000

# Step 1: Open task detail (SCR-CUST-009)
- tapOn:
    id: "my-tasks-feed"

- extendedWaitUntil:
    visible:
      id: "SCR-CUST-009"
    timeout: 5000

# Tap 'Cancel Task' → Cancel confirmation screen (SCR-CUST-010)
- tapOn:
    id: "task-detail-cancel-button"

- extendedWaitUntil:
    visible:
      id: "SCR-CUST-010"
    timeout: 3000

# Step 2: Confirm cancellation → return to home (SCR-CUST-001)
- tapOn:
    id: "task-cancel-confirm"

- extendedWaitUntil:
    visible:
      id: "SCR-CUST-001"
    timeout: 5000
