appId: mn.tasky.mobile
---
# Capture SCR-CUST-017 booking detail and support sheet states for visual QA.
# Precondition: app is already logged in as a customer on SCR-CUST-001 and an
# assigned booking fixture exists.

- runFlow:
    when:
      visible:
        id: 'SCR-CUST-001'
    commands:
      - tapOn:
          id: 'tab-bookings'

- extendedWaitUntil:
    visible:
      id: 'SCR-CUST-016'
    timeout: 10000

- tapOn:
    id: 'booking-card-active'

- extendedWaitUntil:
    visible:
      id: 'SCR-CUST-017'
    timeout: 10000

- takeScreenshot: screenshots/SCR-CUST-017-booking-detail

- scrollUntilVisible:
    element:
      id: 'booking-detail-address-section'
    direction: DOWN

- assertVisible:
    id: 'booking-detail-address-section'

- scrollUntilVisible:
    element:
      id: 'booking-detail-payment-note'
    direction: DOWN

- assertVisible:
    id: 'booking-detail-payment-note'
- swipe:
    direction: UP
    duration: 500
- waitForAnimationToEnd
- takeScreenshot: screenshots/SCR-CUST-017-booking-detail-summary

- scrollUntilVisible:
    element:
      id: 'booking-detail-screen-no-show-btn'
    direction: DOWN

- tapOn:
    id: 'booking-detail-screen-no-show-btn'

- extendedWaitUntil:
    visible:
      id: 'SCR-CUST-021'
    timeout: 5000

- assertVisible:
    id: 'confirm-sheet-backdrop'
- takeScreenshot: screenshots/SCR-CUST-017-no-show-sheet

- tapOn:
    id: 'confirm-sheet-backdrop'
