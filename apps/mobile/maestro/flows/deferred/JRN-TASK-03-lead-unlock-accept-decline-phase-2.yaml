appId: mn.tasky.mobile
---
# Journey JRN-TASK-03: Lead Unlock Accept/Decline (Phase 2)
# Source: docs/design/journey-catalog.yaml
# Covered states: SCR-TASK-017, SCR-TASK-012
# Actor: tasker
# Flow type: happy path
# Phase gate: Phase 2
# Precondition: Logged in as tasker; selection notification received
# STATUS: BLOCKED — tab-notifications does not exist in (tabs)/_layout.tsx.
#   Notifications are accessed via (shared)/notifications.tsx but there is no
#   tab bar entry or header button for it on the tasker browse screen.
#   Will be enabled when a notifications entry point is added for taskers.

- launchApp:
    clearState: true

- runFlow: ../_support/login-tasker.yaml

# Step 1: Navigate to lead unlock notification screen (SCR-TASK-017)
- tapOn:
    id: "tab-notifications"

- extendedWaitUntil:
    visible:
      id: "SCR-TASK-017"
    timeout: 5000

# Step 2: Tap 'Accept' — credits deducted → My Jobs (SCR-TASK-012)
- tapOn:
    id: "lead-unlock-accept"

- extendedWaitUntil:
    visible:
      id: "SCR-TASK-012"
    timeout: 5000
