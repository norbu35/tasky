appId: mn.tasky.mobile
---
# Screen SCR-P3-003: Escrow Payment Flow
# Flow type: smoke test
# Precondition: Logged in as customer; booking eligible for escrow payment exists
# STATUS: BLOCKED — two reasons:
#   1. Customer uses Stack navigator; tab-bookings does not exist.
#   2. Requires backend data: an escrow-eligible booking must exist.
# Will be enabled when Phase 3 is released with real booking data.

- launchApp:
    clearState: true
- runFlow: ../_support/login-customer.yaml

- tapOn:
    point: "38%,93%"

- extendedWaitUntil:
    visible:
      id: "SCR-CUST-016"
    timeout: 5000

- tapOn:
    id: "booking-card-escrow-eligible"

- extendedWaitUntil:
    visible:
      id: "SCR-CUST-017"
    timeout: 5000

- tapOn:
    id: "booking-detail-escrow-link"

- extendedWaitUntil:
    visible:
      id: "SCR-P3-003"
    timeout: 5000
