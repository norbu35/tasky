appId: mn.tasky.mobile
---
# Journey JRN-CUST-08: Instant Match (Phase 3)
# Source: docs/design/journey-catalog.yaml
# Covered states: SCR-CUST-009, SCR-CUST-027, SCR-CUST-014, SCR-CUST-015
# Actor: customer
# Flow type: happy path
# Phase gate: Phase 3
# Precondition: Logged in as customer; task has instant match option enabled

- launchApp:
    clearState: true

- runFlow: ../_support/login-customer.yaml

- extendedWaitUntil:
    visible:
      id: "SCR-CUST-001"
    timeout: 5000

# Step 1: Open task detail (SCR-CUST-009)
- tapOn:
    id: "my-tasks-feed"

- extendedWaitUntil:
    visible:
      id: "SCR-CUST-009"
    timeout: 5000

# Tap 'Instant Match' → Instant match modal (SCR-CUST-027)
- tapOn:
    id: "task-detail-instant-match-button"

- extendedWaitUntil:
    visible:
      id: "SCR-CUST-027"
    timeout: 5000

# Step 2: System auto-assigns top Tasker → Booking confirmation (SCR-CUST-014)
- tapOn:
    id: "instant-match-confirm-button"

- extendedWaitUntil:
    visible:
      id: "SCR-CUST-014"
    timeout: 10000

# Step 3: Confirm booking → Success (SCR-CUST-015)
- tapOn:
    id: "booking-confirm-button"

- extendedWaitUntil:
    visible:
      id: "SCR-CUST-015"
    timeout: 10000
