appId: mn.tasky.mobile
---
# Journey JRN-TASK-01: Tasker Verification
# Source: docs/design/journey-catalog.yaml
# Covered states: SCR-TASK-003, SCR-TASK-004, SCR-TASK-005, SCR-TASK-010
# Actor: tasker (unverified)
# Flow type: happy path
# Note: upload.tsx has TODOs; navigate through screens without actual file upload

- launchApp:
    clearState: true

- runFlow: _support/login-tasker.yaml

# Wait for tasker browse screen to confirm login succeeded
- extendedWaitUntil:
    visible:
      id: "SCR-TASK-001"
    timeout: 5000

# Navigate directly to the verification gate via deep link.
# The browse feed may be empty in E2E (no seeded tasks), so we cannot rely on
# tapping a task card → task detail → "Get Verified" CTA.
# Expo Router resolves tasky://(tasker)/verification to verification/index.tsx (SCR-TASK-003).
- openLink: "tasky://(tasker)/verification"

# Dismiss iOS "Open in Tasky?" system dialog
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"

# Verification gate screen
- extendedWaitUntil:
    visible:
      id: "SCR-TASK-003"
    timeout: 5000

# Tap the start-verification CTA (testID: verification-gate-cta from VerificationGate component)
- tapOn:
    id: "SCR-TASK-003-cta"

# Consent screen
- extendedWaitUntil:
    visible:
      id: "SCR-TASK-004"
    timeout: 5000

# Consent CTA is disabled until user scrolls to the bottom of the legal text.
# The CTA sits in a StickyActionBar (always visible), so we scroll the content
# until the privacy link at the bottom of the scroll view is visible —
# this triggers the hasScrolledToEnd state and enables the button.
- scrollUntilVisible:
    element:
      id: "consent-privacy-link"
    direction: DOWN

# Extra swipe to ensure hasScrolledToEnd triggers
- swipe:
    direction: UP
    duration: 500
- waitForAnimationToEnd

- assertVisible:
    id: "consent-screen-cta"
- tapOn:
    id: "consent-screen-cta"

# Upload screen
- extendedWaitUntil:
    visible:
      id: "SCR-TASK-005"
    timeout: 5000

# Tap camera button to open system camera/picker for ID front
- tapOn:
    id: "capture-camera-btn"
# NOTE: System camera/file picker opens; Maestro cannot interact with OS-level pickers.
# If this step fails, document as KNOWN-LIMITATION: camera/file picker requires device setup.

# Tap the FormWizard "Next" / "Submit" button to advance or submit
- tapOn:
    id: "SCR-TASK-005-next"

- extendedWaitUntil:
    visible:
      id: "SCR-TASK-010"
    timeout: 10000

- assertVisible:
    id: "SCR-TASK-010"
