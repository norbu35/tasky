appId: mn.tasky.mobile
---
# _support/login-customer.yaml
# Precondition: App is launched and at login screen (SCR-SHARED-002)
# Postcondition: User is logged in as Customer and on customer task list (SCR-CUST-001)
# Uses dev auth bypass (EXPO_PUBLIC_DEV_AUTH_ENABLED=true required)
# Handles the onboarding flow if clearState cleared hasSeenOnboarding

- extendedWaitUntil:
    visible:
      id: "SCR-SHARED-002"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "dev-login-customer"
    direction: DOWN
- tapOn:
    id: "dev-login-customer"

# If onboarding appears (clearState wiped hasSeenOnboarding), go through it as customer
- runFlow:
    when:
      visible:
        id: "SCR-SHARED-005"
    commands:
      - tapOn:
          id: "onboarding-skip"
      - extendedWaitUntil:
          visible:
            id: "SCR-SHARED-006"
          timeout: 10000
      - tapOn:
          id: "role-card-customer"
      - tapOn:
          id: "role-confirm-button"
      - extendedWaitUntil:
          visible:
            id: "role-sheet-confirm"
          timeout: 5000
      - tapOn:
          id: "role-sheet-confirm"
      - waitForAnimationToEnd
      - extendedWaitUntil:
          visible:
            id: "SCR-SHARED-007"
          timeout: 15000
      - tapOn:
          id: "permission-allow-button"
      - extendedWaitUntil:
          visible:
            id: "SCR-SHARED-008"
          timeout: 10000
      - tapOn:
          id: "permission-allow-button"
      - extendedWaitUntil:
          visible:
            id: "SCR-SHARED-009"
          timeout: 10000
      - tapOn:
          id: "permission-allow-button"

- extendedWaitUntil:
    visible:
      id: "SCR-CUST-001"
    timeout: 15000
