appId: mn.tasky.mobile
---
# _support/login-tasker.yaml
# Precondition: App is launched and at login screen (SCR-SHARED-002)
# Postcondition: User is logged in as Tasker and on tasker feed (SCR-TASK-001)
# Uses real backend dev auth (POST /api/v1/auth/dev/login)
# Handles the onboarding flow if clearState cleared hasSeenOnboarding

# Dismiss any system "Open in App?" dialog left over from prior deep-link flows
- runFlow:
    when:
      visible: "Cancel"
    commands:
      - tapOn: "Cancel"

# Dismiss any iOS system permission dialog left over from a prior flow
- runFlow:
    when:
      visible: "Allow"
    commands:
      - tapOn: "Allow"
      - waitForAnimationToEnd

# Wait for app UI to settle before checking for Android-specific dialogs
- waitForAnimationToEnd

# Dismiss Android 16KB page-size compatibility dialog (appears on API 35+ emulators)
- runFlow:
    when:
      visible: "Don't Show Again"
    commands:
      - tapOn: "Don't Show Again"
      - waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: "SCR-SHARED-002"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "dev-login-tasker"
    direction: DOWN
- tapOn:
    id: "dev-login-tasker"

# If onboarding appears (clearState wiped hasSeenOnboarding), go through it as tasker
- runFlow:
    when:
      visible:
        id: "SCR-SHARED-005"
    commands:
      - tapOn:
          id: "onboarding-skip"
      - extendedWaitUntil:
          visible:
            id: "SCR-SHARED-006"
          timeout: 10000
      - tapOn:
          id: "role-card-tasker"
      - tapOn:
          id: "role-confirm-button"
      - extendedWaitUntil:
          visible:
            id: "role-sheet-confirm"
          timeout: 5000
      - tapOn:
          id: "role-sheet-confirm"
      - waitForAnimationToEnd
      # Permission screens: use "Skip for now" to bypass reliably on Android.
      # See login-customer.yaml for rationale.
      # SCR-SHARED-007 — Camera permission
      - extendedWaitUntil:
          visible:
            id: "SCR-SHARED-007"
          timeout: 15000
      - tapOn:
          id: "permission-skip-button"
      - waitForAnimationToEnd
      # SCR-SHARED-008 — Location permission
      - runFlow:
          when:
            visible:
              id: "SCR-SHARED-008"
          commands:
            - tapOn:
                id: "permission-skip-button"
            - waitForAnimationToEnd
      # SCR-SHARED-009 — Notification permission
      - runFlow:
          when:
            visible:
              id: "SCR-SHARED-009"
          commands:
            - tapOn:
                id: "permission-skip-button"
            - waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: "SCR-TASK-001"
    timeout: 15000
