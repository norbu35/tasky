appId: mn.tasky.mobile
---
# Journey JRN-SHARED-05: Profile Management
# Source: docs/design/journey-catalog.yaml
# Covered states: SCR-SHARED-012 (profile), SCR-SHARED-013 (profile edit)
# Actor: tasker (only taskers have the (tabs) navigator with profile tab)
# Flow type: happy path
# Note: profile/edit.tsx has TODO markers; test navigation only, not deep form validation
# Note: Edit profile is exposed as an action row on SCR-SHARED-012.

- launchApp:
    clearState: true

- runFlow: _support/login-tasker.yaml

# Navigate to Profile tab (tasker (tabs) navigator)
- tapOn:
    id: 'tab-profile'

- extendedWaitUntil:
    visible:
      id: 'SCR-SHARED-012'
    timeout: 10000

# Tap Edit Profile action row.
- tapOn:
    id: 'action-row-edit-profile'
- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: 'SCR-SHARED-013'
    timeout: 10000

# Go back without saving
- tapOn: 'Back'

- extendedWaitUntil:
    visible:
      id: 'SCR-SHARED-012'
    timeout: 5000
