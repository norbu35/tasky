appId: mn.tasky.mobile
---
# Journey JRN-TASK-04: Manage Active Booking (Tasker)
# Source: docs/design/journey-catalog.yaml
# Covered states: SCR-TASK-012, SCR-TASK-013, SCR-SHARED-017
# Actor: tasker
# Flow type: happy path
# Precondition: Logged in as tasker; assigned booking exists

- launchApp

- runFlow: _support/login-tasker.yaml

- extendedWaitUntil:
    visible:
      id: "SCR-TASK-012"
    timeout: 5000

# Step 1: Filter to active jobs
- tapOn:
    id: "my-jobs-filter-bar"

# Step 2: Open active job → Booking detail (SCR-TASK-013)
- tapOn:
    id: "job-card-active"

- extendedWaitUntil:
    visible:
      id: "SCR-TASK-013"
    timeout: 5000

# Verify key elements
- assertVisible:
    id: "booking-detail-tasker-cancel"

# Step 3: Mark job as done
- tapOn:
    id: "booking-detail-mark-done"

# Confirm completion
- extendedWaitUntil:
    visible:
      id: "booking-detail-confirm-completion-sheet"
    timeout: 3000
- tapOn:
    id: "booking-detail-confirm-done"

# Step 4: Customer confirms → Review screen (SCR-SHARED-017)
- extendedWaitUntil:
    visible:
      id: "SCR-SHARED-017"
    timeout: 10000
