appId: mn.tasky.mobile
---
# Journey JRN-SHARED-01: First Launch & Onboarding
# Source: docs/design/journey-catalog.yaml
# Covered states: SCR-SHARED-005 (onboarding), SCR-SHARED-006 (role select),
#   SCR-SHARED-007/008/009 (permission primers)
# Actor: new user (no role yet)
# Flow type: happy path

- launchApp:
    clearState: true

# clearState clears AsyncStorage (where hasSeenOnboarding is stored via Zustand persist).
# With hasSeenOnboarding=false and no session, index.tsx now routes to /onboarding.
- extendedWaitUntil:
    visible:
      id: "SCR-SHARED-005"
    timeout: 10000

# Swipe through 3 slides using Next button
- tapOn:
    id: "onboarding-next"
- tapOn:
    id: "onboarding-next"
# Third slide: Get Started button
- tapOn: "Get Started"

# Role selection screen
- assertVisible:
    id: "SCR-SHARED-006"
- tapOn:
    id: "role-card-customer"
- tapOn:
    id: "role-confirm-button"

# Camera permission primer (custom RN screen, not OS dialog)
- extendedWaitUntil:
    visible:
      id: "SCR-SHARED-007"
    timeout: 5000
- tapOn:
    id: "permission-allow-button"

# Location permission primer
- extendedWaitUntil:
    visible:
      id: "SCR-SHARED-008"
    timeout: 5000
- tapOn:
    id: "permission-allow-button"

# Notifications permission primer
- extendedWaitUntil:
    visible:
      id: "SCR-SHARED-009"
    timeout: 5000
- tapOn:
    id: "permission-allow-button"

# completeOnboarding() is called in permission-notifications — lands on customer task list
- extendedWaitUntil:
    visible:
      id: "SCR-CUST-001"
    timeout: 10000
