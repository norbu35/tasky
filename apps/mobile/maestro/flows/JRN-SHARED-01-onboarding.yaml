appId: mn.tasky.mobile
---
# Journey JRN-SHARED-01: First Launch & Onboarding
# Source: docs/design/journey-catalog.yaml
# Covered states: SCR-SHARED-005 (onboarding), SCR-SHARED-006 (role select)
# Actor: new user (no role yet)
# Flow type: happy path
#
# INFRA_DEPENDENCY: iOS preserves onboarding-seen flags outside AsyncStorage.
# clearState alone does NOT re-trigger onboarding on an already-installed app.
# To run this flow, uninstall first:
#   xcrun simctl uninstall booted mn.tasky.mobile
#   pnpm --filter @tasky/mobile run ios
# Then run this flow before any other flow.

- launchApp:
    clearState: true

# Fresh install → splash → onboarding carousel
- extendedWaitUntil:
    visible:
      id: "SCR-SHARED-005"
    timeout: 10000

# Swipe through 3 slides
- tapOn:
    id: "onboarding-next"
- tapOn:
    id: "onboarding-next"
- tapOn: "Get Started"

# Role selection
- assertVisible:
    id: "SCR-SHARED-006"
- tapOn:
    id: "role-card-customer"
- tapOn:
    id: "role-confirm-button"

# iOS permission dialogs appear as native system prompts — tap Allow via text match
- extendedWaitUntil:
    anyOf:
      - visible: "Allow"
      - visible:
          id: "SCR-SHARED-002"
    timeout: 8000
- tapOn: "Allow"
- extendedWaitUntil:
    anyOf:
      - visible: "Allow"
      - visible:
          id: "SCR-SHARED-002"
    timeout: 5000
- tapOn: "Allow"
- extendedWaitUntil:
    anyOf:
      - visible: "Allow"
      - visible:
          id: "SCR-SHARED-002"
    timeout: 5000
- tapOn: "Allow"

# End state: login screen
- assertVisible:
    id: "SCR-SHARED-002"
