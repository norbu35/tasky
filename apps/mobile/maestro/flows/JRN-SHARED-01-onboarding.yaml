appId: mn.tasky.mobile
---
# Journey JRN-SHARED-01: First Launch & Onboarding
# Source: docs/design/journey-catalog.yaml
# Covered states: SCR-SHARED-001 (splash), SCR-SHARED-002 (login),
#   SCR-SHARED-005 (onboarding), SCR-SHARED-006 (role select),
#   SCR-SHARED-007/008/009 (permission primers)
# Actor: new user (no role yet)
# Flow type: happy path
# Per PRD §6.1: Authenticate FIRST, then onboard.

- launchApp:
    clearState: true

# clearState clears AsyncStorage → session=null, hasSeenOnboarding=false.
# index.tsx: !session → /(auth) (login screen).
- extendedWaitUntil:
    visible:
      id: "SCR-SHARED-002"
    timeout: 10000

# Step 2: Log in with Facebook (first-time signup)
- tapOn:
    id: "facebook-login-button"

# After first-time auth: session exists, hasSeenOnboarding=false → /onboarding
- extendedWaitUntil:
    visible:
      id: "SCR-SHARED-005"
    timeout: 30000

# Swipe through 3 onboarding slides
- tapOn:
    id: "onboarding-next"
- tapOn:
    id: "onboarding-next"
- tapOn: "Get Started"

# Role selection screen
- assertVisible:
    id: "SCR-SHARED-006"
- tapOn:
    id: "role-card-customer"
- tapOn:
    id: "role-confirm-button"

# Camera permission primer (custom RN screen, not OS dialog)
- extendedWaitUntil:
    visible:
      id: "SCR-SHARED-007"
    timeout: 5000
- tapOn:
    id: "permission-allow-button"

# Location permission primer
- extendedWaitUntil:
    visible:
      id: "SCR-SHARED-008"
    timeout: 5000
- tapOn:
    id: "permission-allow-button"

# Notifications permission primer — calls completeOnboarding()
- extendedWaitUntil:
    visible:
      id: "SCR-SHARED-009"
    timeout: 5000
- tapOn:
    id: "permission-allow-button"

# Exit: customer home (role was set to customer)
- extendedWaitUntil:
    visible:
      id: "SCR-CUST-001"
    timeout: 10000
