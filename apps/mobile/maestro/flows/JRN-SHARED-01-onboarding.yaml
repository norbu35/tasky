appId: mn.tasky.mobile
---
# Journey JRN-SHARED-01: First Launch & Onboarding
# Source: docs/design/journey-catalog.yaml
# Covered states: SCR-SHARED-001 (splash), SCR-SHARED-002 (login),
#   SCR-SHARED-005 (onboarding), SCR-SHARED-006 (role select),
#   SCR-SHARED-007/008/009 (permission primers)
# Actor: new user (no role yet)
# Flow type: happy path
# Per PRD §6.1: Authenticate FIRST, then onboard.
# Note: Uses real backend dev auth (POST /api/v1/auth/dev/login)

- launchApp:
    clearState: true

# clearState clears AsyncStorage → session=null, hasSeenOnboarding=false.
# index.tsx: !session → /(auth) (login screen).
- extendedWaitUntil:
    visible:
      id: "SCR-SHARED-002"
    timeout: 10000

# Step 2: Log in via real backend dev auth (simulates first-time signup)
- scrollUntilVisible:
    element:
      id: "dev-login-customer"
    direction: DOWN
- tapOn:
    id: "dev-login-customer"

# After first-time auth: session exists, hasSeenOnboarding=false → /onboarding
- extendedWaitUntil:
    visible:
      id: "SCR-SHARED-005"
    timeout: 15000

# Diagnostic: tap Skip on slide 1 to test navigation from onboarding
- tapOn:
    id: "onboarding-skip"

# Role selection screen (wait for navigation)
- extendedWaitUntil:
    visible:
      id: "SCR-SHARED-006"
    timeout: 10000
- tapOn:
    id: "role-card-customer"
- tapOn:
    id: "role-confirm-button"
# Confirmation modal appears — tap confirm
- extendedWaitUntil:
    visible:
      id: "role-sheet-confirm"
    timeout: 5000
- tapOn:
    id: "role-sheet-confirm"

# Camera permission primer (custom RN screen, not OS dialog)
- extendedWaitUntil:
    visible:
      id: "SCR-SHARED-007"
    timeout: 5000
- tapOn:
    id: "permission-allow-button"

# Location permission primer
- extendedWaitUntil:
    visible:
      id: "SCR-SHARED-008"
    timeout: 5000
- tapOn:
    id: "permission-allow-button"

# Notifications permission primer — calls completeOnboarding()
- extendedWaitUntil:
    visible:
      id: "SCR-SHARED-009"
    timeout: 5000
- tapOn:
    id: "permission-allow-button"

# Exit: customer home (role was set to customer)
- extendedWaitUntil:
    visible:
      id: "SCR-CUST-001"
    timeout: 10000
