appId: mn.tasky.mobile
---
# Screen SCR-INFRA-004: Terms of Service
# Flow type: smoke test
# Note: reachable from login screen footer (no auth required)

- launchApp:
    clearState: true

- extendedWaitUntil:
    visible:
      id: "SCR-SHARED-002"
    timeout: 30000

# Scroll down to reveal footer links (they are below the sticky action bar)
- scrollUntilVisible:
    element:
      id: "login-footer-terms"
    direction: down
    timeout: 5000

- tapOn:
    id: "login-footer-terms"

- extendedWaitUntil:
    visible:
      id: "SCR-INFRA-004"
    timeout: 5000
