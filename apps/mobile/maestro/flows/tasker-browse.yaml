appId: mn.tasky.mobile
---
# Tasker Browse Smoke
# Verifies a tasker can log in and land on the browse surface.
# Under the current deterministic dev-auth personas, the task feed is empty by
# design, so this flow asserts the browse shell and empty state instead of
# relying on seeded task cards.

- launchApp:
    clearState: true

- runFlow: _support/login-tasker.yaml

# Wait for the tasker feed to load
- extendedWaitUntil:
    visible:
      id: 'SCR-TASK-001'
    timeout: 15000

- assertVisible:
    id: 'task-feed'

- assertVisible:
    id: 'task-feed-filter-bar'

- assertVisible:
    id: 'task-feed-empty'

- assertVisible:
    id: 'task-feed-empty-cta'
