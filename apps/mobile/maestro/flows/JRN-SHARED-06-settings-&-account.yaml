appId: mn.tasky.mobile
---
# Journey JRN-SHARED-06: Settings & Account
# Source: docs/design/journey-catalog.yaml
# Covered states: SCR-SHARED-012 (profile), SCR-SHARED-014 (settings)
# Actor: customer
# Flow type: happy path
# Note: customer profile exposes settings as the secondary CTA.

- launchApp:
    clearState: true

- runFlow: _support/login-customer.yaml

# Navigate to Profile tab
- tapOn:
    id: 'tab-profile'

- extendedWaitUntil:
    visible:
      id: 'SCR-SHARED-012'
    timeout: 10000

# Open settings via the profile secondary CTA.
- tapOn:
    id: 'SCR-SHARED-012-secondary-cta'

- extendedWaitUntil:
    visible:
      id: 'SCR-SHARED-014'
    timeout: 10000

- assertVisible:
    id: 'SCR-SHARED-014'
