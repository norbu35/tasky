appId: mn.tasky.mobile
---
# Capture flow for shared/profile/settings batch visual audit — April 2026
# Captures: SCR-SHARED-012 (customer), SCR-SHARED-012 (tasker), SCR-SHARED-013,
#           SCR-SHARED-014, SCR-SHARED-016, SCR-INFRA-004, SCR-TASK-018

# === Customer login: profile ===
- launchApp:
    clearState: true
- runFlow: _support/login-customer.yaml
- tapOn:
    id: 'tab-profile'
- extendedWaitUntil:
    visible:
      id: 'SCR-SHARED-012'
    timeout: 10000
- takeScreenshot: screenshots/SCR-SHARED-012-profile-customer

# Open settings via secondary CTA
- tapOn:
    id: 'SCR-SHARED-012-secondary-cta'
- extendedWaitUntil:
    visible:
      id: 'SCR-SHARED-014'
    timeout: 10000
- takeScreenshot: screenshots/SCR-SHARED-014-settings

# Swipe to show danger zone section
- swipe:
    direction: UP
    duration: 500
- waitForAnimationToEnd
- takeScreenshot: screenshots/SCR-SHARED-014-settings-bottom

# === SCR-SHARED-016: Notification Center ===
# Restart as customer to reach SCR-CUST-001 cleanly
- launchApp:
    clearState: true
- runFlow: _support/login-customer.yaml
- extendedWaitUntil:
    visible:
      id: 'SCR-CUST-001'
    timeout: 10000
- tapOn:
    id: 'my-tasks-notifications'
- extendedWaitUntil:
    visible:
      id: 'SCR-SHARED-016'
    timeout: 5000
- takeScreenshot: screenshots/SCR-SHARED-016-notification-center

# === SCR-INFRA-004: Terms of Service ===
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: 'SCR-SHARED-002'
    timeout: 30000
- scrollUntilVisible:
    element:
      id: 'login-footer-terms'
    direction: down
    timeout: 5000
- tapOn:
    id: 'login-footer-terms'
- extendedWaitUntil:
    visible:
      id: 'SCR-INFRA-004'
    timeout: 5000
- takeScreenshot: screenshots/SCR-INFRA-004-terms-of-service

# === SCR-TASK-018: Privacy Policy ===
- tapOn:
    id: 'terms-screen-back'
- extendedWaitUntil:
    visible:
      id: 'SCR-SHARED-002'
    timeout: 10000
- tapOn:
    id: 'login-footer-privacy'
- extendedWaitUntil:
    visible:
      id: 'SCR-TASK-018'
    timeout: 5000
- takeScreenshot: screenshots/SCR-TASK-018-privacy-policy

# === Tasker login: profile + profile edit ===
- launchApp:
    clearState: true
- runFlow: _support/login-tasker.yaml
- tapOn:
    id: 'tab-profile'
- extendedWaitUntil:
    visible:
      id: 'SCR-SHARED-012'
    timeout: 10000
- takeScreenshot: screenshots/SCR-SHARED-012-profile-tasker

# SCR-SHARED-013: Profile Edit
- tapOn:
    id: 'SCR-SHARED-012-cta'
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: 'SCR-SHARED-013'
    timeout: 10000
- takeScreenshot: screenshots/SCR-SHARED-013-profile-edit
