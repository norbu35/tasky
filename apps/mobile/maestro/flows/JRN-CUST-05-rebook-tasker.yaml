appId: mn.tasky.mobile
---
# Journey JRN-CUST-05: Rebook Tasker
# Source: docs/design/journey-catalog.yaml
# Covered states: SCR-CUST-017, SCR-CUST-023, SCR-CUST-014, SCR-CUST-015
# Actor: customer
# Flow type: happy path
# Precondition: Logged in as customer; completed booking with same tasker exists

- launchApp:
    clearState: true

- runFlow: _support/login-customer.yaml

# Navigate to completed booking
- tapOn:
    point: "38%,93%"

- extendedWaitUntil:
    visible:
      id: "SCR-CUST-016"
    timeout: 5000

- tapOn:
    id: "booking-card-completed"

- extendedWaitUntil:
    visible:
      id: "SCR-CUST-017"
    timeout: 5000

# Step 1: Tap 'Rebook' on completed booking → Rebook screen (SCR-CUST-023)
- tapOn:
    id: "booking-detail-rebook-button"

- extendedWaitUntil:
    visible:
      id: "SCR-CUST-023"
    timeout: 5000

# Set date and budget
- tapOn:
    id: "rebook-screen-date-picker"
- inputText: "2026.05.01 10:00"

- tapOn:
    id: "rebook-screen-budget"
- eraseText: 20
- inputText: "50000"

# Step 2: Confirm rebook → Booking confirmation (SCR-CUST-014)
- tapOn:
    id: "rebook-confirm-button"

- extendedWaitUntil:
    visible:
      id: "SCR-CUST-014"
    timeout: 5000

# Step 3: Confirm booking → Success (SCR-CUST-015)
- tapOn:
    id: "booking-confirm-button"

- extendedWaitUntil:
    visible:
      id: "SCR-CUST-015"
    timeout: 10000
