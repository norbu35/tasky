appId: mn.tasky.mobile
---
# Capture flow for smoke batch visual audit — April 2026
# Captures: SCR-CUST-001..008 and SCR-TASK-001

# === CUSTOMER JOURNEY: Post a Task ===
- launchApp:
    clearState: true
- setLocation:
    latitude: 47.9184
    longitude: 106.9177
- launchApp
- runFlow: _support/login-customer.yaml
- extendedWaitUntil:
    visible:
      id: 'SCR-CUST-001'
    timeout: 5000
- takeScreenshot: screenshots/SCR-CUST-001-my-tasks-empty

# Create new task — use empty-state CTA if feed is empty, otherwise the shared customer FAB
- runFlow:
    when:
      visible:
        id: 'my-tasks-feed-empty-cta'
    commands:
      - tapOn:
          id: 'my-tasks-feed-empty-cta'
- runFlow:
    when:
      visible:
        id: 'global-fab'
    commands:
      - tapOn:
          id: 'global-fab'

# SCR-CUST-002 - Category selection
- extendedWaitUntil:
    visible:
      id: 'SCR-CUST-002'
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: 'category-selection-grid'
    timeout: 10000
- takeScreenshot: screenshots/SCR-CUST-002-category-selection

- tapOn: 'Cleaning'

# SCR-CUST-003 - Intake form
- extendedWaitUntil:
    visible:
      id: 'SCR-CUST-003'
    timeout: 5000
- takeScreenshot: screenshots/SCR-CUST-003-intake-form

- tapOn:
    id: 'intake-description-input'
- inputText: 'Need home cleaning service. 3 room apartment.'
- tapOn:
    id: 'intake-header'
- waitForAnimationToEnd
- tapOn:
    id: 'intake-property_type-apartment'
- tapOn:
    id: 'intake-size_or_rooms-input'
- eraseText: 3
- inputText: '3'
- tapOn:
    id: 'intake-header'
- waitForAnimationToEnd
- tapOn:
    id: 'intake-cleaning_type-standard'
- tapOn:
    id: 'intake-supplies_provided-yes'
- tapOn:
    id: 'SCR-CUST-003-next'

# SCR-CUST-004 - Photo upload
- extendedWaitUntil:
    visible:
      id: 'SCR-CUST-004'
    timeout: 5000
- takeScreenshot: screenshots/SCR-CUST-004-photo-upload

- tapOn:
    id: 'SCR-CUST-004-next'

# SCR-CUST-005 - Location
- extendedWaitUntil:
    visible:
      id: 'SCR-CUST-005'
    timeout: 5000
- takeScreenshot: screenshots/SCR-CUST-005-location

- runFlow:
    when:
      visible:
        id: 'location-recent-0'
    commands:
      - tapOn:
          id: 'location-recent-0'
- runFlow:
    when:
      notVisible:
        id: 'location-recent-0'
    commands:
      - tapOn:
          id: 'location-map'
- tapOn:
    id: 'location-text-input'
- inputText: 'Sukhbaatar district, 1st khoroo'
- hideKeyboard
- waitForAnimationToEnd
- tapOn:
    id: 'SCR-CUST-005-next'

# SCR-CUST-006 - Schedule & budget
- extendedWaitUntil:
    visible:
      id: 'SCR-CUST-006'
    timeout: 5000
- takeScreenshot: screenshots/SCR-CUST-006-schedule-budget

- tapOn:
    id: 'schedule-budget-input'
- eraseText: 20
- inputText: '50000'
- tapOn:
    id: 'schedule-header'
- waitForAnimationToEnd
- tapOn:
    id: 'schedule-date-input'
- extendedWaitUntil:
    visible:
      id: 'schedule-picker-sheet'
    timeout: 5000
- takeScreenshot: screenshots/SCR-CUST-006-schedule-picker-date
- tapOn:
    id: 'schedule-picker-save'
- waitForAnimationToEnd
- tapOn:
    id: 'schedule-time-input'
- extendedWaitUntil:
    visible:
      id: 'schedule-picker-sheet'
    timeout: 5000
- tapOn:
    id: 'schedule-picker-save'
- waitForAnimationToEnd
- tapOn:
    id: 'SCR-CUST-006-next'

# SCR-CUST-007 - Review & submit
- extendedWaitUntil:
    visible:
      id: 'SCR-CUST-007'
    timeout: 5000
- takeScreenshot: screenshots/SCR-CUST-007-review-submit

- tapOn:
    id: 'SCR-CUST-007-cta'

# SCR-CUST-008 - Success
- extendedWaitUntil:
    visible:
      id: 'SCR-CUST-008'
    timeout: 10000
- takeScreenshot: screenshots/SCR-CUST-008-success

- tapOn:
    id: 'task-posted-success-screen-done'
- assertVisible:
    id: 'SCR-CUST-001'
- takeScreenshot: screenshots/SCR-CUST-001-my-tasks-with-task
