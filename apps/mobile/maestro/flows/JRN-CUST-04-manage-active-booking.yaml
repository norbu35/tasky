appId: mn.tasky.mobile
---
# Journey JRN-CUST-04: Manage Active Booking (Customer)
# Source: docs/design/journey-catalog.yaml
# Covered states: SCR-CUST-016, SCR-CUST-017, SCR-CUST-018, SCR-SHARED-017
# Actor: customer
# Flow type: happy path
# Precondition: Logged in as customer; active (assigned) booking exists; tasker marks done

- launchApp

- runFlow: _support/login-customer.yaml

# Step 1: Navigate to Bookings list (SCR-CUST-016)
- tapOn:
    id: "tab-bookings"

- extendedWaitUntil:
    visible:
      id: "SCR-CUST-016"
    timeout: 5000

# Step 2: Open active booking → Booking detail (SCR-CUST-017)
- tapOn:
    id: "booking-card-active"

- extendedWaitUntil:
    visible:
      id: "SCR-CUST-017"
    timeout: 5000

# Step 3: Tasker marks done → Confirm completion screen (SCR-CUST-018)
- extendedWaitUntil:
    visible:
      id: "SCR-CUST-018"
    timeout: 10000

# Step 4: Tap 'Confirm Complete' → Review screen (SCR-SHARED-017)
- tapOn:
    id: "confirm-complete-button"

- extendedWaitUntil:
    visible:
      id: "SCR-SHARED-017"
    timeout: 5000
