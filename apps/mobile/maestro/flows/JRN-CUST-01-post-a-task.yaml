appId: mn.tasky.mobile
---
# Journey JRN-CUST-01: Post a Task
# Source: docs/design/journey-catalog.yaml
# Covered states: SCR-CUST-001..008 (full wizard)
# Actor: customer
# Flow type: happy path

- launchApp:
    clearState: true

- runFlow: _support/login-customer.yaml

- extendedWaitUntil:
    visible:
      id: 'SCR-CUST-001'
    timeout: 5000

# Create new task — use empty-state CTA if feed is empty, otherwise the feed FAB
- runFlow:
    when:
      visible:
        id: 'my-tasks-feed-empty-cta'
    commands:
      - tapOn:
          id: 'my-tasks-feed-empty-cta'
- runFlow:
    when:
      visible:
        id: 'my-tasks-feed-fab'
    commands:
      - tapOn:
          id: 'my-tasks-feed-fab'

# Step 1: Category selection (SCR-CUST-002)
- extendedWaitUntil:
    visible:
      id: 'SCR-CUST-002'
    timeout: 10000

# Wait for category grid to load, then tap first real category by visible text
- extendedWaitUntil:
    visible:
      id: 'category-selection-grid'
    timeout: 10000

# Tap first category card — tapping a card navigates directly to intake (no Continue step).
# "Cleaning" text is inside an accessibility button so Maestro can't match standalone text;
# tap by position within the grid area.
- tapOn:
    point: '30%,38%'

# Step 2: Intake / Task details (SCR-CUST-003)
- extendedWaitUntil:
    visible:
      id: 'SCR-CUST-003'
    timeout: 5000

- tapOn:
    id: 'intake-description-input'
# Note: Maestro on Android does not support Unicode input (github.com/mobile-dev-inc/maestro/issues/146).
# Using ASCII fallback; Mongolian text would be used on iOS.
- inputText: 'Need home cleaning service. 3 room apartment.'

# Dismiss keyboard by tapping header, then fill required intake schema fields
- tapOn:
    id: 'intake-header'
- waitForAnimationToEnd

# Cleaning intake schema fields (category-specific, from V11__seed_intake_schemas.sql)
# property_type: single_select — tap "Apartment"
- tapOn:
    id: 'intake-property_type-apartment'

# size_or_rooms: numeric_counter
- tapOn:
    id: 'intake-size_or_rooms-input'
- eraseText: 3
- inputText: '3'
- tapOn:
    id: 'intake-header'
- waitForAnimationToEnd

# cleaning_type: single_select — tap "Standard"
- tapOn:
    id: 'intake-cleaning_type-standard'

# supplies_provided: yes_no — tap "Yes"
- tapOn:
    id: 'intake-supplies_provided-yes'

- tapOn:
    id: 'SCR-CUST-003-next'

# Step 3: Photo upload (SCR-CUST-004) — skip photos, tap continue
- extendedWaitUntil:
    visible:
      id: 'SCR-CUST-004'
    timeout: 5000

- tapOn:
    id: 'SCR-CUST-004-next'

# Step 4: Location pin (SCR-CUST-005)
- extendedWaitUntil:
    visible:
      id: 'SCR-CUST-005'
    timeout: 5000

# Tap map to drop a pin (enables Next button)
- tapOn:
    id: 'location-map'

# Fill location description explicitly so the review screen has deterministic text
- tapOn:
    id: 'location-text-input'
# ASCII fallback for Android (Maestro unicode limitation)
- inputText: 'Sukhbaatar district, 1st khoroo'

- hideKeyboard
- tapOn:
    id: 'location-map'
- waitForAnimationToEnd

- tapOn:
    id: 'SCR-CUST-005-next'

# Step 5: Schedule & budget (SCR-CUST-006)
- extendedWaitUntil:
    visible:
      id: 'SCR-CUST-006'
    timeout: 5000

- tapOn:
    id: 'schedule-budget-input'
- eraseText: 20
- inputText: '50000'

# Dismiss keyboard, then select date/time
- tapOn:
    id: 'schedule-header'
- waitForAnimationToEnd

# Open date picker and confirm default (tomorrow)
- tapOn:
    id: 'schedule-date-input'
- extendedWaitUntil:
    visible:
      id: 'schedule-picker-sheet'
    timeout: 5000
- tapOn:
    id: 'schedule-picker-confirm'
- waitForAnimationToEnd

# Open time picker and confirm default (10:00)
- tapOn:
    id: 'schedule-time-input'
- extendedWaitUntil:
    visible:
      id: 'schedule-picker-sheet'
    timeout: 5000
- tapOn:
    id: 'schedule-picker-confirm'
- waitForAnimationToEnd

- tapOn:
    id: 'SCR-CUST-006-next'

# Step 6: Review & submit (SCR-CUST-007)
- extendedWaitUntil:
    visible:
      id: 'SCR-CUST-007'
    timeout: 5000

- tapOn:
    id: 'SCR-CUST-007-cta'

# Step 7: Success (SCR-CUST-008)
- extendedWaitUntil:
    visible:
      id: 'SCR-CUST-008'
    timeout: 10000

- tapOn:
    id: 'task-posted-success-screen-done'

- assertVisible:
    id: 'SCR-CUST-001'
