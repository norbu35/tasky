appId: mn.tasky.mobile
---
# Journey JRN-CUST-01: Post a Task
# Source: docs/design/journey-catalog.yaml
# Covered states: SCR-CUST-001..008 (full wizard)
# Actor: customer
# Flow type: happy path

- launchApp:
    clearState: true

- runFlow: _support/login-customer.yaml

- extendedWaitUntil:
    visible:
      id: "SCR-CUST-001"
    timeout: 5000

# Tap empty-state CTA to post new task
# Note: FAB uses AnimatedPressable (Reanimated) which is unreliable in Maestro — use empty state CTA instead
- tapOn:
    id: "my-tasks-feed-empty-cta"

# Step 1: Category selection (SCR-CUST-002)
- extendedWaitUntil:
    visible:
      id: "SCR-CUST-002"
    timeout: 10000

# Wait for category grid to load, then tap first real category by visible text
- extendedWaitUntil:
    visible:
      id: "category-selection-grid"
    timeout: 10000

# Tap first category card — "Cleaning" text is inside an accessibility button
# so Maestro can't match standalone text. Tap by position within the grid area.
- tapOn:
    point: "30%,38%"

# Tap "Continue" to advance (category screen uses select-then-continue pattern)
- tapOn:
    id: "SCR-CUST-002-next"

# Step 2: Intake / Task details (SCR-CUST-003)
- extendedWaitUntil:
    visible:
      id: "SCR-CUST-003"
    timeout: 5000

- tapOn:
    id: "intake-description-input"
- inputText: "Гэрийн цэвэрлэгээ хэрэгтэй байна. 3 өрөө байшин."

# Tap non-interactive header to dismiss keyboard (hideKeyboard fails on RN custom inputs)
- tapOn:
    id: "intake-header"
# Wait for keyboard dismiss animation to complete before tapping the button
- waitForAnimationToEnd
- tapOn:
    id: "SCR-CUST-003-next"

# Step 3: Photo upload (SCR-CUST-004) — skip photos, tap continue
- extendedWaitUntil:
    visible:
      id: "SCR-CUST-004"
    timeout: 5000

- tapOn:
    id: "SCR-CUST-004-next"

# Step 4: Location pin (SCR-CUST-005)
- extendedWaitUntil:
    visible:
      id: "SCR-CUST-005"
    timeout: 5000

# Tap map to drop a pin (enables Next button)
- tapOn:
    id: "location-map"

# Tap quick location chip to set location description (required by review screen)
- tapOn:
    id: "location-quick-Home"

- tapOn:
    id: "SCR-CUST-005-next"

# Step 5: Schedule & budget (SCR-CUST-006)
- extendedWaitUntil:
    visible:
      id: "SCR-CUST-006"
    timeout: 5000

- tapOn:
    id: "schedule-budget-input"
- eraseText: 20
- inputText: "50000"

# Dismiss keyboard, then select date/time
- tapOn:
    id: "schedule-header"
- waitForAnimationToEnd

# Open date picker and confirm default (tomorrow)
- tapOn:
    id: "schedule-date-input"
- extendedWaitUntil:
    visible:
      id: "schedule-ios-picker-card"
    timeout: 5000
- tapOn:
    id: "schedule-picker-confirm"
- waitForAnimationToEnd

# Open time picker and confirm default (10:00)
- tapOn:
    id: "schedule-time-input"
- extendedWaitUntil:
    visible:
      id: "schedule-ios-picker-card"
    timeout: 5000
- tapOn:
    id: "schedule-picker-confirm"
- waitForAnimationToEnd

- tapOn:
    id: "SCR-CUST-006-next"

# Step 6: Review & submit (SCR-CUST-007)
- extendedWaitUntil:
    visible:
      id: "SCR-CUST-007"
    timeout: 5000

- tapOn:
    id: "SCR-CUST-007-cta"

# Step 7: Success (SCR-CUST-008)
- extendedWaitUntil:
    visible:
      id: "SCR-CUST-008"
    timeout: 10000

- tapOn:
    id: "task-posted-success-screen-done"

- assertVisible:
    id: "SCR-CUST-001"
