appId: mn.tasky.mobile
---
# Screen SCR-TASK-016: Tasker Stats Dashboard
# Flow type: smoke test

- launchApp:
    clearState: true
- runFlow: _support/login-tasker.yaml

- tapOn:
    point: "88%,93%"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "SCR-SHARED-012"
    timeout: 10000
# Secondary CTA "View Stats" = SCR-SHARED-012-secondary-cta (DetailTemplate convention)
- tapOn:
    id: "SCR-SHARED-012-secondary-cta"

- extendedWaitUntil:
    visible:
      id: "SCR-TASK-016"
    timeout: 5000
