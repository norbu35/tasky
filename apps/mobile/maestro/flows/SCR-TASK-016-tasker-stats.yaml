appId: mn.tasky.mobile
---
# Screen SCR-TASK-016: Tasker Stats Dashboard
# Flow type: smoke test

- launchApp:
    clearState: true
- runFlow: _support/login-tasker.yaml

- tapOn:
    id: 'tab-profile'
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: 'SCR-SHARED-012'
    timeout: 10000
# Tasker stats are reached from the profile action row.
- tapOn:
    id: 'action-row-view-stats'

- extendedWaitUntil:
    visible:
      id: 'SCR-TASK-016'
    timeout: 5000
