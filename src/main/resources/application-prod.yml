spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${PGBOUNCER_PORT:6432}/${POSTGRES_DB:tasky}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL:20}
      minimum-idle: ${HIKARI_MIN_IDLE:5}
  flyway:
    baseline-on-migrate: false

tasky:
  dev-auth:
    enabled: false
  auth:
    otp-test-code: ""
  storage:
    endpoint: ${MINIO_ENDPOINT}
    access-key: ${MINIO_ACCESS_KEY}
    secret-key: ${MINIO_SECRET_KEY}
    bucket: ${MINIO_BUCKET}
  push:
    provider: ${TASKY_PUSH_PROVIDER:firebase}
  features:
    data-retention-dry-run: false
