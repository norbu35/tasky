spring:
  datasource:
    # App connects via PgBouncer using the least-privilege tasky_app account
    url: jdbc:postgresql://${POSTGRES_HOST}:${PGBOUNCER_PORT:6432}/${POSTGRES_DB:tasky}
    username: ${APP_DB_USER}
    password: ${APP_DB_PASSWORD}
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL:20}
      minimum-idle: ${HIKARI_MIN_IDLE:5}
  flyway:
    baseline-on-migrate: false
    # Flyway bypasses PgBouncer and connects directly with the owner account
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT:5432}/${POSTGRES_DB:tasky}
    user: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

tasky:
  dev-auth:
    enabled: false
  auth:
    otp-test-code: ""
  storage:
    endpoint: ${MINIO_ENDPOINT}
    access-key: ${MINIO_ACCESS_KEY}
    secret-key: ${MINIO_SECRET_KEY}
    bucket: ${MINIO_BUCKET}
  push:
    provider: ${TASKY_PUSH_PROVIDER:firebase}
  features:
    data-retention-dry-run: false
