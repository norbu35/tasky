spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${PGBOUNCER_PORT:6432}/${POSTGRES_DB:tasky}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL:20}
      minimum-idle: ${HIKARI_MIN_IDLE:5}
  flyway:
    baseline-on-migrate: false

tasky:
  dev-auth:
    enabled: false
  auth:
    otp-test-code: ""
