spring:
  application:
    name: tasky-server

server:
  port: ${PORT:8080}

management:
  endpoint:
    health:
      probes:
        enabled: true
    prometheus:
      access: read_only
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  prometheus:
    metrics:
      export:
        enabled: true

tasky:
  api:
    version: v1
