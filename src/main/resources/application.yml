spring:
  application:
    name: tasky-server

server:
  port: ${PORT:8080}

management:
  endpoint:
    health:
      probes:
        enabled: true
    prometheus:
      access: read_only
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  prometheus:
    metrics:
      export:
        enabled: true

tasky:
  api:
    version: v1
  auth:
    otp-code: ${TASKY_OTP_CODE:123456}
    otp-ttl-seconds: ${TASKY_OTP_TTL_SECONDS:300}
  security:
    jwt-secret: ${TASKY_JWT_SECRET:tasky-dev-signing-secret-key-with-minimum-32-bytes}
    access-token-ttl-seconds: ${TASKY_ACCESS_TOKEN_TTL_SECONDS:900}
    refresh-token-ttl-seconds: ${TASKY_REFRESH_TOKEN_TTL_SECONDS:1209600}
  storage:
    verification-upload-base-url: ${TASKY_VERIFICATION_UPLOAD_BASE_URL:https://upload.tasky.local}
    verification-max-bytes: ${TASKY_VERIFICATION_MAX_BYTES:10485760}
    verification-upload-url-ttl-seconds: ${TASKY_VERIFICATION_UPLOAD_URL_TTL_SECONDS:900}
    task-photo-upload-base-url: ${TASKY_TASK_PHOTO_UPLOAD_BASE_URL:https://upload.tasky.local}
    task-photo-max-bytes: ${TASKY_TASK_PHOTO_MAX_BYTES:5242880}
    task-photo-upload-url-ttl-seconds: ${TASKY_TASK_PHOTO_UPLOAD_URL_TTL_SECONDS:900}
