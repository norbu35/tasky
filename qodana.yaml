version: '1.0'

profile:
  name: qodana.recommended

projectJDK: '21'

exclude:
  - name: All
    paths:
      - '**/build/generated-sources/**'
      - '**/generated/**'

failureConditions:
  severityThresholds:
    any: 15
    critical: 5
  testCoverageThresholds:
    fresh: 70
    total: 50

linter: jetbrains/qodana-jvm:2025.3
