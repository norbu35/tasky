name: quality-gates

on:
  push:
    branches:
      - main
      - staging
  workflow_dispatch:

jobs:
  structural-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Ensure scripts are executable
        run: find tooling/scripts -type f \( -name '*.sh' -o -name '*.py' \) -exec chmod +x {} + && chmod +x gradlew

      - name: Run structural cleanup gate
        run: pnpm verify:cleanup

      - name: Run ops/config verification
        run: pnpm verify:ops

  backend-quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Ensure scripts are executable
        run: find tooling/scripts -type f \( -name '*.sh' -o -name '*.py' \) -exec chmod +x {} + && chmod +x gradlew

      - name: Run backend quality checks
        run: pnpm verify:backend

      - name: Run scenario smoke gate
        run: pnpm verify:scenario:smoke

  frontend-quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Cache turbo
        uses: actions/cache@v5
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend quality checks (affected only, includes i18n)
        run: pnpm verify:frontend:affected

  e2e-web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Cache turbo
        uses: actions/cache@v5
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Ensure scripts are executable
        run: chmod +x gradlew

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start infrastructure
        run: |
          docker compose up -d postgres minio minio-bootstrap
          echo "Waiting for Postgres..."
          for i in $(seq 1 30); do
            docker compose exec -T postgres pg_isready -U tasky -d tasky && break
            sleep 2
          done
          echo "Waiting for MinIO..."
          for i in $(seq 1 15); do
            curl -sf http://localhost:9000/minio/health/live && break
            sleep 2
          done

      - name: Build and start backend
        run: |
          ./gradlew --no-daemon :services:api:bootJar
          java -jar services/api/build/libs/*.jar --spring.profiles.active=ci &
          echo "Waiting for backend health..."
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/actuator/health && break
            sleep 2
          done
        env:
          FACEBOOK_TEST_APP_ID: ${{ secrets.FACEBOOK_TEST_APP_ID }}
          FACEBOOK_TEST_APP_SECRET: ${{ secrets.FACEBOOK_TEST_APP_SECRET }}
          TASKY_JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}
          TASKY_ENCRYPTION_KEY: ${{ secrets.CI_ENCRYPTION_KEY }}
          TASKY_BLIND_INDEX_KEY: ${{ secrets.CI_BLIND_INDEX_KEY }}
          TASKY_QPAY_WEBHOOK_SECRET: ${{ secrets.CI_QPAY_WEBHOOK_SECRET }}

      - name: Install Playwright Chromium
        run: pnpm --filter @tasky/web test:e2e:install:ci

      - name: Run Playwright smoke tests
        run: pnpm --filter @tasky/web test:e2e:smoke

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-playwright-smoke
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop infrastructure
        if: always()
        run: docker compose down

  e2e-android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Cache turbo
        uses: actions/cache@v5
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Ensure scripts are executable
        run: chmod +x gradlew

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start infrastructure
        run: |
          docker compose up -d postgres minio minio-bootstrap
          for i in $(seq 1 30); do
            docker compose exec -T postgres pg_isready -U tasky -d tasky && break
            sleep 2
          done
          for i in $(seq 1 15); do
            curl -sf http://localhost:9000/minio/health/live && break
            sleep 2
          done

      - name: Build and start backend
        run: |
          ./gradlew --no-daemon :services:api:bootJar
          java -jar services/api/build/libs/*.jar --spring.profiles.active=ci &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/actuator/health && break
            sleep 2
          done
        env:
          FACEBOOK_TEST_APP_ID: ${{ secrets.FACEBOOK_TEST_APP_ID }}
          FACEBOOK_TEST_APP_SECRET: ${{ secrets.FACEBOOK_TEST_APP_SECRET }}
          TASKY_JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}
          TASKY_ENCRYPTION_KEY: ${{ secrets.CI_ENCRYPTION_KEY }}
          TASKY_BLIND_INDEX_KEY: ${{ secrets.CI_BLIND_INDEX_KEY }}
          TASKY_QPAY_WEBHOOK_SECRET: ${{ secrets.CI_QPAY_WEBHOOK_SECRET }}

      - name: Install Maestro CLI
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Build Android release app
        run: pnpm --filter @tasky/mobile exec expo run:android --variant release --no-bundler

      - name: Run Maestro smoke flows
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          script: pnpm --filter @tasky/mobile test:e2e:smoke

      - name: Stop infrastructure
        if: always()
        run: docker compose down

  contracts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Ensure scripts are executable
        run: find tooling/scripts -type f \( -name '*.sh' -o -name '*.py' \) -exec chmod +x {} + && chmod +x gradlew

      - name: Run contract drift checks
        run: pnpm verify:drift

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Gitleaks secret scan
        run: bash tooling/scripts/governance/check-gitleaks-secret-scan.sh

      - name: Filesystem vulnerability scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: Build container image
        run: docker build -t tasky-server:ci .

      - name: Container image scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: tasky-server:ci
          format: table
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: Semgrep SAST
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/owasp-top-ten
            p/java
            tooling/config/semgrep/tasky-rules.yaml

      - name: OpenSSF Scorecard
        uses: ossf/scorecard-action@v2
        continue-on-error: true
        with:
          results_file: scorecard-results.json
          results_format: json
