name: quality-gates

on:
  pull_request:
  workflow_dispatch:

jobs:
  workflow-integrity:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure scripts are executable
        run: chmod +x scripts/*.sh scripts/*.py

      - name: Validate traceability and backlog contracts
        run: |
          python3 scripts/validate-traceability.py
          python3 scripts/validate-backlog.py
          python3 scripts/validate-ticket-specs.py
          python3 scripts/validate-compat-docs.py

  frontend-quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run workspace lint
        run: pnpm -r lint

      - name: Run workspace typecheck
        run: pnpm -r typecheck

      - name: Run workspace tests
        run: pnpm -r test

  dependency-security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependency review (PR only)
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

      - name: Filesystem vulnerability scan (dependencies + misconfig + secrets)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: "1"

  semgrep-sast:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Semgrep (OWASP + Java + custom rules)
        run: |
          semgrep scan \
            --config p/owasp-top-ten \
            --config p/java \
            --config config/semgrep/tasky-rules.yaml \
            --error \
            src/main/java/mn/tasky/

  container-security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build container image
        run: docker build -t tasky-server:ci .

      - name: Scan container image for vulnerabilities
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: tasky-server:ci
          format: table
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
          exit-code: "1"

  self-verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v3

      - name: Ensure scripts are executable
        run: chmod +x gradlew scripts/*.sh scripts/*.py

      - name: Ensure local self-verify artifact exists
        run: test -f artifacts/self-verify.json

      - name: Validate local self-verify artifact
        run: python3 scripts/validate-self-verify.py artifacts/self-verify.json docs/quality/self-verify.schema.json

      - name: Determine base refs for PR checks
        id: refs
        run: |
          if [ -n "${{ github.base_ref }}" ]; then
            git fetch --no-tags --prune origin "${{ github.base_ref }}"
            echo "base_ref=origin/${{ github.base_ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "base_ref=" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract self-verify metadata
        id: meta
        run: |
          echo "ticket=$(jq -r '.ticket' artifacts/self-verify.json)" >> "$GITHUB_OUTPUT"
          echo "risk=$(jq -r '.risk_level' artifacts/self-verify.json)" >> "$GITHUB_OUTPUT"
          echo "req=$(jq -r '.req_ids | join(",")' artifacts/self-verify.json)" >> "$GITHUB_OUTPUT"
          echo "ticket_spec=$(jq -r '.ticket_spec_path' artifacts/self-verify.json)" >> "$GITHUB_OUTPUT"

      - name: Install semgrep (high risk only)
        if: steps.meta.outputs.risk == 'high'
        run: python3 -m pip install --upgrade semgrep

      - name: Enforce declared risk against inferred risk
        run: |
          if [ -n "${{ steps.refs.outputs.base_ref }}" ]; then
            python3 scripts/infer-risk.py \
              --declared "${{ steps.meta.outputs.risk }}" \
              --base "${{ steps.refs.outputs.base_ref }}" \
              --head "HEAD"
          else
            python3 scripts/infer-risk.py \
              --declared "${{ steps.meta.outputs.risk }}" \
              --head "HEAD"
          fi

      - name: Run CI self-verification
        run: |
          if [ -n "${{ steps.refs.outputs.base_ref }}" ]; then
            export COMMIT_LINT_BASE="${{ steps.refs.outputs.base_ref }}"
          fi
          scripts/self-verify.sh \
            --ticket "${{ steps.meta.outputs.ticket }}" \
            --risk "${{ steps.meta.outputs.risk }}" \
            --req "${{ steps.meta.outputs.req }}" \
            --ticket-spec "${{ steps.meta.outputs.ticket_spec }}" \
            --out artifacts/self-verify.ci.json

      - name: Validate CI self-verify artifact
        run: python3 scripts/validate-self-verify.py artifacts/self-verify.ci.json docs/quality/self-verify.schema.json

      - name: Verify local vs CI parity
        run: scripts/verify-self-verify-parity.sh --local artifacts/self-verify.json --ci artifacts/self-verify.ci.json

      - name: Upload self-verify artifacts
        uses: actions/upload-artifact@v4
        with:
          name: self-verify-artifacts
          path: |
            artifacts/self-verify.json
            artifacts/self-verify.ci.json
            artifacts/checks/*.log
            docs/agent/WORK_LOG.md
