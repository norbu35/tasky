name: nightly-regression

on:
  workflow_dispatch:

jobs:
  full-regression:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Cache turbo
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Ensure scripts are executable
        run: find tooling/scripts -type f \( -name '*.sh' -o -name '*.py' \) -exec chmod +x {} + && chmod +x gradlew

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend regression checks
        run: |
          pnpm turbo run lint typecheck test:coverage

      - name: Run backend regression gate
        run: ./gradlew --no-daemon :services:api:gateRegression :services:api:openApiValidate

      - name: Run OWASP dependency check
        run: ./gradlew --no-daemon :services:api:dependencyCheckAnalyze
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

      - name: Gitleaks secret scan (full history)
        run: bash tooling/scripts/governance/check-gitleaks-secret-scan.sh

      - name: Build regression container image
        run: docker build -t tasky-server:nightly .

      - name: Scan regression container image
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: tasky-server:nightly
          format: table
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
          exit-code: '1'

  web-e2e-regression:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Ensure scripts are executable
        run: chmod +x gradlew

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Start infrastructure
        run: |
          docker compose up -d postgres minio minio-bootstrap
          for i in $(seq 1 30); do
            docker compose exec -T postgres pg_isready -U tasky -d tasky && break
            sleep 2
          done
          for i in $(seq 1 15); do
            curl -sf http://localhost:9000/minio/health/live && break
            sleep 2
          done

      - name: Build and start backend
        run: |
          ./gradlew --no-daemon :services:api:bootJar
          java -jar services/api/build/libs/*.jar --spring.profiles.active=ci &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/actuator/health && break
            sleep 2
          done
        env:
          FACEBOOK_TEST_APP_ID: ${{ secrets.FACEBOOK_TEST_APP_ID }}
          FACEBOOK_TEST_APP_SECRET: ${{ secrets.FACEBOOK_TEST_APP_SECRET }}
          TASKY_JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}
          TASKY_ENCRYPTION_KEY: ${{ secrets.CI_ENCRYPTION_KEY }}
          TASKY_BLIND_INDEX_KEY: ${{ secrets.CI_BLIND_INDEX_KEY }}
          TASKY_QPAY_WEBHOOK_SECRET: ${{ secrets.CI_QPAY_WEBHOOK_SECRET }}

      - name: Install Playwright Chromium
        run: pnpm --filter @tasky/web test:e2e:install:ci

      - name: Run full Playwright regression suite
        run: pnpm --filter @tasky/web test:e2e

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-playwright-regression
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop infrastructure
        if: always()
        run: docker compose down
