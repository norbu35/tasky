name: nightly-regression

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  full-regression:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v3

      - name: Ensure wrapper is executable
        run: chmod +x gradlew

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend/mobile regression checks
        run: |
          pnpm -r typecheck
          pnpm -r test

      - name: Run full backend regression gates
        run: ./gradlew --no-daemon :services:api:gateFull :services:api:openApiValidate

      - name: Build regression container image
        run: docker build -t tasky-server:nightly .

      - name: Scan regression container image
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: tasky-server:nightly
          format: table
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
          exit-code: "1"

  web-e2e-regression:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium dependencies
        run: pnpm --filter @tasky/web exec playwright install --with-deps chromium

      - name: Run Playwright regression journeys
        run: pnpm --filter @tasky/web test:e2e

  mobile-e2e-smoke:
    runs-on: macos-latest
    permissions:
      contents: read
    env:
      CI: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Maestro CLI
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Boot iOS simulator
        run: |
          SIMULATOR_NAME="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ {gsub(/^ +| +$/, "", $1); print $1; exit}')"
          SIMULATOR_UDID="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ {print $2; exit}')"
          if [ -z "$SIMULATOR_NAME" ] || [ -z "$SIMULATOR_UDID" ]; then
            echo "ERROR: no available iPhone simulator found" >&2
            exit 1
          fi
          echo "SIMULATOR_NAME=$SIMULATOR_NAME" >> "$GITHUB_ENV"
          echo "SIMULATOR_UDID=$SIMULATOR_UDID" >> "$GITHUB_ENV"
          open -a Simulator
          xcrun simctl boot "$SIMULATOR_UDID" || true
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b

      - name: Build Tasky iOS release app
        run: pnpm --filter @tasky/mobile exec expo run:ios --configuration Release --device "$SIMULATOR_NAME" --no-bundler

      - name: Run Maestro smoke journeys
        run: pnpm --filter @tasky/mobile test:e2e:smoke
