name: nightly-regression

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  full-regression:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v3

      - name: Ensure wrapper is executable
        run: chmod +x gradlew

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend/mobile regression checks
        run: |
          pnpm -r typecheck
          pnpm -r test

      - name: Run full regression checks
        run: ./gradlew --no-daemon check openApiValidate

      - name: Build regression container image
        run: docker build -t tasky-server:nightly .

      - name: Scan regression container image
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: tasky-server:nightly
          format: table
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
          exit-code: "1"
