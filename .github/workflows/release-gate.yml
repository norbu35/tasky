name: release-gate

on:
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Deployment target environment'
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production
  workflow_call:
    inputs:
      target_env:
        description: 'Deployment target environment'
        required: true
        type: string

jobs:
  migration-safety:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Ensure scripts are executable
        run: chmod +x tooling/scripts/*.sh tooling/scripts/*.py

      - name: Validate migration naming and immutability
        run: python3 tooling/scripts/validate-migrations.py

      - name: Verify migrations on a clean database
        run: |
          docker compose -f docker-compose.yml up -d postgres
          echo "Waiting for Postgres to be healthy..."
          for i in $(seq 1 30); do
            docker compose exec -T postgres pg_isready -U tasky -d tasky && break
            sleep 2
          done
          docker compose -f docker-compose.yml up --build --no-start app
          # Run Flyway migration check against the fresh DB
          ./gradlew --no-daemon :services:api:flywayInfo
        env:
          POSTGRES_USER: tasky
          POSTGRES_PASSWORD: tasky
          POSTGRES_DB: tasky
          POSTGRES_HOST: localhost
          TASKY_JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}
          TASKY_ENCRYPTION_KEY: ${{ secrets.CI_ENCRYPTION_KEY }}
          TASKY_BLIND_INDEX_KEY: ${{ secrets.CI_BLIND_INDEX_KEY }}
          TASKY_QPAY_WEBHOOK_SECRET: ${{ secrets.CI_QPAY_WEBHOOK_SECRET }}

  rollback-readiness:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify docker/restore.sh is executable and runnable
        run: |
          test -x docker/restore.sh || chmod +x docker/restore.sh
          bash -n docker/restore.sh
          echo "restore.sh syntax OK"

      - name: Verify docker/backup.sh is executable and runnable
        run: |
          test -x docker/backup.sh || chmod +x docker/backup.sh
          bash -n docker/backup.sh
          echo "backup.sh syntax OK"

  performance-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: tasky
          POSTGRES_USER: tasky
          POSTGRES_PASSWORD: tasky
        options: >-
          --health-cmd "pg_isready -U tasky -d tasky"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 6
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Ensure scripts are executable
        run: chmod +x gradlew tooling/scripts/*.sh tooling/scripts/*.py

      - name: Run performance smoke test
        run: bash tooling/scripts/performance-smoke.sh
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: tasky
          POSTGRES_USER: tasky
          POSTGRES_PASSWORD: tasky
          APP_DB_USER: tasky
          APP_DB_PASSWORD: tasky
          TASKY_JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}
          TASKY_ENCRYPTION_KEY: ${{ secrets.CI_ENCRYPTION_KEY }}
          TASKY_BLIND_INDEX_KEY: ${{ secrets.CI_BLIND_INDEX_KEY }}
          TASKY_QPAY_WEBHOOK_SECRET: ${{ secrets.CI_QPAY_WEBHOOK_SECRET }}

  web-e2e-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Ensure scripts are executable
        run: chmod +x gradlew

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start infrastructure
        run: |
          docker compose up -d postgres minio minio-bootstrap
          echo "Waiting for Postgres..."
          for i in $(seq 1 30); do
            docker compose exec -T postgres pg_isready -U tasky -d tasky && break
            sleep 2
          done
          echo "Waiting for MinIO..."
          for i in $(seq 1 15); do
            curl -sf http://localhost:9000/minio/health/live && break
            sleep 2
          done

      - name: Build and start backend
        run: |
          ./gradlew --no-daemon :services:api:bootJar
          java -jar services/api/build/libs/*.jar --spring.profiles.active=ci &
          echo "Waiting for backend health..."
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/actuator/health && break
            sleep 2
          done
        env:
          FACEBOOK_TEST_APP_ID: ${{ secrets.FACEBOOK_TEST_APP_ID }}
          FACEBOOK_TEST_APP_SECRET: ${{ secrets.FACEBOOK_TEST_APP_SECRET }}
          TASKY_JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}
          TASKY_ENCRYPTION_KEY: ${{ secrets.CI_ENCRYPTION_KEY }}
          TASKY_BLIND_INDEX_KEY: ${{ secrets.CI_BLIND_INDEX_KEY }}
          TASKY_QPAY_WEBHOOK_SECRET: ${{ secrets.CI_QPAY_WEBHOOK_SECRET }}

      - name: Install Playwright Chromium
        run: pnpm --filter @tasky/web exec playwright install --with-deps chromium

      - name: Run Playwright smoke tests
        run: pnpm --filter @tasky/web test:e2e:smoke

      - name: Stop infrastructure
        if: always()
        run: docker compose down

  mobile-e2e-smoke:
    runs-on: macos-latest
    permissions:
      contents: read
    env:
      CI: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Ensure scripts are executable
        run: chmod +x gradlew

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Start infrastructure
        run: |
          docker compose up -d postgres minio minio-bootstrap
          for i in $(seq 1 30); do
            docker compose exec -T postgres pg_isready -U tasky -d tasky && break
            sleep 2
          done

      - name: Build and start backend
        run: |
          ./gradlew --no-daemon :services:api:bootJar
          java -jar services/api/build/libs/*.jar --spring.profiles.active=ci &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/actuator/health && break
            sleep 2
          done
        env:
          FACEBOOK_TEST_APP_ID: ${{ secrets.FACEBOOK_TEST_APP_ID }}
          FACEBOOK_TEST_APP_SECRET: ${{ secrets.FACEBOOK_TEST_APP_SECRET }}
          TASKY_JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}
          TASKY_ENCRYPTION_KEY: ${{ secrets.CI_ENCRYPTION_KEY }}
          TASKY_BLIND_INDEX_KEY: ${{ secrets.CI_BLIND_INDEX_KEY }}
          TASKY_QPAY_WEBHOOK_SECRET: ${{ secrets.CI_QPAY_WEBHOOK_SECRET }}

      - name: Install Maestro CLI
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Boot iOS simulator
        run: |
          SIMULATOR_NAME="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ {gsub(/^ +| +$/, "", $1); print $1; exit}')"
          SIMULATOR_UDID="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ {print $2; exit}')"
          if [ -z "$SIMULATOR_NAME" ] || [ -z "$SIMULATOR_UDID" ]; then
            echo "ERROR: no available iPhone simulator found" >&2
            exit 1
          fi
          echo "SIMULATOR_NAME=$SIMULATOR_NAME" >> "$GITHUB_ENV"
          echo "SIMULATOR_UDID=$SIMULATOR_UDID" >> "$GITHUB_ENV"
          open -a Simulator
          xcrun simctl boot "$SIMULATOR_UDID" || true
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b

      - name: Build iOS release app
        run: pnpm --filter @tasky/mobile exec expo run:ios --configuration Release --device "$SIMULATOR_NAME" --no-bundler

      - name: Run Maestro smoke flows
        run: pnpm --filter @tasky/mobile test:e2e:smoke

      - name: Stop infrastructure
        if: always()
        run: docker compose down

  security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Ensure scripts are executable
        run: chmod +x gradlew

      - name: Run OWASP dependency check
        run: ./gradlew --no-daemon :services:api:dependencyCheck
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

      - name: Build container image for Trivy scan
        run: docker build -t tasky-server:release-gate .

      - name: Scan container image with Trivy
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: tasky-server:release-gate
          format: table
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
          exit-code: '1'

  release-readiness-checklist:
    runs-on: ubuntu-latest
    needs:
      [
        migration-safety,
        rollback-readiness,
        performance-smoke,
        web-e2e-smoke,
        mobile-e2e-smoke,
        security-scan,
      ]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Print release readiness summary
        run: |
          echo "==================================================="
          echo "  Tasky Release Gate — ${{ github.event.inputs.target_env }}"
          echo "==================================================="
          echo "  Migration safety: PASSED"
          echo "  Rollback readiness: PASSED"
          echo "  Performance smoke: PASSED"
          echo "  Web E2E smoke: PASSED"
          echo "  Mobile E2E smoke: PASSED"
          echo "  Security scan: PASSED"
          echo "==================================================="
          echo "  Branch:  ${{ github.ref_name }}"
          echo "  SHA:     ${{ github.sha }}"
          echo "  Actor:   ${{ github.actor }}"
          echo "  Date:    $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "==================================================="
          echo "Manual signoff required before promoting to ${{ github.event.inputs.target_env }}."
