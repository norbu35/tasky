      Style: Deep blue (#1B3A5C) primary, gold (#C49A3C) accents, off-white (#F9F8F5) background. Mongolian Cyrillic
      text. 16px minimum body text.
  - state_id: uploaded_2
    prompt: >-
      Generate the "uploaded_2" state of "Post Task — Photo Upload".

      2 photos uploaded successfully; add-photo placeholder remains for 1 more

      Visible elements: COMP-STEPINDICATOR, COMP-PHOTOPICKER, COMP-BUTTON

      Hidden elements: COMP-TOAST

      Style: Deep blue (#1B3A5C) primary, gold (#C49A3C) accents, off-white (#F9F8F5) background. Mongolian Cyrillic
      text. 16px minimum body text.
  - state_id: uploaded_3_max
    prompt: >-
      Generate the "uploaded_3_max" state of "Post Task — Photo Upload".

      3 photos uploaded; maximum reached; add-photo placeholder hidden

      Visible elements: COMP-STEPINDICATOR, COMP-PHOTOPICKER, COMP-BUTTON

      Hidden elements: COMP-TOAST

      Style: Deep blue (#1B3A5C) primary, gold (#C49A3C) accents, off-white (#F9F8F5) background. Mongolian Cyrillic
      text. 16px minimum body text.
  - state_id: upload_error
    prompt: >-
      Generate the "upload_error" state of "Post Task — Photo Upload".

      Photo upload failed due to network or server error; error toast with retry

