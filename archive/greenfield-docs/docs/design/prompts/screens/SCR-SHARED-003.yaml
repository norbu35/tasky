    prompt: >-
      Generate the "default" state of "Auth — OTP Verification".

      OTP screen loaded; phone number displayed; input field empty and focused

      Visible elements: heading, phone_display, otp_input, verify_button_disabled, resend_link

      Hidden elements: error_message, verifying_spinner

      Style: Deep blue (#1B3A5C) primary, gold (#C49A3C) accents, off-white (#F9F8F5) background. Mongolian Cyrillic
      text. 16px minimum body text.
  - state_id: code_entry
    prompt: >-
      Generate the "code_entry" state of "Auth — OTP Verification".

      User is entering the OTP code digits

      Visible elements: heading, phone_display, otp_input_active, verify_button_enabled, resend_link

      Hidden elements: error_message, verifying_spinner

      Style: Deep blue (#1B3A5C) primary, gold (#C49A3C) accents, off-white (#F9F8F5) background. Mongolian Cyrillic
      text. 16px minimum body text.
  - state_id: verifying
    prompt: >-
      Generate the "verifying" state of "Auth — OTP Verification".

      OTP code submitted; verification request in progress

      Visible elements: heading, phone_display, otp_input_disabled, verify_button_loading

      Hidden elements: error_message, resend_link

      Style: Deep blue (#1B3A5C) primary, gold (#C49A3C) accents, off-white (#F9F8F5) background. Mongolian Cyrillic
      text. 16px minimum body text.
  - state_id: error_wrong_code
    prompt: >-
      Generate the "error_wrong_code" state of "Auth — OTP Verification".

      User entered incorrect OTP code; field shows error and clears

      Visible elements: heading, phone_display, otp_input_error, wrong_code_error, verify_button_disabled, resend_link

      Hidden elements: verifying_spinner

      Style: Deep blue (#1B3A5C) primary, gold (#C49A3C) accents, off-white (#F9F8F5) background. Mongolian Cyrillic
      text. 16px minimum body text.
  - state_id: error_expired
    prompt: >-
      Generate the "error_expired" state of "Auth — OTP Verification".

      OTP code has expired; user must request a new code

      Visible elements: heading, phone_display, otp_input_disabled, expired_error, resend_link_enabled

      Hidden elements: verify_button, verifying_spinner

      Style: Deep blue (#1B3A5C) primary, gold (#C49A3C) accents, off-white (#F9F8F5) background. Mongolian Cyrillic
      text. 16px minimum body text.
  - state_id: resend_cooldown
    prompt: >-
      Generate the "resend_cooldown" state of "Auth — OTP Verification".

      Resend requested; countdown timer shown (60s) before resend is available again

      Visible elements: heading, phone_display, otp_input, verify_button, resend_countdown

      Hidden elements: error_message, resend_link_enabled

      Style: Deep blue (#1B3A5C) primary, gold (#C49A3C) accents, off-white (#F9F8F5) background. Mongolian Cyrillic
      text. 16px minimum body text.
  - state_id: error_network
    prompt: >-
      Generate the "error_network" state of "Auth — OTP Verification".

      Network error during OTP verification or resend request

      Visible elements: heading, phone_display, otp_input, network_error_message, verify_button, resend_link

      Hidden elements: verifying_spinner

      Style: Deep blue (#1B3A5C) primary, gold (#C49A3C) accents, off-white (#F9F8F5) background. Mongolian Cyrillic
      text. 16px minimum body text.
