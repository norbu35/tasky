screen_id: SCR-P3-004
name: Subscription — Tasker Pro
role:
  - tasker
phase: 3+
template: detail
route: /(tasker)/subscription
context_refs:
  global: prompts/global-context.yaml
  journeys:
    - prompts/journeys/JRN-TASK-07.yaml
stitch_prompt: >-
  Design a mobile app screen for "Subscription — Tasker Pro" (SCR-P3-004) in the Tasky app — Mongolia's domestic service
  marketplace.

  This screen is used by Tasker role.

  Template: detail — Navigation header at top, scrollable content area, sticky bottom CTA bar for primary action.

  Layout structure: safe_area -> nav_header -> scrollview(plan_hero + benefits + plan_cards) -> sticky_bottom_cta

  Components used:
    • COMP-CARD (elevated): Plan cards showing Standard and Premium tiers with pricing and features
    • COMP-VERIFICATIONBADGE (pro): Pro badge display showing current tier status
    • COMP-STATUSBADGE (completed): Subscription status badge (active, cancelled, ineligible)
    • COMP-BUTTON (primary): Primary CTA to subscribe to selected plan
    • COMP-BUTTON (danger): Danger button to cancel existing subscription
    • COMP-BUTTON (ghost): Ghost back button
    • COMP-LOADINGSKELETON (detail): Detail skeleton for initial load
    • COMP-MODALSHEET (default): Confirmation sheet for subscription actions (subscribe/cancel)
    • COMP-EMPTYSTATE (no_results): Ineligible state when tasker does not meet Pro badge requirements
    • COMP-EMPTYSTATE (error): Error state when subscription data fails to load
  This screen has 7 states — generate the primary/default state:
    Primary state: Fetching subscription plans and current status from API
  Key copy (Mongolian primary):
    • nav_title: "Tasker Pro" (Tasker Pro)
    • hero_heading: "Tasker Pro болоорой" (Become a Tasker Pro)
    • hero_description: "Илүү олон захиалга аваарай. Шилдэг давуу эрхүүд таныг хүлээж байна" (Get more bookings with exclusive pro benefits)
    • benefit_priority: "Тэргүүлсэн байрлал" (Priority placement)
    • benefit_badge: "Pro тэмдэг" (Pro badge)
    • benefit_credits: "Нэмэлт кредит" (Bonus credits)
  Style: Deep blue (#1B3A5C) primary, gold (#C49A3C) accents, off-white (#F9F8F5) background. Manrope for headings, Plus
  Jakarta Sans for body. 16px minimum body text. Clean, professional, premium feel. Mongolian Cyrillic text.
layout:
  template: detail
  density: default
  structure: safe_area -> nav_header -> scrollview(plan_hero + benefits + plan_cards) -> sticky_bottom_cta
components:
  - component: COMP-CARD
    variant: elevated
    usage: Plan cards showing Standard and Premium tiers with pricing and features
  - component: COMP-VERIFICATIONBADGE
    variant: pro
    usage: Pro badge display showing current tier status
  - component: COMP-STATUSBADGE
    variant: completed
    usage: Subscription status badge (active, cancelled, ineligible)
  - component: COMP-BUTTON
    variant: primary
    usage: Primary CTA to subscribe to selected plan
  - component: COMP-BUTTON
    variant: danger
    usage: Danger button to cancel existing subscription
  - component: COMP-BUTTON
    variant: ghost
    usage: Ghost back button
  - component: COMP-LOADINGSKELETON
    variant: detail
    usage: Detail skeleton for initial load
  - component: COMP-MODALSHEET
    variant: default
    usage: Confirmation sheet for subscription actions (subscribe/cancel)
  - component: COMP-EMPTYSTATE
    variant: no_results
    usage: Ineligible state when tasker does not meet Pro badge requirements
  - component: COMP-EMPTYSTATE
    variant: error
    usage: Error state when subscription data fails to load
states:
  - id: loading_initial
    description: Fetching subscription plans and current status from API
    visible:
      - COMP-LOADINGSKELETON
    hidden:
      - COMP-CARD
      - COMP-VERIFICATIONBADGE
      - COMP-STATUSBADGE
      - COMP-BUTTON
      - COMP-EMPTYSTATE
      - COMP-MODALSHEET
  - id: eligible_view_plans
    description: Tasker is eligible (Pro badge earned); plan options displayed for subscription
    visible:
      - COMP-CARD
      - COMP-VERIFICATIONBADGE
      - COMP-BUTTON.primary
      - COMP-BUTTON.ghost
    hidden:
      - COMP-LOADINGSKELETON
      - COMP-STATUSBADGE
      - COMP-BUTTON.danger
      - COMP-EMPTYSTATE
      - COMP-MODALSHEET
  - id: active_standard
    description: Tasker has an active Standard tier subscription
    visible:
      - COMP-CARD
      - COMP-VERIFICATIONBADGE
      - COMP-STATUSBADGE
      - COMP-BUTTON.primary
      - COMP-BUTTON.danger
      - COMP-BUTTON.ghost
    hidden:
      - COMP-LOADINGSKELETON
      - COMP-EMPTYSTATE
      - COMP-MODALSHEET
  - id: active_premium
    description: Tasker has an active Premium tier subscription
    visible:
      - COMP-CARD
      - COMP-VERIFICATIONBADGE
      - COMP-STATUSBADGE
      - COMP-BUTTON.danger
      - COMP-BUTTON.ghost
    hidden:
      - COMP-LOADINGSKELETON
      - COMP-BUTTON.primary
      - COMP-EMPTYSTATE
      - COMP-MODALSHEET
  - id: ineligible_no_badge
    description: Tasker does not have Pro badge (rating < 4.5); cannot subscribe
    visible:
      - COMP-EMPTYSTATE.no_results
      - COMP-BUTTON.ghost
    hidden:
      - COMP-LOADINGSKELETON
      - COMP-CARD
      - COMP-VERIFICATIONBADGE
      - COMP-STATUSBADGE
      - COMP-BUTTON.primary
      - COMP-BUTTON.danger
      - COMP-MODALSHEET
  - id: cancelled_resubscribe
    description: Subscription was cancelled; option to resubscribe shown
    visible:
      - COMP-CARD
      - COMP-BUTTON.primary
      - COMP-BUTTON.ghost
    hidden:
      - COMP-LOADINGSKELETON
      - COMP-VERIFICATIONBADGE
      - COMP-STATUSBADGE
      - COMP-BUTTON.danger
      - COMP-EMPTYSTATE
      - COMP-MODALSHEET
  - id: error_network
    description: Failed to load subscription data due to network error
    visible:
      - COMP-EMPTYSTATE.error
    hidden:
      - COMP-LOADINGSKELETON
      - COMP-CARD
      - COMP-VERIFICATIONBADGE
      - COMP-STATUSBADGE
      - COMP-BUTTON
      - COMP-MODALSHEET
