  - key: error_title
    mn: Алдаа гарлаа
    en: Something went wrong
  - key: error_body
    mn: Мэдэгдлүүдийг ачаалахад алдаа гарлаа
    en: Failed to load notifications
  - key: cta_retry
    mn: Дахин оролдох
    en: Retry
acceptance_criteria:
  - Screen displays loading skeleton with 6 list row placeholders while data is fetching
  - Empty state shows illustration with 'Мэдэгдэл алга' headline when no notifications exist
  - Populated list shows notification cards grouped by 'Today' and 'Earlier' sections
  - Unread notifications display an accent-colored indicator dot
  - Tapping a task notification navigates (push) to SCR-CUST-009 (customer) or SCR-TASK-002 (tasker)
  - Tapping a booking notification navigates (push) to SCR-CUST-017 (customer) or SCR-TASK-013 (tasker)
  - Tapping a dispute notification navigates (push) to SCR-CUST-025
  - Pull-to-refresh re-fetches GET /notifications
  - Network error state shows error illustration with retry button
  - Notification timestamps use relative format within 24h ('2 цагийн өмнө'), absolute after
  - Pagination uses cursor-based infinite scroll with skeleton footer
  - Back button navigates (pop) to the previous screen
api_endpoints:
  - method: GET
    path: /notifications
    purpose: Fetch paginated list of notifications for the authenticated user
analytics_events:
  - event: notifications_viewed
    trigger: Notification center screen loads successfully
  - event: notification_tapped
    trigger: User taps a notification card to navigate to its target
  - event: notifications_refreshed
    trigger: User pulls to refresh the notification list
state_prompts:
  - state_id: loading_initial
    prompt: >-
      Generate the "loading_initial" state of "Notification Center".

      GET /notifications is in flight; skeleton list displayed

      Visible elements: COMP-LOADINGSKELETON

      Hidden elements: COMP-CARD, COMP-EMPTYSTATE

      Style: Deep blue (#1B3A5C) primary, gold (#C49A3C) accents, off-white (#F9F8F5) background. Mongolian Cyrillic
      text. 16px minimum body text.
  - state_id: empty
    prompt: >-
      Generate the "empty" state of "Notification Center".

      GET /notifications returned zero results; empty state with illustration and message

      Visible elements: COMP-EMPTYSTATE

      Hidden elements: COMP-LOADINGSKELETON, COMP-CARD

      Style: Deep blue (#1B3A5C) primary, gold (#C49A3C) accents, off-white (#F9F8F5) background. Mongolian Cyrillic
      text. 16px minimum body text.
  - state_id: populated
    prompt: >-
      Generate the "populated" state of "Notification Center".

      Notification list loaded with items; unread items have accent indicator dot

      Visible elements: COMP-CARD, COMP-STATUSBADGE

      Hidden elements: COMP-LOADINGSKELETON, COMP-EMPTYSTATE

      Style: Deep blue (#1B3A5C) primary, gold (#C49A3C) accents, off-white (#F9F8F5) background. Mongolian Cyrillic
      text. 16px minimum body text.
  - state_id: loading_refresh
    prompt: >-
      Generate the "loading_refresh" state of "Notification Center".

      User pulled to refresh; pull-to-refresh spinner active while re-fetching

      Visible elements: COMP-CARD

      Hidden elements: COMP-LOADINGSKELETON, COMP-EMPTYSTATE

      Style: Deep blue (#1B3A5C) primary, gold (#C49A3C) accents, off-white (#F9F8F5) background. Mongolian Cyrillic
      text. 16px minimum body text.
  - state_id: error_network
    prompt: >-
      Generate the "error_network" state of "Notification Center".

      GET /notifications failed due to network error; error state with retry

      Visible elements: COMP-EMPTYSTATE

      Hidden elements: COMP-LOADINGSKELETON, COMP-CARD

      Style: Deep blue (#1B3A5C) primary, gold (#C49A3C) accents, off-white (#F9F8F5) background. Mongolian Cyrillic
      text. 16px minimum body text.
