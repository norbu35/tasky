screen_id: SCR-TASK-016
name: Tasker Stats Dashboard
role:
  - tasker
phase: 0-1
template: detail
route: /(tasker)/stats
context_refs:
  global: prompts/global-context.yaml
  journeys:
    - none
stitch_prompt: >-
  Design a mobile app screen for "Tasker Stats Dashboard" (SCR-TASK-016) in the Tasky app — Mongolia's domestic service
  marketplace.

  This screen is used by Tasker role.

  Template: detail — Navigation header at top, scrollable content area, sticky bottom CTA bar for primary action.

  Layout structure: safe_area -> nav_header(back + title) -> scrollview(stats_grid + rating_breakdown +
  reliability_section + activity_section)

  Components used:
    • COMP-STATCARD (default): Completed jobs count stat card
    • COMP-STATCARD (default): Overall rating stat card
    • COMP-STATCARD (default): Completion rate stat card
    • COMP-STATCARD (default): Application success rate stat card (Phase 2+)
    • COMP-STATCARD (default): Cancellation count stat card for reliability awareness
    • COMP-STARRATING (display): Per-category rating breakdown display — task clarity, respectfulness, punctuality
    • COMP-VERIFICATIONBADGE (default): Verification and Pro Badge status display in stats header
    • COMP-LOADINGSKELETON (card): Skeleton placeholders matching StatCard grid during load
  This screen has 3 states — generate the primary/default state:
    Primary state: Stats loading — skeleton placeholders matching StatCard grid
  Key copy (Mongolian primary):
    • page_title: "Миний статистик" (My Stats)
    • stats_section_heading: "Ерөнхий үзүүлэлтүүд" (Overview)
    • completed_jobs_label: "Дууссан ажил" (Completed Jobs)
    • overall_rating_label: "Ерөнхий үнэлгээ" (Overall Rating)
    • completion_rate_label: "Гүйцэтгэлийн хувь" (Completion Rate)
    • application_success_label: "Анкетын амжилт" (Application Success)
  Style: Deep blue (#1B3A5C) primary, gold (#C49A3C) accents, off-white (#F9F8F5) background. Manrope for headings, Plus
  Jakarta Sans for body. 16px minimum body text. Clean, professional, premium feel. Mongolian Cyrillic text.
layout:
  template: detail
  density: default
  structure: >-
    safe_area -> nav_header(back + title) -> scrollview(stats_grid + rating_breakdown + reliability_section +
    activity_section)
components:
  - component: COMP-STATCARD
    variant: default
    usage: Completed jobs count stat card
  - component: COMP-STATCARD
    variant: default
    usage: Overall rating stat card
  - component: COMP-STATCARD
    variant: default
    usage: Completion rate stat card
  - component: COMP-STATCARD
    variant: default
    usage: Application success rate stat card (Phase 2+)
  - component: COMP-STATCARD
    variant: default
    usage: Cancellation count stat card for reliability awareness
  - component: COMP-STARRATING
    variant: display
    usage: Per-category rating breakdown display — task clarity, respectfulness, punctuality
  - component: COMP-VERIFICATIONBADGE
    variant: default
    usage: Verification and Pro Badge status display in stats header
  - component: COMP-LOADINGSKELETON
    variant: card
    usage: Skeleton placeholders matching StatCard grid during load
states:
  - id: loading_initial
    description: Stats loading — skeleton placeholders matching StatCard grid
    visible:
      - nav_header
      - loading_skeleton
    hidden:
      - stats_grid
      - rating_breakdown
      - reliability_section
      - activity_section
  - id: loaded
    description: Stats fully loaded and displayed in grid layout
    visible:
      - nav_header
      - stats_grid
      - rating_breakdown
      - reliability_section
      - activity_section
      - badge_status
    hidden:
      - loading_skeleton
      - error_message
  - id: error_network
    description: Network error loading stats — retry option
    visible:
      - nav_header
      - error_message
      - retry_button
    hidden:
      - stats_grid
      - loading_skeleton
      - rating_breakdown
      - reliability_section
