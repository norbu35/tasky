acceptance_criteria:
  - Stats display in StatCard grid layout with label, value, and trend
  - StatCard components show loading skeleton during initial fetch
  - Overall rating displayed with per-category breakdown (task clarity, respectfulness, punctuality) per REQ-SAFE-02
  - Tasker Reliability Score is surfaced per REQ-SAFE-06
  - Reliability description explains score inputs (completion rate, punctuality, ratings, cancellations)
  - Application success rate and unlock conversion metrics shown per REQ-PAY-18
  - Cancellation count shows rolling 30-day count for strike awareness
  - Pro Badge status shows earned/eligible per REQ-SAFE-04 (>15 jobs, >4.5 rating)
  - Back button returns to My Profile (SCR-SHARED-012)
  - Network error displays retry button
  - All StatCard values use appropriate typography (price_display for numbers)
api_endpoints:
  - method: GET
    path: /users/me/stats
    purpose: Fetch tasker statistics including ratings, completion rate, cancellation count, reliability score
analytics_events:
  - event: tasker_stats_viewed
    trigger: Tasker Stats Dashboard becomes visible
  - event: tasker_stats_rating_breakdown_viewed
    trigger: User scrolls to rating breakdown section
  - event: tasker_stats_reliability_viewed
    trigger: User scrolls to reliability section
state_prompts:
  - state_id: loading_initial
    prompt: >-
      Generate the "loading_initial" state of "Tasker Stats Dashboard".

      Stats loading — skeleton placeholders matching StatCard grid

      Visible elements: nav_header, loading_skeleton

      Hidden elements: stats_grid, rating_breakdown, reliability_section, activity_section

      Style: Deep blue (#1B3A5C) primary, gold (#C49A3C) accents, off-white (#F9F8F5) background. Mongolian Cyrillic
      text. 16px minimum body text.
  - state_id: loaded
    prompt: >-
      Generate the "loaded" state of "Tasker Stats Dashboard".

      Stats fully loaded and displayed in grid layout

      Visible elements: nav_header, stats_grid, rating_breakdown, reliability_section, activity_section, badge_status

      Hidden elements: loading_skeleton, error_message

      Style: Deep blue (#1B3A5C) primary, gold (#C49A3C) accents, off-white (#F9F8F5) background. Mongolian Cyrillic
      text. 16px minimum body text.
  - state_id: error_network
    prompt: >-
      Generate the "error_network" state of "Tasker Stats Dashboard".

      Network error loading stats — retry option

      Visible elements: nav_header, error_message, retry_button

      Hidden elements: stats_grid, loading_skeleton, rating_breakdown, reliability_section

      Style: Deep blue (#1B3A5C) primary, gold (#C49A3C) accents, off-white (#F9F8F5) background. Mongolian Cyrillic
      text. 16px minimum body text.
