screen_id: SCR-B2B-007
name: Business Subscription Billing
role:
  - customer
phase: 3+
template: detail
route: /(customer)/business/accounts/:accountId/billing
context_refs:
  global: prompts/global-context.yaml
  journeys:
    - prompts/journeys/JRN-B2B-04.yaml
stitch_prompt: >-
  Design a mobile app screen for "Business Subscription Billing" (SCR-B2B-007) in the Tasky app — Mongolia's domestic
  service marketplace.

  This screen is used by Customer role.

  Template: detail — Navigation header at top, scrollable content area, sticky bottom CTA bar for primary action.

  Layout structure: safe_area -> nav_header(back + title) -> scrollview(plan_cards + billing_cycle + status_notice) ->
  sticky_bottom_cta

  Components used:
    • COMP-CARD (elevated): Billing plan cards for Host Lite and Ops Standard with price and location coverage
    • COMP-STATUSBADGE (assigned): Billing status badge for active, renewal_failed, or cancelled states
    • COMP-BUTTON (primary): Primary CTA to subscribe or resubscribe via QPay
    • COMP-BUTTON (danger): Secondary CTA to cancel current billing
    • COMP-LOADINGSKELETON (detail): Skeleton for billing plans and account billing state
    • COMP-EMPTYSTATE (error): Error and renewal-failed state with retry guidance
  This screen has 7 states — generate the primary/default state:
    Primary state: Business billing plans and current billing state are loading
  Key copy (Mongolian primary):
    • nav_title: "Бизнесийн төлбөр" (Business Billing)
    • host_lite: "Host Lite" (Host Lite)
    • ops_standard: "Ops Standard" (Ops Standard)
    • billing_cycle: "Сарын төлбөрийн өдөр: {day}" (Billing day: {day})
    • cta_subscribe: "QPay-ээр идэвхжүүлэх" (Activate with QPay)
    • renewal_failed: "Сунгалтын төлбөр амжилтгүй болсон" (Renewal payment failed)
  Style: Deep blue (#1B3A5C) primary, gold (#C49A3C) accents, off-white (#F9F8F5) background. Manrope for headings, Plus
  Jakarta Sans for body. 16px minimum body text. Clean, professional, premium feel. Mongolian Cyrillic text.
layout:
  template: detail
  density: default
  structure: safe_area -> nav_header(back + title) -> scrollview(plan_cards + billing_cycle + status_notice) -> sticky_bottom_cta
components:
  - component: COMP-CARD
    variant: elevated
    usage: Billing plan cards for Host Lite and Ops Standard with price and location coverage
  - component: COMP-STATUSBADGE
    variant: assigned
    usage: Billing status badge for active, renewal_failed, or cancelled states
  - component: COMP-BUTTON
    variant: primary
    usage: Primary CTA to subscribe or resubscribe via QPay
  - component: COMP-BUTTON
    variant: danger
    usage: Secondary CTA to cancel current billing
  - component: COMP-LOADINGSKELETON
    variant: detail
    usage: Skeleton for billing plans and account billing state
  - component: COMP-EMPTYSTATE
    variant: error
    usage: Error and renewal-failed state with retry guidance
states:
  - id: loading_initial
    description: Business billing plans and current billing state are loading
    visible:
      - COMP-LOADINGSKELETON
    hidden:
      - COMP-CARD
      - COMP-STATUSBADGE
      - COMP-BUTTON
      - COMP-EMPTYSTATE
  - id: eligible_view_plans
    description: Host Lite and Ops Standard plans are available to subscribe
    visible:
      - COMP-CARD
      - COMP-BUTTON.primary
    hidden:
      - COMP-LOADINGSKELETON
      - COMP-STATUSBADGE
      - COMP-BUTTON.danger
      - COMP-EMPTYSTATE
  - id: active_host_lite
    description: Host Lite is active for the selected business account
    visible:
      - COMP-CARD
      - COMP-STATUSBADGE
      - COMP-BUTTON.danger
    hidden:
      - COMP-LOADINGSKELETON
      - COMP-EMPTYSTATE
  - id: active_ops_standard
    description: Ops Standard is active for the selected business account
    visible:
      - COMP-CARD
      - COMP-STATUSBADGE
      - COMP-BUTTON.danger
    hidden:
      - COMP-LOADINGSKELETON
      - COMP-EMPTYSTATE
  - id: renewal_failed
    description: Recurring payment failed and renewal requires manual recovery
    visible:
      - COMP-STATUSBADGE
      - COMP-EMPTYSTATE
      - COMP-BUTTON.primary
    hidden:
      - COMP-LOADINGSKELETON
      - COMP-CARD
      - COMP-BUTTON.danger
  - id: cancelled_resubscribe
    description: Subscription was cancelled and can be reactivated
    visible:
      - COMP-CARD
      - COMP-STATUSBADGE
      - COMP-BUTTON.primary
    hidden:
      - COMP-LOADINGSKELETON
      - COMP-EMPTYSTATE
      - COMP-BUTTON.danger
  - id: error_network
    description: Billing data failed to load
    visible:
      - COMP-EMPTYSTATE
    hidden:
      - COMP-LOADINGSKELETON
      - COMP-CARD
      - COMP-STATUSBADGE
      - COMP-BUTTON
copy:
  - key: nav_title
    mn: Бизнесийн төлбөр
    en: Business Billing
  - key: host_lite
    mn: Host Lite
    en: Host Lite
  - key: ops_standard
    mn: Ops Standard
    en: Ops Standard
  - key: billing_cycle
    mn: 'Сарын төлбөрийн өдөр: {day}'
    en: 'Billing day: {day}'
  - key: cta_subscribe
    mn: QPay-ээр идэвхжүүлэх
    en: Activate with QPay
  - key: renewal_failed
    mn: Сунгалтын төлбөр амжилтгүй болсон
    en: Renewal payment failed
acceptance_criteria:
  - Host Lite and Ops Standard pricing are shown with per-location semantics
  - Billing cycle day is visible for the selected account
  - Renewal failure is surfaced with a recoverable resubscribe path
  - This screen is feature-gated behind b2b_enabled and intended for Phase 3+ billing rollout
api_endpoints:
  - method: GET
    path: /business/accounts/:id/subscription
    purpose: Fetch business subscription plans, billing cycle day, and current billing state
  - method: POST
    path: /business/accounts/:id/subscription
    purpose: Activate or renew a business subscription plan via QPay payment link
analytics_events:
  - event: business_billing_viewed
    trigger: Billing screen loads
  - event: business_billing_plan_selected
    trigger: A billing plan is selected
  - event: business_billing_subscribed
    trigger: Billing plan activation succeeds
  - event: business_billing_renewal_failed
    trigger: Renewal failure state is shown
state_prompts:
  - state_id: loading_initial
    prompt: >-
      Generate the "loading_initial" state of "Business Subscription Billing".

      Business billing plans and current billing state are loading

      Visible elements: COMP-LOADINGSKELETON

      Hidden elements: COMP-CARD, COMP-STATUSBADGE, COMP-BUTTON, COMP-EMPTYSTATE

      Style: Deep blue (#1B3A5C) primary, gold (#C49A3C) accents, off-white (#F9F8F5) background. Mongolian Cyrillic
      text. 16px minimum body text.
  - state_id: eligible_view_plans
    prompt: >-
      Generate the "eligible_view_plans" state of "Business Subscription Billing".

      Host Lite and Ops Standard plans are available to subscribe

      Visible elements: COMP-CARD, COMP-BUTTON.primary

      Hidden elements: COMP-LOADINGSKELETON, COMP-STATUSBADGE, COMP-BUTTON.danger, COMP-EMPTYSTATE

      Style: Deep blue (#1B3A5C) primary, gold (#C49A3C) accents, off-white (#F9F8F5) background. Mongolian Cyrillic
      text. 16px minimum body text.
  - state_id: active_host_lite
    prompt: >-
      Generate the "active_host_lite" state of "Business Subscription Billing".

      Host Lite is active for the selected business account

      Visible elements: COMP-CARD, COMP-STATUSBADGE, COMP-BUTTON.danger

      Hidden elements: COMP-LOADINGSKELETON, COMP-EMPTYSTATE

      Style: Deep blue (#1B3A5C) primary, gold (#C49A3C) accents, off-white (#F9F8F5) background. Mongolian Cyrillic
      text. 16px minimum body text.
  - state_id: active_ops_standard
    prompt: >-
      Generate the "active_ops_standard" state of "Business Subscription Billing".

      Ops Standard is active for the selected business account

      Visible elements: COMP-CARD, COMP-STATUSBADGE, COMP-BUTTON.danger

      Hidden elements: COMP-LOADINGSKELETON, COMP-EMPTYSTATE

      Style: Deep blue (#1B3A5C) primary, gold (#C49A3C) accents, off-white (#F9F8F5) background. Mongolian Cyrillic
      text. 16px minimum body text.
  - state_id: renewal_failed
    prompt: >-
      Generate the "renewal_failed" state of "Business Subscription Billing".

      Recurring payment failed and renewal requires manual recovery

      Visible elements: COMP-STATUSBADGE, COMP-EMPTYSTATE, COMP-BUTTON.primary

      Hidden elements: COMP-LOADINGSKELETON, COMP-CARD, COMP-BUTTON.danger

      Style: Deep blue (#1B3A5C) primary, gold (#C49A3C) accents, off-white (#F9F8F5) background. Mongolian Cyrillic
      text. 16px minimum body text.
  - state_id: cancelled_resubscribe
    prompt: >-
      Generate the "cancelled_resubscribe" state of "Business Subscription Billing".

      Subscription was cancelled and can be reactivated

      Visible elements: COMP-CARD, COMP-STATUSBADGE, COMP-BUTTON.primary

      Hidden elements: COMP-LOADINGSKELETON, COMP-EMPTYSTATE, COMP-BUTTON.danger

      Style: Deep blue (#1B3A5C) primary, gold (#C49A3C) accents, off-white (#F9F8F5) background. Mongolian Cyrillic
      text. 16px minimum body text.
  - state_id: error_network
    prompt: >-
      Generate the "error_network" state of "Business Subscription Billing".

      Billing data failed to load

      Visible elements: COMP-EMPTYSTATE

      Hidden elements: COMP-LOADINGSKELETON, COMP-CARD, COMP-STATUSBADGE, COMP-BUTTON

      Style: Deep blue (#1B3A5C) primary, gold (#C49A3C) accents, off-white (#F9F8F5) background. Mongolian Cyrillic
      text. 16px minimum body text.
