screen_id: SCR-CUST-026
name: No Applicant Rescue
role:
  - customer
phase: 0-1
template: modal_sheet
route: null
context_refs:
  global: prompts/global-context.yaml
  journeys:
    - prompts/journeys/JRN-CUST-02.yaml
stitch_prompt: >-
  Design a mobile app screen for "No Applicant Rescue" (SCR-CUST-026) in the Tasky app — Mongolia's domestic service
  marketplace.

  This screen is used by Customer role.

  Template: modal_sheet — Bottom sheet overlay with drag handle bar, content area, and max 2 action buttons. Branded
  scrim backdrop.

  Layout structure: scrim -> sheet(handle_bar + title + description + rescue_options + primary_action +
  secondary_action)

  Components used:
    • COMP-MODALSHEET (default): Bottom sheet overlay with rescue options when no applicants are found after 120 minutes
    • COMP-FORMFIELD (default): Wrapper for budget and schedule adjustment fields inside the rescue sheet
    • COMP-INPUT (default): Budget adjustment input field
    • COMP-DATEPICKER (date_time): Schedule adjustment date picker
    • COMP-BUTTON (primary): Save adjustments button and dismiss button
    • COMP-TOAST (success): Success toast after adjustments saved or concierge queued
  This screen has 5 states — generate the primary/default state:
    Primary state: Initial rescue prompt shown after 120 minutes with zero applicants during 08:00-22:00. Offers options: adjust budget, adjust schedule, or request concierge help
  Key copy (Mongolian primary):
    • title: "Гүйцэтгэгч олдсонгүй" (No Tasker found yet)
    • description: "120 минутад ямар нэг гүйцэтгэгч хүсэлт гаргаагүй байна. Дараах сонголтуудаас сонгоно уу." (No Tasker has applied in 120 minutes. Choose from the options below.)
    • option_adjust_budget: "Төсөв нэмэгдүүлэх" (Increase Budget)
    • option_adjust_schedule: "Цаг өөрчлөх" (Change Schedule)
    • option_concierge: "Туслах ажилтнаас тусламж авах" (Request Concierge Help)
    • label_budget: "Шинэ төсөв" (New Budget)
  Style: Deep blue (#1B3A5C) primary, gold (#C49A3C) accents, off-white (#F9F8F5) background. Manrope for headings, Plus
  Jakarta Sans for body. 16px minimum body text. Clean, professional, premium feel. Mongolian Cyrillic text.
layout:
  template: modal_sheet
  density: default
  structure: scrim -> sheet(handle_bar + title + description + rescue_options + primary_action + secondary_action)
components:
  - component: COMP-MODALSHEET
    variant: default
    usage: Bottom sheet overlay with rescue options when no applicants are found after 120 minutes
  - component: COMP-FORMFIELD
    variant: default
    usage: Wrapper for budget and schedule adjustment fields inside the rescue sheet
  - component: COMP-INPUT
    variant: default
    usage: Budget adjustment input field
  - component: COMP-DATEPICKER
    variant: date_time
    usage: Schedule adjustment date picker
  - component: COMP-BUTTON
    variant: primary
    usage: Save adjustments button and dismiss button
  - component: COMP-TOAST
    variant: success
    usage: Success toast after adjustments saved or concierge queued
states:
  - id: rescue_prompt
    description: >-
      Initial rescue prompt shown after 120 minutes with zero applicants during 08:00-22:00. Offers options: adjust
      budget, adjust schedule, or request concierge help
    visible:
      - COMP-MODALSHEET
      - COMP-BUTTON
    hidden:
      - COMP-FORMFIELD
      - COMP-INPUT
      - COMP-DATEPICKER
      - COMP-TOAST
  - id: adjust_budget
    description: User chose to adjust budget; budget input field shown with current value prefilled for editing
    visible:
      - COMP-MODALSHEET
      - COMP-FORMFIELD
      - COMP-INPUT
      - COMP-BUTTON
    hidden:
      - COMP-DATEPICKER
      - COMP-TOAST
  - id: adjust_schedule
    description: User chose to adjust schedule; date picker shown with current schedule prefilled
    visible:
      - COMP-MODALSHEET
      - COMP-FORMFIELD
      - COMP-DATEPICKER
      - COMP-BUTTON
    hidden:
      - COMP-INPUT
      - COMP-TOAST
  - id: broadened_push_sent
    description: System has broadened push notifications to additional nearby verified Taskers; confirmation shown
    visible:
      - COMP-MODALSHEET
      - COMP-BUTTON
      - COMP-TOAST
    hidden:
      - COMP-FORMFIELD
      - COMP-INPUT
      - COMP-DATEPICKER
  - id: concierge_queued
    description: Task has been queued for concierge dispatch follow-up; confirmation shown with expected response time
    visible:
      - COMP-MODALSHEET
      - COMP-BUTTON
      - COMP-TOAST
    hidden:
      - COMP-FORMFIELD
      - COMP-INPUT
      - COMP-DATEPICKER
copy:
  - key: title
    mn: Гүйцэтгэгч олдсонгүй
    en: No Tasker found yet
  - key: description
    mn: 120 минутад ямар нэг гүйцэтгэгч хүсэлт гаргаагүй байна. Дараах сонголтуудаас сонгоно уу.
    en: No Tasker has applied in 120 minutes. Choose from the options below.
  - key: option_adjust_budget
    mn: Төсөв нэмэгдүүлэх
    en: Increase Budget
  - key: option_adjust_schedule
    mn: Цаг өөрчлөх
    en: Change Schedule
  - key: option_concierge
    mn: Туслах ажилтнаас тусламж авах
    en: Request Concierge Help
  - key: label_budget
    mn: Шинэ төсөв
    en: New Budget
  - key: label_schedule
    mn: Шинэ товлосон цаг
    en: New Schedule
  - key: cta_save
    mn: Өөрчлөлт хадгалах
    en: Save Changes
  - key: cta_dismiss
    mn: Хаах
    en: Dismiss
  - key: broadened_push_message
    mn: Ойролцоох нэмэлт гүйцэтгэгчдэд мэдэгдэл илгээлээ
    en: Notifications sent to additional nearby Taskers
  - key: concierge_queued_message
    mn: Таны даалгавар туслах ажилтанд шилжүүлэгдлээ. Удахгүй холбогдоно.
    en: Your task has been queued for concierge follow-up. You will be contacted soon.
  - key: toast_saved
    mn: Өөрчлөлт хадгалагдлаа
    en: Changes saved
acceptance_criteria:
  - >-
    Rescue modal appears only after 120 minutes with zero eligible applicants during 08:00-22:00 local time per
    REQ-BOOK-09
  - 'Three rescue options are presented: adjust budget, adjust schedule, request concierge help'
  - Budget adjustment prefills current budget and allows increase
  - Schedule adjustment shows date picker with minimum date of tomorrow
  - Saving adjustments triggers PUT /tasks/:id and broadened push to additional nearby verified Taskers
  - Concierge option queues the task for founder/admin manual dispatch per REQ-ADMIN-07
  - After adjustments, confirmation message and success toast are shown
  - Dismiss closes the sheet and returns to Task Detail (SCR-CUST-009)
  - Drag-to-dismiss via handle bar is supported
  - All copy renders correctly in Mongolian Cyrillic at 16px minimum body size
api_endpoints:
  - method: PUT
    path: /tasks/:id
    purpose: Update task budget and/or schedule as part of rescue flow
analytics_events:
  - event: no_applicant_rescue_shown
    trigger: Rescue modal appears after 120-minute zero-applicant threshold
  - event: no_applicant_budget_adjusted
    trigger: User saves a budget adjustment
  - event: no_applicant_schedule_adjusted
    trigger: User saves a schedule adjustment
  - event: no_applicant_broadened_push
    trigger: System broadens push to additional Taskers
  - event: no_applicant_concierge_queued
    trigger: Task queued for concierge dispatch
  - event: no_applicant_rescue_dismissed
    trigger: User dismisses the rescue sheet without action
state_prompts:
  - state_id: rescue_prompt
    prompt: >-
      Generate the "rescue_prompt" state of "No Applicant Rescue".

      Initial rescue prompt shown after 120 minutes with zero applicants during 08:00-22:00. Offers options: adjust
      budget, adjust schedule, or request concierge help

      Visible elements: COMP-MODALSHEET, COMP-BUTTON

      Hidden elements: COMP-FORMFIELD, COMP-INPUT, COMP-DATEPICKER, COMP-TOAST

      Style: Deep blue (#1B3A5C) primary, gold (#C49A3C) accents, off-white (#F9F8F5) background. Mongolian Cyrillic
      text. 16px minimum body text.
  - state_id: adjust_budget
    prompt: >-
      Generate the "adjust_budget" state of "No Applicant Rescue".

      User chose to adjust budget; budget input field shown with current value prefilled for editing

      Visible elements: COMP-MODALSHEET, COMP-FORMFIELD, COMP-INPUT, COMP-BUTTON

      Hidden elements: COMP-DATEPICKER, COMP-TOAST

      Style: Deep blue (#1B3A5C) primary, gold (#C49A3C) accents, off-white (#F9F8F5) background. Mongolian Cyrillic
      text. 16px minimum body text.
  - state_id: adjust_schedule
    prompt: >-
      Generate the "adjust_schedule" state of "No Applicant Rescue".

      User chose to adjust schedule; date picker shown with current schedule prefilled

      Visible elements: COMP-MODALSHEET, COMP-FORMFIELD, COMP-DATEPICKER, COMP-BUTTON

      Hidden elements: COMP-INPUT, COMP-TOAST

      Style: Deep blue (#1B3A5C) primary, gold (#C49A3C) accents, off-white (#F9F8F5) background. Mongolian Cyrillic
      text. 16px minimum body text.
  - state_id: broadened_push_sent
    prompt: >-
      Generate the "broadened_push_sent" state of "No Applicant Rescue".

      System has broadened push notifications to additional nearby verified Taskers; confirmation shown

      Visible elements: COMP-MODALSHEET, COMP-BUTTON, COMP-TOAST

      Hidden elements: COMP-FORMFIELD, COMP-INPUT, COMP-DATEPICKER

      Style: Deep blue (#1B3A5C) primary, gold (#C49A3C) accents, off-white (#F9F8F5) background. Mongolian Cyrillic
      text. 16px minimum body text.
  - state_id: concierge_queued
    prompt: >-
      Generate the "concierge_queued" state of "No Applicant Rescue".

      Task has been queued for concierge dispatch follow-up; confirmation shown with expected response time

      Visible elements: COMP-MODALSHEET, COMP-BUTTON, COMP-TOAST

      Hidden elements: COMP-FORMFIELD, COMP-INPUT, COMP-DATEPICKER

      Style: Deep blue (#1B3A5C) primary, gold (#C49A3C) accents, off-white (#F9F8F5) background. Mongolian Cyrillic
      text. 16px minimum body text.
