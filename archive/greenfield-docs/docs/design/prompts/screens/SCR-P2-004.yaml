screen_id: SCR-P2-004
name: Credits — Low Balance Alert
role:
  - tasker
phase: '2'
template: modal_sheet
route: null
context_refs:
  global: prompts/global-context.yaml
  journeys:
    - none
stitch_prompt: >-
  Design a mobile app screen for "Credits — Low Balance Alert" (SCR-P2-004) in the Tasky app — Mongolia's domestic
  service marketplace.

  This screen is used by Tasker role.

  Template: modal_sheet — Bottom sheet overlay with drag handle bar, content area, and max 2 action buttons. Branded
  scrim backdrop.

  Layout structure: scrim -> sheet(handle + icon + message + actions)

  Components used:
    • COMP-MODALSHEET (default): Bottom sheet container for low balance warning
    • COMP-CREDITBALANCE (inline): Inline balance display showing current low/zero credit count
    • COMP-BUTTON (primary): Primary CTA to navigate to credit purchase screen
    • COMP-BUTTON (ghost): Secondary dismiss button
  This screen has 2 states — generate the primary/default state:
    Primary state: Tasker has exactly 1 credit remaining; warning to top up
  Key copy (Mongolian primary):
    • sheet_title_low: "Кредит бага байна" (Low credits)
    • sheet_title_empty: "Кредит дууссан" (No credits remaining)
    • description_1_credit: "Танд 1 кредит үлдлээ. Санал хүлээн авахын тулд кредит нэмнэ үү" (You have 1 credit left. Top up to keep accepting leads)
    • description_0_credits: "Танд кредит үлдээгүй байна. Шинэ санал хүлээн авахын тулд кредит худалдаж аваарай" (You have no credits. Purchase credits to accept new leads)
    • cta_buy: "Кредит авах" (Buy credits)
    • cta_later: "Дараа нь" (Later)
  Style: Deep blue (#1B3A5C) primary, gold (#C49A3C) accents, off-white (#F9F8F5) background. Manrope for headings, Plus
  Jakarta Sans for body. 16px minimum body text. Clean, professional, premium feel. Mongolian Cyrillic text.
layout:
  template: modal_sheet
  density: default
  structure: scrim -> sheet(handle + icon + message + actions)
components:
  - component: COMP-MODALSHEET
    variant: default
    usage: Bottom sheet container for low balance warning
  - component: COMP-CREDITBALANCE
    variant: inline
    usage: Inline balance display showing current low/zero credit count
  - component: COMP-BUTTON
    variant: primary
    usage: Primary CTA to navigate to credit purchase screen
  - component: COMP-BUTTON
    variant: ghost
    usage: Secondary dismiss button
states:
  - id: alert_1_credit
    description: Tasker has exactly 1 credit remaining; warning to top up
    visible:
      - COMP-MODALSHEET
      - COMP-CREDITBALANCE
      - COMP-BUTTON.primary
      - COMP-BUTTON.ghost
    hidden: []
  - id: alert_0_credits
    description: Tasker has 0 credits; cannot accept leads until purchase
    visible:
      - COMP-MODALSHEET
      - COMP-CREDITBALANCE
      - COMP-BUTTON.primary
      - COMP-BUTTON.ghost
    hidden: []
copy:
  - key: sheet_title_low
    mn: Кредит бага байна
    en: Low credits
  - key: sheet_title_empty
    mn: Кредит дууссан
    en: No credits remaining
  - key: description_1_credit
    mn: Танд 1 кредит үлдлээ. Санал хүлээн авахын тулд кредит нэмнэ үү
    en: You have 1 credit left. Top up to keep accepting leads
  - key: description_0_credits
    mn: Танд кредит үлдээгүй байна. Шинэ санал хүлээн авахын тулд кредит худалдаж аваарай
    en: You have no credits. Purchase credits to accept new leads
  - key: cta_buy
    mn: Кредит авах
    en: Buy credits
  - key: cta_later
    mn: Дараа нь
    en: Later
acceptance_criteria:
  - Alert triggers automatically when tasker balance drops to 1 or 0 credits
  - 1-credit state shows warning with amber visual cue and remaining count
  - 0-credit state shows urgent prompt with CreditBalance zero state (danger color)
  - Tapping 'Buy credits' pushes to SCR-P2-001 (Credits Balance & Purchase)
  - Sheet is dismissible via drag-to-close and 'Later' button
  - Alert does not re-trigger within the same session after dismissal
  - Sheet renders at z-index 30 with branded scrim (primaryDeep at 35%)
  - Maximum 2 action buttons per modal sheet template rules
  - All copy renders correctly in Mongolian Cyrillic at 16px minimum body size
api_endpoints: []
analytics_events:
  - event: low_balance_alert_shown
    trigger: 'Low balance sheet displayed (with type: 1_credit or 0_credits)'
  - event: low_balance_buy_tapped
    trigger: User taps 'Buy credits' to navigate to SCR-P2-001
  - event: low_balance_dismissed
    trigger: User taps 'Later' or drags to dismiss
state_prompts:
  - state_id: alert_1_credit
    prompt: >-
      Generate the "alert_1_credit" state of "Credits — Low Balance Alert".

      Tasker has exactly 1 credit remaining; warning to top up

      Visible elements: COMP-MODALSHEET, COMP-CREDITBALANCE, COMP-BUTTON.primary, COMP-BUTTON.ghost

      Style: Deep blue (#1B3A5C) primary, gold (#C49A3C) accents, off-white (#F9F8F5) background. Mongolian Cyrillic
      text. 16px minimum body text.
  - state_id: alert_0_credits
    prompt: >-
      Generate the "alert_0_credits" state of "Credits — Low Balance Alert".

      Tasker has 0 credits; cannot accept leads until purchase

      Visible elements: COMP-MODALSHEET, COMP-CREDITBALANCE, COMP-BUTTON.primary, COMP-BUTTON.ghost

      Style: Deep blue (#1B3A5C) primary, gold (#C49A3C) accents, off-white (#F9F8F5) background. Mongolian Cyrillic
      text. 16px minimum body text.
