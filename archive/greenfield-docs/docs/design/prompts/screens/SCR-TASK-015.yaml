screen_id: SCR-TASK-015
name: Booking Cancel (Tasker)
role:
  - tasker
phase: 0-1
template: modal_sheet
route: null
context_refs:
  global: prompts/global-context.yaml
  journeys:
    - prompts/journeys/JRN-TASK-04.yaml
stitch_prompt: >-
  Design a mobile app screen for "Booking Cancel (Tasker)" (SCR-TASK-015) in the Tasky app — Mongolia's domestic service
  marketplace.

  This screen is used by Tasker role.

  Template: modal_sheet — Bottom sheet overlay with drag handle bar, content area, and max 2 action buttons. Branded
  scrim backdrop.

  Layout structure: scrim -> sheet(handle_bar + title + strike_warning_content + reason_selector + action_buttons)

  Components used:
    • COMP-MODALSHEET (default): Bottom sheet for tasker booking cancellation with strike warning system
    • COMP-BUTTON (danger): Primary danger CTA to confirm cancellation
    • COMP-BUTTON (outline): Secondary CTA to go back and keep the booking
  This screen has 4 states — generate the primary/default state:
    Primary state: First cancellation or no recent strikes — standard cancellation warning with reason selection
  Key copy (Mongolian primary):
    • cancel_heading: "Захиалга цуцлах уу?" (Cancel this booking?)
    • cancel_description: "Захиалга цуцлагдвал даалгавар дахин нээлттэй болно. Цуцлалт таны найдвартай байдлын үзүүлэлтэд нөлөөлнө." (Cancelling will reopen the task. Cancellations affect your reliability score.)
    • impact_notice: "Цуцлалт нь таны хайлтын эрэмбэлэлт болон найдвартай байдлын үнэлгээнд нөлөөлнө." (Cancellations affect your search ranking and reliability score.)
    • strike_warning: "Анхааруулга: Та сүүлийн 30 хоногт {count} удаа цуцалсан байна." (Warning: You have cancelled {count} time(s) in the last 30 days.)
    • suspension_warning: "Анхааруулга: Та сүүлийн 30 хоногт 2 удаа цуцалсан байна. Дахин нэг удаа цуцалвал таны бүртгэл 7 хоногоор түдгэлзэнэ!" (Warning: You have 2 cancellations in 30 days. One more will result in a 7-day suspension!)
    • strike_count_display: "{count}/3 цуцлалт (30 хоногт)" ({count}/3 cancellations (30 days))
  Style: Deep blue (#1B3A5C) primary, gold (#C49A3C) accents, off-white (#F9F8F5) background. Manrope for headings, Plus
  Jakarta Sans for body. 16px minimum body text. Clean, professional, premium feel. Mongolian Cyrillic text.
layout:
  template: modal_sheet
  density: default
  structure: scrim -> sheet(handle_bar + title + strike_warning_content + reason_selector + action_buttons)
components:
  - component: COMP-MODALSHEET
    variant: default
    usage: Bottom sheet for tasker booking cancellation with strike warning system
  - component: COMP-BUTTON
    variant: danger
    usage: Primary danger CTA to confirm cancellation
  - component: COMP-BUTTON
    variant: outline
    usage: Secondary CTA to go back and keep the booking
states:
  - id: default
    description: First cancellation or no recent strikes — standard cancellation warning with reason selection
    visible:
      - handle_bar
      - cancel_heading
      - cancel_description
      - reason_selector
      - impact_notice
      - cancel_button
      - back_button
    hidden:
      - strike_warning
      - suspension_warning
      - confirming_spinner
  - id: strike_warning_count
    description: Tasker has 1-2 cancellations in rolling 30 days — explicit strike count warning shown
    visible:
      - handle_bar
      - cancel_heading
      - strike_warning
      - strike_count_display
      - reason_selector
      - cancel_button
      - back_button
    hidden:
      - suspension_warning
      - confirming_spinner
      - default_description
  - id: strike_warning_suspension
    description: Tasker has 2 cancellations in rolling 30 days — next cancellation triggers 7-day suspension
    visible:
      - handle_bar
      - cancel_heading
      - suspension_warning
      - strike_count_display
      - reason_selector
      - cancel_button_danger_emphasized
      - back_button
    hidden:
      - strike_warning
      - confirming_spinner
      - default_description
  - id: confirming
    description: Cancellation is being submitted to the API
    visible:
      - handle_bar
      - cancel_heading
      - confirming_spinner
    hidden:
      - reason_selector
      - cancel_button
      - back_button
      - strike_warning
      - suspension_warning
copy:
  - key: cancel_heading
    mn: Захиалга цуцлах уу?
    en: Cancel this booking?
  - key: cancel_description
    mn: Захиалга цуцлагдвал даалгавар дахин нээлттэй болно. Цуцлалт таны найдвартай байдлын үзүүлэлтэд нөлөөлнө.
    en: Cancelling will reopen the task. Cancellations affect your reliability score.
  - key: impact_notice
    mn: Цуцлалт нь таны хайлтын эрэмбэлэлт болон найдвартай байдлын үнэлгээнд нөлөөлнө.
    en: Cancellations affect your search ranking and reliability score.
  - key: strike_warning
    mn: 'Анхааруулга: Та сүүлийн 30 хоногт {count} удаа цуцалсан байна.'
    en: 'Warning: You have cancelled {count} time(s) in the last 30 days.'
  - key: suspension_warning
    mn: >-
      Анхааруулга: Та сүүлийн 30 хоногт 2 удаа цуцалсан байна. Дахин нэг удаа цуцалвал таны бүртгэл 7 хоногоор
      түдгэлзэнэ!
    en: 'Warning: You have 2 cancellations in 30 days. One more will result in a 7-day suspension!'
  - key: strike_count_display
    mn: '{count}/3 цуцлалт (30 хоногт)'
    en: '{count}/3 cancellations (30 days)'
  - key: reason_label
    mn: Цуцлах шалтгаан
    en: Reason for cancellation
  - key: reason_schedule_conflict
    mn: Цагийн хуваарь таарахгүй болсон
    en: Schedule conflict
  - key: reason_personal
    mn: Хувийн шалтгаан
    en: Personal reasons
  - key: reason_emergency
    mn: Яаралтай нөхцөл байдал
    en: Emergency
  - key: reason_other
    mn: Бусад
    en: Other
  - key: cancel_confirm_button
    mn: Цуцлахыг баталгаажуулах
    en: Confirm Cancellation
  - key: cancel_confirm_button_danger
    mn: Цуцлах (түдгэлзүүлэх эрсдэлтэй!)
    en: Cancel (Risk of Suspension!)
  - key: back_button
    mn: Буцах
    en: Go Back
acceptance_criteria:
  - This is a bottom sheet overlay, not a standalone route
  - Cancellation reopens linked task to OPEN (REQ-BOOK-06)
  - 'Strike warning system: 3 cancellations in any rolling 30-day window triggers 7-day suspension (REQ-BOOK-06)'
  - Default state shows standard cancellation warning when 0 recent strikes
  - Strike warning count state shows '{count}/3 цуцлалт (30 хоногт)' when 1-2 recent cancellations exist
  - Suspension warning state shows explicit '7 хоногоор түдгэлзэнэ' message when at 2/3 strikes
  - At 2/3 strikes, confirm button text changes to 'Цуцлах (түдгэлзүүлэх эрсдэлтэй!)'
  - Reason selector requires selection before confirm button enables
  - Confirm button uses danger variant for destructive action
  - Cancel triggers PUT /bookings/:id/cancel
  - On confirmation, navigates to My Jobs (SCR-TASK-012) via replace
  - Go Back dismisses sheet and returns to Booking Detail (SCR-TASK-013)
  - Strike count is fetched from tasker_cancel_count_30d data dependency
  - Scrim overlay behind sheet per modal_sheet template
api_endpoints:
  - method: PUT
    path: /bookings/:id/cancel
    purpose: Cancel the booking — task reverts to OPEN, strike count incremented
analytics_events:
  - event: booking_cancel_tasker_viewed
    trigger: Booking Cancel (Tasker) sheet becomes visible
  - event: booking_cancel_tasker_strike_warning
    trigger: Strike warning state is displayed
  - event: booking_cancel_tasker_suspension_warning
    trigger: Suspension warning state is displayed (2/3 strikes)
  - event: booking_cancel_tasker_confirmed
    trigger: Tasker confirms cancellation
  - event: booking_cancel_tasker_reason_selected
    trigger: Tasker selects a cancellation reason
  - event: booking_cancel_tasker_aborted
    trigger: Tasker taps Go Back to keep the booking
state_prompts:
  - state_id: default
    prompt: >-
      Generate the "default" state of "Booking Cancel (Tasker)".

      First cancellation or no recent strikes — standard cancellation warning with reason selection

      Visible elements: handle_bar, cancel_heading, cancel_description, reason_selector, impact_notice, cancel_button,
      back_button

      Hidden elements: strike_warning, suspension_warning, confirming_spinner

      Style: Deep blue (#1B3A5C) primary, gold (#C49A3C) accents, off-white (#F9F8F5) background. Mongolian Cyrillic
      text. 16px minimum body text.
  - state_id: strike_warning_count
    prompt: >-
      Generate the "strike_warning_count" state of "Booking Cancel (Tasker)".

      Tasker has 1-2 cancellations in rolling 30 days — explicit strike count warning shown

      Visible elements: handle_bar, cancel_heading, strike_warning, strike_count_display, reason_selector,
      cancel_button, back_button

      Hidden elements: suspension_warning, confirming_spinner, default_description

      Style: Deep blue (#1B3A5C) primary, gold (#C49A3C) accents, off-white (#F9F8F5) background. Mongolian Cyrillic
      text. 16px minimum body text.
  - state_id: strike_warning_suspension
    prompt: >-
      Generate the "strike_warning_suspension" state of "Booking Cancel (Tasker)".

      Tasker has 2 cancellations in rolling 30 days — next cancellation triggers 7-day suspension

      Visible elements: handle_bar, cancel_heading, suspension_warning, strike_count_display, reason_selector,
      cancel_button_danger_emphasized, back_button

      Hidden elements: strike_warning, confirming_spinner, default_description

      Style: Deep blue (#1B3A5C) primary, gold (#C49A3C) accents, off-white (#F9F8F5) background. Mongolian Cyrillic
      text. 16px minimum body text.
  - state_id: confirming
    prompt: >-
      Generate the "confirming" state of "Booking Cancel (Tasker)".

      Cancellation is being submitted to the API

      Visible elements: handle_bar, cancel_heading, confirming_spinner

      Hidden elements: reason_selector, cancel_button, back_button, strike_warning, suspension_warning

      Style: Deep blue (#1B3A5C) primary, gold (#C49A3C) accents, off-white (#F9F8F5) background. Mongolian Cyrillic
      text. 16px minimum body text.
