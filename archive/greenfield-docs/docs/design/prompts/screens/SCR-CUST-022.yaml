screen_id: SCR-CUST-022
name: Booking Cancel (Customer)
role:
  - customer
phase: 0-1
template: modal_sheet
route: null
context_refs:
  global: prompts/global-context.yaml
  journeys:
    - prompts/journeys/JRN-CUST-04.yaml
stitch_prompt: >-
  Design a mobile app screen for "Booking Cancel (Customer)" (SCR-CUST-022) in the Tasky app — Mongolia's domestic
  service marketplace.

  This screen is used by Customer role.

  Template: modal_sheet — Bottom sheet overlay with drag handle bar, content area, and max 2 action buttons. Branded
  scrim backdrop.

  Layout structure: scrim -> sheet(handle_bar + title + policy_description + incident_count + primary_action +
  secondary_action)

  Components used:
    • COMP-MODALSHEET (default): Bottom sheet overlay for booking cancellation confirmation with policy context
    • COMP-BUTTON (danger): Primary cancel button (danger variant) and secondary go-back button
  This screen has 4 states — generate the primary/default state:
    Primary state: Cancellation is more than 4 hours before scheduled time; no penalty. Simple confirmation with no-penalty messaging
  Key copy (Mongolian primary):
    • title: "Захиалга цуцлах" (Cancel Booking)
    • free_cancel_description: "Та энэ захиалгыг торгуулгүйгээр цуцлах боломжтой." (You can cancel this booking with no penalty.)
    • late_cancel_description: "Товлосон цаг хүртэл 4 цагаас бага хугацаа үлдлээ. Энэ цуцлалт таны найдвартай байдлын бүртгэлд тэмдэглэгдэнэ." (Less than 4 hours until scheduled time. This cancellation will be recorded as a reliability incident.)
    • late_cancel_first_warning: "Энэ нь таны сүүлийн 28 хоногийн анхны зөрчил байна. Анхааруулга хэлбэрээр бүртгэгдэнэ." (This is your first incident in the last 28 days. It will be recorded as a warning.)
    • late_cancel_repeat_warning: "Та сүүлийн 28 хоногт аль хэдийн 1 зөрчилтэй байна. 2 дахь зөрчил нь зэрэглэлийн бууралт болон торгуулийн шалгалтыг идэвхжүүлж болно." (You already have 1 incident in the last 28 days. A 2nd incident may trigger ranking penalty and strike review.)
    • cta_cancel_confirm: "Захиалга цуцлах" (Cancel Booking)
  Style: Deep blue (#1B3A5C) primary, gold (#C49A3C) accents, off-white (#F9F8F5) background. Manrope for headings, Plus
  Jakarta Sans for body. 16px minimum body text. Clean, professional, premium feel. Mongolian Cyrillic text.
layout:
  template: modal_sheet
  density: default
  structure: scrim -> sheet(handle_bar + title + policy_description + incident_count + primary_action + secondary_action)
components:
  - component: COMP-MODALSHEET
    variant: default
    usage: Bottom sheet overlay for booking cancellation confirmation with policy context
  - component: COMP-BUTTON
    variant: danger
    usage: Primary cancel button (danger variant) and secondary go-back button
states:
  - id: free_cancel
    description: Cancellation is more than 4 hours before scheduled time; no penalty. Simple confirmation with no-penalty messaging
    visible:
      - COMP-MODALSHEET
      - COMP-BUTTON
    hidden: []
  - id: late_cancel_warning
    description: >-
      Cancellation is within 4 hours of scheduled time; late cancellation warning shown with reliability incident
      implications
    visible:
      - COMP-MODALSHEET
      - COMP-BUTTON
    hidden: []
  - id: late_cancel_incident_count
    description: >-
      Late cancellation and customer already has 1 incident in trailing 28 days; stronger warning about ranking penalty
      and potential strike review
    visible:
      - COMP-MODALSHEET
      - COMP-BUTTON
    hidden: []
  - id: confirming
    description: User tapped cancel; PUT /bookings/:id/cancel in progress; button shows loading state
    visible:
      - COMP-MODALSHEET
      - COMP-BUTTON
    hidden: []
copy:
  - key: title
    mn: Захиалга цуцлах
    en: Cancel Booking
  - key: free_cancel_description
    mn: Та энэ захиалгыг торгуулгүйгээр цуцлах боломжтой.
    en: You can cancel this booking with no penalty.
  - key: late_cancel_description
    mn: Товлосон цаг хүртэл 4 цагаас бага хугацаа үлдлээ. Энэ цуцлалт таны найдвартай байдлын бүртгэлд тэмдэглэгдэнэ.
    en: Less than 4 hours until scheduled time. This cancellation will be recorded as a reliability incident.
  - key: late_cancel_first_warning
    mn: Энэ нь таны сүүлийн 28 хоногийн анхны зөрчил байна. Анхааруулга хэлбэрээр бүртгэгдэнэ.
    en: This is your first incident in the last 28 days. It will be recorded as a warning.
  - key: late_cancel_repeat_warning
    mn: >-
      Та сүүлийн 28 хоногт аль хэдийн 1 зөрчилтэй байна. 2 дахь зөрчил нь зэрэглэлийн бууралт болон торгуулийн шалгалтыг
      идэвхжүүлж болно.
    en: You already have 1 incident in the last 28 days. A 2nd incident may trigger ranking penalty and strike review.
  - key: cta_cancel_confirm
    mn: Захиалга цуцлах
    en: Cancel Booking
  - key: cta_go_back
    mn: Буцах
    en: Go Back
  - key: policy_note
    mn: 'Цуцлалтын бодлого: 4+ цагийн өмнө — торгуулгүй. 4 цагийн дотор — найдвартай байдлын зөрчил.'
    en: 'Cancellation policy: >4 hours before — no penalty. Within 4 hours — reliability incident.'
acceptance_criteria:
  - Free cancellation state shows no-penalty messaging when >4 hours before scheduled time per REQ-BOOK-04
  - Late cancellation warning appears when <4 hours before scheduled time
  - Late cancel incident count state shows elevated warning when customer has 1 existing incident in trailing 28 days
  - 2 incidents in trailing 28 days triggers ranking penalty and potential strike review per PRD Section 6.4.5
  - Cancel button uses danger variant requiring explicit tap
  - Confirming state shows loading spinner on button while PUT /bookings/:id/cancel is in progress
  - On successful cancellation, sheet dismisses and navigates via replace to Customer Bookings List (SCR-CUST-016)
  - Tapping Go Back dismisses the sheet and returns to Booking Detail (SCR-CUST-017)
  - Cancellation policy note is always visible at the bottom of the sheet
  - Drag-to-dismiss via handle bar is supported
  - All copy renders correctly in Mongolian Cyrillic at 16px minimum body size
api_endpoints:
  - method: PUT
    path: /bookings/:id/cancel
    purpose: Cancel the booking; records reliability incident if late cancellation
analytics_events:
  - event: booking_cancel_sheet_shown
    trigger: Cancellation modal sheet appears
  - event: booking_cancel_free
    trigger: User confirms free cancellation (>4 hours before schedule)
  - event: booking_cancel_late
    trigger: User confirms late cancellation (<4 hours before schedule)
  - event: booking_cancel_aborted
    trigger: User taps Go Back or dismisses the sheet
state_prompts:
  - state_id: free_cancel
    prompt: >-
      Generate the "free_cancel" state of "Booking Cancel (Customer)".

      Cancellation is more than 4 hours before scheduled time; no penalty. Simple confirmation with no-penalty messaging

      Visible elements: COMP-MODALSHEET, COMP-BUTTON

      Style: Deep blue (#1B3A5C) primary, gold (#C49A3C) accents, off-white (#F9F8F5) background. Mongolian Cyrillic
      text. 16px minimum body text.
  - state_id: late_cancel_warning
    prompt: >-
      Generate the "late_cancel_warning" state of "Booking Cancel (Customer)".

      Cancellation is within 4 hours of scheduled time; late cancellation warning shown with reliability incident
      implications

      Visible elements: COMP-MODALSHEET, COMP-BUTTON

      Style: Deep blue (#1B3A5C) primary, gold (#C49A3C) accents, off-white (#F9F8F5) background. Mongolian Cyrillic
      text. 16px minimum body text.
  - state_id: late_cancel_incident_count
    prompt: >-
      Generate the "late_cancel_incident_count" state of "Booking Cancel (Customer)".

      Late cancellation and customer already has 1 incident in trailing 28 days; stronger warning about ranking penalty
      and potential strike review

      Visible elements: COMP-MODALSHEET, COMP-BUTTON

      Style: Deep blue (#1B3A5C) primary, gold (#C49A3C) accents, off-white (#F9F8F5) background. Mongolian Cyrillic
      text. 16px minimum body text.
  - state_id: confirming
    prompt: >-
      Generate the "confirming" state of "Booking Cancel (Customer)".

      User tapped cancel; PUT /bookings/:id/cancel in progress; button shows loading state

      Visible elements: COMP-MODALSHEET, COMP-BUTTON

      Style: Deep blue (#1B3A5C) primary, gold (#C49A3C) accents, off-white (#F9F8F5) background. Mongolian Cyrillic
      text. 16px minimum body text.
