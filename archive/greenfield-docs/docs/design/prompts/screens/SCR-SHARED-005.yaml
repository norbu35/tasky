screen_id: SCR-SHARED-005
name: Onboarding Carousel
role:
  - customer
  - tasker
phase: 0-1
template: auth
route: /onboarding
context_refs:
  global: prompts/global-context.yaml
  journeys:
    - prompts/journeys/JRN-SHARED-01.yaml
stitch_prompt: >-
  Design a mobile app screen for "Onboarding Carousel" (SCR-SHARED-005) in the Tasky app — Mongolia's domestic service
  marketplace.

  This screen is used by both Customer and Tasker roles.

  Template: auth — Centered content with single CTA and trust messaging. Comfortable density, vertically centered,
  primary CTA at bottom.

  Layout structure: safe_area -> carousel(illustration + heading + description) -> page_dots -> bottom_cta(next_or_skip)

  Components used:
    • COMP-BUTTON (primary): Primary CTA changes from 'Дараагийх' on slides 1-2 to 'Эхлэх' on slide 3
    • COMP-BUTTON (ghost): Skip link at top-right to bypass remaining slides
    • COMP-PROGRESSTRACKER (default): Page dots indicating current slide position (3 total)
  This screen has 3 states — generate the primary/default state:
    Primary state: First onboarding slide: value proposition about finding trusted taskers
  Key copy (Mongolian primary):
    • skip_label: "Алгасах" (Skip)
    • next_label: "Дараагийх" (Next)
    • start_label: "Эхлэх" (Get Started)
    • slide_1_heading: "Найдвартай гүйцэтгэгч олох" (Find Trusted Taskers)
    • slide_1_description: "Баталгаажсан, итгэлтэй гүйцэтгэгчидтэй холбогдоорой" (Connect with verified and reliable taskers)
    • slide_2_heading: "Захиалга хийх амархан" (Easy Booking)
  Style: Deep blue (#1B3A5C) primary, gold (#C49A3C) accents, off-white (#F9F8F5) background. Manrope for headings, Plus
  Jakarta Sans for body. 16px minimum body text. Clean, professional, premium feel. Mongolian Cyrillic text.
layout:
  template: auth
  density: comfortable
  structure: safe_area -> carousel(illustration + heading + description) -> page_dots -> bottom_cta(next_or_skip)
components:
  - component: COMP-BUTTON
    variant: primary
    usage: Primary CTA changes from 'Дараагийх' on slides 1-2 to 'Эхлэх' on slide 3
  - component: COMP-BUTTON
    variant: ghost
    usage: Skip link at top-right to bypass remaining slides
  - component: COMP-PROGRESSTRACKER
    variant: default
    usage: Page dots indicating current slide position (3 total)
states:
  - id: slide_1
    description: 'First onboarding slide: value proposition about finding trusted taskers'
    visible:
      - illustration_1
      - heading_1
      - description_1
      - page_dots
      - next_button
      - skip_link
    hidden:
      - illustration_2
      - illustration_3
      - heading_2
      - heading_3
      - description_2
      - description_3
      - start_button
  - id: slide_2
    description: 'Second onboarding slide: value proposition about easy booking process'
    visible:
      - illustration_2
      - heading_2
      - description_2
      - page_dots
      - next_button
      - skip_link
    hidden:
      - illustration_1
      - illustration_3
      - heading_1
      - heading_3
      - description_1
      - description_3
      - start_button
  - id: slide_3
    description: 'Third and final onboarding slide: value proposition about safe transactions; CTA becomes ''Эхлэх'''
    visible:
      - illustration_3
      - heading_3
      - description_3
      - page_dots
      - start_button
    hidden:
      - illustration_1
      - illustration_2
      - heading_1
      - heading_2
      - description_1
      - description_2
      - next_button
      - skip_link
copy:
  - key: skip_label
    mn: Алгасах
    en: Skip
  - key: next_label
    mn: Дараагийх
    en: Next
  - key: start_label
    mn: Эхлэх
    en: Get Started
  - key: slide_1_heading
    mn: Найдвартай гүйцэтгэгч олох
    en: Find Trusted Taskers
  - key: slide_1_description
    mn: Баталгаажсан, итгэлтэй гүйцэтгэгчидтэй холбогдоорой
    en: Connect with verified and reliable taskers
  - key: slide_2_heading
    mn: Захиалга хийх амархан
    en: Easy Booking
  - key: slide_2_description
    mn: Ажлаа нийтлэж, хэдхэн товшилтоор захиалга хийгээрэй
    en: Post your task and book in just a few taps
  - key: slide_3_heading
    mn: Аюулгүй, итгэлтэй
    en: Safe & Secure
  - key: slide_3_description
    mn: Үнэлгээ, баталгаажуулалтаар хамгаалагдсан нийгэмлэг
    en: A community protected by reviews and verification
acceptance_criteria:
  - Carousel displays 3 slides with swipe gesture and Next button navigation
  - Page dots accurately reflect the current slide position
  - Skip link is visible on slides 1 and 2 but hidden on slide 3
  - CTA label changes from 'Дараагийх' (Next) to 'Эхлэх' (Get Started) on the final slide
  - Tapping Skip or Get Started replaces to Role Selection (SCR-SHARED-006)
  - Swipe left advances to next slide; swipe right returns to previous slide
  - Illustrations are centered above heading and description text
  - No API calls are made on this screen
  - Animations between slides use page_enter/page_exit transitions
api_endpoints: []
analytics_events:
  - event: onboarding_started
    trigger: Onboarding carousel becomes visible (slide 1)
  - event: onboarding_slide_viewed
    trigger: Each slide becomes active; includes slide_number property
  - event: onboarding_next_tapped
    trigger: User taps Next button
  - event: onboarding_skipped
    trigger: User taps Skip link; includes current_slide property
  - event: onboarding_completed
    trigger: User taps 'Get Started' on slide 3
state_prompts:
  - state_id: slide_1
    prompt: >-
      Generate the "slide_1" state of "Onboarding Carousel".

      First onboarding slide: value proposition about finding trusted taskers

      Visible elements: illustration_1, heading_1, description_1, page_dots, next_button, skip_link

      Hidden elements: illustration_2, illustration_3, heading_2, heading_3, description_2, description_3, start_button

      Style: Deep blue (#1B3A5C) primary, gold (#C49A3C) accents, off-white (#F9F8F5) background. Mongolian Cyrillic
      text. 16px minimum body text.
  - state_id: slide_2
    prompt: >-
      Generate the "slide_2" state of "Onboarding Carousel".

      Second onboarding slide: value proposition about easy booking process

      Visible elements: illustration_2, heading_2, description_2, page_dots, next_button, skip_link

      Hidden elements: illustration_1, illustration_3, heading_1, heading_3, description_1, description_3, start_button

      Style: Deep blue (#1B3A5C) primary, gold (#C49A3C) accents, off-white (#F9F8F5) background. Mongolian Cyrillic
      text. 16px minimum body text.
  - state_id: slide_3
    prompt: >-
      Generate the "slide_3" state of "Onboarding Carousel".

      Third and final onboarding slide: value proposition about safe transactions; CTA becomes 'Эхлэх'

      Visible elements: illustration_3, heading_3, description_3, page_dots, start_button

      Hidden elements: illustration_1, illustration_2, heading_1, heading_2, description_1, description_2, next_button,
      skip_link

      Style: Deep blue (#1B3A5C) primary, gold (#C49A3C) accents, off-white (#F9F8F5) background. Mongolian Cyrillic
      text. 16px minimum body text.
