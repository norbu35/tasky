  - key: evidence_text_label
    mn: Бичгэн тайлбар
    en: Written Timeline
  - key: cta_submit
    mn: Маргаан илгээх
    en: Submit Dispute
  - key: cta_back
    mn: Буцах
    en: Back
  - key: validation_no_evidence_error
    mn: Дор хаяж 1 нотлох баримт шаардлагатай
