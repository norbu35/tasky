screen_id: SCR-CUST-024
name: Dispute — Raise
role:
  - customer
phase: 0-1
template: form_wizard
route: /(customer)/bookings/:bookingId/dispute
context_refs:
  global: prompts/global-context.yaml
  journeys:
    - prompts/journeys/JRN-CUST-06.yaml
stitch_prompt: >-
  Design a mobile app screen for "Dispute — Raise" (SCR-CUST-024) in the Tasky app — Mongolia's domestic service
  marketplace.

  This screen is used by Customer role.

  Template: form_wizard — Step indicator showing progress, scrollable form fields, back/next navigation at bottom.
  Keyboard-aware scrolling.

  Layout structure: safe_area -> nav_header(back + title) -> scrollview(booking_reference + reason_selector +
  evidence_upload + description) -> bottom_nav(back + submit)

  Components used:
    • COMP-FORMFIELD (default): Wrapper for dispute reason selection, evidence upload section, and written description
    • COMP-INPUT (multiline): Written timeline/description text area for dispute details
    • COMP-PHOTOPICKER (default): Evidence photo upload (at least 1 artifact required per PRD Section 6.4.6)
    • COMP-BUTTON (primary): Submit dispute button and back button
    • COMP-TOAST (success): Success toast after dispute submission or error toast on failure
  This screen has 8 states — generate the primary/default state:
    Primary state: Form shown with booking reference at top, reason selector, evidence upload area, and description field. At least one evidence artifact is required
  Key copy (Mongolian primary):
    • page_title: "Асуудал мэдэгдэх" (Report Issue)
    • section_booking_ref: "Захиалгын мэдээлэл" (Booking Reference)
    • label_reason: "Асуудлын шалтгаан" (Issue Type)
    • label_evidence: "Нотлох баримт" (Evidence)
    • evidence_helper: "Дор хаяж 1 нотлох баримт шаардлагатай: зураг, чатын хэсэг, эсвэл бичгэн тайлбар" (At least 1 evidence artifact required: photo, chat excerpt, or written timeline)
    • label_description: "Дэлгэрэнгүй тайлбар" (Description)
  Style: Deep blue (#1B3A5C) primary, gold (#C49A3C) accents, off-white (#F9F8F5) background. Manrope for headings, Plus
  Jakarta Sans for body. 16px minimum body text. Clean, professional, premium feel. Mongolian Cyrillic text.
layout:
  template: form_wizard
  density: default
  structure: >-
    safe_area -> nav_header(back + title) -> scrollview(booking_reference + reason_selector + evidence_upload +
    description) -> bottom_nav(back + submit)
components:
  - component: COMP-FORMFIELD
    variant: default
    usage: Wrapper for dispute reason selection, evidence upload section, and written description
  - component: COMP-INPUT
    variant: multiline
    usage: Written timeline/description text area for dispute details
  - component: COMP-PHOTOPICKER
    variant: default
    usage: Evidence photo upload (at least 1 artifact required per PRD Section 6.4.6)
  - component: COMP-BUTTON
    variant: primary
    usage: Submit dispute button and back button
  - component: COMP-TOAST
    variant: success
    usage: Success toast after dispute submission or error toast on failure
states:
  - id: default
    description: >-
      Form shown with booking reference at top, reason selector, evidence upload area, and description field. At least
      one evidence artifact is required
    visible:
      - COMP-FORMFIELD
      - COMP-INPUT
      - COMP-PHOTOPICKER
      - COMP-BUTTON
    hidden:
      - COMP-TOAST
  - id: evidence_photo
    description: User is uploading photo evidence; upload progress shown per photo
    visible:
      - COMP-FORMFIELD
      - COMP-INPUT
      - COMP-PHOTOPICKER
      - COMP-BUTTON
    hidden:
      - COMP-TOAST
  - id: evidence_chat
    description: User selects chat excerpt as evidence; chat excerpt selector shown
    visible:
      - COMP-FORMFIELD
      - COMP-INPUT
      - COMP-BUTTON
    hidden:
      - COMP-PHOTOPICKER
      - COMP-TOAST
  - id: evidence_text
    description: User writes a text-based timeline as evidence; description field active
    visible:
      - COMP-FORMFIELD
      - COMP-INPUT
      - COMP-BUTTON
    hidden:
      - COMP-PHOTOPICKER
      - COMP-TOAST
  - id: submitting
    description: Dispute submission in progress via POST /disputes; submit button in loading state
    visible:
      - COMP-FORMFIELD
      - COMP-INPUT
      - COMP-PHOTOPICKER
      - COMP-BUTTON
    hidden:
      - COMP-TOAST
  - id: success
    description: Dispute submitted successfully; navigates to Dispute Status screen
    visible:
      - COMP-TOAST
    hidden:
      - COMP-FORMFIELD
      - COMP-INPUT
      - COMP-PHOTOPICKER
      - COMP-BUTTON
  - id: validation_no_evidence
    description: User attempted to submit without any evidence artifact; inline validation error shown on evidence section
    visible:
      - COMP-FORMFIELD
      - COMP-INPUT
      - COMP-PHOTOPICKER
      - COMP-BUTTON
    hidden:
      - COMP-TOAST
  - id: error_network
    description: Network error during submission; error toast with retry
    visible:
      - COMP-FORMFIELD
      - COMP-INPUT
      - COMP-PHOTOPICKER
      - COMP-BUTTON
      - COMP-TOAST
    hidden: []
