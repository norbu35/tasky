    en: Dispute auto-closes if evidence is not provided within 24 hours
  - key: eligibility_note
    mn: 'Маргаан нээх боломжтой: ASSIGNED төлөвт эсвэл COMPLETED-аас хойш 24 цагийн дотор'
    en: Disputes can be opened during ASSIGNED status or within 24 hours of COMPLETED
acceptance_criteria:
  - >-
    Disputes can only be raised when booking is ASSIGNED or within 24 hours of COMPLETED per REQ-SAFE-03 and PRD Section
    6.4.6
  - 'At least one evidence artifact is required: photo, chat excerpt, or written timeline per REQ-SAFE-10'
  - Submitting without evidence shows inline validation error on evidence section
  - Photo evidence uses presigned URL upload with per-photo progress
  - Chat excerpt selection allows highlighting relevant message range
  - Written timeline has 500 character limit
  - Submit button sends POST /disputes with all evidence artifacts and enters loading state
  - On success, navigates via replace to Dispute Status (SCR-CUST-025)
  - Evidence deadline note warns that dispute auto-closes after 24 hours if evidence not provided
  - Back button navigates via pop to Booking Detail (SCR-CUST-017)
  - Network error shows error toast with retry
  - All copy renders correctly in Mongolian Cyrillic at 16px minimum body size
api_endpoints:
  - method: POST
    path: /disputes
    purpose: Submit a new dispute with reason, evidence artifacts, and description
analytics_events:
  - event: dispute_raise_viewed
    trigger: Dispute form screen becomes visible
  - event: dispute_evidence_photo_added
    trigger: User uploads a photo as evidence
  - event: dispute_evidence_chat_selected
    trigger: User selects a chat excerpt as evidence
  - event: dispute_evidence_text_entered
    trigger: User writes text-based evidence
  - event: dispute_submitted
    trigger: User taps submit and POST /disputes is sent
  - event: dispute_validation_no_evidence
    trigger: Submit attempted without any evidence artifact
  - event: dispute_submit_error
    trigger: Network error during dispute submission
