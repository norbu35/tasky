    en: 'At least 1 evidence artifact required: photo, chat excerpt, or written timeline'
  - key: label_description
    mn: Дэлгэрэнгүй тайлбар
    en: Description
  - key: placeholder_description
    mn: Асуудлын дэлгэрэнгүй тайлбар...
    en: Describe the issue in detail...
  - key: evidence_photo_label
    mn: Зураг нэмэх
