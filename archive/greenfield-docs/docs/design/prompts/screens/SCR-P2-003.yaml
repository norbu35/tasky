screen_id: SCR-P2-003
name: Credits — Transaction History
role:
  - tasker
phase: '2'
template: feed_list
route: /(tasker)/credits/history
context_refs:
  global: prompts/global-context.yaml
  journeys:
    - prompts/journeys/JRN-TASK-05.yaml
stitch_prompt: >-
  Design a mobile app screen for "Credits — Transaction History" (SCR-P2-003) in the Tasky app — Mongolia's domestic
  service marketplace.

  This screen is used by Tasker role.

  Template: feed_list — Sticky header (search bar + filter bar) above a scrollable card feed. Pull-to-refresh, infinite
  scroll pagination, skeleton loading placeholders.

  Layout structure: safe_area -> sticky_header(nav) -> scrollview(transaction_list) -> pagination_footer

  Components used:
    • COMP-LOADINGSKELETON (list_row): List row skeletons matching transaction row layout during initial load
    • COMP-LISTROW (default): Each transaction as a list row showing type, date, credit change, and running balance
    • COMP-EMPTYSTATE (no_results): Empty state when no transactions exist yet
    • COMP-EMPTYSTATE (error): Error state when transaction history fails to load
    • COMP-BUTTON (ghost): Back button in nav header
  This screen has 5 states — generate the primary/default state:
    Primary state: Fetching transaction history from API
  Key copy (Mongolian primary):
    • nav_title: "Гүйлгээний түүх" (Transaction History)
    • type_purchase: "Кредит худалдаж авсан" (Credits purchased)
    • type_lead_unlock: "Санал хүлээн авсан" (Lead unlocked)
    • type_refund: "Буцаалт" (Refund)
    • credit_added: "+{count} кредит" (+{count} credits)
    • credit_spent: "-{count} кредит" (-{count} credits)
  Style: Deep blue (#1B3A5C) primary, gold (#C49A3C) accents, off-white (#F9F8F5) background. Manrope for headings, Plus
  Jakarta Sans for body. 16px minimum body text. Clean, professional, premium feel. Mongolian Cyrillic text.
layout:
  template: feed_list
  density: compact
  structure: safe_area -> sticky_header(nav) -> scrollview(transaction_list) -> pagination_footer
components:
  - component: COMP-LOADINGSKELETON
    variant: list_row
    usage: List row skeletons matching transaction row layout during initial load
  - component: COMP-LISTROW
    variant: default
    usage: Each transaction as a list row showing type, date, credit change, and running balance
  - component: COMP-EMPTYSTATE
    variant: no_results
    usage: Empty state when no transactions exist yet
  - component: COMP-EMPTYSTATE
    variant: error
    usage: Error state when transaction history fails to load
  - component: COMP-BUTTON
    variant: ghost
    usage: Back button in nav header
states:
  - id: loading_initial
    description: Fetching transaction history from API
    visible:
      - COMP-LOADINGSKELETON
    hidden:
      - COMP-LISTROW
      - COMP-EMPTYSTATE
  - id: empty
    description: No transactions yet; user has never purchased or used credits
    visible:
      - COMP-EMPTYSTATE.no_results
    hidden:
      - COMP-LOADINGSKELETON
      - COMP-LISTROW
      - COMP-EMPTYSTATE.error
  - id: populated
    description: Transaction list loaded with entries sorted newest-first
    visible:
      - COMP-LISTROW
    hidden:
      - COMP-LOADINGSKELETON
      - COMP-EMPTYSTATE
  - id: loading_pagination
    description: Loading next page of transactions via infinite scroll
    visible:
      - COMP-LISTROW
      - COMP-LOADINGSKELETON
    hidden:
      - COMP-EMPTYSTATE
  - id: error_network
    description: Failed to load transactions due to network error
    visible:
      - COMP-EMPTYSTATE.error
    hidden:
      - COMP-LOADINGSKELETON
      - COMP-LISTROW
      - COMP-EMPTYSTATE.no_results
copy:
  - key: nav_title
    mn: Гүйлгээний түүх
    en: Transaction History
  - key: type_purchase
    mn: Кредит худалдаж авсан
    en: Credits purchased
  - key: type_lead_unlock
    mn: Санал хүлээн авсан
    en: Lead unlocked
  - key: type_refund
    mn: Буцаалт
    en: Refund
  - key: credit_added
    mn: +{count} кредит
    en: +{count} credits
  - key: credit_spent
    mn: '-{count} кредит'
    en: '-{count} credits'
  - key: empty_headline
    mn: Гүйлгээ байхгүй
    en: No transactions
  - key: empty_description
    mn: Кредит худалдаж авсны дараа гүйлгээний түүх энд харагдана
    en: Transaction history will appear here after your first purchase
  - key: empty_cta
    mn: Кредит авах
    en: Buy credits
  - key: error_headline
    mn: Ачааллах боломжгүй
    en: Unable to load
  - key: error_retry
    mn: Дахин оролдох
    en: Try again
acceptance_criteria:
  - Loading state shows 8 list row skeletons in compact density
  - Each transaction row shows type icon, description, date, and credit delta (+/-)
  - Credit additions are displayed in verified (green) color, deductions in default
  - Transactions are sorted newest-first with date grouping headers
  - Infinite scroll pagination loads next page with skeleton footer
  - Empty state directs user to purchase credits with actionable CTA
  - Network error state shows retry CTA
  - Back button returns to SCR-P2-001 (Credits Balance)
  - Compact density applies 0.75x spacing multiplier to list rows
  - Date format follows YYYY.MM.DD Mongolian convention
  - All copy renders correctly in Mongolian Cyrillic at 16px minimum body size
api_endpoints:
  - method: GET
    path: /credits/transactions
    purpose: Fetch paginated credit transaction history
analytics_events:
  - event: credits_history_viewed
    trigger: Transaction history screen loaded successfully
  - event: credits_history_pagination
    trigger: User scrolls to load next page of transactions
  - event: credits_history_empty_cta
    trigger: User taps 'Buy credits' from empty state
state_prompts:
  - state_id: loading_initial
    prompt: >-
      Generate the "loading_initial" state of "Credits — Transaction History".

      Fetching transaction history from API

      Visible elements: COMP-LOADINGSKELETON

      Hidden elements: COMP-LISTROW, COMP-EMPTYSTATE

      Style: Deep blue (#1B3A5C) primary, gold (#C49A3C) accents, off-white (#F9F8F5) background. Mongolian Cyrillic
      text. 16px minimum body text.
  - state_id: empty
    prompt: >-
      Generate the "empty" state of "Credits — Transaction History".

      No transactions yet; user has never purchased or used credits

      Visible elements: COMP-EMPTYSTATE.no_results

      Hidden elements: COMP-LOADINGSKELETON, COMP-LISTROW, COMP-EMPTYSTATE.error

      Style: Deep blue (#1B3A5C) primary, gold (#C49A3C) accents, off-white (#F9F8F5) background. Mongolian Cyrillic
      text. 16px minimum body text.
  - state_id: populated
    prompt: >-
      Generate the "populated" state of "Credits — Transaction History".

      Transaction list loaded with entries sorted newest-first

      Visible elements: COMP-LISTROW

      Hidden elements: COMP-LOADINGSKELETON, COMP-EMPTYSTATE

      Style: Deep blue (#1B3A5C) primary, gold (#C49A3C) accents, off-white (#F9F8F5) background. Mongolian Cyrillic
      text. 16px minimum body text.
  - state_id: loading_pagination
    prompt: >-
      Generate the "loading_pagination" state of "Credits — Transaction History".

      Loading next page of transactions via infinite scroll

      Visible elements: COMP-LISTROW, COMP-LOADINGSKELETON

      Hidden elements: COMP-EMPTYSTATE

      Style: Deep blue (#1B3A5C) primary, gold (#C49A3C) accents, off-white (#F9F8F5) background. Mongolian Cyrillic
      text. 16px minimum body text.
  - state_id: error_network
    prompt: >-
      Generate the "error_network" state of "Credits — Transaction History".

      Failed to load transactions due to network error

      Visible elements: COMP-EMPTYSTATE.error

      Hidden elements: COMP-LOADINGSKELETON, COMP-LISTROW, COMP-EMPTYSTATE.no_results

      Style: Deep blue (#1B3A5C) primary, gold (#C49A3C) accents, off-white (#F9F8F5) background. Mongolian Cyrillic
      text. 16px minimum body text.
