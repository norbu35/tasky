screen_id: SCR-CUST-021
name: No-Show Flag + Reminder
role:
  - customer
phase: 0-1
template: modal_sheet
route: null
context_refs:
  global: prompts/global-context.yaml
  journeys:
    - prompts/journeys/JRN-CUST-04.yaml
stitch_prompt: >-
  Design a mobile app screen for "No-Show Flag + Reminder" (SCR-CUST-021) in the Tasky app — Mongolia's domestic service
  marketplace.

  This screen is used by Customer role.

  Template: modal_sheet — Bottom sheet overlay with drag handle bar, content area, and max 2 action buttons. Branded
  scrim backdrop.

  Layout structure: scrim -> sheet(handle_bar + icon + title + description + primary_action + secondary_action)

  Components used:
    • COMP-MODALSHEET (default): Bottom sheet overlay for pre-no-show reminder and no-show flagging flow
    • COMP-BUTTON (danger): Primary flag button (danger variant for no-show flag) and secondary dismiss button
    • COMP-TOAST (success): Success toast after no-show flag is submitted
  This screen has 4 states — generate the primary/default state:
    Primary state: At scheduled start +10 minutes, system sends a reminder asking customer to update arrival status. Sheet shows gentle prompt asking if the Tasker has arrived
  Key copy (Mongolian primary):
    • reminder_title: "Гүйцэтгэгч ирсэн үү?" (Has the Tasker arrived?)
    • reminder_description: "Товлосон цагаас 10 минут өнгөрлөө. Байдлаа шинэчилнэ үү." (10 minutes past scheduled time. Please update the status.)
    • cta_tasker_arrived: "Тийм, ирсэн" (Yes, arrived)
    • cta_not_yet: "Үгүй, ирээгүй" (No, not yet)
    • flag_title: "Гүйцэтгэгч ирээгүй" (Tasker did not show up)
    • flag_description: "Товлосон цагаас 15 минут өнгөрлөө. Ирээгүй гэж тэмдэглэх үү? Энэ нь захиалгыг цуцалж, админ шалгалтад оруулна." (15 minutes past scheduled time. Flag as no-show? This will cancel the booking and trigger an admin review.)
  Style: Deep blue (#1B3A5C) primary, gold (#C49A3C) accents, off-white (#F9F8F5) background. Manrope for headings, Plus
  Jakarta Sans for body. 16px minimum body text. Clean, professional, premium feel. Mongolian Cyrillic text.
layout:
  template: modal_sheet
  density: default
  structure: scrim -> sheet(handle_bar + icon + title + description + primary_action + secondary_action)
components:
  - component: COMP-MODALSHEET
    variant: default
    usage: Bottom sheet overlay for pre-no-show reminder and no-show flagging flow
  - component: COMP-BUTTON
    variant: danger
    usage: Primary flag button (danger variant for no-show flag) and secondary dismiss button
  - component: COMP-TOAST
    variant: success
    usage: Success toast after no-show flag is submitted
states:
  - id: pre_reminder_10min
    description: >-
      At scheduled start +10 minutes, system sends a reminder asking customer to update arrival status. Sheet shows
      gentle prompt asking if the Tasker has arrived
    visible:
      - COMP-MODALSHEET
      - COMP-BUTTON
    hidden:
      - COMP-TOAST
  - id: flag_available_15min
    description: >-
      At scheduled start +15 minutes, if neither party checked in within the last 30 minutes and no accepted reschedule
      supersedes the schedule, the no-show flag button becomes active
    visible:
      - COMP-MODALSHEET
      - COMP-BUTTON
    hidden:
      - COMP-TOAST
  - id: flagging
    description: User tapped flag button; POST /bookings/:id/no-show in progress; button shows loading state
    visible:
      - COMP-MODALSHEET
      - COMP-BUTTON
    hidden:
      - COMP-TOAST
  - id: flagged_success
    description: No-show flag submitted successfully; success toast shown, sheet dismisses
    visible:
      - COMP-TOAST
    hidden:
      - COMP-MODALSHEET
copy:
  - key: reminder_title
    mn: Гүйцэтгэгч ирсэн үү?
    en: Has the Tasker arrived?
  - key: reminder_description
    mn: Товлосон цагаас 10 минут өнгөрлөө. Байдлаа шинэчилнэ үү.
    en: 10 minutes past scheduled time. Please update the status.
  - key: cta_tasker_arrived
    mn: Тийм, ирсэн
    en: Yes, arrived
  - key: cta_not_yet
    mn: Үгүй, ирээгүй
    en: No, not yet
  - key: flag_title
    mn: Гүйцэтгэгч ирээгүй
    en: Tasker did not show up
  - key: flag_description
    mn: Товлосон цагаас 15 минут өнгөрлөө. Ирээгүй гэж тэмдэглэх үү? Энэ нь захиалгыг цуцалж, админ шалгалтад оруулна.
    en: 15 minutes past scheduled time. Flag as no-show? This will cancel the booking and trigger an admin review.
  - key: cta_flag_no_show
    mn: Ирээгүй гэж тэмдэглэх
    en: Flag No-Show
  - key: cta_dismiss
    mn: Хаах
    en: Dismiss
  - key: toast_flagged
    mn: Ирээгүй гэж тэмдэглэлээ
    en: No-show flagged successfully
  - key: flag_note
    mn: 28 хоногт 2 удаа ирээгүй тэмдэглэгдвэл торгуулийн шалгалт хийгдэнэ
    en: 2 or more no-shows in 28 days triggers a strike review
acceptance_criteria:
  - Pre-reminder appears at scheduled start +10 minutes per PRD Section 6.4.3
  - No-show flag button activates only at scheduled start +15 minutes
  - >-
    Flag button is only active if system verifies neither party posted an in-app status update or check-in in the
    preceding 30 minutes per REQ-BOOK-11
  - Flag button is disabled if an accepted in-app reschedule has superseded the original schedule
  - Flagging uses danger button variant requiring explicit tap
  - On successful flag, booking transitions to NO_SHOW status
  - Success toast shows after flag submission
  - Sheet dismisses after flagging or on user dismiss
  - Flag note warns about repeated no-show consequences (>=2 in 28 days triggers strike review)
  - Drag-to-dismiss via handle bar is supported
  - All copy renders correctly in Mongolian Cyrillic at 16px minimum body size
api_endpoints:
  - method: POST
    path: /bookings/:id/no-show
    purpose: Submit no-show flag for the booking; triggers admin reliability review
analytics_events:
  - event: no_show_reminder_shown
    trigger: Pre-reminder sheet appears at scheduled start +10 minutes
  - event: no_show_reminder_tasker_arrived
    trigger: Customer confirms Tasker arrived at +10 min reminder
  - event: no_show_flag_available
    trigger: Flag button becomes active at scheduled start +15 minutes
  - event: no_show_flag_submitted
    trigger: Customer taps flag button and POST is sent
  - event: no_show_flag_success
    trigger: No-show flag processed successfully
  - event: no_show_flag_dismissed
    trigger: Customer dismisses the sheet without flagging
state_prompts:
  - state_id: pre_reminder_10min
    prompt: >-
      Generate the "pre_reminder_10min" state of "No-Show Flag + Reminder".

      At scheduled start +10 minutes, system sends a reminder asking customer to update arrival status. Sheet shows
      gentle prompt asking if the Tasker has arrived

      Visible elements: COMP-MODALSHEET, COMP-BUTTON

      Hidden elements: COMP-TOAST

      Style: Deep blue (#1B3A5C) primary, gold (#C49A3C) accents, off-white (#F9F8F5) background. Mongolian Cyrillic
      text. 16px minimum body text.
  - state_id: flag_available_15min
    prompt: >-
      Generate the "flag_available_15min" state of "No-Show Flag + Reminder".

      At scheduled start +15 minutes, if neither party checked in within the last 30 minutes and no accepted reschedule
      supersedes the schedule, the no-show flag button becomes active

      Visible elements: COMP-MODALSHEET, COMP-BUTTON

      Hidden elements: COMP-TOAST

      Style: Deep blue (#1B3A5C) primary, gold (#C49A3C) accents, off-white (#F9F8F5) background. Mongolian Cyrillic
      text. 16px minimum body text.
  - state_id: flagging
    prompt: >-
      Generate the "flagging" state of "No-Show Flag + Reminder".

      User tapped flag button; POST /bookings/:id/no-show in progress; button shows loading state

      Visible elements: COMP-MODALSHEET, COMP-BUTTON

      Hidden elements: COMP-TOAST

      Style: Deep blue (#1B3A5C) primary, gold (#C49A3C) accents, off-white (#F9F8F5) background. Mongolian Cyrillic
      text. 16px minimum body text.
  - state_id: flagged_success
    prompt: >-
      Generate the "flagged_success" state of "No-Show Flag + Reminder".

      No-show flag submitted successfully; success toast shown, sheet dismisses

      Visible elements: COMP-TOAST

      Hidden elements: COMP-MODALSHEET

      Style: Deep blue (#1B3A5C) primary, gold (#C49A3C) accents, off-white (#F9F8F5) background. Mongolian Cyrillic
      text. 16px minimum body text.
