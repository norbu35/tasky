screen_id: SCR-SHARED-013
name: Profile — Edit Profile
role:
  - customer
  - tasker
phase: 0-1
template: form_wizard
route: /profile/edit
context_refs:
  global: prompts/global-context.yaml
  journeys:
    - prompts/journeys/JRN-SHARED-05.yaml
    - prompts/journeys/JRN-TASK-08.yaml
stitch_prompt: >-
  Design a mobile app screen for "Profile — Edit Profile" (SCR-SHARED-013) in the Tasky app — Mongolia's domestic
  service marketplace.

  This screen is used by both Customer and Tasker roles.

  Template: form_wizard — Step indicator showing progress, scrollable form fields, back/next navigation at bottom.
  Keyboard-aware scrolling.

  Layout structure: safe_area -> nav_header(back + title) -> scrollview(avatar_upload + form_fields) ->
  bottom_nav(cancel + save)

  Components used:
    • COMP-PROFILEAVATAR (lg): Editable avatar with camera overlay icon; tapping triggers photo picker
    • COMP-PHOTOPICKER (default): Avatar photo selection from camera or gallery
    • COMP-FORMFIELD (default): Wrapper for each editable profile field with label and inline error
    • COMP-INPUT (default): Text input fields for name, bio, and phone number
    • COMP-INPUT (multiline): Multiline text input for bio/about me field
    • COMP-BUTTON (primary): Save button in bottom navigation bar
    • COMP-BUTTON (ghost): Cancel button in bottom navigation bar
    • COMP-LOADINGSKELETON (detail): Form skeleton while initial profile data loads
    • COMP-TOAST (success): Success toast after profile saved; error toast on save failure
  This screen has 7 states — generate the primary/default state:
    Primary state: Form loaded with current profile data pre-filled in fields
  Key copy (Mongolian primary):
    • nav_title: "Профайл засах" (Edit Profile)
    • label_name: "Нэр" (Name)
    • placeholder_name: "Нэрээ оруулна уу" (Enter your name)
    • label_bio: "Миний тухай" (About me)
    • placeholder_bio: "Өөрийнхөө тухай бичнэ үү" (Write about yourself)
    • label_phone: "Утасны дугаар" (Phone number)
  Style: Deep blue (#1B3A5C) primary, gold (#C49A3C) accents, off-white (#F9F8F5) background. Manrope for headings, Plus
  Jakarta Sans for body. 16px minimum body text. Clean, professional, premium feel. Mongolian Cyrillic text.
layout:
  template: form_wizard
  density: default
  structure: safe_area -> nav_header(back + title) -> scrollview(avatar_upload + form_fields) -> bottom_nav(cancel + save)
components:
  - component: COMP-PROFILEAVATAR
    variant: lg
    usage: Editable avatar with camera overlay icon; tapping triggers photo picker
  - component: COMP-PHOTOPICKER
    variant: default
    usage: Avatar photo selection from camera or gallery
  - component: COMP-FORMFIELD
    variant: default
    usage: Wrapper for each editable profile field with label and inline error
  - component: COMP-INPUT
    variant: default
    usage: Text input fields for name, bio, and phone number
  - component: COMP-INPUT
    variant: multiline
    usage: Multiline text input for bio/about me field
  - component: COMP-BUTTON
    variant: primary
    usage: Save button in bottom navigation bar
  - component: COMP-BUTTON
    variant: ghost
    usage: Cancel button in bottom navigation bar
  - component: COMP-LOADINGSKELETON
    variant: detail
    usage: Form skeleton while initial profile data loads
  - component: COMP-TOAST
    variant: success
    usage: Success toast after profile saved; error toast on save failure
states:
  - id: default
    description: Form loaded with current profile data pre-filled in fields
    visible:
      - COMP-PROFILEAVATAR
      - COMP-FORMFIELD
      - COMP-INPUT
      - COMP-BUTTON
    hidden:
      - COMP-LOADINGSKELETON
      - COMP-TOAST
  - id: editing
    description: User has modified one or more fields; save button becomes enabled
    visible:
      - COMP-PROFILEAVATAR
      - COMP-FORMFIELD
      - COMP-INPUT
      - COMP-BUTTON
    hidden:
      - COMP-LOADINGSKELETON
      - COMP-TOAST
  - id: uploading_avatar
    description: Avatar photo is being uploaded via POST /users/me/avatar/upload-url; spinner overlays avatar
    visible:
      - COMP-PROFILEAVATAR
      - COMP-FORMFIELD
      - COMP-INPUT
      - COMP-BUTTON
    hidden:
      - COMP-LOADINGSKELETON
  - id: saving
    description: PUT /users/me is in flight; save button shows loading spinner
    visible:
      - COMP-PROFILEAVATAR
      - COMP-FORMFIELD
      - COMP-INPUT
      - COMP-BUTTON
    hidden:
      - COMP-LOADINGSKELETON
  - id: validation_error
    description: One or more fields failed client-side validation; inline errors shown below affected fields
    visible:
      - COMP-PROFILEAVATAR
      - COMP-FORMFIELD
      - COMP-INPUT
      - COMP-BUTTON
    hidden:
      - COMP-LOADINGSKELETON
  - id: success
    description: Profile saved successfully; success toast shown, navigates back to My Profile
    visible:
      - COMP-TOAST
    hidden:
      - COMP-LOADINGSKELETON
  - id: error_network
    description: Save or avatar upload failed due to network error; error toast with retry
    visible:
      - COMP-PROFILEAVATAR
      - COMP-FORMFIELD
      - COMP-INPUT
      - COMP-BUTTON
      - COMP-TOAST
    hidden:
      - COMP-LOADINGSKELETON
copy:
