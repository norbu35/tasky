acceptance_criteria:
  - Form pre-fills with current profile data from GET /users/me
  - Save button is disabled until at least one field is modified
  - Tapping avatar triggers camera/gallery picker for new photo
  - Avatar upload shows progress spinner overlay on the avatar image
  - Inline validation errors appear below the affected field on blur
  - Name field is required; empty name shows error 'Нэрээ оруулна уу'
  - Save button shows loading spinner during PUT /users/me
  - Success toast appears and screen navigates back (pop) to SCR-SHARED-012 on save
  - Network error on save shows error toast with retry action
  - Cancel or back navigates (pop) to SCR-SHARED-012 without saving
  - Keyboard-aware scrolling prevents form fields from being hidden behind keyboard
  - All form labels render at 14px minimum (label typography)
  - All input text renders at 16px minimum (body_default typography)
api_endpoints:
  - method: PUT
    path: /users/me
    purpose: Update the authenticated user's profile fields (name, bio, phone)
  - method: POST
    path: /users/me/avatar/upload-url
    purpose: Request a presigned URL for avatar image upload to S3
analytics_events:
  - event: profile_edit_started
    trigger: Screen loads with pre-filled form data
  - event: profile_avatar_changed
    trigger: User selects a new avatar photo
  - event: profile_save_attempted
    trigger: User taps Save button
  - event: profile_save_success
    trigger: PUT /users/me returns 200
  - event: profile_save_failed
    trigger: PUT /users/me returns an error
  - event: profile_edit_cancelled
    trigger: User taps Cancel or back button without saving
