    name: Tasker declines
    branch_at_step: 3
    condition: Selected Tasker declines
    screens:
      - SCR-CUST-012
      - SCR-CUST-011
    outcome: Decline notification, select next applicant
  - id: JRN-CUST-03-A2
    name: Tasker timeout
    branch_at_step: 3
    condition: 15-min window expires
    screens:
      - SCR-CUST-012
      - SCR-CUST-011
    outcome: Timeout notification, select next applicant
visual_consistency_note: >-
  All screens in this journey should share visual continuity — consistent header style, navigation patterns, and color
  usage. Screens in sequence should feel like a cohesive flow.
