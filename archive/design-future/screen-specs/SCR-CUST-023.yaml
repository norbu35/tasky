# Screen Spec: Repeat from Past Booking
screen_id: SCR-CUST-023
name: 'Repeat from Past Booking'
route: '/(customer)/rebook'
role: [customer]
phase: '2'
template: form_wizard
figma_page: 'Phase 2/Customer Repeat from Past Booking'
feature: 'booking'

layout:
  template: form_wizard
  density: default
  structure: 'safe_area -> nav_header(back + title) -> scrollview(tasker_card + prefilled_task_summary + editable_fields) -> bottom_nav(back + submit)'

components:
  - id: COMP-SPLITCARD
    usage: "Read-only card showing the previously hired tasker's avatar, name, rating, and verification status"
    props:
      headerContent: 'ProfileAvatar + name + rating'
      bodyContent: 'category + previous_date'
      status: completed
    variant: booking

  - id: COMP-DATEPICKER
    usage: 'Date and time picker prefilled from previous booking; editable for new schedule'
    props:
      value: 'previous_schedule'
      minDate: 'tomorrow'
      mode: date_time
    variant: date_time

  - id: COMP-FORMFIELD
    usage: 'Wrapper for pricing input with label'
    props:
      label: 'Үнэ / Үнийн нөхцөл'
      required: true
    variant: default

  - id: COMP-INPUT
    usage: 'Pricing input prefilled from previous task when budget mode is used; editable'
    props:
      value: '50000'
      placeholder: '₮'
      maxLength: 10
    variant: default

  - id: COMP-BUTTON
    usage: 'Submit button to create a prefilled task draft from the prior booking context'
    props:
      label: 'Захиалга үргэлжлүүлэх'
      variant: primary
      size: lg
      loading: false
    variant: primary

  - id: COMP-TOAST
    usage: 'Error toast on network failure during submission'
    props:
      message: 'Алдаа гарлаа'
      variant: error
    variant: error

states:
  - id: prefilled
    description: 'Screen loads with tasker info card and task details prefilled from previous booking (category, description, location, schedule, pricing mode)'
    components_visible: [COMP-SPLITCARD, COMP-DATEPICKER, COMP-FORMFIELD, COMP-INPUT, COMP-BUTTON]
    components_hidden: [COMP-TOAST]

  - id: editing
    description: 'User modifies prefilled fields (schedule or pricing); inline validation active'
    components_visible: [COMP-SPLITCARD, COMP-DATEPICKER, COMP-FORMFIELD, COMP-INPUT, COMP-BUTTON]
    components_hidden: [COMP-TOAST]

  - id: submitting
    description: 'User taps submit; POST /tasks is in progress; button shows loading'
    components_visible: [COMP-SPLITCARD, COMP-DATEPICKER, COMP-FORMFIELD, COMP-INPUT, COMP-BUTTON]
    components_hidden: [COMP-TOAST]

  - id: success
    description: 'Prefilled task created; customer continues with the standard posting and selection flow'
    components_visible: [COMP-SPLITCARD]
    components_hidden: [COMP-DATEPICKER, COMP-FORMFIELD, COMP-INPUT, COMP-BUTTON, COMP-TOAST]

  - id: error_network
    description: 'Network error during submission; error toast with retry'
    components_visible:
      [COMP-SPLITCARD, COMP-DATEPICKER, COMP-FORMFIELD, COMP-INPUT, COMP-BUTTON, COMP-TOAST]
    components_hidden: []

copy:
  - key: page_title
    mn: 'Өмнөх захиалгаар дахин эхлэх'
    en: 'Repeat from past booking'
    max_chars: 20

  - key: section_tasker
    mn: 'Өмнөх гүйцэтгэгч'
    en: 'Previous Tasker'
    max_chars: 25

  - key: section_task
    mn: 'Даалгаврын мэдээлэл'
    en: 'Task Details'
    max_chars: 25

  - key: label_schedule
    mn: 'Шинэ товлосон цаг'
    en: 'New Schedule'
    max_chars: 20

  - key: label_pricing
    mn: 'Үнэ / Үнийн нөхцөл'
    en: 'Pricing'
    max_chars: 18

  - key: prefilled_note
    mn: 'Өмнөх захиалгаас урьдчилж бөглөсөн. Та засварлах боломжтой.'
    en: 'Prefilled from previous booking. You can edit.'
    max_chars: 70

  - key: cta_submit
    mn: 'Даалгавар үүсгэх'
    en: 'Create Task'
    max_chars: 25

  - key: cta_back
    mn: 'Буцах'
    en: 'Back'
    max_chars: 20

  - key: error_toast
    mn: 'Өмнөх захиалгаар шинэ даалгавар үүсгэхэд алдаа гарлаа'
    en: 'Failed to create a task from the previous booking'
    max_chars: 40

  - key: validation_budget_low
    mn: 'Үнийн мэдээллийг шалгана уу'
    en: 'Please check the pricing details'
    max_chars: 40

api_endpoints:
  - method: POST
    path: '/tasks'
    purpose: 'Create a new task from the prior booking context using standard posting rules'

analytics_events:
  - event: 'repeat_from_past_booking_viewed'
    trigger: 'Repeat-from-past-booking screen becomes visible with prefilled data'
  - event: 'repeat_from_past_booking_fields_edited'
    trigger: 'User modifies any prefilled field'
  - event: 'repeat_from_past_booking_submitted'
    trigger: 'User taps submit and task creation begins'
  - event: 'repeat_from_past_booking_success'
    trigger: 'Task is created successfully from prior booking context'
  - event: 'repeat_from_past_booking_error'
    trigger: 'Network error during task creation from prior booking context'

acceptance_criteria:
  - 'Screen prefills task details from previous booking: category, description, location, schedule, and pricing mode'
  - 'Tasker info card is read-only showing avatar, name, rating, and verification badge'
  - 'Schedule date picker has minimum date of tomorrow'
  - 'Pricing input validates according to the active posting rules before task creation'
  - 'Submit creates a new task draft or task using the standard posting flow rather than direct booking'
  - 'On success, the flow continues through the standard customer posting path'
  - 'Back button navigates via pop to Booking Detail (SCR-CUST-017)'
  - 'Network error shows error toast with retry'
  - 'All copy renders correctly in Mongolian Cyrillic at 16px minimum body size'
  - 'Date format follows YYYY.MM.DD Mongolian convention'
  - 'Currency format follows ₮XX,XXX convention'
