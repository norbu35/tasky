# Screen Spec: Business Accounts
screen_id: SCR-B2B-001
name: 'Business Accounts'
route: '/(customer)/business/accounts'
role: [customer]
phase: '2'
template: feed_list
figma_page: 'B2B/Business Accounts'
feature: 'b2b'

layout:
  template: feed_list
  density: default
  structure: 'safe_area -> nav_header(back + title) -> scrollview(account_cards) -> sticky_bottom_cta(create_account)'

components:
  - id: COMP-CARD
    usage: 'Business account cards showing name, role, location count, and billing status'
    props:
      onPress: 'open_account'
    variant: elevated

  - id: COMP-BUTTON
    usage: 'Primary CTA to create a new business account'
    props:
      label: 'Бизнес бүртгэх'
      variant: primary
      size: lg
    variant: primary

  - id: COMP-LISTROW
    usage: 'Inline actions for tasks, billing, and membership from an account card'
    props:
      title: 'Даалгаврууд'
      accessory: 'chevron'
    variant: default

  - id: COMP-LOADINGSKELETON
    usage: 'Loading skeleton matching account cards'
    props:
      variant: card
      count: 3
    variant: card

  - id: COMP-EMPTYSTATE
    usage: 'Activation state when no business accounts exist yet'
    props:
      illustration: 'business_empty'
      headline: 'Бизнес бүртгэл алга'
      ctaLabel: 'Эхний бизнесээ нэмэх'
    variant: activation

states:
  - id: loading_initial
    description: 'Business accounts are loading'
    components_visible: [COMP-LOADINGSKELETON]
    components_hidden: [COMP-CARD, COMP-BUTTON, COMP-LISTROW, COMP-EMPTYSTATE]

  - id: empty_activation
    description: 'User has no business accounts yet'
    components_visible: [COMP-EMPTYSTATE, COMP-BUTTON.primary]
    components_hidden: [COMP-LOADINGSKELETON, COMP-CARD, COMP-LISTROW]

  - id: populated_owner
    description: 'User is owner of one or more business accounts'
    components_visible: [COMP-CARD, COMP-BUTTON.primary, COMP-LISTROW]
    components_hidden: [COMP-LOADINGSKELETON, COMP-EMPTYSTATE]

  - id: populated_member
    description: 'User is manager/member on one or more accounts'
    components_visible: [COMP-CARD, COMP-LISTROW]
    components_hidden: [COMP-LOADINGSKELETON, COMP-EMPTYSTATE]

  - id: error_network
    description: 'Business account list failed to load'
    components_visible: [COMP-EMPTYSTATE.error, COMP-BUTTON.primary]
    components_hidden: [COMP-LOADINGSKELETON, COMP-CARD, COMP-LISTROW]

copy:
  - key: nav_title
    mn: 'Бизнес бүртгэлүүд'
    en: 'Business Accounts'
    max_chars: 24

  - key: cta_create
    mn: 'Бизнес бүртгэх'
    en: 'Create account'
    max_chars: 18

  - key: label_locations
    mn: 'Байршлууд'
    en: 'Locations'
    max_chars: 15

  - key: label_role_owner
    mn: 'Эзэмшигч'
    en: 'Owner'
    max_chars: 12

  - key: label_role_manager
    mn: 'Менежер'
    en: 'Manager'
    max_chars: 12

  - key: empty_headline
    mn: 'Бизнес бүртгэл алга'
    en: 'No business accounts yet'
    max_chars: 30

api_endpoints:
  - method: GET
    path: '/business/accounts'
    purpose: 'List business accounts the authenticated customer owns or manages'

analytics_events:
  - event: 'business_accounts_viewed'
    trigger: 'Business account list loads'
  - event: 'business_account_create_tapped'
    trigger: 'Customer taps create account'
  - event: 'business_account_opened'
    trigger: 'Customer opens a business account card'

acceptance_criteria:
  - 'This screen is feature-gated behind b2b_enabled'
  - 'Owner and manager roles are shown clearly on each account card'
  - 'Customer can open tasks, billing, and membership management from each account card'
  - 'Create account CTA navigates to SCR-B2B-002'
