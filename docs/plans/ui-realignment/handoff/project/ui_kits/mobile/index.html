<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tasky Mobile UI Kit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<style>
@font-face { font-family: 'Manrope'; font-weight: 600; src: url('../../fonts/Manrope_600SemiBold.ttf'); }
@font-face { font-family: 'Manrope'; font-weight: 700; src: url('../../fonts/Manrope_700Bold.ttf'); }
@font-face { font-family: 'Plus Jakarta Sans'; font-weight: 400; src: url('../../fonts/PlusJakartaSans_400Regular.ttf'); }
@font-face { font-family: 'Plus Jakarta Sans'; font-weight: 500; src: url('../../fonts/PlusJakartaSans_500Medium.ttf'); }
@font-face { font-family: 'Plus Jakarta Sans'; font-weight: 600; src: url('../../fonts/PlusJakartaSans_600SemiBold.ttf'); }
@font-face { font-family: 'Plus Jakarta Sans'; font-weight: 700; src: url('../../fonts/PlusJakartaSans_700Bold.ttf'); }

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; background: #1a1a1a; display: flex; align-items: center; justify-content: center; font-family: 'Plus Jakarta Sans', sans-serif; }

.stage { display: flex; align-items: center; gap: 24px; padding: 24px; flex-wrap: wrap; justify-content: center; min-height: 100vh; }

/* Phone frame */
.phone {
  width: 390px; height: 780px; border-radius: 48px;
  background: #F9F8F5; position: relative; overflow: hidden;
  box-shadow: 0 30px 80px rgba(0,0,0,0.6), 0 0 0 10px #222, 0 0 0 12px #333;
  flex-shrink: 0;
}
.phone-notch {
  position: absolute; top: 0; left: 50%; transform: translateX(-50%);
  width: 120px; height: 28px; background: #111; border-radius: 0 0 20px 20px;
  z-index: 100;
}
.screen { position: absolute; inset: 0; overflow: hidden; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="components.jsx"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

// ── Sample data ──────────────────────────────────────────────────
const TASKS = [
  { id: 1, title: 'Гал тогооны угаалтуур засуулах', price: '₮80,000', category: 'Засвар', posterName: 'Г. Сарнай', timeAgo: '28 мин өмнө', status: 'open' },
  { id: 2, title: 'Тавилга ачиж хүргэх (Хан-Уул)', price: '₮120,000', category: 'Зөөвөрлөлт', posterName: 'Т. Тэмүүлэн', timeAgo: '45 мин өмнө', status: 'open' },
  { id: 3, title: 'Цонх угаалгах (5 цонх)', price: '₮35,000', category: 'Цэвэрлэгээ', posterName: 'М. Солонго', timeAgo: '1 цаг өмнө', status: 'open' },
  { id: 4, title: 'Угаалгын машин холбох', price: '₮60,000', category: 'Засвар', posterName: 'Б. Мөнхбат', timeAgo: '2 цаг өмнө', status: 'assigned' },
];

const MY_BOOKINGS = [
  { id: 10, title: 'Гал тогооны угаалтуур засуулах', price: '₮80,000', tasker: 'Б. Батбаяр', date: '2026-04-22', status: 'assigned' },
  { id: 11, title: 'Байр цэвэрлэх (3 өрөө)', price: '₮50,000', tasker: 'Э. Нарантуяа', date: '2026-04-18', status: 'completed' },
  { id: 12, title: 'Цонх угаалгах', price: '₮35,000', tasker: 'Г. Дорж', date: '2026-04-10', status: 'completed' },
];

// ── Screen: Login ────────────────────────────────────────────────
function LoginScreen({ onLogin }) {
  const s = { position: 'absolute', inset: 0, background: '#F9F8F5', display: 'flex', flexDirection: 'column' };
  return (
    <div style={s}>
      {/* Top lang switcher */}
      <div style={{ display: 'flex', justifyContent: 'flex-end', padding: '16px 24px' }}>
        <span style={{ fontSize: 13, fontWeight: 700, color: '#1B3A5C', fontFamily: fonts.sans, border: '1px solid rgba(195,198,207,0.4)', borderRadius: 12, padding: '4px 12px' }}>MN/EN</span>
      </div>

      {/* Brand section */}
      <div style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', padding: '0 40px', gap: 32 }}>
        <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 32 }}>
          {/* Logo icon */}
          <div style={{ position: 'relative' }}>
            <div style={{ position: 'absolute', top: -10, left: -10, width: 96, height: 96, borderRadius: 14, background: 'rgba(253,206,106,0.2)' }} />
            <div style={{ width: 76, height: 76, borderRadius: 10, background: '#002444', display: 'flex', alignItems: 'center', justifyContent: 'center', boxShadow: '0 8px 24px rgba(0,36,68,0.25)', position: 'relative' }}>
              <img src="../../assets/logo-icon.svg" width="36" height="36" style={{ filter: 'brightness(0) invert(1)' }} onError={e => { e.target.style.display='none'; }} />
              <svg style={{ position: 'absolute' }} width="36" height="36" viewBox="0 0 40 40" fill="none">
                <polyline points="8,20 16,28 32,12" stroke="white" strokeWidth="3.5" strokeLinecap="round" strokeLinejoin="round"/>
              </svg>
            </div>
          </div>

          {/* Heading */}
          <div style={{ textAlign: 'center', display: 'flex', flexDirection: 'column', gap: 12 }}>
            <h1 style={{ fontFamily: fonts.display, fontWeight: 700, fontSize: 26, color: '#002444', letterSpacing: '-0.5px', lineHeight: 1.2 }}>Tasky-д тавтай морил</h1>
            <p style={{ fontFamily: fonts.sans, fontSize: 15, color: '#43474E', lineHeight: 1.6, textAlign: 'center' }}>Найдвартай гүйцэтгэгчтэй холбогдож,{'\n'}ажлаа хялбар захиалаарай</p>
          </div>
        </div>

        {/* Auth buttons */}
        <div style={{ width: '100%', display: 'flex', flexDirection: 'column', gap: 12 }}>
          <Button label="Facebook-ээр нэвтрэх" variant="dark" fullWidth onClick={onLogin} />

          <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
            <div style={{ flex: 1, height: 1, background: 'rgba(195,198,207,0.3)' }} />
            <span style={{ fontSize: 11, color: '#43474E', fontFamily: fonts.sans, letterSpacing: '0.1em' }}>Эсвэл</span>
            <div style={{ flex: 1, height: 1, background: 'rgba(195,198,207,0.3)' }} />
          </div>

          <Button label="Имэйл хаягаар нэвтрэх" variant="outline" fullWidth onClick={onLogin} />
        </div>
      </div>

      {/* Footer */}
      <div style={{ padding: '0 24px 32px', display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 8 }}>
        <div style={{ display: 'flex', gap: 20 }}>
          <span style={{ fontSize: 13, color: '#43474E', fontFamily: fonts.sans }}>Үйлчилгээний нөхцөл</span>
          <span style={{ fontSize: 13, color: '#43474E', fontFamily: fonts.sans }}>Нууцлалын бодлого</span>
        </div>
        <span style={{ fontSize: 12, color: '#43474E', opacity: 0.5, fontFamily: fonts.sans }}>© 2024 Tasky. Бүх эрх хуулиар хамгаалагдсан.</span>
      </div>
    </div>
  );
}

// ── Screen: Browse Task Feed ─────────────────────────────────────
function BrowseScreen({ onTaskClick }) {
  const [activeFilter, setActiveFilter] = useState('all');
  const filters = [{ id: 'all', label: 'Бүгд' }, { id: 'cleaning', label: 'Цэвэрлэгээ' }, { id: 'repair', label: 'Засвар' }, { id: 'moving', label: 'Зөөвөрлөлт' }];
  const filtered = activeFilter === 'all' ? TASKS : TASKS.filter(t =>
    (activeFilter === 'cleaning' && t.category === 'Цэвэрлэгээ') ||
    (activeFilter === 'repair' && t.category === 'Засвар') ||
    (activeFilter === 'moving' && t.category === 'Зөөвөрлөлт')
  );
  return (
    <div style={{ position: 'absolute', inset: 0, background: '#F9F8F5', display: 'flex', flexDirection: 'column' }}>
      {/* Header */}
      <div style={{ padding: '14px 24px 10px', display: 'flex', alignItems: 'center', justifyContent: 'space-between', paddingTop: 36 }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
          <svg width="18" height="12" viewBox="0 0 18 12" fill={T.ink}><rect y="0" width="18" height="2" rx="1"/><rect y="5" width="18" height="2" rx="1"/><rect y="10" width="18" height="2" rx="1"/></svg>
          <h1 style={{ fontFamily: fonts.display, fontWeight: 700, fontSize: 22, color: T.inkDeep }}>Даалгаврууд</h1>
        </div>
        <div style={{ width: 36, height: 36, borderRadius: 9999, background: T.subtle, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke={T.ink} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        </div>
      </div>

      <div style={{ flex: 1, overflowY: 'auto', padding: '0 0 80px' }}>
        {/* Search */}
        <div style={{ padding: '0 20px 12px' }}>
          <div style={{ background: T.subtle, borderRadius: 8, height: 48, display: 'flex', alignItems: 'center', gap: 10, padding: '0 14px' }}>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#808D99" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <span style={{ fontSize: 15, color: T.textTert, fontFamily: fonts.sans }}>Даалгавар хайх...</span>
          </div>
        </div>

        {/* Filters */}
        <div style={{ padding: '0 20px 12px', display: 'flex', gap: 8, overflowX: 'auto' }}>
          {filters.map(f => <FilterChip key={f.id} label={f.label} active={activeFilter === f.id} onClick={() => setActiveFilter(f.id)} />)}
        </div>

        {/* Trust banner */}
        <div style={{ padding: '0 20px 16px' }}>
          <TrustBanner title="Итгэлтэй платформ" description="1,200+ баталгаажсан гүйцэтгэгч" />
        </div>

        {/* Task cards */}
        <div style={{ padding: '0 20px', display: 'flex', flexDirection: 'column', gap: 12 }}>
          {filtered.map(task => (
            <TaskCard key={task.id} {...task} onClick={() => onTaskClick(task)} />
          ))}
        </div>
      </div>

      {/* FAB */}
      <button style={{ position: 'absolute', right: 20, bottom: 96, width: 52, height: 52, borderRadius: 12, background: T.sunLight, border: 'none', cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', boxShadow: '0 4px 6px -4px rgba(0,0,0,.1),0 10px 15px -3px rgba(0,0,0,.1)' }}>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
    </div>
  );
}

// ── Screen: Task Detail ───────────────────────────────────────────
function TaskDetailScreen({ task, onBack, onApply }) {
  return (
    <div style={{ position: 'absolute', inset: 0, background: '#F9F8F5', display: 'flex', flexDirection: 'column' }}>
      <TopBar title="Даалгаврын дэлгэрэнгүй" onBack={onBack} />

      <div style={{ flex: 1, overflowY: 'auto', padding: '70px 20px 120px' }}>
        {/* Status & price */}
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 12 }}>
          <StatusBadge status={task.status} />
          <span style={{ fontFamily: fonts.display, fontWeight: 700, fontSize: 20, color: T.sunLight }}>{task.price}</span>
        </div>

        {/* Title */}
        <h2 style={{ fontFamily: fonts.display, fontWeight: 700, fontSize: 20, color: T.inkDeep, lineHeight: 1.3, marginBottom: 16 }}>{task.title}</h2>

        {/* Details card */}
        <div style={{ background: T.surface, borderRadius: 12, padding: '16px', marginBottom: 12, boxShadow: '0 1px 2px rgba(0,0,0,0.05)' }}>
          {[
            { icon: '📍', label: 'Байршил', value: 'Хан-Уул дүүрэг, Улаанбаатар' },
            { icon: '📅', label: 'Огноо', value: '2026-04-25, 10:00–14:00' },
            { icon: '🏷️', label: 'Ангилал', value: task.category },
          ].map(row => (
            <div key={row.label} style={{ display: 'flex', alignItems: 'center', gap: 12, padding: '10px 0', borderBottom: `1px solid ${T.subtle}` }}>
              <span style={{ fontSize: 18 }}>{row.icon}</span>
              <div>
                <div style={{ fontSize: 11, color: T.textTert, fontFamily: fonts.sans }}>{row.label}</div>
                <div style={{ fontSize: 14, color: T.ink, fontWeight: 500, fontFamily: fonts.sans, marginTop: 1 }}>{row.value}</div>
              </div>
            </div>
          ))}
          <div style={{ paddingTop: 10, display: 'flex', alignItems: 'center', gap: 12 }}>
            <ProfileAvatar initials={task.posterName.split(' ').map(w=>w[0]).join('')} size={40} showVerified={false} />
            <div>
              <div style={{ fontSize: 11, color: T.textTert, fontFamily: fonts.sans }}>Захиалагч</div>
              <div style={{ fontSize: 14, color: T.ink, fontWeight: 600, fontFamily: fonts.sans }}>{task.posterName}</div>
            </div>
            <span style={{ marginLeft: 'auto', fontSize: 11, color: T.textTert, fontFamily: fonts.sans }}>{task.timeAgo}</span>
          </div>
        </div>

        {/* Description */}
        <div style={{ background: T.surface, borderRadius: 12, padding: '14px 16px', marginBottom: 12, boxShadow: '0 1px 2px rgba(0,0,0,0.05)' }}>
          <div style={{ fontSize: 13, fontWeight: 700, color: T.inkDeep, fontFamily: fonts.display, marginBottom: 8 }}>Тайлбар</div>
          <div style={{ fontSize: 14, color: T.textSec, fontFamily: fonts.sans, lineHeight: 1.6 }}>
            Угаалтуур хагарсан байна. Ус гоожиж байгаа тул яаралтай засварлах хэрэгтэй. Сэлбэг дутуу байвал мэдэгдэнэ.
          </div>
        </div>

        {/* Trust banner */}
        <TrustBanner title="Төлбөл хамгаалалт" description="Ажил дуусах хүртэл таны мөнгийг найдвартай хадгална" />
      </div>

      {/* Footer CTA */}
      <div style={{ position: 'absolute', bottom: 0, left: 0, right: 0, background: 'rgba(249,248,245,0.92)', backdropFilter: 'blur(20px)', boxShadow: '0 -20px 40px rgba(26,28,26,0.06)', borderRadius: '20px 20px 0 0', padding: '16px 20px 28px', display: 'flex', gap: 12 }}>
        <button style={{ width: 56, height: 56, borderRadius: 8, border: 'none', background: T.subtle, cursor: 'pointer', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: 2 }}>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke={T.textSec} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          <span style={{ fontSize: 10, color: T.textSec, fontFamily: fonts.sans }}>Зурвас</span>
        </button>
        <Button label="Өргөдөл илгээх" variant="primary" fullWidth style={{ height: 56, fontSize: 16 }} onClick={onApply} />
      </div>
    </div>
  );
}

// ── Screen: Apply Success ─────────────────────────────────────────
function ApplySuccessScreen({ task, onBack }) {
  return (
    <div style={{ position: 'absolute', inset: 0, background: '#F9F8F5', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', padding: '40px 32px' }}>
      {/* Animated check */}
      <div style={{ marginBottom: 32 }}>
        <div style={{ width: 96, height: 96, borderRadius: 9999, background: 'rgba(70,145,120,0.1)', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
          <svg width="52" height="52" viewBox="0 0 52 52" fill="none">
            <polyline points="10,26 20,36 42,16" stroke="#469178" strokeWidth="4" strokeLinecap="round" strokeLinejoin="round"/>
          </svg>
        </div>
      </div>
      <h2 style={{ fontFamily: fonts.display, fontWeight: 700, fontSize: 22, color: T.inkDeep, textAlign: 'center', marginBottom: 12 }}>Өргөдөл илгээгдлээ!</h2>
      <p style={{ fontFamily: fonts.sans, fontSize: 15, color: T.textSec, textAlign: 'center', lineHeight: 1.6, marginBottom: 32 }}>
        Захиалагч таны өргөдлийг хянаж байна. Шийдвэр гарахад мэдэгдэл илгээнэ.
      </p>
      <Button label="Буцах" variant="outline" fullWidth onClick={onBack} />
    </div>
  );
}

// ── Screen: Tasker Profile ────────────────────────────────────────
function TaskerProfileScreen({ onBack }) {
  const reviews = [
    { name: 'М. Солонго', rating: 5, comment: 'Маш сайн ажилласан, цагтаа ирж чанартай гүйцэтгэлээ.', date: '2026-04-10' },
    { name: 'Б. Мөнхбат', rating: 4, comment: 'Сайн хийж өглөө, дараа дахин дуудна.', date: '2026-04-02' },
  ];
  return (
    <div style={{ position: 'absolute', inset: 0, background: '#F9F8F5', display: 'flex', flexDirection: 'column' }}>
      <TopBar title="" onBack={onBack} />
      <div style={{ flex: 1, overflowY: 'auto', paddingBottom: 40 }}>
        {/* Hero */}
        <div style={{ padding: '60px 24px 20px', display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 10 }}>
          <ProfileAvatar initials="ББ" size={80} showVerified />
          <h2 style={{ fontFamily: fonts.display, fontWeight: 700, fontSize: 20, color: T.inkDeep }}>Батбаяр Б.</h2>
          <VerifiedBadge status="verified" size="md" />
          <RatingStars value={4.8} count={36} size={16} />
          <p style={{ fontSize: 13, color: T.textSec, fontFamily: fonts.sans, textAlign: 'center', lineHeight: 1.6, marginTop: 4 }}>
            Засвар, суурилуулалтын туршлагатай мастер. 3 жилийн туршлагатай.
          </p>
        </div>

        {/* Stats */}
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 10, padding: '0 20px 16px' }}>
          {[['147', 'Ажил'], ['4.8', 'Үнэлгээ'], ['98%', 'Хугацаанд']].map(([val, lbl]) => (
            <div key={lbl} style={{ background: T.surface, borderRadius: 12, padding: '14px 0', display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 2, boxShadow: '0 1px 2px rgba(0,0,0,0.05)' }}>
              <span style={{ fontFamily: fonts.display, fontWeight: 700, fontSize: 20, color: T.inkDeep }}>{val}</span>
              <span style={{ fontSize: 11, color: T.textTert, fontFamily: fonts.sans }}>{lbl}</span>
            </div>
          ))}
        </div>

        {/* Services */}
        <div style={{ padding: '0 20px 16px' }}>
          <div style={{ fontSize: 13, fontWeight: 700, color: T.inkDeep, fontFamily: fonts.display, marginBottom: 10 }}>Үйлчилгээ</div>
          <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8 }}>
            {['Засвар', 'Суурилуулалт', 'Угаалтуур', 'Халаалт'].map(s => (
              <span key={s} style={{ background: T.subtle, borderRadius: 9999, padding: '5px 12px', fontSize: 12, fontWeight: 600, color: T.ink, fontFamily: fonts.sans }}>{s}</span>
            ))}
          </div>
        </div>

        {/* Reviews */}
        <div style={{ padding: '0 20px' }}>
          <div style={{ fontSize: 13, fontWeight: 700, color: T.inkDeep, fontFamily: fonts.display, marginBottom: 10 }}>Сэтгэгдэл</div>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
            {reviews.map((r, i) => (
              <div key={i} style={{ background: T.surface, borderRadius: 12, padding: '14px 16px', boxShadow: '0 1px 2px rgba(0,0,0,0.05)' }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 6 }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                    <ProfileAvatar initials={r.name.split(' ').map(w=>w[0]).join('')} size={28} radius={8} />
                    <span style={{ fontFamily: fonts.sans, fontWeight: 600, fontSize: 13, color: T.ink }}>{r.name}</span>
                  </div>
                  <span style={{ fontSize: 11, color: T.textTert, fontFamily: fonts.sans }}>{r.date}</span>
                </div>
                <RatingStars value={r.rating} size={12} />
                <p style={{ fontSize: 13, color: T.textSec, fontFamily: fonts.sans, lineHeight: 1.5, marginTop: 6 }}>{r.comment}</p>
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

// ── Screen: My Jobs (Bookings) ────────────────────────────────────
function BookingsScreen({ onBookingClick }) {
  return (
    <div style={{ position: 'absolute', inset: 0, background: '#F9F8F5', display: 'flex', flexDirection: 'column' }}>
      <div style={{ padding: '34px 24px 12px' }}>
        <h1 style={{ fontFamily: fonts.display, fontWeight: 700, fontSize: 22, color: T.inkDeep }}>Миний захиалгууд</h1>
      </div>
      <div style={{ flex: 1, overflowY: 'auto', padding: '0 20px 80px', display: 'flex', flexDirection: 'column', gap: 12 }}>
        {MY_BOOKINGS.map(b => (
          <div key={b.id} onClick={() => onBookingClick(b)} style={{ background: T.surface, borderRadius: 12, padding: '14px 16px', boxShadow: '0 1px 2px rgba(0,0,0,0.05)', cursor: 'pointer' }}>

// ── Root App ──────────────────────────────────────────────────────
function App() {
  const STORAGE_KEY = 'tasky_uikit_state';
  const saved = (() => { try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); } catch { return {}; } })();

  const [loggedIn, setLoggedIn] = useState(saved.loggedIn || false);
  const [tab, setTab] = useState(saved.tab || 'browse');
  const [screen, setScreen] = useState(saved.screen || null); // 'taskDetail' | 'taskerProfile' | 'applySuccess'
  const [selectedTask, setSelectedTask] = useState(null);

  useEffect(() => {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ loggedIn, tab, screen }));
  }, [loggedIn, tab, screen]);

  if (!loggedIn) {
    return <LoginScreen onLogin={() => setLoggedIn(true)} />;
  }

  if (screen === 'taskDetail' && selectedTask) {
    return <TaskDetailScreen task={selectedTask} onBack={() => setScreen(null)} onApply={() => setScreen('applySuccess')} />;
  }
  if (screen === 'applySuccess') {
    return <ApplySuccessScreen task={selectedTask} onBack={() => { setScreen(null); }} />;
  }
  if (screen === 'taskerProfile') {
    return <TaskerProfileScreen onBack={() => setScreen(null)} />;
  }

  return (
    <div style={{ position: 'absolute', inset: 0 }}>
      {tab === 'browse'   && <BrowseScreen onTaskClick={t => { setSelectedTask(t); setScreen('taskDetail'); }} />}
      {tab === 'jobs'     && <BookingsScreen onBookingClick={b => { setSelectedTask(b); setScreen('taskDetail'); }} />}
      {tab === 'inbox'    && <InboxScreen />}
      {tab === 'profile'  && <ProfileScreen />}
      <BottomNav active={tab} onNavigate={setTab} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(
  <div className="stage">
    <div style={{ display: 'flex', flexDirection: 'column', gap: 12, alignItems: 'center' }}>
      <div className="phone">
        <div className="phone-notch" />
        <div className="screen"><App /></div>
      </div>
      <div style={{ color: '#666', fontSize: 12, fontFamily: 'sans-serif', textAlign: 'center' }}>
        Tasky Mobile · 390×780 · Click through to explore
      </div>
    </div>
  </div>
);
</script>
