    operationId: adminOutboxSummary
    security:
      - BearerAuth: []
    responses:
      '200':
        description: Outbox summary.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/operations.yaml#/OutboxSummary
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
