/admin/categories/{id}/schemas:
  get:
    tags:
      - Admin
    summary: List category intake schema versions
    operationId: adminListCategorySchemas
    security:
      - BearerAuth: []
    parameters:
      - $ref: ../components/parameters.yaml#/PathId
    responses:
      '200':
        description: Schema versions for category.
        content:
          application/json:
            schema:
              type: object
              required:
                - data
              properties:
                data:
                  type: array
                  items:
                    type: object
                    required:
                      - version
                      - status
                      - schema_json
                      - created_at
                    properties:
                      version:
                        type: integer
                      status:
                        type: string
                        enum:
                          - DRAFT
                          - CANARY
                          - ACTIVE
                          - ROLLED_BACK
                      schema_json:
                        type: object
                        additionalProperties: true
                      created_at:
                        type: string
                        format: date-time
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
  post:
    tags:
      - Admin
    summary: Create category intake schema version
    description: Runs schema lint/preview checks before persisting version.
    operationId: adminCreateCategorySchema
    security:
      - BearerAuth: []
    parameters:
      - $ref: ../components/parameters.yaml#/PathId
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - schema_json
            properties:
              schema_json:
                type: object
                additionalProperties: true
              activate_as:
                type: string
                enum:
                  - DRAFT
                  - CANARY
                  - ACTIVE
    responses:
      '201':
        description: Schema version created.
        content:
          application/json:
            schema:
              type: object
              required:
                - version
                - status
              properties:
                version:
                  type: integer
                status:
                  type: string
      '400':
        $ref: ../components/responses.yaml#/BadRequest
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
/admin/categories/{id}/schemas/{version}/activate:
  post:
    tags:
      - Admin
    summary: Activate or rollback category schema version
    operationId: adminActivateCategorySchema
    security:
      - BearerAuth: []
    parameters:
      - $ref: ../components/parameters.yaml#/PathId
      - name: version
        in: path
        required: true
        schema:
          type: integer
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
