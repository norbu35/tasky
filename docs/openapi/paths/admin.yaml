/admin/messages/flagged:
  get:
    tags:
      - Admin
    summary: List phone-flagged messages
    description: Returns paginated messages where phone_number_flagged is true.
    operationId: adminListFlaggedMessages
    security:
      - BearerAuth: []
    parameters:
      - $ref: ../components/parameters.yaml#/CursorParam
      - $ref: ../components/parameters.yaml#/LimitParam
    responses:
      '200':
        description: Paginated list of phone-flagged messages.
        content:
          application/json:
            schema:
              type: object
              required:
                - data
                - cursor
              properties:
                data:
                  type: array
                  items:
                    $ref: ../components/schemas/messaging.yaml#/Message
                cursor:
                  $ref: ../components/schemas/common.yaml#/CursorPagination
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
/admin/users:
  get:
    tags:
      - Admin
    summary: Search users
    description: |
      Search users by phone number (exact normalized match, E.164 recommended).
    operationId: adminSearchUsers
    security:
      - BearerAuth: []
    parameters:
      - name: phone
        in: query
        required: true
        description: Phone number to search for (exact normalized match, E.164 recommended).
        schema:
          type: string
      - $ref: ../components/parameters.yaml#/CursorParam
      - $ref: ../components/parameters.yaml#/LimitParam
    responses:
      '200':
        description: Paginated list of users.
        content:
          application/json:
            schema:
              type: object
              required:
                - data
                - cursor
              properties:
                data:
                  type: array
                  items:
                    $ref: ../components/schemas/identity.yaml#/User
                cursor:
                  $ref: ../components/schemas/common.yaml#/CursorPagination
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
/admin/users/{id}/ban:
  post:
    tags:
      - Admin
    summary: Ban a user
    description: |
      Bans a user, preventing them from logging in even with a valid JWT.
      Active bookings are not automatically cancelled.
    operationId: adminBanUser
    security:
      - BearerAuth: []
    parameters:
      - $ref: ../components/parameters.yaml#/PathId
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - reason
            properties:
              reason:
                type: string
                minLength: 1
    responses:
      '200':
        description: User banned.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/identity.yaml#/User
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '409':
        description: User is already banned.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/Error
/admin/users/{id}/unban:
  post:
    tags:
      - Admin
    summary: Unban a user
    description: Removes the ban on a user, restoring their access.
    operationId: adminUnbanUser
    security:
      - BearerAuth: []
    parameters:
      - $ref: ../components/parameters.yaml#/PathId
    responses:
      '200':
        description: User unbanned.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/identity.yaml#/User
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '409':
        description: User is not banned.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/Error
/admin/tasks/{id}/concierge-assign:
  post:
    tags:
      - Admin
    summary: Concierge assign task to tasker (Phase 0-1)
    description: |
      Founder/admin manual dispatch fallback for low-liquidity periods.
      Creates booking assignment if target tasker is eligible and verified.
      Requires Idempotency-Key header.
    operationId: adminConciergeAssignTask
    security:
      - BearerAuth: []
    parameters:
      - $ref: ../components/parameters.yaml#/PathId
      - $ref: ../components/parameters.yaml#/IdempotencyKeyHeader
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - tasker_id
              - override_reason
              - liability_disclaimer_accepted
            properties:
              tasker_id:
                type: string
                format: uuid
              override_reason:
                type: string
                minLength: 3
                maxLength: 500
              liability_disclaimer_accepted:
                type: boolean
                enum:
                  - true
    responses:
      '200':
        description: Concierge assignment completed.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/bookings.yaml#/Booking
      '400':
        $ref: ../components/responses.yaml#/BadRequest
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '409':
        description: Task not eligible for assignment or tasker not eligible.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/Error
/admin/verifications/pending:
