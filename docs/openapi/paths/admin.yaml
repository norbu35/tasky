/admin/outbox/events:
  get:
    tags:
      - Admin
    summary: List outbox events
    description: Paginated list of outbox events filtered by status.
    operationId: adminListOutboxEvents
    security:
      - BearerAuth: []
    parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
            - PENDING
            - FAILED
            - PROCESSED
            - PROCESSING
          default: FAILED
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 50
          minimum: 1
          maximum: 200
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          default: 0
          minimum: 0
    responses:
      '200':
        description: Paginated list of outbox events.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/operations.yaml#/OutboxEventPage
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
/admin/outbox/events/{id}:
  get:
    tags:
      - Admin
    summary: Get outbox event detail
    description: Returns a single outbox event by ID.
    operationId: adminGetOutboxEvent
    security:
      - BearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: Outbox event detail.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/operations.yaml#/OutboxEvent
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
/admin/outbox/events/{id}/replay:
  post:
    tags:
      - Admin
    summary: Replay outbox event
    description: Resets a FAILED outbox event to PENDING so the processor will retry it.
    operationId: adminReplayOutboxEvent
    security:
      - BearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: Event replay initiated.
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                eventId:
                  type: string
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '409':
        description: Event is not in FAILED status.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/Error
/admin/outbox/events/replay-all:
  post:
    tags:
      - Admin
    summary: Replay all failed outbox events
    description: Resets all FAILED outbox events to PENDING for bulk retry.
    operationId: adminReplayAllOutboxEvents
    security:
      - BearerAuth: []
    responses:
      '200':
        description: Bulk replay initiated.
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                replayed_count:
                  type: integer
                total_failed:
                  type: integer
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
/admin/bookings/{id}:
  get:
    tags:
      - Admin
    summary: Get booking detail (admin)
    description: Retrieves full booking details for admin inspection.
    operationId: adminGetBooking
    security:
      - BearerAuth: []
    parameters:
      - $ref: ../components/parameters.yaml#/PathId
    responses:
      '200':
        description: Booking detail.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/bookings.yaml#/Booking
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
/admin/bookings/{id}/override-status:
  post:
    tags:
      - Admin
    summary: Override booking status (admin)
    description: |
      Forces a booking status transition. Used for admin dispute resolution
      and manual intervention. Requires idempotency key.
    operationId: adminOverrideBookingStatus
    security:
      - BearerAuth: []
    parameters:
      - $ref: ../components/parameters.yaml#/PathId
      - $ref: ../components/parameters.yaml#/IdempotencyKeyHeader
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - new_status
              - reason
            properties:
              new_status:
                type: string
                enum:
                  - ASSIGNED
                  - PAID
                  - COMPLETED
                  - CANCELLED
                  - NO_SHOW
                  - DISPUTED
              reason:
                type: string
                maxLength: 500
    responses:
      '200':
        description: Status overridden successfully.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/bookings.yaml#/Booking
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '409':
        description: Invalid status transition.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/Error
