/admin/verifications/{id}:
  get:
    tags:
      - Admin
    summary: Get verification detail
    description: Returns a single verification submission with media URLs and review metadata for admin handling.
    operationId: adminGetVerificationDetail
    security:
      - BearerAuth: []
    parameters:
      - $ref: ../components/parameters.yaml#/PathId
    responses:
      '200':
        description: Verification detail.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/identity.yaml#/VerificationDetail
