/admin/verifications/{id}/approve:
  post:
    tags:
      - Admin
    summary: Approve verification
    description: Approves a tasker's identity verification. User status changes to VERIFIED.
    operationId: adminApproveVerification
    security:
      - BearerAuth: []
    parameters:
      - $ref: ../components/parameters.yaml#/PathId
    responses:
      '200':
        description: Verification approved.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/identity.yaml#/VerificationDetail
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '409':
        description: Verification is not in PENDING status.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/Error
/admin/verifications/{id}/reject:
  post:
    tags:
      - Admin
    summary: Reject verification
    description: Rejects a tasker's identity verification with a reason. Tasker can resubmit.
    operationId: adminRejectVerification
    security:
      - BearerAuth: []
    parameters:
      - $ref: ../components/parameters.yaml#/PathId
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - reason
            properties:
              reason:
                type: string
                minLength: 1
                description: Reason for rejection, visible to the tasker.
    responses:
      '200':
        description: Verification rejected.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/identity.yaml#/VerificationDetail
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '409':
        description: Verification is not in PENDING status.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/Error
/admin/disputes:
  get:
    tags:
      - Admin
    summary: List open disputes
    description: Returns paginated list of open disputes for admin resolution.
    operationId: adminListDisputes
    security:
      - BearerAuth: []
    parameters:
      - $ref: ../components/parameters.yaml#/CursorParam
      - $ref: ../components/parameters.yaml#/LimitParam
    responses:
      '200':
        description: Paginated list of open disputes.
        content:
          application/json:
            schema:
              type: object
              required:
                - data
                - cursor
              properties:
                data:
                  type: array
                  items:
                    $ref: ../components/schemas/disputes.yaml#/Dispute
                cursor:
                  $ref: ../components/schemas/common.yaml#/CursorPagination
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
/admin/disputes/{id}:
  get:
    tags:
      - Admin
    summary: Get dispute details with evidence context
    description: |
      Returns full dispute details, related booking context, and recent conversation messages
      between booking participants for moderation review.
    operationId: adminGetDispute
    security:
      - BearerAuth: []
    parameters:
      - $ref: ../components/parameters.yaml#/PathId
    responses:
      '200':
        description: Dispute detail payload for admin review.
        content:
          application/json:
            schema:
              type: object
              properties:
                dispute:
                  $ref: ../components/schemas/disputes.yaml#/Dispute
                booking:
                  $ref: ../components/schemas/bookings.yaml#/Booking
                conversation_id:
                  type: string
                  format: uuid
                  nullable: true
                evidence_messages:
                  type: array
                  items:
                    $ref: ../components/schemas/messaging.yaml#/Message
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
/admin/disputes/{id}/resolve:
  post:
    tags:
      - Admin
    summary: Resolve a dispute
    description: |
      Admin resolves a dispute by selecting customer-favor, tasker-favor, or escalation outcome.
      Later rollout phases may extend this endpoint with refund/release amount handling.
      Requires Idempotency-Key header.
    operationId: adminResolveDispute
    security:
      - BearerAuth: []
    parameters:
      - $ref: ../components/parameters.yaml#/PathId
      - $ref: ../components/parameters.yaml#/IdempotencyKeyHeader
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - resolution
            properties:
              resolution:
                type: string
                enum:
                  - RESOLVE_CUSTOMER
                  - RESOLVE_TASKER
                  - ESCALATE
              notes:
                type: string
                maxLength: 2000
                description: Admin notes on the resolution decision.
    responses:
      '200':
        description: Dispute resolved.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/disputes.yaml#/Dispute
      '400':
        $ref: ../components/responses.yaml#/BadRequest
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '409':
        description: Dispute is already resolved.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/Error
