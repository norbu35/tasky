/admin/categories:
  get:
    tags:
      - Admin
    summary: List all categories
    description: Returns paginated categories including inactive ones. Admin only.
    operationId: adminListCategories
    security:
      - BearerAuth: []
    parameters:
      - $ref: ../components/parameters.yaml#/CursorParam
      - $ref: ../components/parameters.yaml#/LimitParam
    responses:
      '200':
        description: Paginated list of all categories.
        content:
          application/json:
            schema:
              type: object
              required:
                - data
                - cursor
              properties:
                data:
                  type: array
                  items:
                    $ref: ../components/schemas/categories.yaml#/Category
                cursor:
                  $ref: ../components/schemas/common.yaml#/CursorPagination
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
  post:
    tags:
      - Admin
    summary: Create a category
    description: Creates a new service category. Intake can be enabled with schema in separate schema endpoints.
    operationId: adminCreateCategory
    security:
      - BearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - name
              - name_mn
              - icon_url
              - sort_order
            properties:
              name:
                type: string
                minLength: 1
                example: Cleaning
              name_mn:
                type: string
                minLength: 1
                example: Цэвэрлэгээ
              icon_url:
                type: string
                format: uri
              sort_order:
                type: integer
              intake_enabled:
                type: boolean
                default: true
    responses:
      '201':
        description: Category created.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/categories.yaml#/Category
      '400':
        $ref: ../components/responses.yaml#/BadRequest
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
/admin/categories/{id}:
  put:
    tags:
