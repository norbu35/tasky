/security/customer/ping:
  get:
    tags:
      - Security
    summary: Customer role auth smoke-test
    description: |
      Auth scope smoke-test endpoint. Returns the authenticated user's role
      and userId. Used in integration tests to verify that CUSTOMER
      role-based access control is correctly applied.
    operationId: pingCustomer
    security:
      - BearerAuth: []
    responses:
      '200':
        description: Auth scope confirmed.
        content:
          application/json:
            schema:
              type: object
              required:
                - role
                - userId
              properties:
                role:
                  type: string
                  example: CUSTOMER
                userId:
                  type: string
                  format: uuid
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
