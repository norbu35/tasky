/auth/facebook:
  post:
    tags:
      - Auth
    summary: Authenticate with Facebook OAuth
    description: |
      Validates a Facebook user access token and returns JWT tokens.
      This is the launch authentication endpoint for the active Phase 1 contract.
    operationId: loginWithFacebook
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - access_token
            properties:
              access_token:
                type: string
                description: Facebook user access token from the client SDK.
                example: EAABsbCS1...
    responses:
      '200':
        description: Authentication successful.
        content:
          application/json:
            schema:
              type: object
              required:
                - access_token
                - refresh_token
                - user
              properties:
                access_token:
                  type: string
                refresh_token:
                  type: string
                user:
                  $ref: ../components/schemas/identity.yaml#/User
      '400':
        $ref: ../components/responses.yaml#/BadRequest
      '401':
        description: Invalid or mismatched Facebook token.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/Error
      '409':
        description: Account state conflict prevents authentication.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/Error
      '429':
        $ref: ../components/responses.yaml#/TooManyRequests
      '503':
        description: OAuth provider unavailable in Phase 0-1 (`AUTH_PROVIDER_UNAVAILABLE`).
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/Error
/auth/logout:
  post:
    tags:
      - Auth
    summary: Logout and revoke access token
    description: |
      Revokes the current access token. The token cannot be used after this call.
    operationId: logout
    responses:
      '204':
        description: Token revoked successfully.
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
/auth/facebook/status:
  get:
    tags:
      - Auth
    summary: Facebook OAuth circuit breaker status
    description: |
      Returns the current state of the Facebook OAuth circuit breaker.
      Used by the web auth page to surface outage banners when the Facebook
      OAuth provider is degraded or unavailable.
    operationId: getFacebookStatus
    security: []
    responses:
      '200':
        description: Circuit breaker state.
        content:
          application/json:
            schema:
              type: object
              required:
                - available
                - state
              properties:
                available:
                  type: boolean
                state:
                  type: string
                  enum:
                    - CLOSED
                    - OPEN
                    - HALF_OPEN
/auth/dev/login:
  x-tasky-status: deferred
  x-tasky-phase: dev_only
  x-tasky-target-phase: dev_only
  post:
    tags:
      - Auth
    summary: Dev login (development only)
    description: |
      Authenticate with a phone number and role without SMS OTP.
      Only available when `tasky.dev-auth.enabled=true`. Never enabled in production.
    operationId: devLogin
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - phone
              - role
            properties:
              phone:
                type: string
                format: phone
              role:
                type: string
                enum:
                  - CUSTOMER
                  - TASKER
                  - ADMIN
    responses:
      '200':
        description: Auth session with tokens.
        content:
          application/json:
            schema:
              type: object
              required:
                - access_token
                - refresh_token
                - user
              properties:
                access_token:
                  type: string
                refresh_token:
                  type: string
                user:
                  $ref: ../components/schemas/identity.yaml#/User
      '400':
        $ref: ../components/responses.yaml#/BadRequest
/auth/token/refresh:
  post:
    tags:
      - Auth
    summary: Refresh access token
    description: Exchange a valid refresh token for a new token pair.
    operationId: refreshToken
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - refresh_token
            properties:
              refresh_token:
                type: string
    responses:
      '200':
        description: Tokens refreshed successfully.
        content:
          application/json:
            schema:
              type: object
              required:
                - access_token
                - refresh_token
              properties:
                access_token:
                  type: string
                refresh_token:
                  type: string
      '401':
        description: Invalid or expired refresh token.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/Error
/auth/otp/request:
  x-tasky-status: deferred
  x-tasky-phase: phase_2
  x-tasky-target-phase: phase_2
  post:
    tags:
      - Auth
    summary: Request OTP code (Phase 2+)
    description: |
      **Not yet active — Phase 2+ forward reference. Returns 403 until OTP is enabled.**
      Sends a one-time password to the given phone number. Requires `tasky.otp.enabled=true`.
    operationId: requestOtp
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - phone
            properties:
              phone:
                type: string
                format: phone
                description: Phone number in E.164 format.
                example: '+97699112233'
    responses:
      '200':
        description: OTP sent successfully.
        content:
          application/json:
            schema:
              type: object
              required:
                - message
                - masked_phone
              properties:
                message:
                  type: string
                masked_phone:
                  type: string
                  description: Masked phone number confirming the delivery target.
      '400':
        $ref: ../components/responses.yaml#/BadRequest
      '403':
        description: OTP authentication is disabled for the current rollout phase.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/Error
      '429':
        $ref: ../components/responses.yaml#/TooManyRequests
/auth/otp/verify:
  x-tasky-status: deferred
  x-tasky-phase: phase_2
  x-tasky-target-phase: phase_2
  post:
    tags:
      - Auth
    summary: Verify OTP code (Phase 2+)
    description: |
      **Not yet active — Phase 2+ forward reference. Returns 403 until OTP is enabled.**
      Verifies the OTP code sent to the given phone number. Optionally links a Facebook
      access token for account migration. Requires `tasky.otp.enabled=true`.
    operationId: verifyOtp
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - phone
              - code
            properties:
              phone:
                type: string
                format: phone
                description: Phone number in E.164 format.
                example: '+97699112233'
              code:
                type: string
                description: 4-6 digit OTP code.
                minLength: 4
                maxLength: 6
              facebook_access_token:
                type: string
                description: Optional Facebook access token for account linking/migration.
                maxLength: 512
    responses:
      '200':
        description: Authentication successful.
        content:
          application/json:
            schema:
              type: object
              required:
                - access_token
                - refresh_token
                - user
              properties:
                access_token:
                  type: string
                refresh_token:
                  type: string
                user:
                  $ref: ../components/schemas/identity.yaml#/User
      '401':
        description: Invalid or expired OTP code.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/Error
      '403':
        description: OTP authentication is disabled for the current rollout phase.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/Error
      '429':
        $ref: ../components/responses.yaml#/TooManyRequests
