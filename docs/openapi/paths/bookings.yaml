/bookings:
  get:
    tags:
      - Bookings
    summary: List my bookings
    description: |
      Returns paginated list of bookings for the authenticated user.
      Filter by role (as customer or tasker) and booking status.
    operationId: listBookings
    security:
      - BearerAuth: []
    parameters:
      - name: role
        in: query
        description: View bookings as customer or tasker.
        schema:
          type: string
          enum:
            - customer
            - tasker
      - name: status
        in: query
        description: Filter by booking status.
        schema:
          type: string
          enum:
            - ASSIGNED
            - COMPLETED
            - CANCELLED
            - NO_SHOW
      - $ref: ../components/parameters.yaml#/CursorParam
      - $ref: ../components/parameters.yaml#/LimitParam
    responses:
      '200':
        description: Paginated list of bookings.
        content:
          application/json:
            schema:
              type: object
              required:
                - data
                - cursor
              properties:
                data:
                  type: array
                  items:
                    $ref: ../components/schemas/bookings.yaml#/Booking
                cursor:
                  $ref: ../components/schemas/common.yaml#/CursorPagination
      '400':
        $ref: ../components/responses.yaml#/BadRequest
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
/bookings/{id}:
  get:
    tags:
      - Bookings
    summary: Get booking details
    description: Returns full booking details. Only accessible by the booking's customer or tasker.
    operationId: getBooking
    security:
      - BearerAuth: []
    parameters:
      - $ref: ../components/parameters.yaml#/PathId
    responses:
      '200':
        description: Booking details.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/bookings.yaml#/Booking
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
/bookings/{id}/schedule-events:
  get:
    tags:
      - Bookings
    summary: List booking schedule events
    description: Returns immutable reschedule timeline events for auditability.
    operationId: listBookingScheduleEvents
    security:
      - BearerAuth: []
    parameters:
      - $ref: ../components/parameters.yaml#/PathId
    responses:
      '200':
        description: Schedule events.
        content:
          application/json:
            schema:
              type: object
              required:
                - data
              properties:
                data:
                  type: array
                  items:
                    $ref: ../components/schemas/bookings.yaml#/BookingScheduleEvent
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
/bookings/{id}/cancel:
  post:
    tags:
      - Bookings
    summary: Cancel a booking
    description: |
      Cancels an active booking. Cancellation policy applies:
      - Customer: Free cancellation > 4 hours before scheduled_at. Late cancellation is recorded as a reliability incident.
      - Tasker: Task reverts to OPEN. Strike recorded. Suspension thresholds/durations are managed by admin moderation policy.
      Requires Idempotency-Key header.
    operationId: cancelBooking
    security:
      - BearerAuth: []
    parameters:
      - $ref: ../components/parameters.yaml#/PathId
      - $ref: ../components/parameters.yaml#/IdempotencyKeyHeader
    requestBody:
      required: false
      content:
        application/json:
          schema:
            type: object
            properties:
              reason:
                type: string
                description: Optional cancellation reason. Taskers can use `SAFETY_FRAUD` to mark a safety/fraud cancellation.
    responses:
      '200':
        description: Booking cancelled.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/bookings.yaml#/Booking
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '409':
        description: Booking cannot be cancelled in its current status.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/Error
/bookings/{id}/complete:
  post:
    tags:
      - Bookings
    summary: Mark booking as complete
    description: |
      Customer marks an ASSIGNED booking as complete. This triggers:
      - Booking status -> COMPLETED
      - Task status -> COMPLETED
      Requires Idempotency-Key header.
    operationId: completeBooking
    security:
      - BearerAuth: []
    parameters:
      - $ref: ../components/parameters.yaml#/PathId
      - $ref: ../components/parameters.yaml#/IdempotencyKeyHeader
    responses:
      '200':
        description: Booking completed.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/bookings.yaml#/Booking
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '409':
        description: Booking is not in ASSIGNED status.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/Error
/bookings/{id}/reschedule:
  post:
    tags:
      - Bookings
    summary: Request booking reschedule
    description: |
      Either booking party may request a reschedule while booking is ASSIGNED.
      Counterparty accepts/declines in-app. Policy timers always reference the latest accepted schedule.
      Requires Idempotency-Key header.
    operationId: requestBookingReschedule
    security:
      - BearerAuth: []
    parameters:
      - $ref: ../components/parameters.yaml#/PathId
      - $ref: ../components/parameters.yaml#/IdempotencyKeyHeader
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - proposed_scheduled_at
            properties:
              proposed_scheduled_at:
                type: string
                format: date-time
              reason:
                type: string
                nullable: true
                maxLength: 1000
    responses:
      '201':
        description: Reschedule request created.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/bookings.yaml#/BookingScheduleEvent
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '409':
        description: Booking is not in ASSIGNED status or proposed time invalid.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/Error
/bookings/{id}/reschedule/{eventId}/respond:
  post:
    tags:
      - Bookings
    summary: Accept or decline reschedule request
    description: Responds to a pending reschedule request. Accepted response updates canonical schedule.
    operationId: respondBookingReschedule
    security:
      - BearerAuth: []
    parameters:
      - $ref: ../components/parameters.yaml#/PathId
      - name: eventId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: ../components/parameters.yaml#/IdempotencyKeyHeader
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - action
            properties:
              action:
                type: string
                enum:
                  - ACCEPT
                  - DECLINE
    responses:
      '200':
        description: Reschedule request responded.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/bookings.yaml#/BookingScheduleEvent
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '409':
        description: Request already finalized or booking not eligible.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/Error
/bookings/{id}/no-show/flag:
  post:
    tags:
      - Bookings
    summary: Flag and adjudicate no-show
    description: |
      No-show adjudication follows deterministic rules:
      reminder at scheduled +30m; no-show flag eligibility at +1h; rejected if either party
      posted a status/check-in in trailing 30 minutes or a newer accepted reschedule supersedes schedule.
      On success, both booking and linked task transition to NO_SHOW in one transaction.
      Requires Idempotency-Key header.
    operationId: flagNoShow
    security:
      - BearerAuth: []
    parameters:
      - $ref: ../components/parameters.yaml#/PathId
      - $ref: ../components/parameters.yaml#/IdempotencyKeyHeader
    responses:
      '200':
        description: No-show confirmed.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/bookings.yaml#/Booking
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '409':
        description: No-show rules not satisfied (`NO_SHOW_NOT_ELIGIBLE`).
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/Error
/bookings/{id}/mark-done:
  post:
    tags:
      - Bookings
    summary: Tasker marks booking as done
    description: |
      Tasker signals that work is finished while booking remains active.
      Customer is notified to review and finalize booking completion.
      Requires Idempotency-Key header.
    operationId: markBookingDone
    security:
      - BearerAuth: []
    parameters:
      - $ref: ../components/parameters.yaml#/PathId
      - $ref: ../components/parameters.yaml#/IdempotencyKeyHeader
    responses:
      '200':
        description: Booking marked done by tasker.
        content:
          application/json:
            schema:
              type: object
              required:
                - booking
                - tasker_marked_done_at
              properties:
                booking:
                  $ref: ../components/schemas/bookings.yaml#/Booking
                tasker_marked_done_at:
                  type: string
                  format: date-time
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '409':
        description: Booking is not in ASSIGNED status.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/Error
/booking-intents/{id}:
  get:
    tags:
      - Bookings
    summary: Get booking intent
    description: Returns booking intent details for the owner or the selected tasker.
    operationId: getBookingIntent
    security:
      - BearerAuth: []
    parameters:
      - $ref: ../components/parameters.yaml#/PathId
    responses:
      '200':
        description: Booking intent details.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/bookings.yaml#/BookingIntent
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '404':
        $ref: ../components/responses.yaml#/NotFound
/booking-intents/{id}/confirm:
  post:
    tags:
      - Bookings
    summary: Tasker confirms booking intent
    description: |
      The selected tasker confirms a pending booking intent within the default 4-hour response window.
      This creates an ASSIGNED booking and closes the remaining applications for the task.
      Requires Idempotency-Key header.
    operationId: confirmBookingIntent
    security:
      - BearerAuth: []
    parameters:
      - $ref: ../components/parameters.yaml#/PathId
      - $ref: ../components/parameters.yaml#/IdempotencyKeyHeader
    responses:
      '200':
        description: Booking created from intent.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/bookings.yaml#/Booking
      '400':
        $ref: ../components/responses.yaml#/BadRequest
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '409':
        description: Intent or task status does not allow confirmation.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/Error
/booking-intents/{id}/decline:
  post:
    tags:
      - Bookings
    summary: Tasker declines booking intent
    description: |
      The selected tasker declines a pending booking intent.
      The customer can then return to the applicant list and choose another tasker.
      Requires Idempotency-Key header.
    operationId: declineBookingIntent
    security:
      - BearerAuth: []
    parameters:
      - $ref: ../components/parameters.yaml#/PathId
      - $ref: ../components/parameters.yaml#/IdempotencyKeyHeader
    responses:
      '200':
        description: Booking intent declined.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/bookings.yaml#/BookingIntent
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '409':
        description: Intent is not pending or already resolved.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/Error
/bookings/{id}/rebook:
  post:
    tags:
      - Bookings
    summary: Rebook a completed booking
    description: |
      Phase 1 one-time repeat-demand learning surface. Creates a new OPEN task snapshot copied from a completed booking,
      with schedule intentionally unset so the customer must choose a new time before normal booking confirmation applies.
      The original booking must be in COMPLETED status and must belong to the requesting customer. This does not activate
      recurring scheduling, saved household preferences, automatic assignment, paid membership, platform payment, escrow,
      or payment protection.
    operationId: rebookBooking
    security:
      - BearerAuth: []
    parameters:
      - $ref: ../components/parameters.yaml#/PathId
    responses:
      '201':
        description: Rebooked task snapshot created.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/bookings.yaml#/RebookedTask
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '409':
        description: Original booking is not eligible for rebooking.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/Error
/tasks/{id}/booking-intents:
  post:
    tags:
      - Bookings
    summary: Create booking intent for a task
    description: |
      Customer creates a booking intent for a task, selecting a tasker.
      Supports the active REBOOK source from a previous completed booking.
      The task must be in a state that allows booking intent creation.
      Requires Idempotency-Key header.
    operationId: createBookingIntent
    security:
      - BearerAuth: []
    parameters:
      - $ref: ../components/parameters.yaml#/PathId
      - $ref: ../components/parameters.yaml#/IdempotencyKeyHeader
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - source
              - tasker_id
            properties:
              source:
                type: string
                enum:
                  - REBOOK
                description: Active Phase 1 booking intent source type for this endpoint.
              tasker_id:
                type: string
                format: uuid
                description: Selected tasker ID.
              original_booking_id:
                type: string
                format: uuid
                description: Original booking ID (required for REBOOK source).
    responses:
      '201':
        description: Booking intent created.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/bookings.yaml#/BookingIntent
      '400':
        $ref: ../components/responses.yaml#/BadRequest
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '409':
        description: Task is not open or booking not eligible for intent creation.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/Error
