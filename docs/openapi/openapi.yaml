openapi: 3.0.3
info:
  title: Tasky API
  description: |
    REST API for Tasky — Mongolia's most trusted domestic service marketplace.

    ## Authentication
    All endpoints (unless noted) require a Bearer JWT in the `Authorization` header.
    Current launch auth uses Facebook OAuth (`/auth/facebook`).

    ## Pagination
    All list endpoints use **cursor-based pagination**.
    Pass `cursor` (opaque string) and `limit` (default 20, max 100) as query parameters.
    Responses wrap results in `{ data: [], cursor: { next, has_more } }`.

    ## Errors
    All errors return a standard JSON body: `{ code, message, trace_id }`.

    ## Currency
    All monetary amounts are integers in MNT (Mongolian Tugrik).

    ## Idempotency
    Critical state-changing endpoints require an `Idempotency-Key` header.

    ## Phase Gating
    The active spec includes implemented-and-gated endpoints:
    - **Implemented and gated** (`wallet`, `payment`, `payout`): endpoints exist in the server and return `503` when
      their feature toggle is disabled. Current toggles: `escrow_enabled` (Phase 3+).
    These endpoints are retained in the contract because the server implements them. Truly not-yet-implemented
    forward-design endpoints belong in draft or future surfaces, not in this active contract.
  version: 1.3.0
  contact:
    name: Tasky Engineering
servers:
  - url: /api/v1
    description: API v1
