Booking:
  type: object
  required:
    - id
    - task_id
    - tasker_id
    - customer_id
    - price
    - status
    - confirmed_scheduled_at
    - created_at
  properties:
    id:
      type: string
      format: uuid
    task_id:
      type: string
      format: uuid
    task:
      $ref: ./tasks.yaml#/Task
    tasker_id:
      type: string
      format: uuid
    tasker:
      $ref: ./identity.yaml#/Profile
    customer_id:
      type: string
      format: uuid
    customer:
      $ref: ./identity.yaml#/Profile
    price:
      type: integer
      description: Agreed price in MNT.
    status:
      type: string
      enum:
        - ASSIGNED
        - COMPLETED
        - CANCELLED
        - NO_SHOW
        - DISPUTED
    confirmed_scheduled_at:
      type: string
      format: date-time
    liability_disclaimer_accepted:
      type: boolean
    liability_disclaimer_accepted_at:
      type: string
      format: date-time
      nullable: true
    settlement_mode:
      type: string
      enum:
        - DIRECT
    late_cancel_incident:
      type: boolean
    completion_reminder_count:
      type: integer
      description: Number of completion reminders sent for this booking.
    completion_reminder_last_at:
      type: string
      format: date-time
      nullable: true
      description: Timestamp of the most recent completion reminder.
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time
BookingIntent:
  type: object
  required:
    - id
    - task_id
    - tasker_id
    - customer_id
    - source
    - status
    - created_at
    - updated_at
  properties:
    id:
      type: string
      format: uuid
    task_id:
      type: string
      format: uuid
    tasker_id:
      type: string
      format: uuid
    customer_id:
      type: string
      format: uuid
    source:
      type: string
      enum:
        - APPLICATION_SELECTION
        - REBOOK
        - INSTANT_MATCH
    status:
      type: string
      enum:
        - PENDING
        - CONFIRMED
        - DECLINED
        - EXPIRED
        - CANCELLED
    selected_application_id:
      type: string
      format: uuid
      nullable: true
    original_booking_id:
      type: string
      format: uuid
      nullable: true
    offer_id:
      type: string
      format: uuid
      nullable: true
    expires_at:
      type: string
      format: date-time
      nullable: true
    confirmed_booking_id:
      type: string
      format: uuid
      nullable: true
    confirmed_at:
      type: string
      format: date-time
      nullable: true
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time
RebookedTask:
  type: object
  x-tasky-status: deferred
  x-tasky-phase: phase_2
  required:
    - id
    - customer_id
    - category_id
    - description
    - budget
    - location_lat
    - location_lng
    - location_text
    - status
    - created_at
    - updated_at
  properties:
    id:
      type: string
      format: uuid
    customer_id:
      type: string
      format: uuid
    category_id:
      type: string
      format: uuid
    description:
      type: string
    budget:
      type: integer
      nullable: true
      description: Copied budget in MNT when the original task used BUDGET pricing. Null for QUOTE mode tasks.
    location_lat:
      type: number
      format: double
    location_lng:
      type: number
      format: double
    location_text:
      type: string
      description: Copied exact address from the original completed task.
    status:
      type: string
      enum:
        - OPEN
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time
BookingScheduleEvent:
  type: object
  required:
    - id
    - booking_id
    - event_type
    - actor_user_id
    - created_at
  properties:
    id:
      type: string
      format: uuid
    booking_id:
      type: string
      format: uuid
    event_type:
      type: string
      enum:
        - REQUESTED
        - ACCEPTED
        - DECLINED
        - EXPIRED
    actor_user_id:
      type: string
      format: uuid
    proposed_scheduled_at:
      type: string
      format: date-time
      nullable: true
    reason:
      type: string
      nullable: true
    created_at:
      type: string
      format: date-time
