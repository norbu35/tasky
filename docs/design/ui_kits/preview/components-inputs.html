<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--color-background); font-family: var(--font-sans); padding: 20px; display: flex; flex-direction: column; gap: 12px; max-width: 360px; }

.field { display: flex; flex-direction: column; gap: 6px; }
.field-label { font-size: 13px; font-weight: 600; color: var(--tasky-ink); }
.input {
  height: 48px; border-radius: var(--radius-sm);
  border: 1.5px solid var(--tasky-line); background: white;
  padding: 0 14px; font-size: 16px; font-family: var(--font-sans);
  color: var(--tasky-ink); outline: none; transition: border-color var(--duration-fast);
  display: flex; align-items: center;
}
.input-placeholder { color: var(--tasky-text-tertiary); }
.input-focus { border-color: var(--tasky-ink); }
.input-invalid { border-color: var(--tasky-danger); }
.input-icon { position: relative; }
.input-icon .input { padding-left: 42px; }
.input-icon .icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); }
.helper { font-size: 12px; color: var(--tasky-text-tertiary); }
.helper-error { color: var(--tasky-danger); }

/* Search bar */
.search-bar {
  display: flex; align-items: center; gap: 10px;
  background: var(--tasky-subtle); border-radius: var(--radius-sm);
  padding: 0 14px; height: 52px; border: 1.5px solid transparent;
}
.search-bar input { background: none; border: none; outline: none; font-size: 16px; font-family: var(--font-sans); color: var(--tasky-ink); flex: 1; }
</style>
</head>
<body>
  <!-- Default input -->
  <div class="field">
    <div class="field-label">Утасны дугаар</div>
    <div class="input"><span class="input-placeholder">+976 ••• ••••</span></div>
    <div class="helper">Баталгаажуулалтын код илгээгдэнэ</div>
  </div>

  <!-- Focused -->
  <div class="field">
    <div class="field-label">Нэр</div>
    <div class="input input-focus">Батбаяр</div>
  </div>

  <!-- Invalid -->
  <div class="field">
    <div class="field-label">И-мэйл</div>
    <div class="input input-invalid"><span>batbayar@</span></div>
    <div class="helper helper-error">И-мэйл хаяг буруу байна</div>
  </div>

  <!-- Search bar -->
  <div class="search-bar">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#808D99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input placeholder="Даалгавар хайх...">
  </div>
</body>
</html>
