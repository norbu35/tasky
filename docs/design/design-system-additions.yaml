# Design System Additions — Tasky Mobile
# Extends packages/design-tokens with missing categories
# Only NEW tokens — does not redefine existing colors, spacing, typography, shadows, or motion
#
# Existing tokens reference:
#   Colors: primary(#1B3A5C), primaryDeep(#102638), secondary(#8B6914), sunLight(#C49A3C), accent(#6BA3BE),
#           background(#F9F8F5), trust(#3568A1), verified(#469178), danger(#EF4444)
#   Spacing: xs(4), sm(8), md(12), lg(16), xl(24), 2xl(32), 3xl(40)
#   Radius: xs(6), sm(8), md(12), lg(16), full(9999)
#   Typography sizes: heroTitle(30), heading(24), title(20), subtitle(18), body(16),
#                     label(14), caption(12), navLabel(11), micro(10)
#   Font families: Manrope (display), Plus Jakarta Sans (body), Roboto (fallback)
#   Weights: normal(400), medium(500), semibold(600), bold(700)
#   Line heights: tight(1.3), normal(1.6), loose(1.8)
#   Letter spacing: tight(-0.01em), normal(0em)
#   Shadows: card(0 1px 2px 5%), elevated(0 4px 6px 10%), navBar(0 -4px 24px 4%)
#   Motion durations: instant(80ms), fast(150ms), normal(250ms), slow(400ms), skeleton(1500ms)
#   Motion easings: standard(0.4,0,0.2,1), decelerate(0,0,0.2,1), accelerate(0.4,0,1,1), spring(0.34,1.56,0.64,1)

# ─────────────────────────────────────────────
# 1. Interactive States
# ─────────────────────────────────────────────
interactive_states:
  pressed:
    opacity: 0.85
    scale: 0.98 # subtle press-in effect
    description: 'Applied on press-in for buttons, cards, list rows'
  focused:
    ring_width: 2 # px
    ring_color: 'primary' # references colors.primary (#1B3A5C)
    ring_offset: 2 # px
    description: 'Focus ring for keyboard/accessibility navigation'
  disabled:
    opacity: 0.4
    text_color: 'textTertiary' # references colors.textTertiary (#808D99)
    background_color: 'muted' # references colors.muted (#F3F1EC)
    description: 'Used for disabled buttons, inputs, and interactive elements'
    rules:
      - 'Never use color alone to indicate disabled state — also reduce opacity'
      - 'Disabled elements must not receive focus'
  hover:
    opacity: 0.92
    description: 'Web parity only — not primary for mobile. Used in Figma for prototyping.'

# ─────────────────────────────────────────────
# 2. Overlays / Scrim
# ─────────────────────────────────────────────
overlays:
  scrim:
    modal: 'rgba(16, 38, 56, 0.50)' # primaryDeep at 50% — branded, not generic black
    sheet: 'rgba(16, 38, 56, 0.35)' # lighter for bottom sheets
    toast_backdrop: 'rgba(16, 38, 56, 0.20)' # subtle for toasts
    description: 'Uses primaryDeep (#102638) for branded scrim, not pure black'
  image_overlay:
    text_readability: 'linear-gradient(transparent 0%, rgba(16, 38, 56, 0.70) 100%)'
    subtle: 'linear-gradient(transparent 0%, rgba(16, 38, 56, 0.40) 100%)'
    description: 'Bottom gradient overlays for text on images'

# ─────────────────────────────────────────────
# 3. Icon Sizes
# ─────────────────────────────────────────────
icon_sizes:
  xs: 16 # inline icons, badge indicators
  sm: 20 # form field icons, secondary actions
  md: 24 # primary icons, navigation, default
  lg: 32 # feature icons, empty state accents
  xl: 48 # hero/illustration icons, onboarding
  semantic:
    navigation: 24 # header nav icons (back, close, menu)
    tab_bar: 24 # bottom tab bar icons
    tab_bar_active: 24 # same size, weight/fill changes
    avatar_badge: 16 # verification badge anchored to avatar
    input_icon: 20 # trailing/leading icons in text inputs
    fab: 24 # floating action button icon
    status: 16 # inline status indicators
  rules:
    - 'Icons must have 44x44pt minimum touch target regardless of visual size'
    - 'Use hitSlop to expand touch area when visual icon is smaller than 44pt'

# ─────────────────────────────────────────────
# 4. Elevation / Z-Index Scale
# ─────────────────────────────────────────────
elevation:
  base:
    z_index: 0
    description: 'Default content layer'
  sticky:
    z_index: 10
    description: 'Sticky headers, filter bars, tab bars'
  dropdown:
    z_index: 20
    description: 'Dropdown menus, popovers'
  sheet:
    z_index: 30
    description: 'Bottom sheets, drawers'
    shadow: 'elevated' # references existing shadow.elevated
  modal:
    z_index: 40
    description: 'Modal dialogs, full-screen overlays'
    shadow: 'elevated'
    scrim: 'modal' # references overlays.scrim.modal
  toast:
    z_index: 50
    description: 'Toast notifications — always above modals'
  system:
    z_index: 60
    description: 'System overlays (permission dialogs, force update)'

# ─────────────────────────────────────────────
# 5. Typography Variants (Composed)
# ─────────────────────────────────────────────
# Each variant composes: font_family + font_size + font_weight + line_height + letter_spacing
# All body/UI text respects 16px minimum for Mongolian Cyrillic readability
typography_variants:
  hero_title:
    font_family: 'Manrope'
    font_size: 30 # heroTitle
    font_weight: 700 # bold
    line_height: 1.3 # tight
    letter_spacing: '-0.01em' # tight
    usage: 'App hero sections, celebration headlines'

  page_heading:
    font_family: 'Manrope'
    font_size: 24 # heading
    font_weight: 700 # bold
    line_height: 1.3 # tight
    letter_spacing: '-0.01em' # tight
    usage: 'Screen titles, section headers on detail screens'

  section_heading:
    font_family: 'Manrope'
    font_size: 20 # title
    font_weight: 600 # semibold
    line_height: 1.3 # tight
    letter_spacing: '0em' # normal
    usage: 'Card group titles, form section headers'

  card_title:
    font_family: 'Plus Jakarta Sans'
    font_size: 16 # body (minimum for Cyrillic)
    font_weight: 600 # semibold
    line_height: 1.3 # tight
    letter_spacing: '0em'
    usage: 'Task card titles, list item primary text'

  body_default:
    font_family: 'Plus Jakarta Sans'
    font_size: 16 # body
    font_weight: 400 # normal
    line_height: 1.6 # normal — Cyrillic fence prevention
    letter_spacing: '0em'
    usage: 'Paragraphs, descriptions, chat messages'

  body_emphasis:
    font_family: 'Plus Jakarta Sans'
    font_size: 16 # body
    font_weight: 600 # semibold
    line_height: 1.6 # normal
    letter_spacing: '0em'
    usage: 'Emphasized body text, inline labels, bold callouts'

  label:
    font_family: 'Plus Jakarta Sans'
    font_size: 14 # label — exception to 16px floor for form labels
    font_weight: 500 # medium
    line_height: 1.3 # tight
    letter_spacing: '0em'
    usage: 'Form field labels, metadata labels. 14px allowed for labels only.'

  caption:
    font_family: 'Plus Jakarta Sans'
    font_size: 14 # UPGRADED from 12 to 14 for Cyrillic readability
    font_weight: 400 # normal
    line_height: 1.4
    letter_spacing: '0em'
    usage: 'Timestamps, secondary metadata, helper text. Absolute minimum for any visible text.'

  button_label:
    font_family: 'Plus Jakarta Sans'
    font_size: 16 # body
    font_weight: 600 # semibold
    line_height: 1.0 # single line
    letter_spacing: '0em'
    usage: 'Button text, CTA labels'

  nav_label:
    font_family: 'Plus Jakarta Sans'
    font_size: 11 # navLabel — exception for tab bar only
    font_weight: 500 # medium
    line_height: 1.0
    letter_spacing: '0em'
    usage: 'Bottom tab bar labels ONLY. Not for any other UI text.'

  price_display:
    font_family: 'Manrope'
    font_size: 20 # title
    font_weight: 700 # bold
    line_height: 1.0
    letter_spacing: '-0.01em'
    usage: 'Price/budget display on cards and detail screens. Format: ₮XX,XXX'

  badge_text:
    font_family: 'Plus Jakarta Sans'
    font_size: 11 # micro+1 — small but readable
    font_weight: 600 # semibold
    line_height: 1.0
    letter_spacing: '0em'
    usage: 'Status badges, verification badges, category chips'

# ─────────────────────────────────────────────
# 6. Density Rules
# ─────────────────────────────────────────────
density:
  compact:
    multiplier: 0.75
    spacing:
      xs: 3 # 4 * 0.75
      sm: 6 # 8 * 0.75
      md: 9 # 12 * 0.75
      lg: 12 # 16 * 0.75
      xl: 18 # 24 * 0.75
    usage: 'Transaction history, credit ledger, dense data lists'
    rules:
      - 'Never reduce font size in compact mode — only spacing'
      - 'Touch targets remain 44pt minimum'

  default:
    multiplier: 1.0
    spacing: 'Uses standard spacing tokens as-is'
    usage: 'Task feed, booking lists, chat, most screens'

  comfortable:
    multiplier: 1.5
    spacing:
      xs: 6 # 4 * 1.5
      sm: 12 # 8 * 1.5
      md: 18 # 12 * 1.5
      lg: 24 # 16 * 1.5
      xl: 36 # 24 * 1.5
    usage: 'Onboarding, success screens, empty states, permission primers'
    rules:
      - 'Used for screens where breathing room and emotional impact matter'
      - 'Never for data-dense screens'

# ─────────────────────────────────────────────
# 7. Animation Presets (Composed)
# ─────────────────────────────────────────────
# Each preset references existing motion.duration and motion.easing tokens
animation_presets:
  card_expand:
    duration: 'normal' # 250ms
    easing: 'standard' # (0.4, 0, 0.2, 1)
    description: 'Card press → detail expansion'

  sheet_open:
    duration: 'slow' # 400ms
    easing: 'decelerate' # (0, 0, 0.2, 1)
    description: 'Bottom sheet slides up into view'

  sheet_close:
    duration: 'normal' # 250ms
    easing: 'accelerate' # (0.4, 0, 1, 1)
    description: 'Bottom sheet slides down and dismisses'

  page_enter:
    duration: 'normal' # 250ms
    easing: 'decelerate' # (0, 0, 0.2, 1)
    description: 'Screen push transition (slide from right)'

  page_exit:
    duration: 'normal' # 250ms
    easing: 'accelerate' # (0.4, 0, 1, 1)
    description: 'Screen pop transition (slide to right)'

  fab_appear:
    duration: 'fast' # 150ms
    easing: 'spring' # (0.34, 1.56, 0.64, 1)
    description: 'FAB scales in with playful bounce'

  fab_disappear:
    duration: 'fast' # 150ms
    easing: 'accelerate' # (0.4, 0, 1, 1)
    description: 'FAB scales out on scroll down'

  success_checkmark:
    duration: 'slow' # 400ms
    easing: 'spring' # (0.34, 1.56, 0.64, 1)
    description: 'Animated checkmark draw on success/celebration screens'

  skeleton_pulse:
    duration: 'skeleton' # 1500ms
    easing: 'standard' # (0.4, 0, 0.2, 1)
    loop: true
    description: 'Skeleton loading shimmer. Tuned for Mongolia ~20 Mbps average.'

  badge_pop:
    duration: 'fast' # 150ms
    easing: 'spring' # (0.34, 1.56, 0.64, 1)
    description: 'Badge/chip appears with scale pop'

  toast_slide_in:
    duration: 'normal' # 250ms
    easing: 'decelerate' # (0, 0, 0.2, 1)
    description: 'Toast notification slides in from top'

  toast_slide_out:
    duration: 'fast' # 150ms
    easing: 'accelerate' # (0.4, 0, 1, 1)
    description: 'Toast dismisses upward'

  pull_to_refresh:
    duration: 'normal' # 250ms
    easing: 'decelerate' # (0, 0, 0.2, 1)
    description: 'Pull-to-refresh spinner appearance'

# ─────────────────────────────────────────────
# 8. Color Opacity Scale
# ─────────────────────────────────────────────
# Systematic opacity steps for brand colors
# Used for: tinted backgrounds, overlays, borders, state variations
color_opacity:
  primary: # #1B3A5C
    '5': 'rgba(27, 58, 92, 0.05)' # subtle tinted backgrounds
    '10': 'rgba(27, 58, 92, 0.10)' # hover backgrounds, light borders
    '15': 'rgba(27, 58, 92, 0.15)' # pressed backgrounds
    '20': 'rgba(27, 58, 92, 0.20)' # input focus rings
    '30': 'rgba(27, 58, 92, 0.30)' # separator lines
    '40': 'rgba(27, 58, 92, 0.40)' # secondary borders
    '50': 'rgba(27, 58, 92, 0.50)' # disabled text alternative
    '60': 'rgba(27, 58, 92, 0.60)' # heavy tint
    '80': 'rgba(27, 58, 92, 0.80)' # dark overlay

  secondary: # #C49A3C
    '5': 'rgba(196, 154, 60, 0.05)'
    '10': 'rgba(196, 154, 60, 0.10)'
    '15': 'rgba(196, 154, 60, 0.15)'
    '20': 'rgba(196, 154, 60, 0.20)'

  accent: # #6BA3BE
    '5': 'rgba(107, 163, 190, 0.05)'
    '10': 'rgba(107, 163, 190, 0.10)'
    '15': 'rgba(107, 163, 190, 0.15)'
    '20': 'rgba(107, 163, 190, 0.20)'

  trust: # #3568A1
    '5': 'rgba(53, 104, 161, 0.05)'
    '10': 'rgba(53, 104, 161, 0.10)'
    '15': 'rgba(53, 104, 161, 0.15)'
    '20': 'rgba(53, 104, 161, 0.20)'

  verified: # #469178
    '5': 'rgba(70, 145, 120, 0.05)'
    '10': 'rgba(70, 145, 120, 0.10)'
    '15': 'rgba(70, 145, 120, 0.15)'
    '20': 'rgba(70, 145, 120, 0.20)'

  danger: # #EF4444
    '5': 'rgba(239, 68, 68, 0.05)' # error field background
    '10': 'rgba(239, 68, 68, 0.10)' # error border tint
    '15': 'rgba(239, 68, 68, 0.15)'

# ─────────────────────────────────────────────
# 9. Content Rules
# ─────────────────────────────────────────────
content_rules:
  mongolian_cyrillic:
    expansion_factor: 1.2 # Mongolian text is ~20% longer than English equivalent
    min_body_size: 16 # px — absolute floor
    min_secondary_size: 14 # px — allowed only for labels and captions
    min_nav_size: 11 # px — tab bar labels only
    line_height_body: 1.6 # prevents "fence effect" with Cyrillic verticals
    letter_spacing: '0em' # never widen — kills Cyrillic readability
    text_alignment: 'flush-left' # never justify Cyrillic text
    hyphenation: false # no automatic hyphenation for Mongolian

  max_lengths:
    page_title: 30 # characters — e.g., "Миний даалгаврууд" (18 chars)
    card_title: 40 # characters — e.g., "Гэрийн цэвэрлэгээ хийлгэх" (26 chars)
    button_label: 20 # characters — e.g., "Баталгаажуулах" (14 chars)
    badge_text: 15 # characters — e.g., "Баталгаажсан" (12 chars)
    helper_text: 80 # characters per line
    description: 200 # characters before truncation
    chat_preview: 50 # characters in conversation list

  truncation:
    method: 'word-boundary' # never break mid-word in Mongolian
    indicator: '...' # standard ellipsis
    lines_card_description: 2 # max lines before truncation on cards
    lines_chat_preview: 1

  currency:
    format: '₮{amount}' # e.g., ₮45,000
    thousand_separator: ','
    minimum: 1001 # MNT
    position: 'prefix'

  date_format:
    display: 'YYYY.MM.DD' # Mongolian convention
    relative: true # "2 цагийн өмнө" for recent, absolute for older
    relative_threshold_hours: 24 # switch to absolute after 24h
