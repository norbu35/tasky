    screen_id: SCR-TASK-002
    screen_name: Task Detail (Tasker)
    action: Tap 'Apply' while unverified
    next: SCR-TASK-003
    lifecycle: null
  - step: 2
    screen_id: SCR-TASK-003
    screen_name: Verification Gate
    action: View verification encouragement
    next: SCR-TASK-004
    lifecycle: null
  - step: 3
    screen_id: SCR-TASK-004
    screen_name: Verification — Consent
    action: Accept verification consent
    next: SCR-TASK-005
    lifecycle: null
  - step: 4
    screen_id: SCR-TASK-005
    screen_name: Verification — ID Upload
    action: Upload ID front, back, selfie
    next: SCR-TASK-010
    lifecycle: VER-T01 (tasker_submits_id)
  - step: 5
    screen_id: SCR-TASK-010
    screen_name: Verification Submitted — Success
    action: Success — submitted
    next: SCR-TASK-007
    lifecycle: null
