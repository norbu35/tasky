      - SCR-TASK-009
      - SCR-TASK-005
    outcome: Re-enters verification queue
  - id: JRN-TASK-01-A3
    name: DAN fast-path (Phase 2)
    branch_at_step: 2
    condition: Phase 2, E-Mongolia available
    screens:
      - SCR-TASK-006
    outcome: Auto-verified via DAN
visual_consistency_note: >-
  All screens in this journey should share visual continuity — consistent header style, navigation patterns, and color
  usage. Screens in sequence should feel like a cohesive flow.
