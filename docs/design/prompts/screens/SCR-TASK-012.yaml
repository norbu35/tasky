      Pull-to-refresh in progress — refresh indicator visible with existing cards

      Visible elements: page_title, tab_filter, booking_cards, refresh_indicator

      Hidden elements: empty_state, loading_skeleton

      Style: Deep blue (#1B3A5C) primary, gold (#C49A3C) accents, off-white (#F9F8F5) background. Mongolian Cyrillic
