  - state_id: error_network
    prompt: >-
      Generate the "error_network" state of "Tasker Bookings (My Jobs)".

      Network error loading bookings — error message with retry

      Visible elements: page_title, tab_filter, error_message, retry_button

      Hidden elements: booking_cards, empty_state, loading_skeleton

      Style: Deep blue (#1B3A5C) primary, gold (#C49A3C) accents, off-white (#F9F8F5) background. Mongolian Cyrillic
      text. 16px minimum body text.
