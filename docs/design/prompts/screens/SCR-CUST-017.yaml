acceptance_criteria:
  - Initial load shows detail skeleton matching content layout
  - Assigned state shows tasker avatar with verification badge, task title, schedule, location, and budget
  - 'Assigned state CTA bar contains Message (primary) and secondary actions: Reschedule, Cancel, Timeline'
  - Assigned_approaching state shows a warning banner when scheduled time is within 4 hours
  - Tasker_marked_done state changes primary CTA to 'Confirm Complete' and shows 'Report Issue' as secondary
  - Tapping 'Confirm Complete' opens Confirm Completion modal (SCR-CUST-018)
  - Completed state shows review prompt if not yet reviewed, with 'Leave Review' CTA navigating to SCR-SHARED-017
  - Completed_rebook_cta state shows 'Rebook' as primary CTA navigating to Rebook Shortcut (SCR-CUST-023)
  - Cancelled state shows cancelled status badge with no modify actions; only Timeline and Report Issue available
  - No-show state shows no-show status badge with Timeline and Report Issue available
  - Escrow states (pending, held, released) are optional Phase 3+ and show appropriate escrow status indicators
  - Payment settlement note is always visible in Phase 0-2 (direct settlement)
  - Tapping tasker avatar navigates to Tasker Public Profile (SCR-CUST-013)
  - Tapping 'Message' navigates to Chat Detail (SCR-SHARED-011)
  - Tapping 'Reschedule' navigates to Reschedule screen (SCR-CUST-020)
  - Tapping 'Cancel Booking' opens Booking Cancel modal (SCR-CUST-022)
  - Tapping 'Report Issue' navigates to Dispute Raise (SCR-CUST-024)
  - Tapping 'View Timeline' navigates to Booking Timeline (SCR-CUST-019)
  - No-show flag trigger is handled via modal (SCR-CUST-021) when conditions met per PRD Section 6.4.3
  - All copy renders correctly in Mongolian Cyrillic at 16px minimum body size
  - Network error shows error toast with retry action
api_endpoints:
  - method: GET
    path: /bookings/:id
    purpose: Fetch booking detail including tasker profile, task summary, schedule, status, and timeline preview
analytics_events:
  - event: booking_detail_viewed
    trigger: Screen becomes visible with booking data loaded
  - event: booking_detail_message_tapped
    trigger: User taps 'Message' to open chat with tasker
  - event: booking_detail_confirm_complete_tapped
    trigger: User taps 'Confirm Complete' when tasker marked done
  - event: booking_detail_rebook_tapped
    trigger: User taps 'Rebook' on a completed booking
  - event: booking_detail_reschedule_tapped
    trigger: User taps 'Reschedule'
  - event: booking_detail_cancel_tapped
    trigger: User taps 'Cancel Booking'
  - event: booking_detail_report_issue_tapped
    trigger: User taps 'Report Issue'
  - event: booking_detail_timeline_tapped
    trigger: User taps 'View Timeline'
  - event: booking_detail_tasker_profile_tapped
    trigger: User taps tasker avatar/name to view profile
  - event: booking_detail_escrow_pay_tapped
    trigger: 'Phase 3+: user taps ''Pay with Escrow'''
