screen_id: SCR-CUST-017
name: Booking Detail (Customer)
role:
  - customer
phase: 0-1
template: detail
route: /(customer)/bookings/:bookingId
context_refs:
  global: prompts/global-context.yaml
  journeys:
    - prompts/journeys/JRN-CUST-04.yaml
    - prompts/journeys/JRN-CUST-05.yaml
    - prompts/journeys/JRN-CUST-06.yaml
stitch_prompt: >-
  Design a mobile app screen for "Booking Detail (Customer)" (SCR-CUST-017) in the Tasky app — Mongolia's domestic
  service marketplace.

  This screen is used by Customer role.

  Template: detail — Navigation header at top, scrollable content area, sticky bottom CTA bar for primary action.

  Layout structure: safe_area -> nav_header(back + title) -> scrollview(tasker_section + task_summary + schedule +
  actions) -> sticky_bottom_cta

  Components used:
    • COMP-PROFILEAVATAR (lg): Tasker avatar with verification badge in the hero section
    • COMP-STATUSBADGE (assigned): Booking status badge displayed prominently below the tasker info
    • COMP-BUTTON (primary): Primary CTA in sticky bottom bar; changes per state (Message, Confirm Complete, Rebook, Report Issue)
    • COMP-LOADINGSKELETON (detail): Detail skeleton placeholder during initial data fetch
    • COMP-TOAST (error): Error toast on network failure
    • COMP-TIMELINEEVENT (current): Quick timeline preview showing latest booking event; tappable to view full timeline
  This screen has 12 states — generate the primary/default state:
    Primary state: First load; detail skeleton shown while GET /bookings/:id is in progress
  Key copy (Mongolian primary):
    • page_title: "Захиалгын дэлгэрэнгүй" (Booking Detail)
    • section_tasker: "Гүйцэтгэгч" (Tasker)
    • section_task_summary: "Даалгаврын товч" (Task Summary)
    • section_schedule: "Товлосон цаг" (Scheduled Time)
    • section_location: "Байршил" (Location)
    • section_budget: "Төсөв" (Budget)
  Style: Deep blue (#1B3A5C) primary, gold (#C49A3C) accents, off-white (#F9F8F5) background. Manrope for headings, Plus
  Jakarta Sans for body. 16px minimum body text. Clean, professional, premium feel. Mongolian Cyrillic text.
layout:
  template: detail
  density: default
  structure: >-
    safe_area -> nav_header(back + title) -> scrollview(tasker_section + task_summary + schedule + actions) ->
    sticky_bottom_cta
components:
  - component: COMP-PROFILEAVATAR
    variant: lg
    usage: Tasker avatar with verification badge in the hero section
  - component: COMP-STATUSBADGE
    variant: assigned
    usage: Booking status badge displayed prominently below the tasker info
  - component: COMP-BUTTON
    variant: primary
    usage: Primary CTA in sticky bottom bar; changes per state (Message, Confirm Complete, Rebook, Report Issue)
  - component: COMP-LOADINGSKELETON
    variant: detail
    usage: Detail skeleton placeholder during initial data fetch
  - component: COMP-TOAST
    variant: error
    usage: Error toast on network failure
  - component: COMP-TIMELINEEVENT
    variant: current
    usage: Quick timeline preview showing latest booking event; tappable to view full timeline
states:
  - id: loading_initial
    description: First load; detail skeleton shown while GET /bookings/:id is in progress
    visible:
      - COMP-LOADINGSKELETON
    hidden:
      - COMP-PROFILEAVATAR
      - COMP-STATUSBADGE
      - COMP-BUTTON
      - COMP-TIMELINEEVENT
      - COMP-TOAST
  - id: assigned
    description: >-
      Booking is ASSIGNED; tasker info, task summary, schedule, and action buttons visible. CTA bar shows 'Message' and
      secondary actions (Reschedule, Cancel, Timeline)
    visible:
      - COMP-PROFILEAVATAR
      - COMP-STATUSBADGE
      - COMP-BUTTON
      - COMP-TIMELINEEVENT
    hidden:
      - COMP-LOADINGSKELETON
      - COMP-TOAST
  - id: assigned_approaching
    description: >-
      Booking is ASSIGNED and scheduled time is within 4 hours; late-cancel warning context shown, reschedule still
      available
    visible:
      - COMP-PROFILEAVATAR
      - COMP-STATUSBADGE
      - COMP-BUTTON
      - COMP-TIMELINEEVENT
    hidden:
      - COMP-LOADINGSKELETON
      - COMP-TOAST
  - id: tasker_marked_done
    description: Tasker has marked the job done; primary CTA changes to 'Confirm Complete'. Report Issue action also available
    visible:
      - COMP-PROFILEAVATAR
      - COMP-STATUSBADGE
      - COMP-BUTTON
      - COMP-TIMELINEEVENT
    hidden:
      - COMP-LOADINGSKELETON
      - COMP-TOAST
  - id: completed
    description: 'Booking is COMPLETED; review prompt shown if not yet reviewed. Actions: Leave Review, View Timeline'
    visible:
      - COMP-PROFILEAVATAR
      - COMP-STATUSBADGE
      - COMP-BUTTON
      - COMP-TIMELINEEVENT
    hidden:
      - COMP-LOADINGSKELETON
      - COMP-TOAST
  - id: completed_rebook_cta
    description: Booking is COMPLETED and review is submitted; Rebook CTA becomes primary action
    visible:
      - COMP-PROFILEAVATAR
      - COMP-STATUSBADGE
      - COMP-BUTTON
      - COMP-TIMELINEEVENT
    hidden:
      - COMP-LOADINGSKELETON
      - COMP-TOAST
  - id: cancelled
    description: Booking is CANCELLED; status badge shows cancelled, no further actions except View Timeline and Report Issue
    visible:
      - COMP-PROFILEAVATAR
      - COMP-STATUSBADGE
      - COMP-TIMELINEEVENT
    hidden:
      - COMP-LOADINGSKELETON
      - COMP-TOAST
  - id: no_show
    description: Booking ended in NO_SHOW; status badge shows no-show, timeline visible, Report Issue available
    visible:
      - COMP-PROFILEAVATAR
      - COMP-STATUSBADGE
      - COMP-TIMELINEEVENT
    hidden:
      - COMP-LOADINGSKELETON
      - COMP-TOAST
  - id: escrow_pending
    description: 'Phase 3+ optional: escrow payment initiated but not yet confirmed; escrow status indicator shown'
    visible:
      - COMP-PROFILEAVATAR
      - COMP-STATUSBADGE
      - COMP-BUTTON
      - COMP-TIMELINEEVENT
    hidden:
      - COMP-LOADINGSKELETON
      - COMP-TOAST
  - id: escrow_held
    description: 'Phase 3+ optional: escrow deposit is held by platform; release info visible'
    visible:
      - COMP-PROFILEAVATAR
      - COMP-STATUSBADGE
      - COMP-BUTTON
      - COMP-TIMELINEEVENT
    hidden:
      - COMP-LOADINGSKELETON
      - COMP-TOAST
  - id: escrow_released
    description: 'Phase 3+ optional: escrow funds released to tasker after completion confirmation'
    visible:
      - COMP-PROFILEAVATAR
      - COMP-STATUSBADGE
      - COMP-TIMELINEEVENT
    hidden:
      - COMP-LOADINGSKELETON
      - COMP-TOAST
  - id: error_network
    description: Network error on data fetch; error toast with retry
    visible:
      - COMP-TOAST
    hidden:
      - COMP-PROFILEAVATAR
      - COMP-STATUSBADGE
      - COMP-BUTTON
      - COMP-TIMELINEEVENT
      - COMP-LOADINGSKELETON
