screen_id: SCR-TASK-017
name: Lead Unlock — Accept/Decline
role:
  - tasker
phase: '2'
template: modal_sheet
route: null
context_refs:
  global: prompts/global-context.yaml
  journeys:
    - prompts/journeys/JRN-TASK-03.yaml
stitch_prompt: >-
  Design a mobile app screen for "Lead Unlock — Accept/Decline" (SCR-TASK-017) in the Tasky app — Mongolia's domestic
  service marketplace.

  This screen is used by Tasker role.

  Template: modal_sheet — Bottom sheet overlay with drag handle bar, content area, and max 2 action buttons. Branded
  scrim backdrop.

  Layout structure: scrim -> sheet(handle_bar + title + lead_details + credit_cost + balance_display + timer +
  action_buttons)

  Components used:
    • COMP-MODALSHEET (default): Bottom sheet for lead unlock accept/decline flow with credit deduction
    • COMP-BUTTON (primary): Primary CTA to accept the lead and spend credits
    • COMP-BUTTON (outline): Secondary CTA to decline the lead without spending credits
    • COMP-BUTTON (primary): CTA shown when credits are insufficient — redirect to purchase
    • COMP-CREDITBALANCE (inline): Inline credit balance display showing current balance and cost to unlock
    • COMP-PROFILEAVATAR (md): Customer avatar shown in lead notification (blurred or partial until unlock)
  This screen has 6 states — generate the primary/default state:
    Primary state: Lead notification received — task summary, credit cost, balance, and 15-min countdown timer displayed
  Key copy (Mongolian primary):
    • notification_heading: "Захиалагч таныг сонголоо!" (A customer selected you!)
    • task_summary_label: "Даалгавар" (Task)
    • credit_cost_label: "Кредит зарцуулалт" (Credit Cost)
    • credit_cost_value: "{cost} кредит" ({cost} credit(s))
    • credit_balance_label: "Таны үлдэгдэл" (Your Balance)
    • credit_balance_value: "{balance} кредит" ({balance} credit(s))
  Style: Deep blue (#1B3A5C) primary, gold (#C49A3C) accents, off-white (#F9F8F5) background. Manrope for headings, Plus
  Jakarta Sans for body. 16px minimum body text. Clean, professional, premium feel. Mongolian Cyrillic text.
layout:
  template: modal_sheet
  density: default
  structure: scrim -> sheet(handle_bar + title + lead_details + credit_cost + balance_display + timer + action_buttons)
components:
  - component: COMP-MODALSHEET
    variant: default
    usage: Bottom sheet for lead unlock accept/decline flow with credit deduction
  - component: COMP-BUTTON
    variant: primary
    usage: Primary CTA to accept the lead and spend credits
  - component: COMP-BUTTON
    variant: outline
    usage: Secondary CTA to decline the lead without spending credits
  - component: COMP-BUTTON
    variant: primary
    usage: CTA shown when credits are insufficient — redirect to purchase
  - component: COMP-CREDITBALANCE
    variant: inline
    usage: Inline credit balance display showing current balance and cost to unlock
  - component: COMP-PROFILEAVATAR
    variant: md
    usage: Customer avatar shown in lead notification (blurred or partial until unlock)
states:
  - id: notification_received
    description: Lead notification received — task summary, credit cost, balance, and 15-min countdown timer displayed
    visible:
      - handle_bar
      - notification_heading
      - task_summary
      - credit_cost
      - credit_balance
      - countdown_timer
      - accept_button
      - decline_button
    hidden:
      - accepting_spinner
      - success_content
      - insufficient_content
      - expired_content
  - id: accepting
    description: Accept in progress — credits being deducted via API
    visible:
      - handle_bar
      - notification_heading
      - accepting_spinner
      - accepting_message
    hidden:
      - accept_button
      - decline_button
      - credit_cost
      - countdown_timer
      - success_content
      - insufficient_content
  - id: accepted_credits_deducted
    description: Lead accepted — credits deducted, customer contact info unlocked
    visible:
      - handle_bar
      - success_icon
      - accepted_heading
      - accepted_description
      - contact_info_unlocked
      - view_booking_button
    hidden:
      - accept_button
      - decline_button
      - accepting_spinner
      - credit_cost
      - countdown_timer
      - insufficient_content
  - id: declined
    description: Lead declined — no credits charged, confirmation shown
    visible:
      - handle_bar
      - declined_heading
      - declined_description
      - done_button
    hidden:
      - accept_button
      - decline_button
      - credit_cost
      - countdown_timer
      - success_content
      - insufficient_content
  - id: insufficient_credits
    description: Credit balance is less than lead cost — purchase redirect offered
    visible:
      - handle_bar
      - notification_heading
      - task_summary
      - credit_cost
      - insufficient_warning
      - buy_credits_button
      - decline_button
      - countdown_timer
    hidden:
      - accept_button
      - accepting_spinner
      - success_content
  - id: expired_15min
    description: 15-minute acceptance window expired — auto-declined, no credits charged
    visible:
      - handle_bar
      - expired_heading
      - expired_description
      - done_button
    hidden:
      - accept_button
      - decline_button
      - credit_cost
      - countdown_timer
      - accepting_spinner
      - success_content
      - insufficient_content
