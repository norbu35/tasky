screen_id: SCR-CUST-028
name: Task Boost Options
role:
  - customer
phase: '2'
template: detail
route: /(customer)/tasks/:taskId/boost
context_refs:
  global: prompts/global-context.yaml
  journeys:
    - prompts/journeys/JRN-CUST-09.yaml
stitch_prompt: >-
  Design a mobile app screen for "Task Boost Options" (SCR-CUST-028) in the Tasky app — Mongolia's domestic service
  marketplace.

  This screen is used by Customer role.

  Template: detail — Navigation header at top, scrollable content area, sticky bottom CTA bar for primary action.

  Layout structure: safe_area -> nav_header(back + title) -> scrollview(task_summary + boost_cards + rules_notice) ->
  sticky_bottom_cta

  Components used:
    • COMP-CARD (elevated): Task summary card and two boost option cards for Promoted and Urgent
    • COMP-STATUSBADGE (open): Inline label indicating selected boost type or already-active status
    • COMP-BUTTON (primary): Primary CTA to continue to payment for the selected boost
    • COMP-BUTTON (ghost): Secondary CTA to go back to task detail
    • COMP-LOADINGSKELETON (detail): Skeleton for task summary and boost cards while options load
    • COMP-EMPTYSTATE (no_results): Already-active or unavailable state when another overlapping boost cannot be purchased
  This screen has 6 states — generate the primary/default state:
    Primary state: Boost options and current task visibility state are loading
  Key copy (Mongolian primary):
    • nav_title: "Даалгаврын boost" (Task Boost)
    • promoted_name: "Онцлох" (Promoted)
    • urgent_name: "Яаралтай" (Urgent)
    • promoted_price: "₮15,000 / 7 хоног" (₮15,000 / 7 days)
    • urgent_price: "₮25,000 / 3 хоног" (₮25,000 / 3 days)
    • cta_continue: "Төлбөр рүү үргэлжлүүлэх" (Continue to payment)
  Style: Deep blue (#1B3A5C) primary, gold (#C49A3C) accents, off-white (#F9F8F5) background. Manrope for headings, Plus
  Jakarta Sans for body. 16px minimum body text. Clean, professional, premium feel. Mongolian Cyrillic text.
layout:
  template: detail
  density: default
  structure: safe_area -> nav_header(back + title) -> scrollview(task_summary + boost_cards + rules_notice) -> sticky_bottom_cta
components:
  - component: COMP-CARD
    variant: elevated
    usage: Task summary card and two boost option cards for Promoted and Urgent
  - component: COMP-STATUSBADGE
    variant: open
    usage: Inline label indicating selected boost type or already-active status
  - component: COMP-BUTTON
    variant: primary
    usage: Primary CTA to continue to payment for the selected boost
  - component: COMP-BUTTON
    variant: ghost
    usage: Secondary CTA to go back to task detail
  - component: COMP-LOADINGSKELETON
    variant: detail
    usage: Skeleton for task summary and boost cards while options load
  - component: COMP-EMPTYSTATE
    variant: no_results
    usage: Already-active or unavailable state when another overlapping boost cannot be purchased
states:
  - id: loading_initial
    description: Boost options and current task visibility state are loading
    visible:
      - COMP-LOADINGSKELETON
    hidden:
      - COMP-CARD
      - COMP-STATUSBADGE
      - COMP-BUTTON
      - COMP-EMPTYSTATE
  - id: options_available
    description: Both promoted and urgent options are shown with price, duration, and ranking effect
    visible:
      - COMP-CARD
      - COMP-BUTTON.primary
      - COMP-BUTTON.ghost
    hidden:
      - COMP-LOADINGSKELETON
      - COMP-EMPTYSTATE
  - id: promoted_selected
    description: Promoted option is selected and queued for payment
    visible:
      - COMP-CARD
      - COMP-STATUSBADGE
      - COMP-BUTTON.primary
      - COMP-BUTTON.ghost
    hidden:
      - COMP-LOADINGSKELETON
      - COMP-EMPTYSTATE
  - id: urgent_selected
    description: Urgent option is selected and queued for payment
    visible:
      - COMP-CARD
      - COMP-STATUSBADGE
      - COMP-BUTTON.primary
      - COMP-BUTTON.ghost
    hidden:
      - COMP-LOADINGSKELETON
      - COMP-EMPTYSTATE
  - id: already_active
    description: Task already has an active promoted or urgent boost and duplicate overlap is blocked
    visible:
      - COMP-EMPTYSTATE
      - COMP-BUTTON.ghost
    hidden:
      - COMP-LOADINGSKELETON
      - COMP-CARD
      - COMP-STATUSBADGE
      - COMP-BUTTON.primary
  - id: error_network
    description: Boost options failed to load
    visible:
      - COMP-EMPTYSTATE.error
      - COMP-BUTTON.ghost
    hidden:
      - COMP-LOADINGSKELETON
      - COMP-CARD
      - COMP-STATUSBADGE
      - COMP-BUTTON.primary
copy:
  - key: nav_title
    mn: Даалгаврын boost
    en: Task Boost
  - key: promoted_name
    mn: Онцлох
    en: Promoted
  - key: urgent_name
    mn: Яаралтай
    en: Urgent
  - key: promoted_price
    mn: ₮15,000 / 7 хоног
    en: ₮15,000 / 7 days
  - key: urgent_price
    mn: ₮25,000 / 3 хоног
    en: ₮25,000 / 3 days
  - key: cta_continue
    mn: Төлбөр рүү үргэлжлүүлэх
    en: Continue to payment
  - key: overlap_notice
    mn: Нэг даалгаварт нэгэн зэрэг давхцсан boost идэвхжүүлэх боломжгүй
    en: Only one overlapping boost can be active per task
acceptance_criteria:
  - Both visibility products are feature-gated behind promoted_listings_enabled
  - Promoted option shows 7-day duration and 'Онцлох' feed labeling effect
  - Urgent option shows 3-day duration and higher sort priority than promoted
  - Duplicate overlapping boosts are blocked and surfaced clearly
  - Continue CTA navigates to SCR-CUST-029 with selected boost product
  - Back button returns to SCR-CUST-009
api_endpoints:
  - method: GET
    path: /tasks/:id/boost-options
    purpose: Fetch available promoted and urgent boost products plus active boost state for a task
analytics_events:
  - event: task_boost_options_viewed
    trigger: Boost options screen loads
  - event: task_boost_promoted_selected
    trigger: Customer selects the promoted listing option
  - event: task_boost_urgent_selected
    trigger: Customer selects the urgent boost option
state_prompts:
  - state_id: loading_initial
    prompt: >-
      Generate the "loading_initial" state of "Task Boost Options".

      Boost options and current task visibility state are loading

      Visible elements: COMP-LOADINGSKELETON

      Hidden elements: COMP-CARD, COMP-STATUSBADGE, COMP-BUTTON, COMP-EMPTYSTATE

      Style: Deep blue (#1B3A5C) primary, gold (#C49A3C) accents, off-white (#F9F8F5) background. Mongolian Cyrillic
      text. 16px minimum body text.
  - state_id: options_available
    prompt: >-
      Generate the "options_available" state of "Task Boost Options".

      Both promoted and urgent options are shown with price, duration, and ranking effect

      Visible elements: COMP-CARD, COMP-BUTTON.primary, COMP-BUTTON.ghost

      Hidden elements: COMP-LOADINGSKELETON, COMP-EMPTYSTATE

      Style: Deep blue (#1B3A5C) primary, gold (#C49A3C) accents, off-white (#F9F8F5) background. Mongolian Cyrillic
      text. 16px minimum body text.
  - state_id: promoted_selected
    prompt: >-
      Generate the "promoted_selected" state of "Task Boost Options".

      Promoted option is selected and queued for payment

      Visible elements: COMP-CARD, COMP-STATUSBADGE, COMP-BUTTON.primary, COMP-BUTTON.ghost

      Hidden elements: COMP-LOADINGSKELETON, COMP-EMPTYSTATE

      Style: Deep blue (#1B3A5C) primary, gold (#C49A3C) accents, off-white (#F9F8F5) background. Mongolian Cyrillic
      text. 16px minimum body text.
  - state_id: urgent_selected
    prompt: >-
      Generate the "urgent_selected" state of "Task Boost Options".

      Urgent option is selected and queued for payment

      Visible elements: COMP-CARD, COMP-STATUSBADGE, COMP-BUTTON.primary, COMP-BUTTON.ghost

      Hidden elements: COMP-LOADINGSKELETON, COMP-EMPTYSTATE

      Style: Deep blue (#1B3A5C) primary, gold (#C49A3C) accents, off-white (#F9F8F5) background. Mongolian Cyrillic
      text. 16px minimum body text.
  - state_id: already_active
    prompt: >-
      Generate the "already_active" state of "Task Boost Options".

      Task already has an active promoted or urgent boost and duplicate overlap is blocked

      Visible elements: COMP-EMPTYSTATE, COMP-BUTTON.ghost

      Hidden elements: COMP-LOADINGSKELETON, COMP-CARD, COMP-STATUSBADGE, COMP-BUTTON.primary

      Style: Deep blue (#1B3A5C) primary, gold (#C49A3C) accents, off-white (#F9F8F5) background. Mongolian Cyrillic
      text. 16px minimum body text.
  - state_id: error_network
    prompt: >-
      Generate the "error_network" state of "Task Boost Options".

      Boost options failed to load

      Visible elements: COMP-EMPTYSTATE.error, COMP-BUTTON.ghost

      Hidden elements: COMP-LOADINGSKELETON, COMP-CARD, COMP-STATUSBADGE, COMP-BUTTON.primary

      Style: Deep blue (#1B3A5C) primary, gold (#C49A3C) accents, off-white (#F9F8F5) background. Mongolian Cyrillic
      text. 16px minimum body text.
