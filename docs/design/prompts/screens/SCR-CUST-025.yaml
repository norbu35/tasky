screen_id: SCR-CUST-025
name: Dispute — Status
role:
  - customer
phase: 0-1
template: detail
route: /(customer)/disputes/:disputeId
context_refs:
  global: prompts/global-context.yaml
  journeys:
    - prompts/journeys/JRN-CUST-06.yaml
stitch_prompt: >-
  Design a mobile app screen for "Dispute — Status" (SCR-CUST-025) in the Tasky app — Mongolia's domestic service
  marketplace.

  This screen is used by Customer role.

  Template: detail — Navigation header at top, scrollable content area, sticky bottom CTA bar for primary action.

  Layout structure: safe_area -> nav_header(back + title) -> scrollview(status_header + dispute_summary + evidence_list
  + resolution_details)

  Components used:
    • COMP-STATUSBADGE (open): Prominent status badge showing current dispute state (open, escalated, resolved, closed)
    • COMP-LOADINGSKELETON (detail): Detail skeleton placeholder during initial data fetch
    • COMP-TOAST (error): Error toast on network failure
  This screen has 7 states — generate the primary/default state:
    Primary state: First load; skeleton shown while GET /disputes/:id is in progress
  Key copy (Mongolian primary):
    • page_title: "Маргааны төлөв" (Dispute Status)
    • section_status: "Төлөв" (Status)
    • section_summary: "Маргааны товч" (Dispute Summary)
    • section_evidence: "Илгээсэн нотлох баримт" (Submitted Evidence)
    • section_resolution: "Шийдвэр" (Resolution)
    • status_open: "Нээлттэй" (Open)
  Style: Deep blue (#1B3A5C) primary, gold (#C49A3C) accents, off-white (#F9F8F5) background. Manrope for headings, Plus
  Jakarta Sans for body. 16px minimum body text. Clean, professional, premium feel. Mongolian Cyrillic text.
layout:
  template: detail
  density: default
  structure: >-
    safe_area -> nav_header(back + title) -> scrollview(status_header + dispute_summary + evidence_list +
    resolution_details)
components:
  - component: COMP-STATUSBADGE
    variant: open
    usage: Prominent status badge showing current dispute state (open, escalated, resolved, closed)
  - component: COMP-LOADINGSKELETON
    variant: detail
    usage: Detail skeleton placeholder during initial data fetch
  - component: COMP-TOAST
    variant: error
    usage: Error toast on network failure
states:
  - id: loading_initial
    description: First load; skeleton shown while GET /disputes/:id is in progress
    visible:
      - COMP-LOADINGSKELETON
    hidden:
      - COMP-STATUSBADGE
      - COMP-TOAST
  - id: open
    description: Dispute is open and under admin review; evidence summary visible, status badge shows 'Open'
    visible:
      - COMP-STATUSBADGE
    hidden:
      - COMP-LOADINGSKELETON
      - COMP-TOAST
  - id: escalated
    description: Dispute has been escalated by admin for further investigation; escalation note visible
    visible:
      - COMP-STATUSBADGE
    hidden:
      - COMP-LOADINGSKELETON
      - COMP-TOAST
  - id: resolved_customer
    description: Dispute resolved in favor of the customer; resolution details and outcome visible
    visible:
      - COMP-STATUSBADGE
    hidden:
      - COMP-LOADINGSKELETON
      - COMP-TOAST
  - id: resolved_tasker
    description: Dispute resolved in favor of the tasker; resolution details and outcome visible
    visible:
      - COMP-STATUSBADGE
    hidden:
      - COMP-LOADINGSKELETON
      - COMP-TOAST
  - id: closed_insufficient
    description: Dispute auto-closed due to insufficient evidence (evidence not provided within 24 hours after reminder)
    visible:
      - COMP-STATUSBADGE
    hidden:
      - COMP-LOADINGSKELETON
      - COMP-TOAST
  - id: error_network
    description: Network error on dispute data fetch; error toast with retry
    visible:
      - COMP-TOAST
    hidden:
      - COMP-STATUSBADGE
      - COMP-LOADINGSKELETON
copy:
  - key: page_title
    mn: Маргааны төлөв
    en: Dispute Status
  - key: section_status
    mn: Төлөв
    en: Status
  - key: section_summary
    mn: Маргааны товч
    en: Dispute Summary
  - key: section_evidence
    mn: Илгээсэн нотлох баримт
    en: Submitted Evidence
  - key: section_resolution
    mn: Шийдвэр
    en: Resolution
  - key: status_open
    mn: Нээлттэй
    en: Open
  - key: status_escalated
    mn: Мөрдөн шалгаж байна
    en: Escalated
  - key: status_resolved_customer
    mn: Хэрэглэгчийн талд шийдэгдсэн
    en: Resolved for Customer
  - key: status_resolved_tasker
    mn: Гүйцэтгэгчийн талд шийдэгдсэн
    en: Resolved for Tasker
  - key: status_closed_insufficient
    mn: Нотлох баримт хангалтгүй — хаагдсан
    en: Closed — Insufficient Evidence
  - key: open_description
    mn: Таны маргаан админы хянаж байна. Шийдвэр гарахад мэдэгдэл авна.
    en: Your dispute is under admin review. You will be notified when a decision is made.
  - key: escalated_description
    mn: Маргааныг нэмэлт шалгалтад шилжүүлсэн. Удахгүй хариу өгнө.
    en: Dispute has been escalated for further investigation. A response will follow.
  - key: resolved_customer_description
    mn: Маргаан таны талд шийдэгдлээ. Нөгөө талд зөрчлийн тэмдэглэл хийгдсэн.
    en: Dispute resolved in your favor. A misconduct note has been added to the other party.
  - key: resolved_tasker_description
    mn: Маргаан гүйцэтгэгчийн талд шийдэгдлээ.
    en: Dispute resolved in favor of the Tasker.
  - key: closed_insufficient_description
    mn: Нотлох баримт 24 цагийн дотор ирүүлээгүй тул маргаан хаагдлаа.
    en: Dispute closed because evidence was not provided within 24 hours.
  - key: phase1_note
    mn: Маргаан нь зөвхөн зуучлалын шинжтэй. Мөнгөн нөхөн төлбөр олгогдохгүй.
    en: Disputes are evidence-only mediation. No monetary compensation is issued.
  - key: error_toast
    mn: Маргааны мэдээлэл ачааллахад алдаа гарлаа
    en: Failed to load dispute details
acceptance_criteria:
  - Initial load shows detail skeleton matching content layout
  - Open state shows dispute summary, submitted evidence, and 'under review' messaging
  - Escalated state shows escalation note with 'further investigation' messaging
  - >-
    Resolved states show resolution details: resolved for customer shows misconduct note acknowledgment; resolved for
    tasker shows outcome
  - Closed insufficient state explains the 24-hour evidence deadline per PRD Section 6.4.6 and REQ-SAFE-10
  - 'Phase 1 mediation note is always visible: disputes are evidence-only, no monetary compensation per REQ-SAFE-03'
  - Submitted evidence (photos, chat excerpts, text) is displayed read-only
  - Back button navigates via pop to Booking Detail (SCR-CUST-017)
  - Deep link from dispute_update push notification lands on this screen
  - Network error shows error toast with retry
  - All copy renders correctly in Mongolian Cyrillic at 16px minimum body size
api_endpoints:
  - method: GET
    path: /disputes/:id
    purpose: Fetch dispute details including status, evidence, and resolution outcome
analytics_events:
  - event: dispute_status_viewed
    trigger: Screen becomes visible with dispute data loaded
  - event: dispute_status_refreshed
    trigger: User pulls to refresh dispute status
state_prompts:
  - state_id: loading_initial
    prompt: >-
      Generate the "loading_initial" state of "Dispute — Status".

      First load; skeleton shown while GET /disputes/:id is in progress

      Visible elements: COMP-LOADINGSKELETON

      Hidden elements: COMP-STATUSBADGE, COMP-TOAST

      Style: Deep blue (#1B3A5C) primary, gold (#C49A3C) accents, off-white (#F9F8F5) background. Mongolian Cyrillic
      text. 16px minimum body text.
  - state_id: open
    prompt: >-
      Generate the "open" state of "Dispute — Status".

      Dispute is open and under admin review; evidence summary visible, status badge shows 'Open'

      Visible elements: COMP-STATUSBADGE

      Hidden elements: COMP-LOADINGSKELETON, COMP-TOAST

      Style: Deep blue (#1B3A5C) primary, gold (#C49A3C) accents, off-white (#F9F8F5) background. Mongolian Cyrillic
      text. 16px minimum body text.
  - state_id: escalated
    prompt: >-
      Generate the "escalated" state of "Dispute — Status".

      Dispute has been escalated by admin for further investigation; escalation note visible

      Visible elements: COMP-STATUSBADGE

      Hidden elements: COMP-LOADINGSKELETON, COMP-TOAST

      Style: Deep blue (#1B3A5C) primary, gold (#C49A3C) accents, off-white (#F9F8F5) background. Mongolian Cyrillic
      text. 16px minimum body text.
  - state_id: resolved_customer
    prompt: >-
      Generate the "resolved_customer" state of "Dispute — Status".

      Dispute resolved in favor of the customer; resolution details and outcome visible

      Visible elements: COMP-STATUSBADGE

      Hidden elements: COMP-LOADINGSKELETON, COMP-TOAST

      Style: Deep blue (#1B3A5C) primary, gold (#C49A3C) accents, off-white (#F9F8F5) background. Mongolian Cyrillic
      text. 16px minimum body text.
  - state_id: resolved_tasker
    prompt: >-
      Generate the "resolved_tasker" state of "Dispute — Status".

      Dispute resolved in favor of the tasker; resolution details and outcome visible

      Visible elements: COMP-STATUSBADGE

      Hidden elements: COMP-LOADINGSKELETON, COMP-TOAST

      Style: Deep blue (#1B3A5C) primary, gold (#C49A3C) accents, off-white (#F9F8F5) background. Mongolian Cyrillic
      text. 16px minimum body text.
  - state_id: closed_insufficient
    prompt: >-
      Generate the "closed_insufficient" state of "Dispute — Status".

      Dispute auto-closed due to insufficient evidence (evidence not provided within 24 hours after reminder)

      Visible elements: COMP-STATUSBADGE

      Hidden elements: COMP-LOADINGSKELETON, COMP-TOAST

      Style: Deep blue (#1B3A5C) primary, gold (#C49A3C) accents, off-white (#F9F8F5) background. Mongolian Cyrillic
      text. 16px minimum body text.
  - state_id: error_network
