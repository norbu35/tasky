screen_id: SCR-TASK-005
name: Verification — ID Upload
role:
  - tasker
phase: 0-1
template: form_wizard
route: /(tasker)/verification/upload
context_refs:
  global: prompts/global-context.yaml
  journeys:
    - prompts/journeys/JRN-TASK-01.yaml
stitch_prompt: >-
  Design a mobile app screen for "Verification — ID Upload" (SCR-TASK-005) in the Tasky app — Mongolia's domestic
  service marketplace.

  This screen is used by Tasker role.

  Template: form_wizard — Step indicator showing progress, scrollable form fields, back/next navigation at bottom.
  Keyboard-aware scrolling.

  Layout structure: safe_area -> nav_header(back + title) -> step_indicator(3 steps) -> scrollview(upload_area + preview
  + instructions) -> bottom_nav(back_button + next_button)

  Components used:
    • COMP-STEPINDICATOR (horizontal): 3-step progress indicator: 1) ID Front, 2) ID Back, 3) Selfie
    • COMP-PHOTOPICKER (default): Camera capture area for each upload step — ID front, ID back, selfie
    • COMP-BUTTON (primary): Primary CTA — 'Next' to proceed to next upload step or 'Submit' on final review
    • COMP-BUTTON (outline): Secondary back button to return to previous step
    • COMP-BUTTON (secondary): Danger button to retake a photo on the review step
    • COMP-LOADINGSKELETON (detail): Upload progress indicator while photo is being uploaded to presigned URL
  This screen has 9 states — generate the primary/default state:
    Primary state: Step 1 — ID front photo not yet captured; camera prompt displayed
  Key copy (Mongolian primary):
    • page_title: "Баталгаажуулалт" (Verification)
    • step_front_label: "Урд тал" (Front)
    • step_back_label: "Ар тал" (Back)
    • step_selfie_label: "Амьд зураг" (Selfie)
    • front_instruction_heading: "Иргэний үнэмлэхний урд талыг зурагла" (Photograph the front of your ID card)
    • front_instruction_detail: "Бүх мэдээлэл тод харагдахаар гэрэлтэй газар зурагла" (Take photo in good lighting so all details are clear)
  Style: Deep blue (#1B3A5C) primary, gold (#C49A3C) accents, off-white (#F9F8F5) background. Manrope for headings, Plus
  Jakarta Sans for body. 16px minimum body text. Clean, professional, premium feel. Mongolian Cyrillic text.
layout:
  template: form_wizard
  density: default
  structure: >-
    safe_area -> nav_header(back + title) -> step_indicator(3 steps) -> scrollview(upload_area + preview + instructions)
    -> bottom_nav(back_button + next_button)
components:
  - component: COMP-STEPINDICATOR
    variant: horizontal
    usage: '3-step progress indicator: 1) ID Front, 2) ID Back, 3) Selfie'
  - component: COMP-PHOTOPICKER
    variant: default
    usage: Camera capture area for each upload step — ID front, ID back, selfie
  - component: COMP-BUTTON
    variant: primary
    usage: Primary CTA — 'Next' to proceed to next upload step or 'Submit' on final review
  - component: COMP-BUTTON
    variant: outline
    usage: Secondary back button to return to previous step
  - component: COMP-BUTTON
    variant: secondary
    usage: Danger button to retake a photo on the review step
  - component: COMP-LOADINGSKELETON
    variant: detail
    usage: Upload progress indicator while photo is being uploaded to presigned URL
states:
  - id: front_upload_empty
    description: Step 1 — ID front photo not yet captured; camera prompt displayed
    visible:
      - nav_header
      - step_indicator_step1
      - camera_prompt_front
      - instructions_front
      - next_button_disabled
    hidden:
      - front_preview
      - back_upload
      - selfie_upload
      - review_section
      - uploading_indicator
  - id: front_upload_captured
    description: Step 1 — ID front photo captured and previewed; next button enabled
    visible:
      - nav_header
      - step_indicator_step1
      - front_preview
      - retake_button
      - next_button_enabled
    hidden:
      - camera_prompt_front
      - back_upload
      - selfie_upload
      - review_section
      - uploading_indicator
  - id: back_upload_empty
    description: Step 2 — ID back photo not yet captured; camera prompt displayed
    visible:
      - nav_header
      - step_indicator_step2
      - camera_prompt_back
      - instructions_back
      - back_button
      - next_button_disabled
    hidden:
      - front_upload
      - back_preview
      - selfie_upload
      - review_section
      - uploading_indicator
  - id: back_upload_captured
    description: Step 2 — ID back photo captured and previewed; next button enabled
    visible:
      - nav_header
      - step_indicator_step2
      - back_preview
      - retake_button
      - back_button
      - next_button_enabled
    hidden:
      - camera_prompt_back
      - front_upload
      - selfie_upload
      - review_section
      - uploading_indicator
  - id: selfie_upload_empty
    description: Step 3 — Selfie not yet captured; front-camera prompt with face outline guide
    visible:
      - nav_header
      - step_indicator_step3
      - camera_prompt_selfie
      - instructions_selfie
      - back_button
      - next_button_disabled
    hidden:
      - front_upload
      - back_upload
      - selfie_preview
      - review_section
      - uploading_indicator
  - id: selfie_upload_captured
    description: Step 3 — Selfie captured and previewed; next button enabled to proceed to review
    visible:
      - nav_header
      - step_indicator_step3
      - selfie_preview
      - retake_button
      - back_button
      - next_button_enabled
    hidden:
      - camera_prompt_selfie
      - front_upload
      - back_upload
      - review_section
      - uploading_indicator
  - id: uploading
    description: All 3 photos are being uploaded to presigned URLs — progress indicator shown
    visible:
      - nav_header
      - step_indicator_complete
      - uploading_indicator
      - uploading_message
    hidden:
      - camera_prompts
      - review_section
      - next_button
      - back_button
  - id: review_all_three
    description: All 3 photos uploaded — review thumbnails of ID front, back, and selfie before final submit
    visible:
      - nav_header
      - step_indicator_complete
      - front_thumbnail
      - back_thumbnail
      - selfie_thumbnail
      - retake_buttons
      - submit_button
    hidden:
      - camera_prompts
      - uploading_indicator
  - id: upload_error
    description: Upload failed for one or more photos — error message with retry
    visible:
      - nav_header
      - step_indicator
      - error_message
      - retry_button
    hidden:
      - camera_prompts
      - uploading_indicator
      - review_section
