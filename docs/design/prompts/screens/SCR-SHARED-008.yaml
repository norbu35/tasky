screen_id: SCR-SHARED-008
name: Permission Primer — Location
role:
  - customer
  - tasker
phase: 0-1
template: modal_sheet
route: /onboarding/permission-location
context_refs:
  global: prompts/global-context.yaml
  journeys:
    - prompts/journeys/JRN-SHARED-01.yaml
stitch_prompt: >-
  Design a mobile app screen for "Permission Primer — Location" (SCR-SHARED-008) in the Tasky app — Mongolia's domestic
  service marketplace.

  This screen is used by both Customer and Tasker roles.

  Template: modal_sheet — Bottom sheet overlay with drag handle bar, content area, and max 2 action buttons. Branded
  scrim backdrop.

  Layout structure: scrim -> sheet(handle_bar + icon + heading + description + primary_action + secondary_action)

  Components used:
    • COMP-MODALSHEET (default): Bottom sheet explaining why location permission is needed
    • COMP-BUTTON (primary): Primary CTA to trigger the OS location permission dialog
    • COMP-BUTTON (ghost): Secondary action to skip location permission
  This screen has 3 states — generate the primary/default state:
    Primary state: Permission primer shown explaining why location access is needed
  Key copy (Mongolian primary):
    • heading: "Байршлын зөвшөөрөл" (Location Permission)
    • description: "Ойролцоох даалгавруудыг харуулах, байршил тодорхойлоход хэрэгтэй" (Needed to show nearby tasks and set task location)
    • allow_button_label: "Зөвшөөрөх" (Allow)
    • skip_label: "Дараа хийх" (Do it later)
    • granted_message: "Байршил зөвшөөрөгдлөө" (Location access granted)
    • denied_message: "Байршлын зөвшөөрөл хаагдсан" (Location permission denied)
  Style: Deep blue (#1B3A5C) primary, gold (#C49A3C) accents, off-white (#F9F8F5) background. Manrope for headings, Plus
  Jakarta Sans for body. 16px minimum body text. Clean, professional, premium feel. Mongolian Cyrillic text.
layout:
  template: modal_sheet
  density: comfortable
  structure: scrim -> sheet(handle_bar + icon + heading + description + primary_action + secondary_action)
components:
  - component: COMP-MODALSHEET
    variant: default
    usage: Bottom sheet explaining why location permission is needed
  - component: COMP-BUTTON
    variant: primary
    usage: Primary CTA to trigger the OS location permission dialog
  - component: COMP-BUTTON
    variant: ghost
    usage: Secondary action to skip location permission
states:
  - id: default
    description: Permission primer shown explaining why location access is needed
    visible:
      - location_icon
      - heading
      - description
      - allow_button
      - skip_link
    hidden:
      - granted_message
      - denied_message
  - id: granted
    description: Location permission granted by the OS; screen auto-advances
    visible:
      - location_icon
      - granted_message
    hidden:
      - heading
      - description
      - allow_button
      - skip_link
      - denied_message
  - id: denied
    description: Location permission denied by the OS; fallback guidance shown
    visible:
      - location_icon
      - denied_message
      - settings_hint
      - continue_button
    hidden:
      - heading
      - description
      - allow_button
      - skip_link
      - granted_message
copy:
  - key: heading
    mn: Байршлын зөвшөөрөл
    en: Location Permission
  - key: description
    mn: Ойролцоох даалгавруудыг харуулах, байршил тодорхойлоход хэрэгтэй
    en: Needed to show nearby tasks and set task location
  - key: allow_button_label
    mn: Зөвшөөрөх
    en: Allow
  - key: skip_label
    mn: Дараа хийх
    en: Do it later
  - key: granted_message
    mn: Байршил зөвшөөрөгдлөө
    en: Location access granted
  - key: denied_message
    mn: Байршлын зөвшөөрөл хаагдсан
    en: Location permission denied
  - key: settings_hint
    mn: Тохиргооноос байршлыг нээх боломжтой
    en: You can enable location in Settings
  - key: continue_label
    mn: Үргэлжлүүлэх
    en: Continue
acceptance_criteria:
  - Bottom sheet displays location icon, explanation heading, and description
  - Allow button triggers the OS native location permission dialog
  - If granted, screen auto-advances to Permission Primer Notifications (SCR-SHARED-009)
  - If denied, fallback message shows with a hint to open device Settings
  - Skip link allows user to proceed without granting permission
  - Skipping also advances to Permission Primer Notifications (SCR-SHARED-009)
  - Sheet has drag handle but is not dismissible by dragging (onboarding context)
  - No API calls are made on this screen
  - Location is essential for Tasker feed proximity filtering and Customer task pinning
api_endpoints: []
analytics_events:
  - event: permission_primer_location_viewed
    trigger: Location permission primer becomes visible
  - event: permission_location_allow_tapped
    trigger: User taps Allow button
  - event: permission_location_granted
    trigger: OS returns granted status for location
  - event: permission_location_denied
    trigger: OS returns denied status for location
  - event: permission_location_skipped
    trigger: User taps 'Do it later'
state_prompts:
  - state_id: default
    prompt: >-
      Generate the "default" state of "Permission Primer — Location".

      Permission primer shown explaining why location access is needed

      Visible elements: location_icon, heading, description, allow_button, skip_link

      Hidden elements: granted_message, denied_message

      Style: Deep blue (#1B3A5C) primary, gold (#C49A3C) accents, off-white (#F9F8F5) background. Mongolian Cyrillic
      text. 16px minimum body text.
  - state_id: granted
    prompt: >-
      Generate the "granted" state of "Permission Primer — Location".

      Location permission granted by the OS; screen auto-advances

      Visible elements: location_icon, granted_message

      Hidden elements: heading, description, allow_button, skip_link, denied_message

      Style: Deep blue (#1B3A5C) primary, gold (#C49A3C) accents, off-white (#F9F8F5) background. Mongolian Cyrillic
      text. 16px minimum body text.
  - state_id: denied
    prompt: >-
      Generate the "denied" state of "Permission Primer — Location".

      Location permission denied by the OS; fallback guidance shown

      Visible elements: location_icon, denied_message, settings_hint, continue_button

      Hidden elements: heading, description, allow_button, skip_link, granted_message

      Style: Deep blue (#1B3A5C) primary, gold (#C49A3C) accents, off-white (#F9F8F5) background. Mongolian Cyrillic
      text. 16px minimum body text.
