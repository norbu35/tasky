screen_id: SCR-CUST-011
name: Applicants List
role:
  - customer
phase: 0-1
template: feed_list
route: /(customer)/tasks/:taskId/applicants
context_refs:
  global: prompts/global-context.yaml
  journeys:
    - prompts/journeys/JRN-CUST-02.yaml
    - prompts/journeys/JRN-CUST-03.yaml
    - prompts/journeys/JRN-CUST-08.yaml
stitch_prompt: >-
  Design a mobile app screen for "Applicants List" (SCR-CUST-011) in the Tasky app — Mongolia's domestic service
  marketplace.

  This screen is used by Customer role.

  Template: feed_list — Sticky header (search bar + filter bar) above a scrollable card feed. Pull-to-refresh, infinite
  scroll pagination, skeleton loading placeholders.

  Layout structure: safe_area -> nav_header(back + title + applicant_count) -> scrollview(applicant_cards) ->
  sticky_bottom_cta(accept)

  Components used:
    • COMP-SPLITCARD (application): Applicant cards showing Tasker avatar, name, rating, review count, and verification badge; Phase 2 adds Recommended label
    • COMP-PROFILEAVATAR (md): Tasker profile avatar in each applicant card header
    • COMP-STARRATING (display): Tasker rating display (read-only) in each applicant card
    • COMP-VERIFICATIONBADGE (default): Verified identity badge on each applicant's avatar
    • COMP-BUTTON (primary): Accept button per applicant card; Phase 0-1 navigates directly to booking confirmation
    • COMP-EMPTYSTATE (no_results): Empty state when no applicants have applied yet
    • COMP-LOADINGSKELETON (card): Card-shaped skeleton placeholders during initial load
    • COMP-MODALSHEET (default): Accept confirmation sheet before navigating to booking confirmation
  This screen has 6 states — generate the primary/default state:
    Primary state: GET /tasks/:id/applications in progress; skeleton cards shown
  Key copy (Mongolian primary):
    • page_title: "Хүсэлтүүд" (Applications)
    • applicant_count_header: "{count} хүсэлт" ({count} applications)
    • recommended_label: "Санал болгох" (Recommended)
    • rating_label: "Үнэлгээ" (Rating)
    • reviews_count: "{count} сэтгэгдэл" ({count} reviews)
    • verified_label: "Баталгаажсан" (Verified)
  Style: Deep blue (#1B3A5C) primary, gold (#C49A3C) accents, off-white (#F9F8F5) background. Manrope for headings, Plus
  Jakarta Sans for body. 16px minimum body text. Clean, professional, premium feel. Mongolian Cyrillic text.
layout:
  template: feed_list
  density: default
  structure: safe_area -> nav_header(back + title + applicant_count) -> scrollview(applicant_cards) -> sticky_bottom_cta(accept)
components:
  - component: COMP-SPLITCARD
    variant: application
    usage: >-
      Applicant cards showing Tasker avatar, name, rating, review count, and verification badge; Phase 2 adds
      Recommended label
  - component: COMP-PROFILEAVATAR
    variant: md
    usage: Tasker profile avatar in each applicant card header
  - component: COMP-STARRATING
    variant: display
    usage: Tasker rating display (read-only) in each applicant card
  - component: COMP-VERIFICATIONBADGE
    variant: default
    usage: Verified identity badge on each applicant's avatar
  - component: COMP-BUTTON
    variant: primary
    usage: Accept button per applicant card; Phase 0-1 navigates directly to booking confirmation
  - component: COMP-EMPTYSTATE
    variant: no_results
    usage: Empty state when no applicants have applied yet
  - component: COMP-LOADINGSKELETON
    variant: card
    usage: Card-shaped skeleton placeholders during initial load
  - component: COMP-MODALSHEET
    variant: default
    usage: Accept confirmation sheet before navigating to booking confirmation
states:
  - id: loading_initial
    description: GET /tasks/:id/applications in progress; skeleton cards shown
    visible:
      - COMP-LOADINGSKELETON
    hidden:
      - COMP-SPLITCARD
      - COMP-EMPTYSTATE
      - COMP-BUTTON
      - COMP-MODALSHEET
  - id: empty
    description: Zero applicants; empty state with waiting message and notification promise
    visible:
      - COMP-EMPTYSTATE
    hidden:
      - COMP-SPLITCARD
      - COMP-LOADINGSKELETON
      - COMP-BUTTON
      - COMP-MODALSHEET
  - id: populated_phase01
    description: 'Phase 0-1: applicants listed in chronological order; each with Accept button'
    visible:
      - COMP-SPLITCARD
      - COMP-PROFILEAVATAR
      - COMP-STARRATING
      - COMP-VERIFICATIONBADGE
      - COMP-BUTTON
    hidden:
      - COMP-EMPTYSTATE
      - COMP-LOADINGSKELETON
      - COMP-MODALSHEET
  - id: populated_phase2_ranked
    description: 'Phase 2: applicants sorted by relevance score; top-ranked applicants show ''Recommended'' label per REQ-BOOK-02'
    visible:
      - COMP-SPLITCARD
      - COMP-PROFILEAVATAR
      - COMP-STARRATING
      - COMP-VERIFICATIONBADGE
      - COMP-BUTTON
    hidden:
      - COMP-EMPTYSTATE
      - COMP-LOADINGSKELETON
      - COMP-MODALSHEET
  - id: accept_confirm_sheet
    description: User tapped Accept on an applicant; confirmation sheet displayed before proceeding
    visible:
      - COMP-SPLITCARD
      - COMP-MODALSHEET
    hidden:
      - COMP-EMPTYSTATE
      - COMP-LOADINGSKELETON
  - id: error_network
    description: GET /tasks/:id/applications failed; error state with retry
    visible: []
    hidden:
      - COMP-SPLITCARD
      - COMP-EMPTYSTATE
      - COMP-LOADINGSKELETON
      - COMP-BUTTON
      - COMP-MODALSHEET
copy:
  - key: page_title
    mn: Хүсэлтүүд
    en: Applications
  - key: applicant_count_header
    mn: '{count} хүсэлт'
    en: '{count} applications'
  - key: recommended_label
    mn: Санал болгох
    en: Recommended
  - key: rating_label
    mn: Үнэлгээ
    en: Rating
  - key: reviews_count
    mn: '{count} сэтгэгдэл'
    en: '{count} reviews'
  - key: verified_label
    mn: Баталгаажсан
    en: Verified
  - key: empty_headline
    mn: Одоогоор хүсэлт ирээгүй байна
    en: No applications yet
  - key: empty_description
    mn: Гүйцэтгэгчид таны даалгаврыг хянаж хүсэлт илгээх болно. Шинэ хүсэлт ирэхэд мэдэгдэл авна
    en: Taskers are reviewing your task and will apply. You will be notified of new applications
  - key: cta_accept
    mn: Сонгох
    en: Accept
  - key: cta_view_profile
    mn: Профайл харах
    en: View Profile
  - key: confirm_title
    mn: Энэ гүйцэтгэгчийг сонгох уу?
    en: Select this Tasker?
  - key: confirm_body
    mn: Сонгосны дараа захиалга баталгаажуулах хуудас руу шилжинэ
    en: After selecting, you will proceed to booking confirmation
  - key: confirm_cta
    mn: Баталгаажуулах
    en: Confirm
  - key: confirm_cancel
    mn: Буцах
    en: Go Back
  - key: error_network
    mn: Хүсэлтүүдийг ачаалахад алдаа гарлаа
    en: Failed to load applications
acceptance_criteria:
  - >-
    Applicant cards use SplitCard application variant with Tasker avatar, name, rating, review count, and verification
    badge
  - Each applicant card has a tappable area to view Tasker profile (push to SCR-CUST-013) and an Accept button
  - 'Phase 0-1: applicants listed in chronological order'
  - 'Phase 2: applicants sorted by relevance score with ''Recommended'' label on top-ranked per REQ-BOOK-02'
  - Tapping Accept opens confirmation bottom sheet before proceeding
  - Confirming Accept navigates (push) to Booking Confirmation SCR-CUST-014 in Phase 0-1
  - In Phase 2, confirming Accept triggers Tasker notification and waits for lead unlock per REQ-PAY-11
  - Phase 2 timeout/decline triggers SCR-CUST-012 modal
  - Empty state shows waiting message with notification promise
  - Back button pops to Task Detail SCR-CUST-009
  - Application cap info shown when task has reached max applications per REQ-PAY-17
  - Network error shows error state with retry
  - All copy renders correctly in Mongolian Cyrillic at 16px minimum body size
api_endpoints:
  - method: GET
    path: /tasks/:id/applications
    purpose: Fetch list of applicants for this task; Phase 2 includes relevance scores
analytics_events:
  - event: applicants_list_viewed
    trigger: Screen becomes visible; includes task_id and applicant_count
  - event: applicant_profile_tapped
    trigger: User taps an applicant card to view profile; includes tasker_id
  - event: applicant_accept_tapped
    trigger: User taps Accept on an applicant; includes task_id and tasker_id
  - event: applicant_accept_confirmed
    trigger: User confirms acceptance in the bottom sheet
  - event: applicant_accept_cancelled
    trigger: User dismisses the accept confirmation sheet
state_prompts:
  - state_id: loading_initial
    prompt: >-
      Generate the "loading_initial" state of "Applicants List".

      GET /tasks/:id/applications in progress; skeleton cards shown

      Visible elements: COMP-LOADINGSKELETON

      Hidden elements: COMP-SPLITCARD, COMP-EMPTYSTATE, COMP-BUTTON, COMP-MODALSHEET

      Style: Deep blue (#1B3A5C) primary, gold (#C49A3C) accents, off-white (#F9F8F5) background. Mongolian Cyrillic
      text. 16px minimum body text.
  - state_id: empty
    prompt: >-
      Generate the "empty" state of "Applicants List".

      Zero applicants; empty state with waiting message and notification promise

      Visible elements: COMP-EMPTYSTATE

      Hidden elements: COMP-SPLITCARD, COMP-LOADINGSKELETON, COMP-BUTTON, COMP-MODALSHEET

      Style: Deep blue (#1B3A5C) primary, gold (#C49A3C) accents, off-white (#F9F8F5) background. Mongolian Cyrillic
      text. 16px minimum body text.
  - state_id: populated_phase01
    prompt: >-
      Generate the "populated_phase01" state of "Applicants List".

      Phase 0-1: applicants listed in chronological order; each with Accept button

      Visible elements: COMP-SPLITCARD, COMP-PROFILEAVATAR, COMP-STARRATING, COMP-VERIFICATIONBADGE, COMP-BUTTON

      Hidden elements: COMP-EMPTYSTATE, COMP-LOADINGSKELETON, COMP-MODALSHEET

      Style: Deep blue (#1B3A5C) primary, gold (#C49A3C) accents, off-white (#F9F8F5) background. Mongolian Cyrillic
      text. 16px minimum body text.
  - state_id: populated_phase2_ranked
    prompt: >-
      Generate the "populated_phase2_ranked" state of "Applicants List".

      Phase 2: applicants sorted by relevance score; top-ranked applicants show 'Recommended' label per REQ-BOOK-02

      Visible elements: COMP-SPLITCARD, COMP-PROFILEAVATAR, COMP-STARRATING, COMP-VERIFICATIONBADGE, COMP-BUTTON

      Hidden elements: COMP-EMPTYSTATE, COMP-LOADINGSKELETON, COMP-MODALSHEET

      Style: Deep blue (#1B3A5C) primary, gold (#C49A3C) accents, off-white (#F9F8F5) background. Mongolian Cyrillic
      text. 16px minimum body text.
  - state_id: accept_confirm_sheet
    prompt: >-
      Generate the "accept_confirm_sheet" state of "Applicants List".

      User tapped Accept on an applicant; confirmation sheet displayed before proceeding

      Visible elements: COMP-SPLITCARD, COMP-MODALSHEET

      Hidden elements: COMP-EMPTYSTATE, COMP-LOADINGSKELETON

      Style: Deep blue (#1B3A5C) primary, gold (#C49A3C) accents, off-white (#F9F8F5) background. Mongolian Cyrillic
      text. 16px minimum body text.
  - state_id: error_network
    prompt: >-
      Generate the "error_network" state of "Applicants List".

      GET /tasks/:id/applications failed; error state with retry

      Hidden elements: COMP-SPLITCARD, COMP-EMPTYSTATE, COMP-LOADINGSKELETON, COMP-BUTTON, COMP-MODALSHEET

      Style: Deep blue (#1B3A5C) primary, gold (#C49A3C) accents, off-white (#F9F8F5) background. Mongolian Cyrillic
      text. 16px minimum body text.
