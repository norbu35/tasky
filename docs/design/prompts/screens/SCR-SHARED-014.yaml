      Generate the "default" state of "Profile — Settings".

      Settings screen loaded with current preferences; all list rows visible

      Visible elements: COMP-LISTROW, COMP-TOGGLE, COMP-LANGUAGESWITCHER

      Hidden elements: COMP-MODALSHEET

      Style: Deep blue (#1B3A5C) primary, gold (#C49A3C) accents, off-white (#F9F8F5) background. Mongolian Cyrillic
      text. 16px minimum body text.
  - state_id: language_mn
    prompt: >-
      Generate the "language_mn" state of "Profile — Settings".

      Language is set to Mongolian (default); toggle reflects mn state

      Visible elements: COMP-LISTROW, COMP-TOGGLE, COMP-LANGUAGESWITCHER

      Hidden elements: COMP-MODALSHEET

      Style: Deep blue (#1B3A5C) primary, gold (#C49A3C) accents, off-white (#F9F8F5) background. Mongolian Cyrillic
      text. 16px minimum body text.
  - state_id: language_en
    prompt: >-
      Generate the "language_en" state of "Profile — Settings".

      Language is set to English; toggle reflects en state, all UI copy switches

      Visible elements: COMP-LISTROW, COMP-TOGGLE, COMP-LANGUAGESWITCHER

      Hidden elements: COMP-MODALSHEET

      Style: Deep blue (#1B3A5C) primary, gold (#C49A3C) accents, off-white (#F9F8F5) background. Mongolian Cyrillic
      text. 16px minimum body text.
  - state_id: notification_on
    prompt: >-
      Generate the "notification_on" state of "Profile — Settings".

      Push notifications are enabled; notification toggle is ON

      Visible elements: COMP-LISTROW, COMP-TOGGLE

      Hidden elements: COMP-MODALSHEET

      Style: Deep blue (#1B3A5C) primary, gold (#C49A3C) accents, off-white (#F9F8F5) background. Mongolian Cyrillic
      text. 16px minimum body text.
  - state_id: notification_off
    prompt: >-
      Generate the "notification_off" state of "Profile — Settings".

      Push notifications are disabled; notification toggle is OFF

      Visible elements: COMP-LISTROW, COMP-TOGGLE

      Hidden elements: COMP-MODALSHEET

      Style: Deep blue (#1B3A5C) primary, gold (#C49A3C) accents, off-white (#F9F8F5) background. Mongolian Cyrillic
      text. 16px minimum body text.
  - state_id: role_switch_confirm
    prompt: >-
      Generate the "role_switch_confirm" state of "Profile — Settings".

      User tapped role switch; confirmation modal sheet appears asking to confirm

