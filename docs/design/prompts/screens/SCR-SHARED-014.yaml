    en: This action cannot be undone. All your data will be permanently deleted.
  - key: cta_confirm
    mn: Батлах
    en: Confirm
  - key: cta_cancel
    mn: Болих
    en: Cancel
  - key: label_app_version
    mn: Хувилбар
    en: App Version
acceptance_criteria:
  - 'Settings screen displays grouped list rows: Preferences, Account, Legal, and Danger Zone sections'
  - Language toggle switches between Mongolian and English and persists immediately
  - Notification toggle enables/disables push notifications
  - Switch Role row shows current role and opens confirmation modal sheet on tap
  - Role switch confirmation calls PUT /users/me/role on confirm
  - If user switches to Tasker and is not verified, navigates (push) to SCR-TASK-003 after confirmation
  - Delete Account row is styled in danger color and opens deletion confirmation modal on tap
  - Delete Account confirmation modal navigates (modal) to SCR-SHARED-015
  - Terms of Service row navigates (push) to SCR-INFRA-004
  - Privacy Policy row navigates (push) to SCR-TASK-018
  - Help & Support row navigates (push) to SCR-INFRA-005
  - Back button navigates (pop) to SCR-SHARED-012
  - All list rows have 44pt minimum touch target
  - Destructive row (Delete Account) uses danger color and is placed at the bottom of the screen
api_endpoints:
  - method: GET
    path: /users/me
    purpose: Fetch current user settings including role, language preference, notification status
  - method: PUT
    path: /users/me/role
    purpose: Switch user role between customer and tasker
analytics_events:
  - event: settings_viewed
    trigger: Settings screen loads
  - event: settings_language_changed
    trigger: User toggles language between mn and en
  - event: settings_notifications_toggled
    trigger: User toggles notification preference on or off
  - event: settings_role_switch_initiated
    trigger: User taps Switch Role row
  - event: settings_role_switch_confirmed
    trigger: User confirms role switch in modal
  - event: settings_delete_account_initiated
    trigger: User taps Delete Account row
  - event: settings_terms_tapped
    trigger: User taps Terms of Service
  - event: settings_privacy_tapped
    trigger: User taps Privacy Policy
  - event: settings_help_tapped
    trigger: User taps Help & Support
state_prompts:
