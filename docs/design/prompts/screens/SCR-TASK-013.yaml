screen_id: SCR-TASK-013
name: Booking Detail (Tasker)
role:
  - tasker
phase: 0-1
template: detail
route: /(tasker)/jobs/:bookingId
context_refs:
  global: prompts/global-context.yaml
  journeys:
    - prompts/journeys/JRN-TASK-04.yaml
stitch_prompt: >-
  Design a mobile app screen for "Booking Detail (Tasker)" (SCR-TASK-013) in the Tasky app — Mongolia's domestic service
  marketplace.

  This screen is used by Tasker role.

  Template: detail — Navigation header at top, scrollable content area, sticky bottom CTA bar for primary action.

  Layout structure: safe_area -> nav_header(back + title) -> scrollview(status_section + customer_info +
  task_description + exact_address + schedule + payment_note + action_section) -> sticky_bottom_cta(primary_action)

  Components used:
    • COMP-BUTTON (primary): Primary CTA — context-dependent: 'Mark Done' when work is complete, 'Message' when assigned
    • COMP-BUTTON (outline): Secondary CTA — Message customer
    • COMP-BUTTON (ghost): Danger ghost link to cancel the booking
    • COMP-BUTTON (outline): Ghost link to leave a review after completion
    • COMP-STATUSBADGE (assigned): Booking status badge — Assigned, Completed, Cancelled, No-Show
    • COMP-PROFILEAVATAR (lg): Customer's profile avatar with verification indicator
    • COMP-LOADINGSKELETON (detail): Detail skeleton during initial load
  This screen has 9 states — generate the primary/default state:
    Primary state: Booking detail loading — skeleton placeholder shown
  Key copy (Mongolian primary):
    • page_title: "Захиалгын дэлгэрэнгүй" (Booking Detail)
    • status_assigned: "Хуваарилагдсан" (Assigned)
    • status_completed: "Дууссан" (Completed)
    • status_cancelled: "Цуцлагдсан" (Cancelled)
    • status_no_show: "Ирээгүй" (No-Show)
    • customer_label: "Захиалагч" (Customer)
  Style: Deep blue (#1B3A5C) primary, gold (#C49A3C) accents, off-white (#F9F8F5) background. Manrope for headings, Plus
  Jakarta Sans for body. 16px minimum body text. Clean, professional, premium feel. Mongolian Cyrillic text.
layout:
  template: detail
  density: default
  structure: >-
    safe_area -> nav_header(back + title) -> scrollview(status_section + customer_info + task_description +
    exact_address + schedule + payment_note + action_section) -> sticky_bottom_cta(primary_action)
components:
  - component: COMP-BUTTON
    variant: primary
    usage: 'Primary CTA — context-dependent: ''Mark Done'' when work is complete, ''Message'' when assigned'
  - component: COMP-BUTTON
    variant: outline
    usage: Secondary CTA — Message customer
  - component: COMP-BUTTON
    variant: ghost
    usage: Danger ghost link to cancel the booking
  - component: COMP-BUTTON
    variant: outline
    usage: Ghost link to leave a review after completion
  - component: COMP-STATUSBADGE
    variant: assigned
    usage: Booking status badge — Assigned, Completed, Cancelled, No-Show
  - component: COMP-PROFILEAVATAR
    variant: lg
    usage: Customer's profile avatar with verification indicator
  - component: COMP-LOADINGSKELETON
    variant: detail
    usage: Detail skeleton during initial load
states:
  - id: loading_initial
    description: Booking detail loading — skeleton placeholder shown
    visible:
      - nav_header
      - loading_skeleton
    hidden:
      - booking_content
      - action_buttons
  - id: assigned
    description: Booking is assigned — customer info, task details, and exact address visible; Message and Cancel CTAs available
    visible:
      - nav_header
      - status_badge_assigned
      - customer_info
      - task_description
      - exact_address
      - schedule
      - payment_note
      - message_button
      - cancel_link
    hidden:
      - mark_done_button
      - review_button
      - completion_status
      - no_show_status
  - id: assigned_approaching
    description: Scheduled time is approaching — countdown or reminder prominently displayed alongside assigned content
    visible:
      - nav_header
      - status_badge_assigned
      - approaching_reminder
      - customer_info
      - task_description
      - exact_address
      - schedule_highlighted
      - payment_note
      - message_button
      - cancel_link
    hidden:
      - mark_done_button
      - review_button
  - id: mark_done_available
    description: Work is in progress or complete — 'Mark Done' primary CTA becomes available
    visible:
      - nav_header
      - status_badge_assigned
      - customer_info
      - task_description
      - exact_address
      - schedule
      - payment_note
      - mark_done_button
      - message_button
    hidden:
      - cancel_link
      - review_button
  - id: marked_done_awaiting
    description: Tasker has marked work done — awaiting customer confirmation
    visible:
      - nav_header
      - status_badge_assigned
      - awaiting_confirmation_banner
      - customer_info
      - task_description
      - schedule
      - payment_note
      - message_button
    hidden:
      - mark_done_button
      - cancel_link
      - review_button
  - id: completed
    description: Booking is completed — review CTA shown, all details in read-only mode
    visible:
      - nav_header
      - status_badge_completed
      - customer_info
      - task_description
      - schedule
      - payment_note
      - review_button
    hidden:
      - mark_done_button
      - cancel_link
      - exact_address
      - message_button
  - id: cancelled
    description: Booking was cancelled — cancellation reason and details shown
    visible:
      - nav_header
      - status_badge_cancelled
      - cancellation_info
      - customer_info
      - task_description
      - schedule
    hidden:
      - mark_done_button
      - cancel_link
      - review_button
      - message_button
      - exact_address
      - payment_note
  - id: no_show
    description: Booking ended in no-show — no-show details and resolution info shown
    visible:
      - nav_header
      - status_badge_no_show
      - no_show_info
      - customer_info
      - task_description
      - schedule
    hidden:
      - mark_done_button
      - cancel_link
      - review_button
      - message_button
      - exact_address
      - payment_note
  - id: error_network
    description: Network error loading booking detail — retry option
    visible:
      - nav_header
      - error_message
      - retry_button
    hidden:
      - booking_content
      - action_buttons
      - loading_skeleton
