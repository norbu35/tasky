    en: Payment is arranged directly with the customer. Tasky is a connector, not a payment processor.
  - key: mark_done_button
    mn: Ажил дууссан
    en: Mark Done
  - key: message_button
    mn: Зурвас илгээх
    en: Message
  - key: cancel_link
    mn: Захиалга цуцлах
    en: Cancel Booking
  - key: review_button
    mn: Үнэлгээ өгөх
    en: Leave Review
  - key: awaiting_confirmation
    mn: Захиалагч баталгаажуулахыг хүлээж байна
    en: Waiting for customer to confirm completion
  - key: approaching_reminder
    mn: Хуваарьт цаг ойрхон байна!
    en: Scheduled time is approaching!
  - key: budget_label
