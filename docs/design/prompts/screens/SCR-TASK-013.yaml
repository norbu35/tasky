  - key: page_title
    mn: Захиалгын дэлгэрэнгүй
    en: Booking Detail
  - key: status_assigned
    mn: Хуваарилагдсан
    en: Assigned
  - key: status_completed
    mn: Дууссан
    en: Completed
  - key: status_cancelled
    mn: Цуцлагдсан
    en: Cancelled
  - key: status_no_show
    mn: Ирээгүй
    en: No-Show
  - key: customer_label
    mn: Захиалагч
    en: Customer
  - key: task_description_label
    mn: Даалгаврын тайлбар
    en: Task Description
  - key: exact_address_label
    mn: Тодорхой хаяг
    en: Exact Address
  - key: exact_address_note
    mn: Энэ хаяг зөвхөн танд харагдана
    en: This address is visible only to you
  - key: schedule_label
    mn: Хуваарь
    en: Schedule
  - key: payment_note_heading
