screen_id: SCR-SHARED-020
name: Suspended Account
role:
  - customer
  - tasker
phase: 0-1
template: error_state
route: /account/suspended
context_refs:
  global: prompts/global-context.yaml
  journeys:
    - none
stitch_prompt: >-
  Design a mobile app screen for "Suspended Account" (SCR-SHARED-020) in the Tasky app — Mongolia's domestic service
  marketplace.

  This screen is used by both Customer and Tasker roles.

  Template: error_state — Centered error icon, message text, and retry CTA button. Comfortable density.

  Layout structure: safe_area -> centered(warning_icon + title + body_text + expiry_info + appeal_section + cta)

  Components used:
    • COMP-EMPTYSTATE (error): Full-screen suspension notice with warning illustration, explanation, and appeal option
    • COMP-BUTTON (primary): Appeal button for users to submit an appeal against suspension
    • COMP-BUTTON (ghost): Logout button as secondary action
  This screen has 3 states — generate the primary/default state:
    Primary state: Suspension has a known expiry date; shows countdown or date when suspension will be lifted
  Key copy (Mongolian primary):
    • title_suspended: "Бүртгэл түдгэлзүүлсэн" (Account Suspended)
    • body_with_expiry: "Таны бүртгэл түр хугацаагаар түдгэлзүүлсэн байна. Дараах хугацаанд сэргэнэ:" (Your account has been temporarily suspended. It will be restored on:)
    • body_no_expiry: "Таны бүртгэл хянагдаж байна. Гомдол гаргах боломжтой." (Your account is under review. You may submit an appeal.)
    • label_expiry_date: "Сэргэх огноо" (Restoration date)
    • body_appeal_sent: "Таны гомдол хүлээн авлаа. Бид аль болох хурдан шалгаж хариу өгнө." (Your appeal has been received. We will review it and respond as soon as possible.)
    • label_appeal_status: "Гомдлын төлөв: Хянагдаж байна" (Appeal status: Under review)
  Style: Deep blue (#1B3A5C) primary, gold (#C49A3C) accents, off-white (#F9F8F5) background. Manrope for headings, Plus
  Jakarta Sans for body. 16px minimum body text. Clean, professional, premium feel. Mongolian Cyrillic text.
layout:
  template: error_state
  density: comfortable
  structure: safe_area -> centered(warning_icon + title + body_text + expiry_info + appeal_section + cta)
components:
  - component: COMP-EMPTYSTATE
    variant: error
    usage: Full-screen suspension notice with warning illustration, explanation, and appeal option
  - component: COMP-BUTTON
    variant: primary
    usage: Appeal button for users to submit an appeal against suspension
  - component: COMP-BUTTON
    variant: ghost
    usage: Logout button as secondary action
states:
  - id: default_with_expiry
    description: Suspension has a known expiry date; shows countdown or date when suspension will be lifted
    visible:
      - COMP-EMPTYSTATE
      - COMP-BUTTON
    hidden: []
  - id: no_expiry
    description: Suspension has no set expiry (indefinite pending review); appeal CTA prominently shown
    visible:
      - COMP-EMPTYSTATE
      - COMP-BUTTON
    hidden: []
  - id: appeal_sent
    description: User has already submitted an appeal; appeal button replaced with status message indicating appeal is under review
    visible:
      - COMP-EMPTYSTATE
      - COMP-BUTTON
    hidden: []
copy:
  - key: title_suspended
    mn: Бүртгэл түдгэлзүүлсэн
    en: Account Suspended
  - key: body_with_expiry
    mn: 'Таны бүртгэл түр хугацаагаар түдгэлзүүлсэн байна. Дараах хугацаанд сэргэнэ:'
    en: 'Your account has been temporarily suspended. It will be restored on:'
  - key: body_no_expiry
    mn: Таны бүртгэл хянагдаж байна. Гомдол гаргах боломжтой.
    en: Your account is under review. You may submit an appeal.
  - key: label_expiry_date
    mn: Сэргэх огноо
    en: Restoration date
  - key: body_appeal_sent
    mn: Таны гомдол хүлээн авлаа. Бид аль болох хурдан шалгаж хариу өгнө.
    en: Your appeal has been received. We will review it and respond as soon as possible.
  - key: label_appeal_status
    mn: 'Гомдлын төлөв: Хянагдаж байна'
    en: 'Appeal status: Under review'
  - key: cta_appeal
    mn: Гомдол гаргах
    en: Submit Appeal
  - key: cta_appeal_disabled
    mn: Гомдол илгээгдсэн
    en: Appeal Submitted
  - key: cta_logout
    mn: Гарах
    en: Logout
  - key: suspension_reason_label
    mn: Шалтгаан
    en: Reason
acceptance_criteria:
  - Screen blocks all app functionality; only appeal and logout actions are available
  - With-expiry state shows the suspension end date in YYYY.MM.DD format
  - No-expiry state shows indefinite suspension message with prominent appeal CTA
  - Appeal-sent state replaces the appeal button with 'Гомдол илгээгдсэн' disabled state and status message
  - Appeal button transitions to disabled/loading state during submission
  - >-
    If suspension expires while on this screen, auto-navigates (replace) to SCR-CUST-001 (customer) or SCR-TASK-001
    (tasker)
  - Logout button clears JWT and navigates (replace) to SCR-SHARED-002
  - Uses comfortable density for emotional weight
  - Warning icon/illustration is centered above the text content
  - Suspension reason is shown if available from the user profile data
  - All body text uses 16px minimum for Mongolian Cyrillic readability
api_endpoints:
  - method: GET
    path: /users/me
    purpose: Fetch user profile to check suspension status, expiry date, and appeal status
analytics_events:
  - event: suspended_screen_viewed
    trigger: 'Suspended account screen loads (with has_expiry: boolean)'
  - event: suspension_appeal_tapped
    trigger: User taps the Submit Appeal button
  - event: suspension_appeal_submitted
    trigger: Appeal submission completes successfully
  - event: suspension_logout_tapped
    trigger: User taps the Logout button
state_prompts:
  - state_id: default_with_expiry
    prompt: >-
      Generate the "default_with_expiry" state of "Suspended Account".

      Suspension has a known expiry date; shows countdown or date when suspension will be lifted

      Visible elements: COMP-EMPTYSTATE, COMP-BUTTON

      Style: Deep blue (#1B3A5C) primary, gold (#C49A3C) accents, off-white (#F9F8F5) background. Mongolian Cyrillic
      text. 16px minimum body text.
  - state_id: no_expiry
    prompt: >-
      Generate the "no_expiry" state of "Suspended Account".

      Suspension has no set expiry (indefinite pending review); appeal CTA prominently shown

      Visible elements: COMP-EMPTYSTATE, COMP-BUTTON

      Style: Deep blue (#1B3A5C) primary, gold (#C49A3C) accents, off-white (#F9F8F5) background. Mongolian Cyrillic
      text. 16px minimum body text.
  - state_id: appeal_sent
    prompt: >-
      Generate the "appeal_sent" state of "Suspended Account".

      User has already submitted an appeal; appeal button replaced with status message indicating appeal is under review

      Visible elements: COMP-EMPTYSTATE, COMP-BUTTON

      Style: Deep blue (#1B3A5C) primary, gold (#C49A3C) accents, off-white (#F9F8F5) background. Mongolian Cyrillic
      text. 16px minimum body text.
