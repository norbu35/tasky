screen_id: SCR-INFRA-003
name: Session Expired
role:
  - customer
  - tasker
phase: 0-1
template: modal_sheet
route: null
context_refs:
  global: prompts/global-context.yaml
  journeys:
    - none
stitch_prompt: >-
  Design a mobile app screen for "Session Expired" (SCR-INFRA-003) in the Tasky app — Mongolia's domestic service
  marketplace.

  This screen is used by both Customer and Tasker roles.

  Template: modal_sheet — Bottom sheet overlay with drag handle bar, content area, and max 2 action buttons. Branded
  scrim backdrop.

  Layout structure: scrim -> sheet(handle + icon + message + cta)

  Components used:
    • COMP-MODALSHEET (default): Bottom sheet container for session expired prompt
    • COMP-BUTTON (primary): Primary CTA to navigate to login screen for re-authentication
  This screen has 1 states — generate the primary/default state:
    Primary state: JWT expired or invalidated server-side; user must re-login
  Key copy (Mongolian primary):
    • sheet_title: "Хугацаа дууссан" (Session expired)
    • sheet_description: "Таны нэвтрэх хугацаа дууссан байна. Дахин нэвтэрнэ үү" (Your session has expired. Please log in again)
    • cta_relogin: "Дахин нэвтрэх" (Log in again)
  Style: Deep blue (#1B3A5C) primary, gold (#C49A3C) accents, off-white (#F9F8F5) background. Manrope for headings, Plus
  Jakarta Sans for body. 16px minimum body text. Clean, professional, premium feel. Mongolian Cyrillic text.
layout:
  template: modal_sheet
  density: default
  structure: scrim -> sheet(handle + icon + message + cta)
components:
  - component: COMP-MODALSHEET
    variant: default
    usage: Bottom sheet container for session expired prompt
  - component: COMP-BUTTON
    variant: primary
    usage: Primary CTA to navigate to login screen for re-authentication
states:
  - id: default
    description: JWT expired or invalidated server-side; user must re-login
    visible:
      - COMP-MODALSHEET
      - COMP-BUTTON
    hidden: []
copy:
  - key: sheet_title
    mn: Хугацаа дууссан
    en: Session expired
  - key: sheet_description
    mn: Таны нэвтрэх хугацаа дууссан байна. Дахин нэвтэрнэ үү
    en: Your session has expired. Please log in again
  - key: cta_relogin
    mn: Дахин нэвтрэх
    en: Log in again
acceptance_criteria:
  - Bottom sheet appears with branded scrim overlay (primaryDeep at 35%)
  - Sheet is not dismissible by drag-to-close; user must tap 'Log in again'
  - Tapping 'Log in again' replaces entire navigation stack with login screen (SCR-SHARED-002)
  - All local user state is preserved; only auth token is cleared
  - Sheet renders at z-index 30 (sheet elevation)
  - All copy renders correctly in Mongolian Cyrillic at 16px minimum body size
api_endpoints: []
analytics_events:
  - event: session_expired_shown
    trigger: Bottom sheet displayed after 401 response or JWT expiry detected
  - event: session_relogin_tapped
    trigger: User taps 'Log in again' to navigate to login
state_prompts:
  - state_id: default
    prompt: >-
      Generate the "default" state of "Session Expired".

      JWT expired or invalidated server-side; user must re-login

      Visible elements: COMP-MODALSHEET, COMP-BUTTON

      Style: Deep blue (#1B3A5C) primary, gold (#C49A3C) accents, off-white (#F9F8F5) background. Mongolian Cyrillic
      text. 16px minimum body text.
