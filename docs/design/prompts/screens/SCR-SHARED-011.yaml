  - state_id: error_network
    prompt: >-
      Generate the "error_network" state of "Inbox — Chat Detail".

      Network error loading messages; retry available

      Visible elements: nav_header, error_message, retry_button

      Hidden elements: message_list, input_bar, loading_skeleton, phone_warning, offline_banner, send_failed

      Style: Deep blue (#1B3A5C) primary, gold (#C49A3C) accents, off-white (#F9F8F5) background. Mongolian Cyrillic
      text. 16px minimum body text.
  - state_id: offline_cached
