  - state_id: payment_failed
    prompt: >-
      Generate the "payment_failed" state of "Credits — QPay Payment".

      Payment was rejected or errored

      Visible elements: COMP-EMPTYSTATE, COMP-BUTTON.ghost

      Hidden elements: COMP-CARD, COMP-STATUSBADGE, COMP-ANIMATEDCHECKMARK

      Style: Deep blue (#1B3A5C) primary, gold (#C49A3C) accents, off-white (#F9F8F5) background. Mongolian Cyrillic
