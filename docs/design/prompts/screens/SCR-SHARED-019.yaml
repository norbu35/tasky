screen_id: SCR-SHARED-019
name: Review Hard Lock
role:
  - customer
  - tasker
phase: 0-1
template: error_state
route: null
context_refs:
  global: prompts/global-context.yaml
  journeys:
    - prompts/journeys/JRN-SHARED-07.yaml
stitch_prompt: >-
  Design a mobile app screen for "Review Hard Lock" (SCR-SHARED-019) in the Tasky app — Mongolia's domestic service
  marketplace.

  This screen is used by both Customer and Tasker roles.

  Template: error_state — Centered error icon, message text, and retry CTA button. Comfortable density.

  Layout structure: safe_area -> centered(lock_icon + title + body_text + reason_badge + submit_review_cta)

  Components used:
    • COMP-EMPTYSTATE (error): Full-screen blocker with lock illustration, explanation text, and CTA to submit review
    • COMP-BUTTON (primary): Primary CTA to navigate to the review form to resolve the lock
    • COMP-STATUSBADGE (cancelled): Badge showing the reason for the lock (dispute, missed reviews, investigation)
  This screen has 3 states — generate the primary/default state:
    Primary state: User has an open dispute; cannot post tasks or apply to jobs until review is submitted for the disputed booking
  Key copy (Mongolian primary):
    • title_dispute: "Маргааны улмаас хаагдсан" (Locked due to dispute)
    • body_dispute: "Танд нээлттэй маргаан байгаа тул шинэ даалгавар нийтлэх эсвэл ажилд орох боломжгүй. Сэтгэгдлээ бичиж маргааныг шийдвэрлэнэ үү." (You have an open dispute. You cannot post tasks or apply to jobs. Please submit your review to help resolve the dispute.)
    • title_missed: "Сэтгэгдэл дутуу" (Missing reviews)
    • body_missed: "Та 2 ба түүнээс олон сэтгэгдлийг алгассан байна. Бүх сэтгэгдлийг бичих хүртэл апп ашиглах боломжгүй." (You have missed 2 or more reviews. You cannot use the app until all reviews are submitted.)
    • title_investigation: "Шалгалтын улмаас хаагдсан" (Locked due to investigation)
    • body_investigation: "Таны бүртгэл шалгагдаж байна. Сэтгэгдлээ бичиж шийдвэрлэлтэд тусална уу." (Your account is under investigation. Please submit your review to assist with the resolution.)
  Style: Deep blue (#1B3A5C) primary, gold (#C49A3C) accents, off-white (#F9F8F5) background. Manrope for headings, Plus
  Jakarta Sans for body. 16px minimum body text. Clean, professional, premium feel. Mongolian Cyrillic text.
layout:
  template: error_state
  density: comfortable
  structure: safe_area -> centered(lock_icon + title + body_text + reason_badge + submit_review_cta)
components:
  - component: COMP-EMPTYSTATE
    variant: error
    usage: Full-screen blocker with lock illustration, explanation text, and CTA to submit review
  - component: COMP-BUTTON
    variant: primary
    usage: Primary CTA to navigate to the review form to resolve the lock
  - component: COMP-STATUSBADGE
    variant: cancelled
    usage: Badge showing the reason for the lock (dispute, missed reviews, investigation)
states:
  - id: locked_open_dispute
    description: User has an open dispute; cannot post tasks or apply to jobs until review is submitted for the disputed booking
    visible:
      - COMP-EMPTYSTATE
      - COMP-BUTTON
      - COMP-STATUSBADGE
    hidden: []
  - id: locked_missed_reviews
    description: User has missed 2 or more reviews; hard lock blocks all posting and applying until reviews are submitted
    visible:
      - COMP-EMPTYSTATE
      - COMP-BUTTON
      - COMP-STATUSBADGE
    hidden: []
  - id: locked_investigation
    description: >-
      User's account is under investigation; hard lock blocks all activity until review is submitted and investigation
      clears
    visible:
      - COMP-EMPTYSTATE
      - COMP-BUTTON
      - COMP-STATUSBADGE
    hidden: []
copy:
  - key: title_dispute
    mn: Маргааны улмаас хаагдсан
    en: Locked due to dispute
  - key: body_dispute
    mn: >-
      Танд нээлттэй маргаан байгаа тул шинэ даалгавар нийтлэх эсвэл ажилд орох боломжгүй. Сэтгэгдлээ бичиж маргааныг
      шийдвэрлэнэ үү.
    en: >-
      You have an open dispute. You cannot post tasks or apply to jobs. Please submit your review to help resolve the
      dispute.
  - key: title_missed
    mn: Сэтгэгдэл дутуу
    en: Missing reviews
  - key: body_missed
    mn: Та 2 ба түүнээс олон сэтгэгдлийг алгассан байна. Бүх сэтгэгдлийг бичих хүртэл апп ашиглах боломжгүй.
    en: You have missed 2 or more reviews. You cannot use the app until all reviews are submitted.
  - key: title_investigation
    mn: Шалгалтын улмаас хаагдсан
    en: Locked due to investigation
  - key: body_investigation
    mn: Таны бүртгэл шалгагдаж байна. Сэтгэгдлээ бичиж шийдвэрлэлтэд тусална уу.
    en: Your account is under investigation. Please submit your review to assist with the resolution.
  - key: badge_dispute
    mn: Нээлттэй маргаан
    en: Open dispute
  - key: badge_missed
    mn: Дутуу сэтгэгдэл
    en: Missed reviews
  - key: badge_investigation
    mn: Шалгалт
    en: Investigation
  - key: cta_submit_review
    mn: Сэтгэгдэл бичих
    en: Submit Review
acceptance_criteria:
  - Full-screen blocker prevents all navigation to task posting or job application screens
  - Lock screen appears when user has an open dispute and tries to post/apply
  - Lock screen appears when user has missed 2 or more reviews
  - Lock screen appears when user's account is under investigation
  - Each lock reason shows a specific title, explanation body, and reason badge
  - Tapping 'Сэтгэгдэл бичих' navigates (push) to SCR-SHARED-017 with the pending booking_id
  - Lock screen cannot be dismissed or navigated away from (except via the review CTA)
  - Uses comfortable density for emotional weight and breathing room
  - Lock icon illustration is centered above the text content
  - This is a full-screen blocker, not a standalone route — it intercepts navigation to protected screens
  - After review is successfully submitted, the lock is released and user returns to their intended destination
api_endpoints: []
analytics_events:
  - event: review_hard_lock_shown
    trigger: 'Hard lock screen appears (with lock_reason: dispute, missed_reviews, or investigation)'
  - event: review_hard_lock_cta_tapped
    trigger: User taps 'Submit Review' CTA to navigate to review form
state_prompts:
  - state_id: locked_open_dispute
    prompt: >-
      Generate the "locked_open_dispute" state of "Review Hard Lock".

      User has an open dispute; cannot post tasks or apply to jobs until review is submitted for the disputed booking

      Visible elements: COMP-EMPTYSTATE, COMP-BUTTON, COMP-STATUSBADGE

      Style: Deep blue (#1B3A5C) primary, gold (#C49A3C) accents, off-white (#F9F8F5) background. Mongolian Cyrillic
      text. 16px minimum body text.
  - state_id: locked_missed_reviews
    prompt: >-
      Generate the "locked_missed_reviews" state of "Review Hard Lock".

      User has missed 2 or more reviews; hard lock blocks all posting and applying until reviews are submitted

      Visible elements: COMP-EMPTYSTATE, COMP-BUTTON, COMP-STATUSBADGE

      Style: Deep blue (#1B3A5C) primary, gold (#C49A3C) accents, off-white (#F9F8F5) background. Mongolian Cyrillic
      text. 16px minimum body text.
  - state_id: locked_investigation
    prompt: >-
      Generate the "locked_investigation" state of "Review Hard Lock".

      User's account is under investigation; hard lock blocks all activity until review is submitted and investigation
      clears

      Visible elements: COMP-EMPTYSTATE, COMP-BUTTON, COMP-STATUSBADGE

      Style: Deep blue (#1B3A5C) primary, gold (#C49A3C) accents, off-white (#F9F8F5) background. Mongolian Cyrillic
      text. 16px minimum body text.
