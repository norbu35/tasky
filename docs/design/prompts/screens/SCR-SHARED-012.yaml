acceptance_criteria:
  - Profile displays loading skeleton while GET /users/me is in flight
  - Customer view shows avatar, display name, email, member-since date, and Edit Profile CTA
  - >-
    Tasker view shows avatar with verification badge, average star rating, completed jobs stat card, recent reviews, and
    trust banner
  - Tapping Edit Profile navigates (push) to SCR-SHARED-013
  - Tapping Settings icon navigates (push) to SCR-SHARED-014
  - Tapping View Stats navigates (push) to SCR-TASK-016 (tasker only)
  - Network error state shows centered error message with retry button
  - Retry button re-triggers GET /users/me
  - All text renders correctly in Mongolian Cyrillic at 16px minimum body size
  - Profile avatar shows initials fallback when no image URL is available
  - This screen is the root of the profile tab in both customer and tasker tab bars
api_endpoints:
  - method: GET
    path: /users/me
    purpose: Fetch the authenticated user's profile data including role, avatar, stats, and reviews
analytics_events:
  - event: profile_viewed
    trigger: Screen loads successfully with user data
  - event: profile_edit_tapped
    trigger: User taps the Edit Profile CTA
  - event: profile_settings_tapped
    trigger: User taps the settings icon in nav header
  - event: profile_stats_tapped
    trigger: Tasker taps View Stats to navigate to stats dashboard
state_prompts:
  - state_id: loading_initial
    prompt: >-
      Generate the "loading_initial" state of "Profile — My Profile".

      Profile data is being fetched from GET /users/me

      Visible elements: COMP-LOADINGSKELETON

      Hidden elements: COMP-PROFILEAVATAR, COMP-STARRATING, COMP-REVIEWCARD, COMP-STATCARD, COMP-BUTTON,
      COMP-TRUSTBANNER

      Style: Deep blue (#1B3A5C) primary, gold (#C49A3C) accents, off-white (#F9F8F5) background. Mongolian Cyrillic
      text. 16px minimum body text.
  - state_id: customer_view
    prompt: >-
      Generate the "customer_view" state of "Profile — My Profile".

      User is logged in as customer; shows avatar, name, email, member-since, and edit CTA

      Visible elements: COMP-PROFILEAVATAR, COMP-BUTTON

      Hidden elements: COMP-STARRATING, COMP-STATCARD, COMP-REVIEWCARD, COMP-TRUSTBANNER, COMP-VERIFICATIONBADGE,
      COMP-LOADINGSKELETON

      Style: Deep blue (#1B3A5C) primary, gold (#C49A3C) accents, off-white (#F9F8F5) background. Mongolian Cyrillic
      text. 16px minimum body text.
  - state_id: tasker_view
    prompt: >-
      Generate the "tasker_view" state of "Profile — My Profile".

      User is logged in as tasker; shows avatar with verification badge, stats, rating, reviews, and trust banner

      Visible elements: COMP-PROFILEAVATAR, COMP-VERIFICATIONBADGE, COMP-STARRATING, COMP-STATCARD, COMP-REVIEWCARD,
      COMP-TRUSTBANNER, COMP-BUTTON

      Hidden elements: COMP-LOADINGSKELETON

      Style: Deep blue (#1B3A5C) primary, gold (#C49A3C) accents, off-white (#F9F8F5) background. Mongolian Cyrillic
      text. 16px minimum body text.
  - state_id: error_network
    prompt: >-
      Generate the "error_network" state of "Profile — My Profile".

      GET /users/me failed due to network error; full-screen error with retry

      Visible elements: COMP-BUTTON

      Hidden elements: COMP-PROFILEAVATAR, COMP-STARRATING, COMP-REVIEWCARD, COMP-STATCARD, COMP-TRUSTBANNER,
      COMP-LOADINGSKELETON

      Style: Deep blue (#1B3A5C) primary, gold (#C49A3C) accents, off-white (#F9F8F5) background. Mongolian Cyrillic
      text. 16px minimum body text.
