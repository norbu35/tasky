screen_id: SCR-TASK-007
name: Verification — Pending
role:
  - tasker
phase: 0-1
template: empty_state
route: /(tasker)/verification/pending
context_refs:
  global: prompts/global-context.yaml
  journeys:
    - prompts/journeys/JRN-TASK-01.yaml
stitch_prompt: >-
  Design a mobile app screen for "Verification — Pending" (SCR-TASK-007) in the Tasky app — Mongolia's domestic service
  marketplace.

  This screen is used by Tasker role.

  Template: empty_state — Centered illustration above headline, description, and actionable CTA button. Comfortable
  density with generous whitespace.

  Layout structure: safe_area -> centered(pending_illustration + heading + description + sla_info + browse_cta)

  Components used:
    • COMP-EMPTYSTATE (activation): Pending verification state with hourglass illustration and SLA messaging
    • COMP-BUTTON (primary): Primary CTA to browse tasks while waiting (tasker can view but not apply)
    • COMP-PROGRESSTRACKER (default): Visual progress showing verification is in-progress with estimated time
  This screen has 3 states — generate the primary/default state:
    Primary state: Verification is under admin review — SLA messaging and browse CTA shown
  Key copy (Mongolian primary):
    • heading: "Баталгаажуулалт хянагдаж байна" (Verification under review)
    • description: "Таны иргэний үнэмлэх болон зургийг манай баг хянаж байна. Энэ нь ихэвчлэн 24 цагийн дотор хийгдэнэ." (Our team is reviewing your ID and photos. This usually takes up to 24 hours.)
    • sla_info: "Хүлээгдэж буй хугацаа: 24 цаг хүртэл" (Expected wait: up to 24 hours)
    • sla_approaching_warning: "Хянах хугацаа дуусах дөхөж байна. Удахгүй хариу авна." (Review deadline approaching. You'll hear back soon.)
    • sla_breached_message: "Хянах хугацаа хэтэрсэн байна. Тусламж авахын тулд бидэнтэй холбогдоно уу." (Review time exceeded. Please contact us for help.)
    • browse_cta: "Даалгавар үзэх" (Browse Tasks)
  Style: Deep blue (#1B3A5C) primary, gold (#C49A3C) accents, off-white (#F9F8F5) background. Manrope for headings, Plus
  Jakarta Sans for body. 16px minimum body text. Clean, professional, premium feel. Mongolian Cyrillic text.
layout:
  template: empty_state
  density: comfortable
  structure: safe_area -> centered(pending_illustration + heading + description + sla_info + browse_cta)
components:
  - component: COMP-EMPTYSTATE
    variant: activation
    usage: Pending verification state with hourglass illustration and SLA messaging
  - component: COMP-BUTTON
    variant: primary
    usage: Primary CTA to browse tasks while waiting (tasker can view but not apply)
  - component: COMP-PROGRESSTRACKER
    variant: default
    usage: Visual progress showing verification is in-progress with estimated time
states:
  - id: default_pending
    description: Verification is under admin review — SLA messaging and browse CTA shown
    visible:
      - pending_illustration
      - heading
      - description
      - sla_info
      - progress_tracker
      - browse_cta
    hidden:
      - sla_approaching_warning
  - id: sla_approaching
    description: 24-hour SLA deadline is approaching — additional urgency messaging shown
    visible:
      - pending_illustration
      - heading
      - description
      - sla_approaching_warning
      - progress_tracker
      - browse_cta
    hidden: []
  - id: sla_breached
    description: Optional state — 24-hour SLA has passed without decision; contact support hint shown
    visible:
      - pending_illustration
      - heading
      - sla_breached_message
      - contact_support_link
      - browse_cta
    hidden:
      - sla_info
      - sla_approaching_warning
copy:
  - key: heading
    mn: Баталгаажуулалт хянагдаж байна
    en: Verification under review
  - key: description
    mn: Таны иргэний үнэмлэх болон зургийг манай баг хянаж байна. Энэ нь ихэвчлэн 24 цагийн дотор хийгдэнэ.
    en: Our team is reviewing your ID and photos. This usually takes up to 24 hours.
  - key: sla_info
    mn: 'Хүлээгдэж буй хугацаа: 24 цаг хүртэл'
    en: 'Expected wait: up to 24 hours'
  - key: sla_approaching_warning
    mn: Хянах хугацаа дуусах дөхөж байна. Удахгүй хариу авна.
    en: Review deadline approaching. You'll hear back soon.
  - key: sla_breached_message
    mn: Хянах хугацаа хэтэрсэн байна. Тусламж авахын тулд бидэнтэй холбогдоно уу.
    en: Review time exceeded. Please contact us for help.
  - key: browse_cta
    mn: Даалгавар үзэх
    en: Browse Tasks
  - key: contact_support
    mn: Тусламж авах
    en: Contact Support
  - key: notification_hint
    mn: Баталгаажуулалтын үр дүнг мэдэгдэл хэлбэрээр авна
    en: You'll receive a notification when the review is complete
  - key: progress_submitted
    mn: Илгээсэн
    en: Submitted
  - key: progress_reviewing
    mn: Хянагдаж байна
    en: Under Review
acceptance_criteria:
  - Pending screen displays hourglass illustration with clear SLA messaging (24-hour SLA per REQ-SAFE-01)
  - Progress tracker shows verification submission is in review
  - Browse Tasks CTA navigates to Task Feed (SCR-TASK-001) where tasker can view but not apply
  - Push notification for approval navigates to Verification Approved (SCR-TASK-008)
  - Push notification for rejection navigates to Verification Rejected (SCR-TASK-009)
  - SLA approaching state shows when within last 4 hours of the 24-hour window
  - Optional SLA breached state shows contact support option if 24 hours have passed
  - Comfortable density with breathing room for reassuring messaging
  - Notification hint informs user they will be notified of the result
api_endpoints:
  - method: GET
    path: /verification/status
    purpose: Poll verification status to detect approval or rejection
analytics_events:
  - event: verification_pending_viewed
    trigger: Pending screen becomes visible
  - event: verification_pending_browse_tapped
    trigger: User taps Browse Tasks CTA to return to feed
  - event: verification_sla_approaching
    trigger: SLA approaching state becomes visible
  - event: verification_sla_breached
    trigger: SLA breached state becomes visible
state_prompts:
  - state_id: default_pending
    prompt: >-
      Generate the "default_pending" state of "Verification — Pending".

      Verification is under admin review — SLA messaging and browse CTA shown

      Visible elements: pending_illustration, heading, description, sla_info, progress_tracker, browse_cta

      Hidden elements: sla_approaching_warning

      Style: Deep blue (#1B3A5C) primary, gold (#C49A3C) accents, off-white (#F9F8F5) background. Mongolian Cyrillic
      text. 16px minimum body text.
  - state_id: sla_approaching
    prompt: >-
      Generate the "sla_approaching" state of "Verification — Pending".

      24-hour SLA deadline is approaching — additional urgency messaging shown

      Visible elements: pending_illustration, heading, description, sla_approaching_warning, progress_tracker,
      browse_cta

      Style: Deep blue (#1B3A5C) primary, gold (#C49A3C) accents, off-white (#F9F8F5) background. Mongolian Cyrillic
      text. 16px minimum body text.
  - state_id: sla_breached
    prompt: >-
      Generate the "sla_breached" state of "Verification — Pending".

      Optional state — 24-hour SLA has passed without decision; contact support hint shown

      Visible elements: pending_illustration, heading, sla_breached_message, contact_support_link, browse_cta

      Hidden elements: sla_info, sla_approaching_warning

      Style: Deep blue (#1B3A5C) primary, gold (#C49A3C) accents, off-white (#F9F8F5) background. Mongolian Cyrillic
      text. 16px minimum body text.
