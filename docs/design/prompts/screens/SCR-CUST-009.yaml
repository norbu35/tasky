      Hidden elements: COMP-STATUSBADGE, COMP-CARD, COMP-PROFILEAVATAR, COMP-TRUSTBANNER, COMP-BUTTON, COMP-TOAST

      Style: Deep blue (#1B3A5C) primary, gold (#C49A3C) accents, off-white (#F9F8F5) background. Mongolian Cyrillic
      text. 16px minimum body text.
  - state_id: open_no_applicants
