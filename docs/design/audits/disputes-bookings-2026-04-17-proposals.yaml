rejected:
  - finding_id: F-01
    reason: 'bg-muted rounded-lg p-lg combo is too generic to name in ≤3 words without anti-pattern (CardSection, ContentBlock). Values already tokenized. Gap varies across 6 different values — would need escape-hatch props.'

  - finding_id: F-02
    reason: 'Same as F-01. bg-muted rounded-lg p-xl gap-md is generic. 10 consistent sites is strong but the name would be generic (SectionCard, ContentBlock → anti-pattern).'

  - finding_id: F-04
    reason: 'bg-muted rounded-md has 7+ padding sub-variants. Extraction would need boolean escape hatches. Too fragmented.'

  - finding_id: F-13
    reason: 'bg-card rounded-lg p-lg sites bypass Card.tsx — some intentionally (elevation vs border). Not an extraction issue, just a Card usage audit.'

  - finding_id: F-14
    reason: 'Single call site (success.tsx). Leave local per rule-of-one.'

  - finding_id: F-15
    reason: 'Only 2 call sites. rgba(0,0,0,0.05) is a different pattern from interactiveStates.pressed. Merging would be confusing.'

  - finding_id: F-16
    reason: "Timeline dot border widths differ across screens (4px, 2px, 3px). Not the same value — can't extract a shared token."

  - finding_id: F-20
    reason: '96px success hero: only 2 call sites. Below rule-of-three.'

  - finding_id: F-21
    reason: "bg-muted rounded-sm p-lg: 6 sites but 4 in one file (tasks/[taskId]). Family-specific, can't name without referencing task screens."

  - finding_id: F-22
    reason: 'bg-muted rounded-lg p-lg gap-item: 2 sites in 1 file (disputes). Contained.'

  - finding_id: F-24
    reason: 'lineHeight: 20: 3 sites but different semantic meanings (verification modal, notification, chat). Not clearly the same intent.'

  - finding_id: F-27
    reason: "bg-muted rounded-md p-md: 7 sites all in booking/job family. Can't name without referencing booking screens."

  - finding_id: F-28
    reason: 'w-[48%] grid tile: 2 sites in 1 component (PhotoGrid). Contained.'

  - finding_id: F-29
    reason: 'text-caption font-bold uppercase: disputes variant (4 sites in 1 file) and tasks variant (1 site) differ (tracking-widest vs font-bold). Not the same pattern.'

  - finding_id: F-30
    reason: 'elevations.soft on cards: elevation is already tokenized. The combo with bg-card rounded-lg is incidental, not a new recipe.'

  - finding_id: F-08
    reason: 'bg-primary-deep rounded-lg p-lg: combo of already-tokenized values (semantic color + standard radius + standard padding). 3 sites but only 2 share structure; 3rd (notifications banner) has justify-end h-[128px] — different intent. Name would be generic (accentCard → anti-pattern). No new surface needed.'

  - finding_id: F-12
    reason: 'w-12 h-12 rounded-md: ListItemCard (primary consumer) owns its own dimension API internally (sm/md variant class strings) — component API, not raw literal duplication. The 2 remaining sites in tasks/index.tsx are skeleton loading placeholders in one file — contained, below rule-of-three when excluding component internals.'

