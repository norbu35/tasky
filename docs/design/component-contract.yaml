# Component Usage Contract — Tasky Mobile
# Canonical components, variants, templates, composition rules
# Source: existing codebase components + new components from spec
#
# ═══════════════════════════════════════════════════
# NATIVEWIND API CONTRACT (Phase 1 — foundation freeze)
# ═══════════════════════════════════════════════════
#
# Migration status: Phase 1 COMPLETE — all primitives and templates use NativeWind.
#   - StyleSheet.create has been eliminated from all component and template files.
#   - All static layout/color/typography styles are expressed as NativeWind className strings.
#   - Dynamic / runtime styles remain in style={} (insets, animated values, rgba colors).
#
# cn() utility
#   location: apps/mobile/src/lib/cn.ts
#   signature: cn(...inputs: (string | undefined | false)[]) => string
#   implementation: tailwind-merge (extendTailwindMerge) with custom classGroups for
#     Tasky's font-family, spacing, padding, and gap tokens.
#   usage: all components call cn() to merge variant classes with caller-supplied className.
#   example: className={cn(buttonVariants({ variant, size }), className)}
#
# className prop
#   All UI primitives accept an optional className?: string prop.
#   Callers may pass additional Tailwind utility classes.
#   The component merges them via cn() so caller classes win conflicts correctly.
#
# cva() variants
#   Variant logic uses class-variance-authority (cva).
#   Exported variant types (for consumer TS):
#     ButtonVariant  — 'default' | 'secondary' | 'outline' | 'ghost' | 'destructive'
#     ButtonSize     — 'default' | 'sm' | 'lg' | 'icon' | 'icon-sm'
#     StatusType     — 'open' | 'assigned' | 'completed' | 'cancelled' | 'no_show'
#     (CategoryChip, PressableCard, FilterBar also use cva internally)
#
# Shadows (elevations)
#   Shadows are imperative ViewStyle objects — NOT Tailwind classes.
#   location: apps/mobile/src/design/elevations.ts
#   exported object: elevations  (keys: none, soft, card, elevated, navBar)
#   usage: style={elevations.card}  (combined with className for layout)
#   rationale: React Native shadow props differ per platform (iOS shadowColor vs Android elevation).
#
# Dynamic / runtime styles  →  style={}
#   The following categories always stay in style={}, never in className:
#     - Safe-area insets   (useSafeAreaInsets())
#     - Reanimated values  (useAnimatedStyle())
#     - rgba overlay colors (from elevations.ts overlays map)
#     - Any value computed at runtime from JS variables
#
# Export barrels
#   UI primitives export from: apps/mobile/src/components/ui/index.ts
#   Shared templates export from: apps/mobile/src/components/templates/index.ts
#   Screens import via path aliases, for example `@/components/ui/Button` or
#   `@/components/templates/ModalSheetTemplate`.
#
# Implementation metadata
#   runtime_name: optional exported symbol when the design component name is stable but runtime uses a
#     more specific name, such as EmptyState -> EmptyStateTemplate.
#   implementation_status:
#     active       implemented shared primitive/component (default)
#     template     implemented as a shared template under apps/mobile/src/components/templates
#     screen_local implemented inside a screen family rather than as a shared primitive
#     deferred     retained design intent without an active runtime path

# ═══════════════════════════════════════════════════
# EXISTING COMPONENTS AND TEMPLATES
# ═══════════════════════════════════════════════════

existing_components:
  - id: COMP-BUTTON
    name: Button
    path: 'apps/mobile/src/components/ui/Button.tsx'
    nativewind: true
    variants:
      - default # filled, primary color  (ButtonVariant: 'default')
      - secondary # filled, secondary color
      - outline # border, no fill
      - ghost # text-only, no background
      - destructive # filled, danger color
    sizes: [default, sm, lg, icon, icon-sm] # ButtonSize type
    props:
      [
        label,
        variant,
        size,
        onPress,
        disabled,
        isLoading,
        className,
        labelClassName,
        children,
        style,
      ]
    states: [default, pressed, disabled, loading]
    animation: 'NativeWind active:opacity-pressed active:scale-pressed'
    shadow: 'elevations.card applied via style={} for default variant only'
    tokens:
      colors: [primary, secondary, danger, background]
      typography: [label, caption, body]
      spacing: [sm, md, lg, xl]
      touch_targets: [min-h-touch-lg, min-h-touch-xl, size-touch, size-touch-sm]
      radius: [md]
    rules:
      - 'Always full-width in forms and bottom CTAs'
      - 'Never stack more than 2 buttons side-by-side'
      - 'Destructive actions use destructive variant only'
      - 'Loading state replaces label with ActivityIndicator, keeps width'
      - 'Use icon-sm only for compact icon-only affordances that remain inside a larger touch-safe surface'
      - 'className prop merged via cn() — caller classes win conflicts'

  - id: COMP-INPUT
    name: Input
    path: 'apps/mobile/src/components/ui/Input.tsx'
    nativewind: true
    variants:
      - default
      - multiline
    props: [invalid, editable, readOnly, className, style, '...TextInputProps']
    states: [default, focused, filled, invalid, disabled]
    tokens:
      colors: [primary, danger, textTertiary, muted]
      typography: [body_default, label, caption]
      spacing: [sm, md]
      radius: [sm]
    rules:
      - 'Error message always below field, inline (not toast)'
      - '16px minimum font size for input text (Cyrillic)'
      - 'Always pair with FormField for label + error'

  - id: COMP-FORMFIELD
    name: FormField
    path: 'apps/mobile/src/components/ui/FormField.tsx'
    nativewind: true
    variants: [default]
    props: [label, helperText, errorText, children, className, style]
    states: [default, error, helper]
    tokens:
      typography: [label, caption]
      colors: [danger, textTertiary]
      spacing: [xs, sm]
    rules:
      - 'Wraps Input, DatePicker, MapPicker, and all form elements'
      - 'Error replaces helper text when present'

  - id: COMP-CARD
    name: Card
    path: 'apps/mobile/src/components/ui/Card.tsx'
    nativewind: true
    sub_components:
      - Card.Header
      - Card.Title
      - Card.Description
      - Card.Content
      - Card.Footer
    variants: [default, elevated, outlined]
    props: [className, style, '...ViewProps']
    states: [default, pressed]
    tokens:
      colors: [background, primary]
      shadows: [card, elevated]
      spacing: [md, lg]
      radius: [md, lg]
    rules:
      - 'Plain Card is a static surface primitive'
      - 'Use PressableCard or SplitCard for tappable task/booking cards'

  - id: COMP-FAB
    name: FAB
    path: 'apps/mobile/src/components/ui/FAB.tsx'
    nativewind: true
    variants: [default]
    props: [testID, authGuard, className]
    states: [default, pressed, hidden_on_scroll]
    animation: 'fab_appear / fab_disappear'
    tokens:
      colors: [accent]
      shadows: [elevated]
      icon_sizes: [fab]
    rules:
      - "Only on Customer 'My Tasks' tab"
      - 'Hides on scroll down, appears on scroll up'
      - 'Auth check before action'

  - id: COMP-MODALSHEET
    name: Modal Sheet
    implementation_status: template
    path: 'apps/mobile/src/components/templates/ModalSheetTemplate.tsx'
    runtime_name: ModalSheetTemplate
    nativewind: true
    variants: [default]
    props:
      [
        isOpen,
        onClose,
        title,
        titleAlign,
        children,
        snapPoints,
        testID,
        className,
        contentClassName,
        dismissible,
        isLoading,
        loadingTestID,
        primaryAction,
        secondaryAction,
        hideDefaultAction,
        footer,
        headerLeading,
        headerTrailing,
      ]
    states: [default, open, loading, closing]
    animation: 'sheet_open / sheet_close'
    tokens:
      overlays: [scrim.sheet]
      elevation: [sheet]
      radius: [lg]
      spacing: [lg, xl]
    rules:
      - 'Stable design component id for the mobile dialog/sheet pattern; runtime implementation is the ModalSheetTemplate template'
      - 'All destructive confirmations use Modal Sheet'
      - 'Max 2 action buttons (primary + secondary)'
      - 'Handle bar is always visible; drag/backdrop dismiss is enabled by default and may be disabled for blocking flows'
      - 'Shared sheet wrappers such as ActionSheet and ConfirmSheet compose this template instead of owning a separate modal stack'
      - 'Use isLoading for short action-pending sheet states; full content loading still uses Skeleton where layout is known'

  - id: COMP-TOAST
    name: Toast
    path: 'apps/mobile/src/components/ui/Toast.tsx'
    nativewind: true
    variants:
      - info
      - success
      - error
    props: [message, variant, className]
    states: [entering, visible, exiting]
    animation: 'toast_slide_in / toast_slide_out'
    tokens:
      elevation: [toast]
      colors: [primary, verified, danger]
      typography: [body_default]
    rules:
      - 'Host-owned lifecycle controls auto-dismiss timing'
      - 'Error retry actions belong in the host surface, not inside Toast'
      - 'Never overlap with Modal Sheet'
      - 'Badge/meta letter spacing uses tracking-badge or a token-backed typography variant'

  - id: COMP-STATUSBADGE
    name: StatusBadge
    path: 'apps/mobile/src/components/ui/StatusBadge.tsx'
    nativewind: true
    variants:
      - open # bg-statusOpen           (StatusType: 'open')
      - assigned # bg-statusAssigned       (StatusType: 'assigned')
      - completed # bg-verified             (StatusType: 'completed')
      - cancelled # bg-muted                (StatusType: 'cancelled')
      - no_show # bg-danger               (StatusType: 'no_show')
    props: [status, className, testID]
    states: [default]
    variant_api: 'cva badgeVariants({ status }) — color is non-overridable by design'
    tokens:
      colors: [statusOpen, statusAssigned, verified, muted, danger]
      typography: [micro, font-sans-bold uppercase tracking-badge]
    rules:
      - "Status text always in Mongolian as primary (via i18n t('status.*'))"
      - 'Color mapping is semantic and non-overridable'
      - 'className prop merged via cn() for layout overrides only'

  - id: COMP-CATEGORYCHIP
    name: CategoryChip
    path: 'apps/mobile/src/components/ui/CategoryChip.tsx'
    nativewind: true
    variants: [active, inactive] # boolean active prop drives cva chipVariants
    props: [label, isActive, onPress, testID, className]
    states: [default, active, pressed]
    variant_api: 'cva chipVariants({ active: boolean })'
    tokens:
      colors: [primary, chipInactive, muted-foreground, primary-foreground]
      typography: [label, font-sans-semibold]
      radius: [full]
      spacing: [xl, sm]
    rules:
      - 'Used in filter bars and category selection'
      - 'Horizontal scroll when many categories'
      - 'className prop merged via cn() for spacing overrides'

  - id: COMP-TRUSTBANNER
    name: TrustBanner
    path: 'apps/mobile/src/components/ui/TrustBanner.tsx'
    nativewind: true
    variants: [default, compact]
    props: [title, description, variant, className]
    states: [default]
    tokens:
      colors: [trust, verified]
      typography: [caption, body_emphasis]
    rules:
      - 'Shown on task feed and detail screens'
      - 'Compact variant for inline use in cards'

  - id: COMP-STATCARD
    name: StatCard
    path: 'apps/mobile/src/components/ui/StatCard.tsx'
    nativewind: true
    variants: [default]
    props: [value, label, className]
    states: [default, loading]
    tokens:
      typography: [price_display, label]
      colors: [primary, verified, danger]
      shadows: [card]
    rules:
      - 'Used in Tasker reputation and reliability summaries'
      - 'Loading state shows skeleton'

  - id: COMP-REVIEWCARD
    name: ReviewCard
    path: 'apps/mobile/src/components/ui/ReviewCard.tsx'
    nativewind: true
    variants: [default, featured]
    props: [reviewerInitials, reviewerName, rating, comment, timeAgo, featured, className]
    states: [default]
    tokens:
      typography: [body_default, caption, label]
      colors: [secondary]
    rules:
      - 'Star rating shown inline'
      - 'Featured variant has highlighted border'

  - id: COMP-PROFILEAVATAR
    name: Avatar
    path: 'apps/mobile/src/components/ui/ProfileAvatar.tsx'
    runtime_name: ProfileAvatar
    nativewind: true
    variants: [xs, sm, md, lg]
    props: [uri, name, size, showVerified, className]
    states: [default, loading, fallback_initials]
    tokens:
      icon_sizes: [avatar_badge]
      colors: [verified, secondary]
    rules:
      - 'Verification badge anchored bottom-right'
      - 'Fallback: initials on primary background'

  - id: COMP-LANGUAGESWITCHER
    name: LanguageSwitcher
    path: 'apps/mobile/src/components/ui/LanguageSwitcher.tsx'
    nativewind: true
    variants: [default]
    props: [className]
    states: [en, mn]
    tokens:
      typography: [label]
    rules:
      - 'mn is always default'
      - 'Toggle in settings only'

  - id: COMP-LOGINREQUIREDCTA
    name: LoginRequiredCTA
    path: 'apps/mobile/src/components/ui/LoginRequiredCTA.tsx'
    nativewind: true
    variants: [default]
    props: [message, testID, className]
    states: [default]
    tokens:
      typography: [section_heading, body_default]
      colors: [primary]
    rules:
      - 'Full-screen auth gate for protected actions'

# ═══════════════════════════════════════════════════
# NEW COMPONENTS (specified by design system)
# ═══════════════════════════════════════════════════

new_components:
  - id: COMP-SPLITCARD
    name: SplitCard
    path: 'apps/mobile/src/components/ui/SplitCard.tsx'
    nativewind: true
    description: 'Hybrid two-tone card: dark teal header (person + price), light body (task details)'
    variants: [task, booking, application]
    props: [headerContent, bodyContent, onPress, testID, className]
    states: [default, pressed, urgent]
    tokens:
      colors: [primaryDeep, background, accent, secondary]
      typography: [card_title, body_default, price_display, badge_text]
      shadows: [card, elevated]
      radius: [lg]
    rules:
      - 'Header: dark teal background, white text, person avatar, price'
      - 'Body: light background, task details, status badge'
      - 'Urgent tasks get accent highlight + label'
    composition:
      header: [Avatar, price_display, StatusBadge]
      body: [card_title, body_default, CategoryChip, TrustBanner.compact]

  - id: COMP-STEPINDICATOR
    name: StepIndicator
    path: 'apps/mobile/src/components/ui/StepIndicator.tsx'
    nativewind: true
    description: 'Multi-step form progress indicator'
    variants: [horizontal, minimal]
    props: [currentStep, totalSteps, testID, className]
    states: [default]
    tokens:
      colors: [primary, muted, verified]
      typography: [caption]
      spacing: [sm]
    rules:
      - 'Used in Post Task wizard and Verification flow'
      - 'Completed steps show checkmark'
      - 'Current step highlighted'

  - id: COMP-SEARCHBAR
    name: SearchBar
    path: 'apps/mobile/src/components/ui/SearchBar.tsx'
    nativewind: true
    description: 'Text search input with filter trigger'
    variants: [default, with_filter]
    props: [className, containerClassName, '...TextInputProps']
    states: [default, focused, active_filter]
    tokens:
      colors: [muted, primary]
      typography: [body_default]
      radius: [md]
      icon_sizes: [input_icon]
    rules:
      - 'Always at top of feed/list screens'
      - 'Filter icon triggers FilterBar sheet'

  - id: COMP-FILTERBAR
    name: FilterBar
    description: 'Horizontal scrolling filter chips with sheet for advanced filters'
    path: 'apps/mobile/src/components/ui/FilterBar.tsx'
    nativewind: true
    variants: [inline, sheet]
    props: [filters, activeFilters, onToggle, testID, className]
    states: [default, sheet_open, filters_active]
    variant_api: 'cva chipVariants({ active: boolean }) — internal to FilterBar'
    tokens:
      colors: [primary, muted, primary-foreground]
      typography: [label, font-sans-semibold]
      spacing: [sm, md, lg]
    rules:
      - 'Inline chips for category/distance quick filters'
      - 'Sheet for advanced multi-select'
      - 'Clear all button when filters active'
    composition:
      chips: [CategoryChip]
      sheet: [Modal Sheet]

  - id: COMP-TOUCHABLE
    name: Touchable
    description: 'Thin Pressable wrapper for non-button tap targets (list items, card areas, swipe zones)'
    path: 'apps/mobile/src/components/ui/Touchable.tsx'
    nativewind: true
    variants: [default] # no visual variants — pure layout/touch primitive
    props: [className, style, children, testID, '...PressableProps']
    states: [default, pressed]
    rules:
      - 'Screens MUST use <Touchable> instead of raw <Pressable> (enforced by lint rule no-raw-pressable-in-screens)'
      - 'testID is required — DEV warning fires when omitted'
      - 'className merged via cn(); dynamic styles passed via style={}'
      - 'For button-like actions with labels use <Button> instead'

  - id: COMP-DATEPICKER
    name: DatePicker
    path: 'apps/mobile/src/components/ui/SchedulePickerSheet.tsx'
    runtime_name: SchedulePickerSheet
    implementation_status: active
    description: 'Shared date and time selector sheet for task scheduling and booking reschedules'
    variants: [date, time]
    props:
      [
        mode,
        draftDate,
        draftTime,
        dateOptions,
        timeOptions,
        onModeChange,
        onDateChange,
        onTimeChange,
        onReset,
        onClose,
        onSave,
      ]
    states: [default, open, selected]
    tokens:
      colors: [primary, muted]
      typography: [body_default, label]
    rules:
      - 'Minimum date is always tomorrow'
      - 'Format: YYYY.MM.DD (Mongolian convention)'
      - 'Wrap in FormField for labels'

  - id: COMP-MAPPICKER
    name: MapPicker
    implementation_status: screen_local
    path: 'apps/mobile/src/features/tasks/screens/TaskLocation/Screen.tsx'
    runtime_name: TaskLocationScreen
    description: 'Map-based location pin selector'
    variants: [default]
    props: ['...routeScreenProps']
    states: [default, pin_placed, permission_denied]
    tokens:
      colors: [accent, primary]
      typography: [body_default, caption]
    rules:
      - 'Pin drop on map + text description field'
      - 'Show approximate area to Taskers (fuzzed 500m)'
      - 'Requires location permission'

  - id: COMP-EMPTYSTATE
    name: EmptyState
    implementation_status: template
    path: 'apps/mobile/src/components/templates/EmptyStateTemplate.tsx'
    runtime_name: EmptyStateTemplate
    description: 'Illustration + headline + description + CTA for empty lists'
    variants: [activation, no_results, error]
    props: [title, description, ctaLabel, ctaOnPress, icon, testID, className]
    states: [default]
    tokens:
      typography: [section_heading, body_default, button_label]
      colors: [primary, textTertiary]
      density: [comfortable]
    rules:
      - "Activation variant includes actionable CTA (not just 'nothing here')"
      - 'Comfortable density for breathing room'
      - 'Illustration centered above text'

  - id: COMP-LOADINGSKELETON
    name: Skeleton
    path: 'apps/mobile/src/components/ui/SkeletonLoader.tsx'
    runtime_name: SkeletonLoader
    description: 'Content-matching skeleton loading placeholder'
    variants: [card, list_row, detail, profile]
    props: [width, height, borderRadius, style, testID]
    states: [loading]
    animation: 'skeleton_pulse'
    tokens:
      colors: [muted]
    rules:
      - 'Skeleton shape must match content layout'
      - 'Pulse animation at 1500ms (tuned for Mongolia bandwidth)'
      - 'Never show generic spinner — always skeleton'

  - id: COMP-ANIMATEDCHECKMARK
    name: AnimatedCheckmark
    path: 'apps/mobile/src/components/ui/HandDrawnCheck.tsx'
    runtime_name: HandDrawnCheck
