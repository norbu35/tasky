# ═══════════════════════════════════════════════════
# SCREEN TEMPLATES
# All templates: NativeWind (Phase 1 complete)
# Path: apps/mobile/src/components/templates/<Name>Template.tsx
# Barrel: apps/mobile/src/components/templates/index.ts
# ═══════════════════════════════════════════════════

templates:
  - id: TPL-AUTH
    name: auth
    description: 'Centered content, single CTA, trust messaging'
    layout:
      structure: 'safe_area → centered_content → bottom_cta'
      density: comfortable
    slots:
      - illustration_or_logo
      - heading
      - description_or_form
      - primary_cta
      - secondary_link
    components: [Button, Input, FormField, LanguageSwitcher]
    rules:
      - 'Always centered vertically'
      - 'Single primary CTA at bottom'
      - 'Trust messaging below CTA when applicable'

  - id: TPL-FEED-LIST
    name: feed_list
    description: 'Searchable scrollview, filter bar, cards, FAB overlay'
    layout:
      structure: 'safe_area → sticky_header(search+filter) → scrollview(cards) → fab_overlay'
      density: default
    slots:
      - search_bar
      - filter_bar
      - card_list
      - empty_state
      - loading_skeleton
      - fab
      - pull_to_refresh
      - pagination_footer
    components: [SearchBar, FilterBar, SplitCard, Card, FAB, EmptyState, Skeleton]
    required_states: [loading, empty, populated, error, offline]
    rules:
      - 'Pull-to-refresh on all list screens'
      - 'Infinite scroll pagination with footer spinner'
      - 'Empty state includes activation CTA'
      - 'FAB only on Customer My Tasks tab'

  - id: TPL-DETAIL
    name: detail
    description: 'Scrollable content with sticky bottom CTA bar'
    layout:
      structure: 'safe_area → nav_header → scrollview(content) → sticky_bottom_cta'
      density: default
    slots:
      - nav_header
      - hero_section
      - content_sections
      - bottom_cta_bar
    components: [Button, StatusBadge, Avatar, TrustBanner, StarRating, TimelineEvent]
    rules:
      - 'Back button in nav header'
      - 'Sticky CTA bar at bottom for primary action'
      - 'Content scrolls independently'

  - id: TPL-FORM-WIZARD
    name: form_wizard
    description: 'Step indicator, form fields, next/back navigation'
    layout:
      structure: 'safe_area → nav_header → step_indicator → scrollview(form) → bottom_nav(back+next)'
      density: default
    slots:
      - step_indicator
      - form_content
      - back_button
      - next_button
    components: [StepIndicator, FormField, Input, DatePicker, MapPicker, PhotoPicker, Button]
    required_states: [form_entry, validation_error]
    rules:
      - 'Step indicator shows progress'
      - 'Inline validation per field'
      - 'Back/Next at bottom'
      - 'Keyboard-aware scrolling'

  - id: TPL-SETTINGS
    name: settings
    description: 'Grouped list rows with disclosure indicators'
    layout:
      structure: 'safe_area → nav_header → scrollview(groups)'
      density: default
    slots:
      - setting_groups
      - list_rows
    components: [ListRow, Toggle, LanguageSwitcher, Button]
    rules:
      - 'Grouped by section with headers'
      - 'Disclosure indicator for drill-down rows'
      - 'Destructive actions at bottom in danger color'

  - id: TPL-MODAL-SHEET
    name: modal_sheet
    description: 'Bottom sheet with handle, content, action buttons'
    layout:
      structure: 'scrim → sheet(handle + content + actions)'
      density: default
    slots:
      - handle_bar
      - header_leading
      - title
      - header_trailing
      - content
      - loading_indicator
      - primary_action
      - secondary_action
      - custom_footer
    components: [Button, Modal Sheet]
    rules:
      - 'Drag/backdrop dismiss by default; set dismissible=false only for blocking system or confirmation flows'
      - 'Max 2 action buttons'
      - 'Scrim overlay behind sheet'
      - 'All destructive confirmations use this template'
      - 'Short action-pending states may use the template loading slot; content-loading states still prefer Skeleton'

  - id: TPL-EMPTY-STATE
    name: empty_state
    description: 'Illustration, headline, description, CTA'
    layout:
      structure: 'safe_area → centered(illustration + text + cta)'
      density: comfortable
    slots:
      - illustration
      - headline
      - description
      - cta_button
    components: [EmptyState, Button]
    rules:
      - 'Comfortable density'
      - 'CTA must be actionable, not just informational'

  - id: TPL-ERROR-STATE
    name: error_state
    description: 'Icon, message, retry CTA'
    layout:
      structure: 'safe_area → centered(icon + message + retry)'
      density: comfortable
    slots:
      - icon
      - message
      - retry_cta
    components: [Button, EmptyState]
    rules:
      - 'Retry CTA when applicable'
      - 'Show cached content when available'

  - id: TPL-SUCCESS
    name: success_celebration
    description: 'Animated checkmark, headline, next steps, CTAs'
    layout:
      structure: 'safe_area → centered(checkmark + headline + next_steps + ctas)'
      density: comfortable
    slots:
      - animated_checkmark
      - headline
      - next_steps_text
      - primary_cta
      - secondary_cta
    components: [AnimatedCheckmark, Button]
    rules:
      - "All success moments include 'what happens next' guidance"
      - 'Primary CTA goes to next logical screen'
      - 'Secondary CTA goes to home/list'

# ═══════════════════════════════════════════════════
# COMPOSITION RULES
# ═══════════════════════════════════════════════════

composition_rules:
  - rule: 'All forms use FormField wrapper with inline error below field'
  - rule: 'Destructive actions always use Modal Sheet confirmation with explicit copy'
  - rule: 'List → Detail flows always use push navigation (page_enter/page_exit)'
  - rule: 'Search/Filter/Sort follows: SearchBar → FilterBar → ModalSheetTemplate pattern'
  - rule: 'Pull-to-refresh on all feed_list and detail screens with async data'
  - rule: 'Pagination via infinite scroll with Skeleton footer'
  - rule: "Empty states include activation CTAs (not just 'nothing here')"
  - rule: "All success moments include 'what happens next' guidance"
  - rule: 'Content-loading states use Skeleton matching content layout; compact spinners are allowed for action-pending or pagination states'
  - rule: 'Error states use shared error component with retry CTA'
  - rule: 'Offline states show banner + cached content or full-screen EmptyState'

# ═══════════════════════════════════════════════════
# FORBIDDEN COMBINATIONS
# ═══════════════════════════════════════════════════

forbidden_combinations:
  - combination: 'Toast + Modal Sheet simultaneously'
    reason: 'Visual conflict — Toast is z:50, Modal Sheet z:30, but they compete for attention'
  - combination: 'FAB on non-Customer-My-Tasks screens'
    reason: "FAB is exclusively for 'Post Task' action"
  - combination: 'danger Button without Modal Sheet confirmation'
    reason: 'Destructive actions require explicit confirmation'
  - combination: 'Generic spinner as loading state'
    reason: 'Use Skeleton for full content loading; reserve spinners for compact action-pending or pagination states'
  - combination: 'price_display typography outside price/budget contexts'
    reason: 'Reserve Manrope bold 20px for monetary values only'
  - combination: 'caption typography for primary content'
    reason: '14px is absolute minimum — use body_default (16px) for anything substantive'
  - combination: 'More than 2 Buttons in bottom CTA bar'
    reason: 'Max 2 buttons — primary + secondary'
  - combination: 'EmptyState without actionable CTA'
    reason: 'Every empty state must guide user to next action'
