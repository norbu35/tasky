# Screen Spec: Verification — ID Upload
screen_id: SCR-TASK-005
name: 'Verification — ID Upload'
route: '/(tasker)/verification/upload'
role: [tasker]
phase: '0-1'
traceability:
  status: validated
  screen_graph_node: SCR-TASK-005
  prd_refs:
    - REQ-P1-SAFE-02
    - REQ-P1-SAFE-05
    - NFR-SEC-01
    - NFR-SEC-02
  journey_refs:
    - JRN-TASK-01:step-4
    - JRN-TASK-01-A2
  scenario_refs:
    - SCN-VERIF-002
    - SCN-VERIF-003
template: form_wizard
figma_page: 'Tasker/Verification ID Upload'
feature: 'verification'

layout:
  template: form_wizard
  density: default
  structure: 'safe_area -> nav_header(back + title) -> step_indicator(3 steps) -> scrollview(upload_area + preview + instructions) -> bottom_nav(back_button + next_button)'

components:
  - id: COMP-STEPINDICATOR
    usage: '3-step progress indicator: 1) ID Front, 2) ID Back, 3) Selfie'
    props:
      currentStep: 1
      totalSteps: 3
      labels: ['Урд тал', 'Ар тал', 'Амьд зураг']
    variant: horizontal

  - id: COMP-PHOTOPICKER
    usage: 'Camera capture area for each upload step — ID front, ID back, selfie'
    props:
      photos: []
      maxPhotos: 1
    variant: default

  - id: COMP-BUTTON
    usage: "Primary CTA — 'Next' to proceed to next upload step or 'Submit' on final review"
    props:
      label: 'Үргэлжлүүлэх'
      variant: primary
      size: xl
      disabled: true
    variant: primary

  - id: COMP-BUTTON
    usage: 'Secondary back button to return to previous step'
    props:
      label: 'Буцах'
      variant: outline
      size: lg
    variant: outline

  - id: COMP-BUTTON
    usage: 'Danger button to retake a photo on the review step'
    props:
      label: 'Дахин авах'
      variant: secondary
      size: md
    variant: secondary

  - id: COMP-LOADINGSKELETON
    usage: 'Upload progress indicator while photo is being uploaded to presigned URL'
    props:
      variant: detail
      count: 1
    variant: detail

states:
  - id: front_upload_empty
    description: 'Step 1 — ID front photo not yet captured; camera prompt displayed'
    components_visible:
      [
        nav_header,
        step_indicator_step1,
        camera_prompt_front,
        instructions_front,
        next_button_disabled,
      ]
    components_hidden:
      [front_preview, back_upload, selfie_upload, review_section, uploading_indicator]

  - id: front_upload_captured
    description: 'Step 1 — ID front photo captured and previewed; next button enabled'
    components_visible:
      [nav_header, step_indicator_step1, front_preview, retake_button, next_button_enabled]
    components_hidden:
      [camera_prompt_front, back_upload, selfie_upload, review_section, uploading_indicator]

  - id: back_upload_empty
    description: 'Step 2 — ID back photo not yet captured; camera prompt displayed'
    components_visible:
      [
        nav_header,
        step_indicator_step2,
        camera_prompt_back,
        instructions_back,
        back_button,
        next_button_disabled,
      ]
    components_hidden:
      [front_upload, back_preview, selfie_upload, review_section, uploading_indicator]

  - id: back_upload_captured
    description: 'Step 2 — ID back photo captured and previewed; next button enabled'
    components_visible:
      [
        nav_header,
        step_indicator_step2,
        back_preview,
        retake_button,
        back_button,
        next_button_enabled,
      ]
    components_hidden:
      [camera_prompt_back, front_upload, selfie_upload, review_section, uploading_indicator]

  - id: selfie_upload_empty
    description: 'Step 3 — Selfie not yet captured; front-camera prompt with face outline guide'
    components_visible:
      [
        nav_header,
        step_indicator_step3,
        camera_prompt_selfie,
        instructions_selfie,
        back_button,
        next_button_disabled,
      ]
    components_hidden:
      [front_upload, back_upload, selfie_preview, review_section, uploading_indicator]

  - id: selfie_upload_captured
    description: 'Step 3 — Selfie captured and previewed; next button enabled to proceed to review'
    components_visible:
      [
        nav_header,
        step_indicator_step3,
        selfie_preview,
        retake_button,
        back_button,
        next_button_enabled,
      ]
    components_hidden:
      [camera_prompt_selfie, front_upload, back_upload, review_section, uploading_indicator]

  - id: uploading
    description: 'All 3 photos are being uploaded to presigned URLs — progress indicator shown'
    components_visible:
      [nav_header, step_indicator_complete, uploading_indicator, uploading_message]
    components_hidden: [camera_prompts, review_section, next_button, back_button]

  - id: review_all_three
    description: 'All 3 photos uploaded — review thumbnails of ID front, back, and selfie before final submit'
    components_visible:
      [
        nav_header,
        step_indicator_complete,
        front_thumbnail,
        back_thumbnail,
        selfie_thumbnail,
        retake_buttons,
        submit_button,
      ]
    components_hidden: [camera_prompts, uploading_indicator]

  - id: upload_error
    description: 'Upload failed for one or more photos — error message with retry'
    components_visible: [nav_header, step_indicator, error_message, retry_button]
    components_hidden: [camera_prompts, uploading_indicator, review_section]

copy:
  - key: page_title
    mn: 'Баталгаажуулалт'
    en: 'Verification'
    max_chars: 20

  - key: step_front_label
    mn: 'Урд тал'
    en: 'Front'
    max_chars: 10

  - key: step_back_label
    mn: 'Ар тал'
    en: 'Back'
    max_chars: 10

  - key: step_selfie_label
    mn: 'Амьд зураг'
    en: 'Selfie'
    max_chars: 15

  - key: front_instruction_heading
    mn: 'Иргэний үнэмлэхний урд талыг зурагла'
    en: 'Photograph the front of your ID card'
    max_chars: 45

  - key: front_instruction_detail
    mn: 'Бүх мэдээлэл тод харагдахаар гэрэлтэй газар зурагла'
    en: 'Take photo in good lighting so all details are clear'
    max_chars: 60

  - key: back_instruction_heading
    mn: 'Иргэний үнэмлэхний ар талыг зурагла'
    en: 'Photograph the back of your ID card'
    max_chars: 45

  - key: back_instruction_detail
    mn: 'MRZ код болон бүх мэдээлэл харагдах ёстой'
    en: 'MRZ code and all information must be visible'
    max_chars: 55

  - key: selfie_instruction_heading
    mn: 'Амьд зураг авах'
    en: 'Take a selfie'
    max_chars: 20

  - key: selfie_instruction_detail
    mn: 'Нүүрээ хүрээн дотор байрлуулж, тод гэрэлтэй газар зурагла'
    en: 'Place your face within the frame in good lighting'
    max_chars: 65

  - key: capture_button
    mn: 'Зураг авах'
    en: 'Take Photo'
    max_chars: 15

  - key: retake_button
    mn: 'Дахин авах'
    en: 'Retake'
    max_chars: 12

  - key: next_button
    mn: 'Үргэлжлүүлэх'
    en: 'Continue'
    max_chars: 15

  - key: back_button
    mn: 'Буцах'
    en: 'Back'
    max_chars: 10

  - key: review_heading
    mn: 'Зургуудаа шалгана уу'
    en: 'Review your photos'
    max_chars: 25

  - key: review_description
    mn: 'Бүх зураг тод, мэдээлэл бүрэн харагдаж байгаа эсэхийг шалгана уу'
    en: 'Make sure all photos are clear and information is fully visible'
    max_chars: 80

  - key: submit_button
    mn: 'Илгээх'
    en: 'Submit'
    max_chars: 10

  - key: uploading_message
    mn: 'Зургуудыг илгээж байна...'
    en: 'Uploading photos...'
    max_chars: 25

  - key: upload_error
    mn: 'Зураг илгээхэд алдаа гарлаа. Дахин оролдоно уу.'
    en: 'Failed to upload photos. Please try again.'
    max_chars: 50

  - key: retry_button
    mn: 'Дахин оролдох'
    en: 'Retry'
    max_chars: 15

api_endpoints:
  - method: POST
    path: '/verification/upload-url'
    purpose: 'Get presigned upload URL for ID front, back, or selfie image'
  - method: POST
    path: '/verification/submit'
    purpose: 'Submit verification with storage keys for all 3 uploaded photos'

analytics_events:
  - event: 'verification_upload_viewed'
    trigger: 'ID Upload screen becomes visible'
  - event: 'verification_front_captured'
    trigger: 'User captures ID front photo'
  - event: 'verification_back_captured'
    trigger: 'User captures ID back photo'
  - event: 'verification_selfie_captured'
    trigger: 'User captures selfie photo'
  - event: 'verification_photo_retaken'
    trigger: 'User retakes any photo'
  - event: 'verification_review_viewed'
    trigger: 'User reaches the review all three step'
  - event: 'verification_submitted'
    trigger: 'User taps Submit on review step'
  - event: 'verification_upload_failed'
    trigger: 'Upload fails for one or more photos'

acceptance_criteria:
  - 'Step indicator shows 3 steps: Урд тал, Ар тал, Амьд зураг'
  - 'Each step captures exactly one photo via device camera'
  - 'Camera permission primer is shown on first camera access if not already granted'
  - 'Photos are uploaded via presigned URL'
  - "Next button is disabled until current step's photo is captured"
  - 'User can retake any photo before moving to next step'
  - 'Review step shows thumbnails of all 3 photos with individual retake buttons'
  - 'Submit triggers POST /verification/submit with storage keys'
  - 'On successful submit, navigates to Verification Submitted (SCR-TASK-010)'
  - 'Upload error shows error message with retry option'
  - 'Back button returns to previous step or Consent screen (SCR-TASK-004)'
  - 'Selfie step shows face outline guide for proper framing'
  - 'All instruction text meets 16px minimum for Mongolian Cyrillic readability'
