# Screen Spec: Tasker Public Profile
screen_id: SCR-CUST-013
name: 'Tasker Public Profile'
route: '/(customer)/taskers/:taskerId'
role: [customer]
phase: '0-1'
traceability:
  status: validated
  screen_graph_node: SCR-CUST-013
  prd_refs:
    - REQ-P1-SAFE-13
    - REQ-P1-SAFE-18
    - REQ-P1-MSG-04
  journey_refs:
    - JRN-CUST-02:step-3
  scenario_refs:
    - SCN-REVIEW-007
template: detail
figma_page: 'Customer/Tasker Public Profile'
feature: 'profiles'

layout:
  template: detail
  density: default
  structure: 'safe_area -> nav_header(back + title) -> scrollview(avatar_hero + trust_summary + categories + reviews)'

redesign_proof:
  thesis: warm_marketplace_with_operational_spine
  density: balanced
  trust_cues:
    - verified_badge_as_eligibility
    - completed_jobs
    - review_threshold_state
    - service_categories
    - no_direct_contact_before_booking
  non_goals:
    - no_fake_top_candidate_ranking
    - no_payment_protection_claims
  airbnb_scaffold:
    - structured_comparison_signals
    - no_recommended_ranking
    - review_threshold_state
    - review_search_filter
    - verification_and_eligibility_evidence

profile_redesign_proof:
  thesis: warm_marketplace_with_operational_spine
  density: balanced
  trust_cues:
    - verified_eligibility
    - review_threshold
    - completed_jobs
    - role_specific_review_dimensions
    - neutral_no_review_state
  non_goals:
    - no_provider_level_badges
    - no_unbacked_reputation_claims
  airbnb_scaffold:
    - review_summary_search_filter
    - thresholded_rating
    - neutral_low_review_state
    - anchored_review_sections

components:
  - id: COMP-PROFILEAVATAR
    usage: 'Large Tasker avatar with verification badge at top of profile'
    props:
      imageUrl: '{tasker_avatar}'
      size: 'lg'
      isVerified: true
    variant: lg

  - id: COMP-VERIFICATIONBADGE
    usage: 'ID verification badge anchored to avatar bottom-right'
    props:
      isVerified: true
      size: 'avatar_badge'
    variant: default

  - id: COMP-STARRATING
    usage: 'Public Tasker rating shown only when at least three customer-to-tasker reviews are submitted'
    props:
      value: 4.7
      readonly: true
      size: 'lg'
    variant: display

  - id: COMP-TRUSTBANNER
    usage: 'Trust metrics showing ID-verified status and completion count; public rating is additive only after at least three customer-to-tasker reviews are submitted'
    props:
      verifiedCount: 1
      completedCount: 24
    variant: default

  - id: COMP-CATEGORYCHIP
    usage: 'Category chips showing which task categories the Tasker works in'
    props:
      category: '{category_name}'
      isActive: false
    variant: inactive

  - id: COMP-REVIEWCARD
    usage: 'Recent review cards from past customers'
    props:
      review: '{review_object}'
      isFeatured: false
    variant: default

  - id: COMP-LOADINGSKELETON
    usage: 'Profile-shaped skeleton during initial load'
    props:
      variant: profile
      count: 1
    variant: profile

states:
  - id: loading_initial
    description: 'GET /users/:id/profile in progress; profile skeleton shown'
    components_visible: [COMP-LOADINGSKELETON]
    components_hidden:
      [
        COMP-PROFILEAVATAR,
        COMP-VERIFICATIONBADGE,
        COMP-STARRATING,
        COMP-TRUSTBANNER,
        COMP-CATEGORYCHIP,
        COMP-REVIEWCARD,
      ]

  - id: loaded_trust_first
    description: 'Profile data loaded below three customer-to-tasker reviews; ID verification, completion history, and categories are shown first'
    components_visible:
      [COMP-PROFILEAVATAR, COMP-VERIFICATIONBADGE, COMP-TRUSTBANNER, COMP-CATEGORYCHIP]
    components_hidden: [COMP-STARRATING, COMP-REVIEWCARD, COMP-LOADINGSKELETON]

  - id: loaded_with_public_reputation
    description: 'Profile data loaded and public reputation is visible because at least three customer-to-tasker reviews are submitted'
    components_visible:
      [
        COMP-PROFILEAVATAR,
        COMP-VERIFICATIONBADGE,
        COMP-STARRATING,
        COMP-TRUSTBANNER,
        COMP-CATEGORYCHIP,
        COMP-REVIEWCARD,
      ]
    components_hidden: [COMP-LOADINGSKELETON]

  - id: error_network
    description: 'GET /users/:id/profile failed; error state with retry'
    components_visible: []
    components_hidden:
      [
        COMP-PROFILEAVATAR,
        COMP-VERIFICATIONBADGE,
        COMP-STARRATING,
        COMP-TRUSTBANNER,
        COMP-CATEGORYCHIP,
        COMP-REVIEWCARD,
        COMP-LOADINGSKELETON,
      ]

copy:
  - key: page_title
    mn: 'Гүйцэтгэгчийн профайл'
    en: 'Tasker Profile'
    max_chars: 25

  - key: section_about
    mn: 'Танилцуулга'
    en: 'About'
    max_chars: 15

  - key: section_categories
    mn: 'Ажлын чиглэлүүд'
    en: 'Categories'
    max_chars: 20

  - key: section_reviews
    mn: 'Сэтгэгдлүүд'
    en: 'Reviews'
    max_chars: 15

  - key: section_stats
    mn: 'Статистик'
    en: 'Stats'
    max_chars: 15

  - key: stat_completed
    mn: 'Дууссан ажил'
    en: 'Completed Jobs'
    max_chars: 20

  - key: stat_rating
    mn: 'Үнэлгээ'
    en: 'Rating'
    max_chars: 10

  - key: stat_reviews
    mn: 'Сэтгэгдэл'
    en: 'Reviews'
    max_chars: 15

  - key: public_reputation_pending
    mn: 'Нийтийн үнэлгээ удахгүй харагдана'
    en: 'Public rating appears after three customer reviews'
    max_chars: 60

  - key: verified_since
    mn: 'Баталгаажсан: {date}'
    en: 'ID-verified since: {date}'
    max_chars: 35

  - key: member_since
    mn: 'Бүртгүүлсэн: {date}'
    en: 'Member since: {date}'
    max_chars: 30

  - key: no_reviews_yet
    mn: 'Одоогоор сэтгэгдэл байхгүй байна'
    en: 'No reviews yet'
    max_chars: 40

  - key: error_network
    mn: 'Профайл ачаалахад алдаа гарлаа'
    en: 'Failed to load profile'
    max_chars: 40

api_endpoints:
  - method: GET
    path: '/users/:id/profile'
    purpose: 'Fetch Tasker public profile including verification/trust cues, categories, and thresholded public reputation'

analytics_events:
  - event: 'tasker_profile_viewed'
    trigger: 'Screen becomes visible; includes tasker_id'
  - event: 'tasker_profile_review_expanded'
    trigger: 'User expands a review card to read full text'

acceptance_criteria:
  - 'Profile hero shows large Tasker avatar with ID verification badge anchored bottom-right'
  - 'Name and member-since date are always shown below avatar'
  - 'TrustBanner shows ID-verified status and completed-job count even when public rating is still hidden'
  - 'Overall rating and public review list appear only after at least three customer-to-tasker reviews are submitted'
  - 'Categories section shows CategoryChip for each category the Tasker works in'
  - 'Below three customer-to-tasker reviews, the profile avoids public rating/review-count claims and may show a neutral pending-reputation message instead'
  - 'When the threshold is met, the reviews section lists recent ReviewCards from past customers'
  - 'Tasker phone number is never shown on the public profile'
  - 'No direct-contact CTA appears on the public profile before booking confirmation'
  - 'Back button pops to Applicants List SCR-CUST-011'
  - 'Profile skeleton matches profile layout during loading'
  - 'Network error shows error state with retry'
  - 'All copy renders correctly in Mongolian Cyrillic at 16px minimum body size'
