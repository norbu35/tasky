# Screen Spec: Tasker Reputation & Reliability
screen_id: SCR-TASK-016
name: 'Tasker Reputation & Reliability'
route: '/(tasker)/stats'
role: [tasker]
phase: '0-1'
traceability:
  status: validated
  screen_graph_node: SCR-TASK-016
  prd_refs:
    - REQ-P1-SAFE-13
    - REQ-P1-SAFE-10
    - REQ-P1-BOOK-17
    - REQ-P1-BOOK-24
  journey_refs:
    - JRN-SHARED-05-A2
  scenario_refs: []
template: detail
figma_page: 'Tasker/Tasker Reputation'
feature: 'tasker-profile'

layout:
  template: detail
  density: default
  structure: 'safe_area -> nav_header(back + title) -> scrollview(stats_grid + rating_breakdown + reliability_section + activity_section)'

components:
  - id: COMP-STATCARD
    usage: 'Completed jobs count stat card'
    props:
      label: 'Дууссан ажил'
      value: '23'
      trend: '+5'
      icon: 'briefcase'
    variant: default

  - id: COMP-STATCARD
    usage: 'Overall rating stat card'
    props:
      label: 'Ерөнхий үнэлгээ'
      value: '4.7'
      trend: null
      icon: 'star'
    variant: default

  - id: COMP-STATCARD
    usage: 'Completion rate stat card'
    props:
      label: 'Гүйцэтгэлийн хувь'
      value: '96%'
      trend: '+2%'
      icon: 'check-circle'
    variant: default

  - id: COMP-STATCARD
    usage: 'Application success rate stat card'
    props:
      label: 'Анкетын амжилт'
      value: '42%'
      trend: '+8%'
      icon: 'target'
    variant: default

  - id: COMP-STATCARD
    usage: 'Cancellation count stat card for reliability awareness'
    props:
      label: 'Цуцлалт (30 хоногт)'
      value: '0'
      trend: null
      icon: 'alert-circle'
    variant: default

  - id: COMP-STARRATING
    usage: 'Per-category rating breakdown display — quality, punctuality, communication'
    props:
      value: 4.7
      readonly: true
      size: 'md'
    variant: display

  - id: COMP-VERIFICATIONBADGE
    usage: 'Verification status display in stats header'
    props:
      isVerified: true
      size: 'md'
    variant: default

  - id: COMP-LOADINGSKELETON
    usage: 'Skeleton placeholders matching StatCard grid during load'
    props:
      variant: card
      count: 5
    variant: card

states:
  - id: loading_initial
    description: 'Stats loading — skeleton placeholders matching StatCard grid'
    components_visible: [nav_header, loading_skeleton]
    components_hidden: [stats_grid, rating_breakdown, reliability_section, activity_section]

  - id: loaded
    description: 'Stats fully loaded and displayed in grid layout'
    components_visible:
      [
        nav_header,
        stats_grid,
        rating_breakdown,
        reliability_section,
        activity_section,
        badge_status,
      ]
    components_hidden: [loading_skeleton, error_message]

  - id: error_network
    description: 'Network error loading stats — retry option'
    components_visible: [nav_header, error_message, retry_button]
    components_hidden: [stats_grid, loading_skeleton, rating_breakdown, reliability_section]

copy:
  - key: page_title
    mn: 'Миний статистик'
    en: 'My Reputation'
    max_chars: 20

  - key: stats_section_heading
    mn: 'Ерөнхий үзүүлэлтүүд'
    en: 'Overview'
    max_chars: 25

  - key: completed_jobs_label
    mn: 'Дууссан ажил'
    en: 'Completed Jobs'
    max_chars: 20

  - key: overall_rating_label
    mn: 'Ерөнхий үнэлгээ'
    en: 'Overall Rating'
    max_chars: 20

  - key: completion_rate_label
    mn: 'Гүйцэтгэлийн хувь'
    en: 'Completion Rate'
    max_chars: 20

  - key: application_success_label
    mn: 'Анкетын амжилт'
    en: 'Application Success'
    max_chars: 20

  - key: cancellation_count_label
    mn: 'Цуцлалт (30 хоногт)'
    en: 'Cancellations (30d)'
    max_chars: 25

  - key: rating_breakdown_heading
    mn: 'Үнэлгээний задаргаа'
    en: 'Rating Breakdown'
    max_chars: 25

  - key: rating_quality
    mn: 'Ажлын чанар'
    en: 'Quality of work'
    max_chars: 30

  - key: rating_communication
    mn: 'Харилцаа'
    en: 'Communication'
    max_chars: 25

  - key: rating_punctuality
    mn: 'Цаг баримтлал'
    en: 'Punctuality'
    max_chars: 20

  - key: reliability_heading
    mn: 'Найдвартай байдал'
    en: 'Reliability'
    max_chars: 20

  - key: reliability_score_label
    mn: 'Найдвартай байдлын оноо'
    en: 'Reliability Score'
    max_chars: 25

  - key: reliability_description
    mn: 'Гүйцэтгэлийн хувь, цаг баримтлал, үнэлгээ, цуцлалтын түүх дээр суурилсан'
    en: 'Based on completion rate, punctuality, ratings, and cancellation history'
    max_chars: 80

  - key: activity_heading
    mn: 'Идэвхжил'
    en: 'Activity'
    max_chars: 15

  - key: error_network
    mn: 'Интернэт холболтоо шалгана уу'
    en: 'Please check your internet connection'
    max_chars: 45

  - key: retry_button
    mn: 'Дахин оролдох'
    en: 'Retry'
    max_chars: 15

api_endpoints:
  - method: GET
    path: '/users/me/stats'
    purpose: 'Fetch tasker statistics including ratings, completion rate, cancellation count, reliability score'

analytics_events:
  - event: 'tasker_stats_viewed'
    trigger: 'Tasker Reputation & Reliability screen becomes visible'
  - event: 'tasker_stats_rating_breakdown_viewed'
    trigger: 'User scrolls to rating breakdown section'
  - event: 'tasker_stats_reliability_viewed'
    trigger: 'User scrolls to reliability section'

acceptance_criteria:
  - 'Stats display in StatCard grid layout with label, value, and trend'
  - 'StatCard components show loading skeleton during initial fetch'
  - 'Overall rating displayed with customer-to-tasker breakdown (quality, punctuality, communication)'
  - 'Tasker Reliability Score is surfaced with a short explanation of its inputs'
  - 'Reliability description explains score inputs (completion rate, punctuality, ratings, cancellations)'
  - 'Activity section is tasker-facing reputation context only and must not be labeled as the launch KPI dashboard'
  - 'Cancellation count shows rolling 30-day count for strike awareness'
  - 'Header shows verification status and review-backed activity summary without future monetization badges'
  - 'Back button returns to My Profile (SCR-SHARED-012)'
  - 'Network error displays retry button'
  - 'All StatCard values use appropriate typography (price_display for numbers)'
