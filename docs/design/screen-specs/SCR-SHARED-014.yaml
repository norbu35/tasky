# Screen Spec: Profile — Settings
screen_id: SCR-SHARED-014
name: 'Profile — Settings'
route: '/profile/settings'
role: [customer, tasker]
phase: '0-1'
traceability:
  status: validated
  screen_graph_node: SCR-SHARED-014
  prd_refs:
    - REQ-P1-AUTH-06
    - REQ-P1-SAFE-01
    - REQ-P1-SAFE-04
    - REQ-P1-COVER-05
    - NFR-SEC-04
    - NFR-LEGAL-03
  journey_refs:
    - JRN-SHARED-06:step-1
    - JRN-SHARED-06-A1
    - JRN-SHARED-06-A2
    - JRN-SHARED-06-A6
  scenario_refs:
    - SCN-AUTH-002
    - SCN-AUTH-003
    - SCN-VERIF-001
    - SCN-TASK-032
    - SCN-SEC-013
template: settings
figma_page: 'Shared/Profile — Settings'
feature: 'settings'

layout:
  template: settings
  density: default
  structure: 'safe_area -> nav_header(back + title) -> scrollview(grouped_list_sections: preferences, account, legal, danger_zone)'

components:
  - id: COMP-LISTROW
    usage: 'Each setting item displayed as a tappable row with disclosure or toggle'
    props:
      label: 'Хэл'
      value: 'Монгол'
      showDisclosure: true
      icon: 'globe'
    variant: default

  - id: COMP-LISTROW
    usage: 'Tasker-only row for service-area notification preferences; preferences do not gate browsing or applications'
    props:
      label: 'Үйлчлэх дүүргүүд'
      value: '{selected_district_count}'
      showDisclosure: true
      icon: 'map-pin'
    variant: default

  - id: COMP-LISTROW
    usage: 'Destructive account deletion row at bottom in danger color'
    props:
      label: 'Бүртгэл устгах'
      isDestructive: true
      icon: 'trash'
    variant: destructive

  - id: COMP-TOGGLE
    usage: 'Toggle switch for notification and language settings'
    props:
      value: true
      onValueChange: 'handleNotificationToggle'
      disabled: false
    variant: default

  - id: COMP-LANGUAGESWITCHER
    usage: 'Language preference toggle between Mongolian and English'
    props:
      currentLang: 'mn'
      onSwitch: 'handleLanguageSwitch'
    variant: default

  - id: COMP-MODALSHEET
    usage: 'Confirmation sheet for role switch and account deletion'
    props:
      visible: false
      title: 'Бүртгэл устгах уу?'
      primaryAction: 'Тийм'
      secondaryAction: 'Үгүй'
    variant: default

  - id: COMP-BUTTON
    usage: 'Primary and secondary action buttons inside confirmation modal sheets'
    props:
      label: 'Батлах'
      variant: danger
      size: lg
    variant: danger

states:
  - id: default
    description: 'Settings screen loaded with current preferences; all list rows visible'
    components_visible: [COMP-LISTROW, COMP-TOGGLE, COMP-LANGUAGESWITCHER]
    components_hidden: [COMP-MODALSHEET]

  - id: tasker_service_area_preferences
    description: 'Verified Tasker edits district preferences used for notification targeting only; citywide browsing and application eligibility are unchanged'
    components_visible: [COMP-LISTROW, COMP-MODALSHEET, COMP-BUTTON]
    components_hidden: []

  - id: language_mn
    description: 'Language is set to Mongolian (default); toggle reflects mn state'
    components_visible: [COMP-LISTROW, COMP-TOGGLE, COMP-LANGUAGESWITCHER]
    components_hidden: [COMP-MODALSHEET]

  - id: language_en
    description: 'Language is set to English; toggle reflects en state, all UI copy switches'
    components_visible: [COMP-LISTROW, COMP-TOGGLE, COMP-LANGUAGESWITCHER]
    components_hidden: [COMP-MODALSHEET]

  - id: notification_on
    description: 'Push notifications are enabled; notification toggle is ON'
    components_visible: [COMP-LISTROW, COMP-TOGGLE]
    components_hidden: [COMP-MODALSHEET]

  - id: notification_off
    description: 'Push notifications are disabled; notification toggle is OFF'
    components_visible: [COMP-LISTROW, COMP-TOGGLE]
    components_hidden: [COMP-MODALSHEET]

  - id: role_switch_confirm
    description: 'User tapped role switch; confirmation modal sheet appears asking to confirm'
    components_visible: [COMP-LISTROW, COMP-MODALSHEET, COMP-BUTTON]
    components_hidden: []

  - id: delete_confirm
    description: 'User tapped Delete Account; confirmation modal sheet appears with danger styling'
    components_visible: [COMP-LISTROW, COMP-MODALSHEET, COMP-BUTTON]
    components_hidden: []

