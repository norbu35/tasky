# Screen Spec: Verification — Pending
screen_id: SCR-TASK-007
name: 'Verification — Pending'
route: '/(tasker)/verification/pending'
role: [tasker]
phase: '0-1'
traceability:
  status: validated
  screen_graph_node: SCR-TASK-007
  prd_refs:
    - REQ-P1-SAFE-02
    - REQ-P1-ADMIN-10
    - REQ-P1-NOTIF-06
  journey_refs:
    - JRN-TASK-01:step-6
  scenario_refs:
    - SCN-VERIF-002
    - SCN-VERIF-005
    - SCN-NOTIF-006
template: empty_state
figma_page: 'Tasker/Verification Pending'
feature: 'verification'

layout:
  template: empty_state
  density: comfortable
  structure: 'safe_area -> centered(pending_illustration + heading + description + queue_info + browse_cta)'

components:
  - id: COMP-EMPTYSTATE
    usage: 'Pending verification state with queue-status messaging'
    props:
      illustration: 'pending_review'
      headline: 'Баталгаажуулалт хянагдаж байна'
      description: 'Таны мэдээлэл баталгаажуулалтын дараалалд хянагдаж байна'
      ctaLabel: 'Даалгавар үзэх'
    variant: activation

  - id: COMP-BUTTON
    usage: 'Primary CTA to browse tasks while waiting (tasker can view but not apply)'
    props:
      label: 'Даалгавар үзэх'
      variant: primary
      size: xl
    variant: primary

  - id: COMP-PROGRESSTRACKER
    usage: 'Visual progress showing verification is in progress'
    props:
      current: 1
      total: 2
      milestones: ['Илгээсэн', 'Хянагдаж байна']
    variant: default

states:
  - id: default_pending
    description: 'Verification is under admin review — queue-status messaging and browse CTA shown'
    components_visible:
      [pending_illustration, heading, description, queue_info, progress_tracker, browse_cta]
    components_hidden: [queue_attention_message]

  - id: queue_attention
    description: 'Queue status needs attention — additional support guidance shown'
    components_visible:
      [
        pending_illustration,
        heading,
        description,
        queue_attention_message,
        progress_tracker,
        browse_cta,
      ]
    components_hidden: []

  - id: queue_delayed
    description: 'Optional state — verification queue runs longer than expected; contact support hint shown'
    components_visible:
      [pending_illustration, heading, queue_delayed_message, contact_support_link, browse_cta]
    components_hidden: [queue_info, queue_attention_message]

copy:
  - key: heading
    mn: 'Баталгаажуулалт хянагдаж байна'
    en: 'Verification under review'
    max_chars: 35

  - key: description
    mn: 'Таны иргэний үнэмлэх болон зургийг манай баг баталгаажуулалтын дараалалд хянаж байна.'
    en: 'Our team is reviewing your ID and photos. Queue timing depends on current verification volume.'
    max_chars: 100

  - key: queue_info
    mn: 'Хүлээгдэж буй хугацаа: одоогийн дарааллын төлөвөөс хамаарна'
    en: 'Expected wait: shown from current queue status'
    max_chars: 70

  - key: queue_attention_message
    mn: 'Хянах дараалал шинэчлэгдэж байна. Үр дүнг мэдэгдлээр авна.'
    en: "The review queue is updating. You'll receive a notification with the result."
    max_chars: 55

  - key: queue_delayed_message
    mn: 'Хянах хугацаа уртассан байна. Тусламж авахын тулд бидэнтэй холбогдоно уу.'
    en: 'Review is taking longer than expected. Please contact us for help.'
    max_chars: 60

  - key: browse_cta
    mn: 'Даалгавар үзэх'
    en: 'Browse Tasks'
    max_chars: 20

  - key: contact_support
    mn: 'Тусламж авах'
    en: 'Contact Support'
    max_chars: 20

  - key: notification_hint
    mn: 'Баталгаажуулалтын үр дүнг мэдэгдэл хэлбэрээр авна'
    en: "You'll receive a notification when the review is complete"
    max_chars: 65

  - key: progress_submitted
    mn: 'Илгээсэн'
    en: 'Submitted'
    max_chars: 12

  - key: progress_reviewing
    mn: 'Хянагдаж байна'
    en: 'Under Review'
    max_chars: 18

api_endpoints:
  - method: GET
    path: '/verification/status'
    purpose: 'Poll verification status to detect approval or rejection'

analytics_events:
  - event: 'verification_pending_viewed'
    trigger: 'Pending screen becomes visible'
  - event: 'verification_pending_browse_tapped'
    trigger: 'User taps Browse Tasks CTA to return to feed'
  - event: 'verification_queue_attention'
    trigger: 'Queue attention state becomes visible'
  - event: 'verification_queue_delayed'
    trigger: 'Queue delayed state becomes visible'

acceptance_criteria:
  - 'Pending screen displays hourglass illustration with clear queue-status messaging'
  - 'Progress tracker shows verification submission is in review'
  - 'Browse Tasks CTA navigates to Task Feed (SCR-TASK-001) where tasker can view but not apply'
  - 'Push notification for approval navigates to Verification Approved (SCR-TASK-008)'
  - 'Push notification for rejection navigates to Verification Rejected (SCR-TASK-009)'
  - 'Queue attention state uses current verification queue posture instead of a fixed SLA promise'
  - 'Optional delayed-review state shows contact support guidance when the queue runs longer than expected'
  - 'Comfortable density with breathing room for reassuring messaging'
  - 'Notification hint informs user they will be notified of the result'
