# Screen Spec: Subscription — Tasker Pro
screen_id: SCR-P3-004
name: "Subscription — Tasker Pro"
route: "/(tasker)/subscription"
role: [tasker]
phase: "3+"
template: detail
figma_page: "Phase 3+/Tasker Pro Subscription"
feature: "subscription"

layout:
  template: detail
  density: default
  structure: "safe_area -> nav_header -> scrollview(plan_hero + benefits + plan_cards) -> sticky_bottom_cta"

components:
  - id: COMP-CARD
    usage: "Plan cards showing Standard and Premium tiers with pricing and features"
    props:
      onPress: "select_plan"
    variant: elevated

  - id: COMP-VERIFICATIONBADGE
    usage: "Pro badge display showing current tier status"
    props:
      isVerified: true
      isPro: true
      size: "lg"
    variant: pro

  - id: COMP-STATUSBADGE
    usage: "Subscription status badge (active, cancelled, ineligible)"
    props:
      status: "completed"
    variant: completed

  - id: COMP-BUTTON
    usage: "Primary CTA to subscribe to selected plan"
    props:
      label: "Бүртгүүлэх"
      variant: primary
      size: lg
    variant: primary

  - id: COMP-BUTTON
    usage: "Danger button to cancel existing subscription"
    props:
      label: "Цуцлах"
      variant: danger
      size: md
    variant: danger

  - id: COMP-BUTTON
    usage: "Ghost back button"
    props:
      label: "Буцах"
      variant: ghost
      size: md
    variant: ghost

  - id: COMP-LOADINGSKELETON
    usage: "Detail skeleton for initial load"
    props:
      variant: detail
      count: 1
    variant: detail

  - id: COMP-MODALSHEET
    usage: "Confirmation sheet for subscription actions (subscribe/cancel)"
    props:
      visible: false
      title: "Баталгаажуулах"
    variant: default

  - id: COMP-EMPTYSTATE
    usage: "Ineligible state when tasker does not meet Pro badge requirements"
    props:
      illustration: "badge_locked"
      headline: "Шаардлага хангаагүй"
      description: "Tasker Pro бүртгэлд нийцэхийн тулд 4.5+ үнэлгээ шаардлагатай"
    variant: no_results

  - id: COMP-EMPTYSTATE
    usage: "Error state when subscription data fails to load"
    props:
      illustration: "error_subscription"
      headline: "Ачааллах боломжгүй"
      ctaLabel: "Дахин оролдох"
    variant: error

states:
  - id: loading_initial
    description: "Fetching subscription plans and current status from API"
    components_visible: [COMP-LOADINGSKELETON]
    components_hidden: [COMP-CARD, COMP-VERIFICATIONBADGE, COMP-STATUSBADGE, COMP-BUTTON, COMP-EMPTYSTATE, COMP-MODALSHEET]

  - id: eligible_view_plans
    description: "Tasker is eligible (Pro badge earned); plan options displayed for subscription"
    components_visible: [COMP-CARD, COMP-VERIFICATIONBADGE, COMP-BUTTON.primary, COMP-BUTTON.ghost]
    components_hidden: [COMP-LOADINGSKELETON, COMP-STATUSBADGE, COMP-BUTTON.danger, COMP-EMPTYSTATE, COMP-MODALSHEET]

  - id: active_standard
    description: "Tasker has an active Standard tier subscription"
    components_visible: [COMP-CARD, COMP-VERIFICATIONBADGE, COMP-STATUSBADGE, COMP-BUTTON.primary, COMP-BUTTON.danger, COMP-BUTTON.ghost]
    components_hidden: [COMP-LOADINGSKELETON, COMP-EMPTYSTATE, COMP-MODALSHEET]

  - id: active_premium
    description: "Tasker has an active Premium tier subscription"
    components_visible: [COMP-CARD, COMP-VERIFICATIONBADGE, COMP-STATUSBADGE, COMP-BUTTON.danger, COMP-BUTTON.ghost]
    components_hidden: [COMP-LOADINGSKELETON, COMP-BUTTON.primary, COMP-EMPTYSTATE, COMP-MODALSHEET]

  - id: ineligible_no_badge
    description: "Tasker does not have Pro badge (rating < 4.5); cannot subscribe"
    components_visible: [COMP-EMPTYSTATE.no_results, COMP-BUTTON.ghost]
    components_hidden: [COMP-LOADINGSKELETON, COMP-CARD, COMP-VERIFICATIONBADGE, COMP-STATUSBADGE, COMP-BUTTON.primary, COMP-BUTTON.danger, COMP-MODALSHEET]

  - id: cancelled_resubscribe
    description: "Subscription was cancelled; option to resubscribe shown"
    components_visible: [COMP-CARD, COMP-BUTTON.primary, COMP-BUTTON.ghost]
    components_hidden: [COMP-LOADINGSKELETON, COMP-VERIFICATIONBADGE, COMP-STATUSBADGE, COMP-BUTTON.danger, COMP-EMPTYSTATE, COMP-MODALSHEET]

  - id: error_network
    description: "Failed to load subscription data due to network error"
    components_visible: [COMP-EMPTYSTATE.error]
    components_hidden: [COMP-LOADINGSKELETON, COMP-CARD, COMP-VERIFICATIONBADGE, COMP-STATUSBADGE, COMP-BUTTON, COMP-MODALSHEET]

