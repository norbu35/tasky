api_endpoints:
  - method: GET
    path: "/subscriptions/plans"
    purpose: "Fetch available subscription plans with pricing and benefits"
  - method: POST
    path: "/subscriptions"
    purpose: "Subscribe to a plan or upgrade existing subscription"
  - method: DELETE
    path: "/subscriptions"
    purpose: "Cancel current subscription"

analytics_events:
  - event: "subscription_screen_viewed"
    trigger: "Subscription screen loaded (with state: eligible, active, ineligible, cancelled)"
  - event: "subscription_plan_selected"
    trigger: "User taps a plan card"
  - event: "subscription_subscribed"
    trigger: "User successfully subscribes to a plan"
  - event: "subscription_upgraded"
    trigger: "User upgrades from Standard to Premium"
  - event: "subscription_cancel_tapped"
    trigger: "User taps cancel button"
  - event: "subscription_cancelled"
    trigger: "User confirms cancellation"
  - event: "subscription_resubscribed"
    trigger: "Previously cancelled user resubscribes"
  - event: "subscription_ineligible_viewed"
    trigger: "Ineligible state shown (rating < 4.5)"

acceptance_criteria:
  - "Loading state shows detail skeleton matching subscription layout"
  - "Eligible state shows Standard and Premium plan cards with pricing and benefit comparison"
  - "Premium plan card has a 'Best' badge label"
  - "Active Standard state shows current plan status and option to upgrade to Premium"
  - "Active Premium state shows current plan status and cancel option only"
  - "Cancel action uses danger button variant and requires ModalSheet confirmation"
  - "Ineligible state shows locked badge illustration with rating requirement"
  - "Cancelled state shows resubscribe option with plan cards"
  - "Pro badge (VerificationBadge pro variant) displayed for eligible/active taskers"
  - "Plan prices use price_display typography (Manrope bold 20px) with ₮ prefix"
  - "Network error shows error state with retry CTA"
  - "Back button pops to previous screen"
  - "All copy renders correctly in Mongolian Cyrillic at 16px minimum body size"
