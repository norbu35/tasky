# Screen Spec: Booking Detail (Customer)
screen_id: SCR-CUST-017
name: 'Booking Detail (Customer)'
route: '/(customer)/bookings/:bookingId'
role: [customer]
phase: '0-1'
traceability:
  status: validated
  screen_graph_node: SCR-CUST-017
  prd_refs:
    - REQ-P1-BOOK-07
    - REQ-P1-BOOK-08
    - REQ-P1-BOOK-09
    - REQ-P1-BOOK-13
    - REQ-P1-BOOK-25
    - REQ-P1-MSG-02
  journey_refs:
    - JRN-CUST-04:step-2
    - JRN-CUST-04:step-3
    - JRN-CUST-04-A5
    - JRN-CUST-06:step-1
  scenario_refs:
    - SCN-SEC-007
    - SCN-MSG-003
    - SCN-BOOK-009
    - SCN-BOOK-026
template: detail
figma_page: 'Customer/Booking Detail Customer'
feature: 'booking'

layout:
  template: detail
  density: default
  structure: 'safe_area -> nav_header(back + title) -> scrollview(tasker_section + task_summary + schedule + actions) -> sticky_bottom_cta'

components:
  - id: COMP-PROFILEAVATAR
    usage: 'Tasker avatar with verification badge in the hero section'
    props:
      imageUrl: 'tasker.avatarUrl'
      size: lg
      isVerified: true
    variant: lg

  - id: COMP-STATUSBADGE
    usage: 'Booking status badge displayed prominently below the tasker info'
    props:
      status: assigned
      size: md
    variant: assigned

  - id: COMP-BUTTON
    usage: 'Primary CTA in sticky bottom bar; changes per state (Message, Confirm Complete, Leave Review, Report Issue)'
    props:
      label: 'Зурвас илгээх'
      variant: primary
      size: lg
    variant: primary

  - id: COMP-LOADINGSKELETON
    usage: 'Detail skeleton placeholder during initial data fetch'
    props:
      variant: detail
      count: 1
    variant: detail

  - id: COMP-TOAST
    usage: 'Error toast on network failure'
    props:
      message: 'Алдаа гарлаа'
      variant: error
    variant: error

  - id: COMP-TIMELINEEVENT
    usage: 'Quick timeline preview showing latest booking event; tappable to view full timeline'
    props:
      event: 'Захиалга баталгаажсан'
      timestamp: '2026-03-22 10:00'
      isCurrent: true
    variant: current

states:
  - id: loading_initial
    description: 'First load; detail skeleton shown while GET /bookings/:id is in progress'
    components_visible: [COMP-LOADINGSKELETON]
    components_hidden:
      [COMP-PROFILEAVATAR, COMP-STATUSBADGE, COMP-BUTTON, COMP-TIMELINEEVENT, COMP-TOAST]

  - id: assigned
    description: "Booking is ASSIGNED; tasker info, task summary, schedule, and action buttons visible. CTA bar shows 'Message' and secondary actions (Reschedule, Cancel, Timeline)"
    components_visible: [COMP-PROFILEAVATAR, COMP-STATUSBADGE, COMP-BUTTON, COMP-TIMELINEEVENT]
    components_hidden: [COMP-LOADINGSKELETON, COMP-TOAST]

  - id: assigned_approaching
    description: 'Booking is ASSIGNED and scheduled time is within 4 hours; late-cancel warning context shown, reschedule still available'
    components_visible: [COMP-PROFILEAVATAR, COMP-STATUSBADGE, COMP-BUTTON, COMP-TIMELINEEVENT]
    components_hidden: [COMP-LOADINGSKELETON, COMP-TOAST]

  - id: tasker_marked_done
    description: "Tasker has marked the job done; primary CTA changes to 'Confirm Complete'. Report Issue action also available"
    components_visible: [COMP-PROFILEAVATAR, COMP-STATUSBADGE, COMP-BUTTON, COMP-TIMELINEEVENT]
    components_hidden: [COMP-LOADINGSKELETON, COMP-TOAST]

  - id: completed
    description: 'Booking is COMPLETED; review prompt shown if not yet reviewed. Actions: Leave Review, View Timeline'
    components_visible: [COMP-PROFILEAVATAR, COMP-STATUSBADGE, COMP-BUTTON, COMP-TIMELINEEVENT]
    components_hidden: [COMP-LOADINGSKELETON, COMP-TOAST]

  - id: completed_reviewed
    description: 'Booking is COMPLETED and review is submitted; timeline and booking summary remain available'
    components_visible: [COMP-PROFILEAVATAR, COMP-STATUSBADGE, COMP-BUTTON, COMP-TIMELINEEVENT]
    components_hidden: [COMP-LOADINGSKELETON, COMP-TOAST]

  - id: cancelled
    description: 'Booking is CANCELLED; status badge shows cancelled, no further actions except View Timeline and Report Issue'
    components_visible: [COMP-PROFILEAVATAR, COMP-STATUSBADGE, COMP-TIMELINEEVENT]
    components_hidden: [COMP-LOADINGSKELETON, COMP-TOAST]

  - id: no_show
    description: 'Booking ended in NO_SHOW; status badge shows no-show, timeline visible, Report Issue available'
    components_visible: [COMP-PROFILEAVATAR, COMP-STATUSBADGE, COMP-TIMELINEEVENT]
    components_hidden: [COMP-LOADINGSKELETON, COMP-TOAST]

  - id: error_network
    description: 'Network error on data fetch; error toast with retry'
    components_visible: [COMP-TOAST]
    components_hidden:
      [COMP-PROFILEAVATAR, COMP-STATUSBADGE, COMP-BUTTON, COMP-TIMELINEEVENT, COMP-LOADINGSKELETON]

