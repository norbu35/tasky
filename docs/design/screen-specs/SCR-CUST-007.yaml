# Screen Spec: Post Task — Review & Submit
screen_id: SCR-CUST-007
name: 'Post Task — Review & Submit'
route: '/(customer)/tasks/new/review'
role: [customer]
phase: '0-1'
traceability:
  status: validated
  screen_graph_node: SCR-CUST-007
  prd_refs:
    - REQ-P1-TASK-06
    - REQ-P1-TASK-07
    - REQ-P1-TASK-08
    - REQ-P1-TASK-05
    - REQ-P1-PRICE-01
    - REQ-P1-KPI-04
  journey_refs:
    - JRN-CUST-01:step-7
    - JRN-CUST-01-A1
  scenario_refs:
    - SCN-TASK-014
    - SCN-TASK-015
    - SCN-TASK-020
    - SCN-ANALYTICS-001
template: detail
figma_page: 'Customer/Post Task Review Submit'
feature: 'task_posting'

layout:
  template: detail
  density: default
  structure: 'safe_area -> nav_header(back + title) -> step_indicator(step 6/7) -> scrollview(summary_sections) -> sticky_bottom_cta(submit)'

components:
  - id: COMP-STEPINDICATOR
    usage: 'Shows step 6 of 7 in the Post Task wizard flow'
    props:
      currentStep: 6
      totalSteps: 7
      labels: ['Ангилал', 'Маягт', 'Зураг', 'Байршил', 'Хуваарь', 'Хянах', 'Дуусгах']
    variant: horizontal

  - id: COMP-CARD
    usage: 'Summary sections displaying category, intake answers, photos, location, schedule, and pricing mode'
    props:
      onPress: null
    variant: outlined

  - id: COMP-STATUSBADGE
    usage: 'Category badge displayed in the summary header'
    props:
      status: 'open'
      size: 'sm'
    variant: open

  - id: COMP-BUTTON
    usage: 'Primary submit CTA at bottom; secondary edit links on each summary section'
    props:
      label: 'Даалгавар оруулах'
      variant: primary
      size: xl
      loading: false
    variant: primary

  - id: COMP-TOAST
    usage: 'Error toast when task submission fails'
    props:
      message: 'Даалгавар оруулахад алдаа гарлаа'
      variant: error
      duration: 6000
    variant: error

states:
  - id: review
    description: 'All task data displayed in summary sections; user reviews before submitting'
    components_visible: [COMP-STEPINDICATOR, COMP-CARD, COMP-STATUSBADGE, COMP-BUTTON]
    components_hidden: [COMP-TOAST]

  - id: submitting
    description: 'POST /tasks in progress; submit button shows loading spinner'
    components_visible: [COMP-STEPINDICATOR, COMP-CARD, COMP-BUTTON]
    components_hidden: [COMP-TOAST]

  - id: submit_error
    description: 'POST /tasks failed; error toast with retry action shown'
    components_visible: [COMP-STEPINDICATOR, COMP-CARD, COMP-BUTTON, COMP-TOAST]
    components_hidden: []

copy:
  - key: page_title
    mn: 'Хянах ба илгээх'
    en: 'Review & Submit'
    max_chars: 25

  - key: step_label
    mn: 'Хянах'
    en: 'Review'
    max_chars: 15

  - key: section_category
    mn: 'Ангилал'
    en: 'Category'
    max_chars: 15

  - key: section_details
    mn: 'Даалгаврын дэлгэрэнгүй'
    en: 'Task Details'
    max_chars: 25

  - key: section_scope_summary
    mn: 'Ажлын товч тайлбар'
    en: 'Job Scope Summary'
    max_chars: 25

  - key: section_photos
    mn: 'Зурагнууд'
    en: 'Photos'
    max_chars: 15

  - key: section_location
    mn: 'Байршил'
    en: 'Location'
    max_chars: 15

  - key: section_schedule
    mn: 'Хуваарь'
    en: 'Schedule'
    max_chars: 15

  - key: section_pricing
    mn: 'Үнэ'
    en: 'Pricing'
    max_chars: 15

  - key: edit_link
    mn: 'Засах'
    en: 'Edit'
    max_chars: 10

  - key: scope_summary_source_hint
    mn: 'Товч тайлбар нь маягтын хариултаас автоматаар үүснэ'
    en: 'The summary is generated from your structured answers'
    max_chars: 60

  - key: pricing_note
    mn: 'Төсөвтэй эсвэл үнийн санал авах горимын сонголт харагдана'
    en: 'Shows whether the task uses budget or quote mode'
    max_chars: 60

  - key: cta_submit
    mn: 'Даалгавар оруулах'
    en: 'Post Task'
    max_chars: 20

  - key: cta_back
    mn: 'Буцах'
    en: 'Back'
    max_chars: 10

  - key: error_submit
    mn: 'Даалгавар оруулахад алдаа гарлаа. Дахин оролдоно уу'
    en: 'Failed to post task. Please try again'
    max_chars: 60

api_endpoints:
  - method: POST
    path: '/tasks'
    purpose: 'Submit the complete task with all collected data including pricing mode'

analytics_events:
  - event: 'task_review_viewed'
    trigger: 'Review screen becomes visible with complete task summary'
  - event: 'task_submitted'
    trigger: 'User taps Post Task and POST /tasks succeeds; includes task_id'
  - event: 'task_submit_failed'
    trigger: 'POST /tasks failed; includes error type'
  - event: 'task_review_section_edit_tapped'
    trigger: 'User taps Edit on a summary section; includes section name'

acceptance_criteria:
  - "StepIndicator shows step 6 of 7 with 'Хянах' label highlighted"
  - 'Summary displays all collected data in outlined Card sections: category, intake answers, photos, location, schedule, pricing'
  - 'Job Scope Summary section is deterministically generated from intake answers and is not directly editable'
  - 'Each source section has an Edit link that navigates back to the corresponding wizard step so the generated summary updates from structured data'
  - 'Submit-time validation uses the draft-bound intake schema version even if a newer schema has been activated'
  - 'Budget mode shows the budget in ₮ format with comma separator; quote mode clearly indicates that taskers will send structured offers'
  - 'Location shows the pin text description and approximate area'
  - 'Photos show thumbnail previews of uploaded images'
  - 'Submit button enters loading state during POST /tasks'
  - 'On success, screen replaces to Task Posted Success SCR-CUST-008'
  - 'On failure, error toast appears with retry action'
  - 'Back button pops to Schedule & Budget SCR-CUST-006'
  - 'All copy renders correctly in Mongolian Cyrillic at 16px minimum body size'
