# Screen Spec: Applicants List
screen_id: SCR-CUST-011
name: 'Applicants List'
route: '/(customer)/tasks/:taskId/applicants'
role: [customer]
phase: '0-1'
template: feed_list
figma_page: 'Customer/Applicants List'
feature: 'matching'

layout:
  template: feed_list
  density: default
  structure: 'safe_area -> nav_header(back + title + applicant_count) -> scrollview(applicant_cards)'

components:
  - id: COMP-SPLITCARD
    usage: 'Applicant cards showing Tasker avatar, name, rating, review count, verification badge, and structured pricing response summary'
    props:
      headerContent: '{tasker_avatar, tasker_name, rating, review_count}'
      bodyContent: '{verification_badge, category_match, distance, pricing_response_summary}'
      status: 'open'
    variant: application

  - id: COMP-PROFILEAVATAR
    usage: 'Tasker profile avatar in each applicant card header'
    props:
      imageUrl: '{tasker_avatar}'
      size: 'md'
      isVerified: true
    variant: md

  - id: COMP-STARRATING
    usage: 'Tasker rating display (read-only) in each applicant card'
    props:
      value: 4.5
      readonly: true
      size: 'md'
    variant: display

  - id: COMP-VERIFICATIONBADGE
    usage: 'Verified identity badge on each applicant avatar'
    props:
      isVerified: true
      size: 'avatar_badge'
    variant: default

  - id: COMP-BUTTON
    usage: 'Select button per applicant card; opens the selection confirmation flow'
    props:
      label: 'Сонгох'
      variant: primary
      size: md
    variant: primary

  - id: COMP-EMPTYSTATE
    usage: 'Empty state when no applicants have applied yet'
    props:
      illustration: 'applicants_empty'
      headline: 'Одоогоор хүсэлт ирээгүй байна'
      description: 'Гүйцэтгэгчид хүсэлт илгээх болно. Мэдэгдэл авна'
      ctaLabel: null
    variant: no_results

  - id: COMP-LOADINGSKELETON
    usage: 'Card-shaped skeleton placeholders during initial load'
    props:
      variant: card
      count: 3
    variant: card

  - id: COMP-MODALSHEET
    usage: 'Select confirmation sheet before navigating to the booking-request confirmation screen'
    props:
      visible: false
      title: 'Гүйцэтгэгч сонгох'
      primaryAction: 'Баталгаажуулах'
      secondaryAction: 'Буцах'
    variant: default

states:
  - id: loading_initial
    description: 'GET /tasks/:id/applications in progress; skeleton cards shown'
    components_visible: [COMP-LOADINGSKELETON]
    components_hidden: [COMP-SPLITCARD, COMP-EMPTYSTATE, COMP-BUTTON, COMP-MODALSHEET]

  - id: empty
    description: 'Zero applicants; empty state with waiting message and notification promise'
    components_visible: [COMP-EMPTYSTATE]
    components_hidden: [COMP-SPLITCARD, COMP-LOADINGSKELETON, COMP-BUTTON, COMP-MODALSHEET]

  - id: populated_phase01
    description: 'Applications are listed and each card includes a select action'
    components_visible:
      [COMP-SPLITCARD, COMP-PROFILEAVATAR, COMP-STARRATING, COMP-VERIFICATIONBADGE, COMP-BUTTON]
    components_hidden: [COMP-EMPTYSTATE, COMP-LOADINGSKELETON, COMP-MODALSHEET]

  - id: populated_highlighted
    description: 'Optional highlighted view: the UI surfaces a suggested subset while still showing all applications'
    components_visible:
      [COMP-SPLITCARD, COMP-PROFILEAVATAR, COMP-STARRATING, COMP-VERIFICATIONBADGE, COMP-BUTTON]
    components_hidden: [COMP-EMPTYSTATE, COMP-LOADINGSKELETON, COMP-MODALSHEET]

  - id: select_confirm_sheet
    description: 'User tapped Select on an applicant; confirmation sheet displayed before proceeding'
    components_visible: [COMP-SPLITCARD, COMP-MODALSHEET]
    components_hidden: [COMP-EMPTYSTATE, COMP-LOADINGSKELETON]

  - id: error_network
    description: 'GET /tasks/:id/applications failed; error state with retry'
    components_visible: []
    components_hidden:
      [COMP-SPLITCARD, COMP-EMPTYSTATE, COMP-LOADINGSKELETON, COMP-BUTTON, COMP-MODALSHEET]

copy:
  - key: page_title
    mn: 'Хүсэлтүүд'
    en: 'Applications'
    max_chars: 15

  - key: applicant_count_header
    mn: '{count} хүсэлт'
    en: '{count} applications'
    max_chars: 20

  - key: recommended_label
    mn: 'Санал болгох'
    en: 'Suggested'
    max_chars: 15

  - key: rating_label
    mn: 'Үнэлгээ'
    en: 'Rating'
    max_chars: 10

  - key: reviews_count
    mn: '{count} сэтгэгдэл'
    en: '{count} reviews'
    max_chars: 20

  - key: verified_label
    mn: 'Баталгаажсан'
    en: 'Verified'
    max_chars: 15

  - key: empty_headline
    mn: 'Одоогоор хүсэлт ирээгүй байна'
    en: 'No applications yet'
    max_chars: 40

  - key: empty_description
    mn: 'Гүйцэтгэгчид таны даалгаврыг хянаж хүсэлт илгээх болно. Шинэ хүсэлт ирэхэд мэдэгдэл авна'
    en: 'Taskers are reviewing your task and will apply. You will be notified of new applications'
    max_chars: 120

  - key: cta_accept
    mn: 'Сонгох'
    en: 'Select'
    max_chars: 12

  - key: cta_view_profile
    mn: 'Профайл харах'
    en: 'View Profile'
    max_chars: 20

  - key: confirm_title
    mn: 'Энэ гүйцэтгэгчийг сонгох уу?'
    en: 'Select this Tasker?'
    max_chars: 30

  - key: confirm_body
    mn: 'Сонгосны дараа гүйцэтгэгчид зөвшөөрөх хүсэлт илгээгдэнэ'
    en: 'After selecting, the tasker will be asked to accept the booking request'
    max_chars: 90

  - key: confirm_cta
    mn: 'Баталгаажуулах'
    en: 'Confirm'
    max_chars: 20

  - key: confirm_cancel
    mn: 'Буцах'
    en: 'Go Back'
    max_chars: 10

  - key: error_network
    mn: 'Хүсэлтүүдийг ачаалахад алдаа гарлаа'
    en: 'Failed to load applications'
    max_chars: 40

api_endpoints:
  - method: GET
    path: '/tasks/:id/applications'
    purpose: 'Fetch the list of applications for this task'

analytics_events:
  - event: 'applicants_list_viewed'
    trigger: 'Screen becomes visible; includes task_id and applicant_count'
  - event: 'applicant_profile_tapped'
    trigger: 'User taps an applicant card to view profile; includes tasker_id'
  - event: 'applicant_accept_tapped'
    trigger: 'User taps Select on an applicant; includes task_id and tasker_id'
  - event: 'applicant_accept_confirmed'
    trigger: 'User confirms the selection in the bottom sheet'
  - event: 'applicant_accept_cancelled'
    trigger: 'User dismisses the selection confirmation sheet'

acceptance_criteria:
  - 'Applicant cards use SplitCard application variant with Tasker avatar, name, rating, review count, and verification badge'
  - 'Each applicant card has a tappable area to view Tasker profile (push to SCR-CUST-013) and a Select button'
  - 'Customers can review all applications, and the UI may optionally highlight a suggested subset without hiding the rest'
  - 'Tapping Select opens a confirmation bottom sheet before proceeding'
  - 'Confirming Select navigates (push) to Booking Request Confirmation SCR-CUST-014'
  - 'After a customer selects one applicant, the selected tasker has the default four-hour response window to accept or decline'
  - 'Decline or response-window expiry triggers SCR-CUST-012'
  - 'Empty state shows waiting message with notification promise'
  - 'Back button pops to Task Detail SCR-CUST-009'
  - 'Network error shows error state with retry'
  - 'All copy renders correctly in Mongolian Cyrillic at 16px minimum body size'
