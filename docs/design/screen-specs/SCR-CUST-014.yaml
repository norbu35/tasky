# Screen Spec: Booking Request Confirmation
screen_id: SCR-CUST-014
name: 'Booking Request Confirmation'
route: '/(customer)/bookings/confirm'
role: [customer]
phase: '0-1'
template: detail
figma_page: 'Customer/Booking Request Confirmation'
feature: 'booking'

layout:
  template: detail
  density: default
  structure: 'safe_area -> nav_header(back + title) -> scrollview(tasker_summary + task_summary + pricing + disclaimer + response_window_note) -> sticky_bottom_cta(confirm)'

components:
  - id: COMP-PROFILEAVATAR
    usage: 'Selected Tasker avatar shown in the booking request summary header'
    props:
      imageUrl: '{tasker_avatar}'
      size: 'lg'
      isVerified: true
    variant: lg

  - id: COMP-VERIFICATIONBADGE
    usage: 'Verified identity badge on selected Tasker avatar'
    props:
      isVerified: true
      size: 'avatar_badge'
    variant: default

  - id: COMP-STARRATING
    usage: 'Selected Tasker public rating displayed only when public reputation is above the minimum review threshold'
    props:
      value: 4.7
      readonly: true
      size: 'md'
    variant: display

  - id: COMP-CARD
    usage: 'Summary sections for selected Tasker info, task details, pricing, liability disclaimer, and response-window note'
    props:
      onPress: null
    variant: outlined

  - id: COMP-BUTTON
    usage: 'Primary CTA to send the booking request to the selected Tasker'
    props:
      label: 'Сонгоод хүсэлт илгээх'
      variant: primary
      size: xl
      loading: false
    variant: primary

  - id: COMP-TOAST
    usage: 'Error toast when the booking request submission fails'
    props:
      message: 'Гүйцэтгэгч сонгоход алдаа гарлаа'
      variant: error
      duration: 6000
    variant: error

states:
  - id: default
    description: 'Booking request summary displayed with Tasker info, task details, and disclaimer requiring review'
    components_visible:
      [COMP-PROFILEAVATAR, COMP-VERIFICATIONBADGE, COMP-STARRATING, COMP-CARD, COMP-BUTTON]
    components_hidden: [COMP-TOAST]

  - id: disclaimer_review
    description: 'User is reviewing the liability disclaimer; confirm button becomes enabled after acknowledgment'
    components_visible:
      [COMP-PROFILEAVATAR, COMP-VERIFICATIONBADGE, COMP-STARRATING, COMP-CARD, COMP-BUTTON]
    components_hidden: [COMP-TOAST]

  - id: confirming
    description: 'Selection request is being submitted; confirm button shows loading spinner'
    components_visible:
      [COMP-PROFILEAVATAR, COMP-VERIFICATIONBADGE, COMP-STARRATING, COMP-CARD, COMP-BUTTON]
    components_hidden: [COMP-TOAST]

  - id: error_network
    description: 'Selection request failed; error toast with retry action'
    components_visible:
      [
        COMP-PROFILEAVATAR,
        COMP-VERIFICATIONBADGE,
        COMP-STARRATING,
        COMP-CARD,
        COMP-BUTTON,
        COMP-TOAST,
      ]
    components_hidden: []

copy:
  - key: page_title
    mn: 'Гүйцэтгэгч сонгох'
    en: 'Select Tasker'
    max_chars: 25

  - key: section_tasker
    mn: 'Гүйцэтгэгч'
    en: 'Tasker'
    max_chars: 15

  - key: section_task
    mn: 'Даалгавар'
    en: 'Task'
    max_chars: 15

  - key: section_schedule
    mn: 'Хуваарь'
    en: 'Schedule'
    max_chars: 15

  - key: section_pricing
    mn: 'Үнэ'
    en: 'Pricing'
    max_chars: 15

  - key: section_disclaimer
    mn: 'Хариуцлагын мэдэгдэл'
    en: 'Liability Disclaimer'
    max_chars: 25

  - key: disclaimer_text
    mn: 'Tasky нь захиалагч болон гүйцэтгэгчийг холбох платформ юм. Төлбөр нь захиалга баталгаажсаны дараа талуудын хооронд шууд тохиролцогдоно. Платформ нь төлбөр зуучлагч биш бөгөөд төлбөр хамгаалах амлалт өгөхгүй.'
    en: 'Tasky connects customers and taskers. After booking confirmation, payment is arranged directly between the parties. The platform is not a payment intermediary and does not promise payment hold or payment protection.'
    max_chars: 220

  - key: disclaimer_acknowledge
    mn: 'Би энэ нөхцлийг зөвшөөрч байна'
    en: 'I agree to these terms'
    max_chars: 40

  - key: payment_note
    mn: 'Захиалга баталгаажсаны дараа үнэ түгжигдэж, төлбөрийг шууд тохиролцоно'
    en: 'After confirmation, the agreed price is locked and paid directly between the parties'
    max_chars: 80

  - key: response_window_note
    mn: 'Сонгосон гүйцэтгэгч 4 цагийн дотор зөвшөөрөх ёстой'
    en: 'The selected tasker must accept within 4 hours'
    max_chars: 60

  - key: cta_confirm
    mn: 'Сонгоод хүсэлт илгээх'
    en: 'Select and Send Request'
    max_chars: 30

  - key: cta_back
    mn: 'Буцах'
    en: 'Back'
    max_chars: 10

  - key: error_confirm
    mn: 'Гүйцэтгэгч сонгоход алдаа гарлаа. Дахин оролдоно уу'
    en: 'Failed to send the booking request. Please try again'
    max_chars: 70

api_endpoints:
  - method: POST
    path: '/tasks/:id/applications/:applicationId/accept'
    purpose: 'Create a booking-selection intent for the selected applicant after liability disclaimer acceptance'

analytics_events:
  - event: 'booking_confirmation_viewed'
    trigger: 'Screen becomes visible; includes task_id and selected_tasker_id'
  - event: 'disclaimer_acknowledged'
    trigger: 'User checks the disclaimer acknowledgment checkbox'
  - event: 'booking_request_sent'
    trigger: 'User taps Select and Send Request and the selection intent is created; includes booking_intent_id'
  - event: 'booking_confirm_failed'
    trigger: 'Selection request submission fails; includes error type'

acceptance_criteria:
  - 'Summary shows selected Tasker with avatar, name, and VerificationBadge; public rating appears only when thresholded reputation is available'
  - 'Task summary shows category, title or description, approximate location, schedule (YYYY.MM.DD), and pricing'
  - 'Pricing summary preserves the posted budget and any structured counter-offer, or shows the submitted quote when the task was posted in quote mode'
  - 'Liability disclaimer section is prominently displayed and must be explicitly acknowledged before continuing'
  - 'Confirm button is disabled until disclaimer is acknowledged'
  - 'Payment note states that price locks only after booking confirmation and settlement remains direct between the parties'
  - 'Confirm button enters loading state during POST /tasks/:id/applications/:applicationId/accept'
  - 'On success, screen replaces to Selection Sent Success SCR-CUST-015'
  - 'On failure, error toast appears with retry action'
  - 'Back button pops to Applicants List SCR-CUST-011'
  - 'Successful submission creates a pending selection request, not a confirmed booking'
  - 'Booking confirmation requires the selected Tasker to accept within the default four-hour SLA'
  - 'All copy renders correctly in Mongolian Cyrillic at 16px minimum body size'
