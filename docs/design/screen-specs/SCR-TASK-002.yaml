# Screen Spec: Task Detail (Tasker)
screen_id: SCR-TASK-002
name: 'Task Detail (Tasker)'
route: '/(tasker)/tasks/:taskId'
role: [tasker]
phase: '0-1'
traceability:
  status: validated
  screen_graph_node: SCR-TASK-002
  prd_refs:
    - REQ-P1-MATCH-01
    - REQ-P1-MATCH-02
    - REQ-P1-MATCH-05
    - REQ-P1-MATCH-06
    - REQ-P1-MATCH-07
    - REQ-P1-SAFE-03
    - REQ-P1-TASK-09
    - REQ-P1-TASK-10
    - REQ-P1-PRICE-02
    - REQ-P1-PRICE-04
    - REQ-P1-PRICE-06
    - REQ-P1-MSG-01
  journey_refs:
    - JRN-TASK-01:step-1
    - JRN-TASK-02:step-2
    - JRN-TASK-02:step-3
    - JRN-TASK-02-A1
    - JRN-TASK-02-A2
    - JRN-TASK-02-A3
    - JRN-TASK-02-A5
  scenario_refs:
    - SCN-TASK-009
    - SCN-TASK-010
    - SCN-TASK-022
    - SCN-TASK-023
    - SCN-TASK-025
    - SCN-TASK-026
    - SCN-TASK-027
    - SCN-TASK-028
    - SCN-TASK-032
    - SCN-SEC-006
    - SCN-SEC-007
template: detail
figma_page: 'Tasker/Task Detail Tasker'
feature: 'task-browse'

layout:
  template: detail
  density: default
  structure: 'safe_area -> nav_header(back + title) -> scrollview(task_hero + customer_info + description + photos + location_approximate + schedule_pricing + trust_banner) -> sticky_bottom_cta(apply_button)'

components:
  - id: COMP-BUTTON
    usage: "Primary CTA at bottom — 'Apply' for verified taskers, 'Get Verified' for unverified"
    props:
      label: 'Анкет илгээх'
      variant: primary
      size: xl
      disabled: false
    variant: primary

  - id: COMP-BUTTON
    usage: "Secondary CTA in already-applied state — 'Withdraw application' before customer selection"
    props:
      label: 'Анкетаа буцаах'
      variant: outline
      size: lg
      disabled: false
    variant: outline

  - id: COMP-STATUSBADGE
    usage: "Task status badge showing 'Нээлттэй' (Open)"
    props:
      status: 'open'
      size: 'md'
    variant: open

  - id: COMP-PROFILEAVATAR
    usage: "Customer's profile avatar in task hero section"
    props:
      imageUrl: 'customer_avatar_url'
      size: 'md'
      isVerified: false
    variant: md

  - id: COMP-CATEGORYCHIP
    usage: "Category label chip showing the task's service category"
    props:
      category: 'Цэвэрлэгээ'
      isActive: true
    variant: active

  - id: COMP-TRUSTBANNER
    usage: 'Trust messaging reinforcing platform safety on detail view'
    props:
      verifiedCount: 128
      completedCount: 540
    variant: compact

  - id: COMP-LOADINGSKELETON
    usage: 'Detail skeleton placeholder during initial data fetch'
    props:
      variant: detail
      count: 1
    variant: detail

states:
  - id: loading_initial
    description: 'Task detail is loading — skeleton placeholder shown'
    components_visible: [nav_header, loading_skeleton]
    components_hidden: [task_content, apply_button, trust_banner]

  - id: viewable_unverified
    description: "Unverified tasker can view task details but cannot apply — CTA says 'Get Verified'"
    components_visible:
      [
        nav_header,
        task_content,
        customer_info,
        photos,
        location,
        schedule_pricing,
        trust_banner,
        verify_cta,
      ]
    components_hidden: [apply_button, already_applied_badge, application_closed_notice]

  - id: apply_verified
    description: 'Verified tasker can view full detail and apply — primary CTA enabled'
    components_visible:
      [
        nav_header,
        task_content,
        customer_info,
        photos,
        location,
        schedule_pricing,
        trust_banner,
        apply_button,
      ]
    components_hidden: [verify_cta, already_applied_badge, application_closed_notice]

  - id: already_applied
    description: 'Tasker has already applied to this task before customer selection — apply button replaced with status indicator and withdraw action'
    components_visible:
      [
        nav_header,
        task_content,
        customer_info,
        photos,
        location,
        schedule_pricing,
        trust_banner,
        already_applied_badge,
        withdraw_application_button,
      ]
    components_hidden: [apply_button, verify_cta, application_closed_notice]

  - id: closed_to_applications
    description: 'Task is no longer accepting applications — apply button disabled with explanation'
    components_visible:
      [
        nav_header,
        task_content,
        customer_info,
        photos,
        location,
        schedule_pricing,
        trust_banner,
        application_closed_notice,
      ]
    components_hidden: [apply_button, verify_cta, already_applied_badge]

  - id: error_network
    description: 'Failed to load task detail — network error with retry'
    components_visible: [nav_header, error_message, retry_button]
    components_hidden: [task_content, apply_button, trust_banner, loading_skeleton]

copy:
  - key: page_title
    mn: 'Даалгаврын дэлгэрэнгүй'
    en: 'Task Detail'
    max_chars: 25

  - key: apply_button
    mn: 'Анкет илгээх'
    en: 'Apply'
    max_chars: 15

  - key: verify_cta
    mn: 'Баталгаажуулалт хийх'
    en: 'Get Verified'
    max_chars: 25

  - key: pricing_label
    mn: 'Үнэ / Үнийн нөхцөл'
    en: 'Pricing'
    max_chars: 18

  - key: schedule_label
    mn: 'Хуваарь'
    en: 'Schedule'
    max_chars: 10

  - key: location_label
    mn: 'Байршил'
    en: 'Location'
    max_chars: 10

  - key: location_approximate_note
    mn: 'Ойролцоо байршил (захиалга баталгаажсны дараа тодорхой хаяг харагдана)'
    en: 'Approximate location (exact address shown after booking confirmed)'
    max_chars: 80

  - key: description_label
    mn: 'Тайлбар'
    en: 'Description'
    max_chars: 15

  - key: photos_label
    mn: 'Зурагнууд'
    en: 'Photos'
    max_chars: 10

  - key: customer_label
    mn: 'Захиалагч'
    en: 'Customer'
    max_chars: 15

  - key: applicant_count
    mn: '{count} хүн анкет илгээсэн'
    en: '{count} applicants'
    max_chars: 30

  - key: already_applied_badge
    mn: 'Анкет илгээсэн'
    en: 'Applied'
    max_chars: 15

  - key: application_closed_notice
    mn: 'Энэ даалгавар анкет авахаа зогсоосон байна'
    en: 'Task is no longer accepting applications'
    max_chars: 45

  - key: withdraw_application_button
    mn: 'Анкетаа буцаах'
    en: 'Withdraw application'
    max_chars: 25

  - key: withdraw_application_note
    mn: 'Сонгогдохоос өмнө анкетаа буцааж болно'
    en: 'You can withdraw before the customer selects you'
    max_chars: 70

  - key: posted_time
    mn: '{time} өмнө нийтлэгдсэн'
    en: 'Posted {time} ago'
    max_chars: 30

  - key: error_network
    mn: 'Интернэт холболтоо шалгана уу'
    en: 'Please check your internet connection'
    max_chars: 45

  - key: retry
    mn: 'Дахин оролдох'
    en: 'Retry'
    max_chars: 15

api_endpoints:
  - method: GET
    path: '/tasks/:id'
    purpose: 'Fetch full task detail including description, photos, location, schedule, and pricing summary'
  - method: POST
    path: '/tasks/:id/applications'
    purpose: 'Submit application to the task (verified taskers only)'
  - method: POST
    path: '/tasks/:id/applications/:applicationId/withdraw'
    purpose: 'Withdraw the current tasker application before customer selection'

analytics_events:
  - event: 'task_detail_viewed'
    trigger: 'Task Detail screen becomes visible'
  - event: 'task_apply_tapped'
    trigger: 'Verified tasker taps Apply button'
  - event: 'task_apply_blocked_unverified'
    trigger: 'Unverified tasker taps Get Verified CTA'
  - event: 'task_apply_blocked_closed'
    trigger: 'Apply action blocked because the task is no longer accepting applications'
  - event: 'task_application_withdraw_tapped'
    trigger: 'Tasker taps Withdraw application in already-applied state'
  - event: 'task_application_withdrawn'
    trigger: 'Withdraw application request succeeds'
  - event: 'task_detail_photos_viewed'
    trigger: 'User scrolls through task photos'

acceptance_criteria:
  - 'Task detail displays title, description, photos, approximate location, schedule, and pricing summary'
  - 'Location is shown as approximate area (fuzzed 500m) per PRD — exact address only after booking'
  - "Verified taskers see enabled 'Анкет илгээх' primary CTA at bottom"
  - 'Task detail does not expose open-ended pre-booking chat; any messaging channel remains post-confirmation only'
  - 'Application choice is supported by structured task, pricing, and scope fields, not pre-booking chat'
  - 'Phase 1 application eligibility uses global verified status only; category-specific vetting and service-area preferences do not block applying'
  - "Unverified taskers see 'Баталгаажуулалт хийх' CTA that navigates to Verification Gate (SCR-TASK-003)"
  - 'Tapping Apply for a verified tasker triggers application POST and navigates to Application Sent (SCR-TASK-011)'
  - "Already applied state replaces apply button with 'Анкет илгээсэн' badge and shows a Withdraw application CTA while the application is not selected"
  - 'Withdrawing calls POST /tasks/:id/applications/:applicationId/withdraw and removes the tasker application from the customer selectable list'
  - 'Application-closed state disables apply with explanatory notice when the task is no longer accepting applications'
  - 'Customer avatar and name are displayed in customer info section'
  - 'Pricing summary displays either posted budget or quote-request state using the correct price or label treatment'
  - 'Back button in nav header returns to Task Feed (SCR-TASK-001)'
  - "Application count is shown (e.g., '5 хүн анкет илгээсэн')"
  - 'Loading state uses detail skeleton matching content layout'
  - 'Network error displays retry button'
