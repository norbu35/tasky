# Screen Spec: Booking Detail (Tasker)
screen_id: SCR-TASK-013
name: 'Booking Detail (Tasker)'
route: '/(tasker)/jobs/:bookingId'
role: [tasker]
phase: '0-1'
template: detail
figma_page: 'Tasker/Booking Detail Tasker'
feature: 'tasker-bookings'

layout:
  template: detail
  density: default
  structure: 'safe_area -> nav_header(back + title) -> scrollview(status_section + customer_info + task_description + exact_address + schedule + payment_note + action_section) -> sticky_bottom_cta(primary_action)'

components:
  - id: COMP-BUTTON
    usage: "Primary CTA — context-dependent: 'Mark Done' when work is complete, 'Message' when assigned"
    props:
      label: 'Ажил дууссан'
      variant: primary
      size: xl
    variant: primary

  - id: COMP-BUTTON
    usage: 'Secondary CTA — Message customer'
    props:
      label: 'Зурвас илгээх'
      variant: outline
      size: lg
    variant: outline

  - id: COMP-BUTTON
    usage: 'Danger ghost link to cancel the booking'
    props:
      label: 'Захиалга цуцлах'
      variant: ghost
      size: md
    variant: ghost

  - id: COMP-BUTTON
    usage: 'Ghost link to leave a review when review debt exists'
    props:
      label: 'Үнэлгээ өгөх'
      variant: outline
      size: lg
    variant: outline

  - id: COMP-STATUSBADGE
    usage: 'Booking status badge — Assigned, Completed, Cancelled, No-Show'
    props:
      status: 'assigned'
      size: 'lg'
    variant: assigned

  - id: COMP-PROFILEAVATAR
    usage: "Customer's profile avatar with verification indicator"
    props:
      imageUrl: 'customer_avatar_url'
      size: 'lg'
      isVerified: false
    variant: lg

  - id: COMP-LOADINGSKELETON
    usage: 'Detail skeleton during initial load'
    props:
      variant: detail
      count: 1
    variant: detail

states:
  - id: loading_initial
    description: 'Booking detail loading — skeleton placeholder shown'
    components_visible: [nav_header, loading_skeleton]
    components_hidden: [booking_content, action_buttons]

  - id: assigned
    description: 'Booking is assigned — customer info, task details, and exact address visible; Message and Cancel CTAs available'
    components_visible:
      [
        nav_header,
        status_badge_assigned,
        customer_info,
        task_description,
        exact_address,
        schedule,
        payment_note,
        message_button,
        cancel_link,
      ]
    components_hidden: [mark_done_button, review_button, completion_status, no_show_status]

  - id: assigned_approaching
    description: 'Scheduled time is approaching — countdown or reminder prominently displayed alongside assigned content'
    components_visible:
      [
        nav_header,
        status_badge_assigned,
        approaching_reminder,
        customer_info,
        task_description,
        exact_address,
        schedule_highlighted,
        payment_note,
        message_button,
        cancel_link,
      ]
    components_hidden: [mark_done_button, review_button]

  - id: mark_done_available
    description: "Work is in progress or complete — 'Mark Done' primary CTA becomes available"
    components_visible:
      [
        nav_header,
        status_badge_assigned,
        customer_info,
        task_description,
        exact_address,
        schedule,
        payment_note,
        mark_done_button,
        message_button,
      ]
    components_hidden: [cancel_link, review_button]

  - id: marked_done_awaiting
    description: 'Tasker has marked work done — awaiting customer confirmation'
    components_visible:
      [
        nav_header,
        status_badge_assigned,
        awaiting_confirmation_banner,
        customer_info,
        task_description,
        schedule,
        payment_note,
        message_button,
      ]
    components_hidden: [mark_done_button, cancel_link, review_button]

  - id: completed
    description: 'Booking is completed — review CTA shown, all details in read-only mode'
    components_visible:
      [
        nav_header,
        status_badge_completed,
        customer_info,
        task_description,
        schedule,
        payment_note,
        review_button,
      ]
    components_hidden: [mark_done_button, cancel_link, exact_address, message_button]

  - id: cancelled
    description: 'Booking was cancelled — cancellation reason and details shown'
    components_visible:
      [
        nav_header,
        status_badge_cancelled,
        cancellation_info,
        customer_info,
        task_description,
        schedule,
      ]
    components_hidden:
      [mark_done_button, cancel_link, review_button, message_button, exact_address, payment_note]

  - id: no_show
    description: 'Booking ended in no-show — no-show details and resolution info shown'
    components_visible:
      [nav_header, status_badge_no_show, no_show_info, customer_info, task_description, schedule]
    components_hidden:
      [mark_done_button, cancel_link, review_button, message_button, exact_address, payment_note]

  - id: error_network
    description: 'Network error loading booking detail — retry option'
    components_visible: [nav_header, error_message, retry_button]
    components_hidden: [booking_content, action_buttons, loading_skeleton]

