api_endpoints:
  - method: GET
    path: '/bookings/:id'
    purpose: 'Fetch full booking detail including customer info, task, address, schedule'
  - method: PUT
    path: '/bookings/:id/mark-done'
    purpose: 'Mark booking as done — triggers customer confirmation flow'

analytics_events:
  - event: 'booking_detail_tasker_viewed'
    trigger: 'Booking Detail (Tasker) screen becomes visible'
  - event: 'booking_mark_done_tapped'
    trigger: 'Tasker taps Mark Done button'
  - event: 'booking_mark_done_confirmed'
    trigger: 'Mark Done API call succeeds'
  - event: 'booking_message_tapped'
    trigger: 'Tasker taps Message button'
  - event: 'booking_cancel_tapped'
    trigger: 'Tasker taps Cancel Booking link'
  - event: 'booking_review_tapped'
    trigger: 'Tasker taps Leave Review button when review debt exists'

acceptance_criteria:
  - 'Exact address is shown only after booking is assigned and visible only to the confirmed tasker'
  - 'Exact address section includes note that it is visible only to the tasker'
  - 'Payment note clearly states direct settlement between parties'
  - 'Locked price display adapts to the task pricing mode and agreed booking price'
  - 'Mark Done button triggers PUT /bookings/:id/mark-done'
  - 'After marking done, awaiting confirmation banner replaces Mark Done button'
  - 'Cancel link opens Booking Cancel modal (SCR-TASK-015)'
  - 'No-show flag modal (SCR-TASK-014) is triggered based on schedule timing'
  - 'Message button navigates to Chat Detail (SCR-SHARED-011)'
  - 'Leave Review button navigates to Review Form (SCR-SHARED-017) when review debt exists'
  - 'Approaching reminder highlights when within 2 hours of scheduled time'
  - 'Completed state shows booking in read-only mode with review CTA'
  - 'Cancelled and No-Show states show relevant details and reason'
  - 'Back button returns to My Jobs (SCR-TASK-012)'
  - 'Budget displayed in price_display typography (₮XX,XXX format)'
