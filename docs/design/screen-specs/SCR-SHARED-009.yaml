# Screen Spec: Permission Primer — Notifications
screen_id: SCR-SHARED-009
name: "Permission Primer — Notifications"
route: "/onboarding/permission-notifications"
role: [customer, tasker]
phase: "0-1"
template: modal_sheet
figma_page: "Shared/Permission Primer Notifications"
feature: "onboarding"

layout:
  template: modal_sheet
  density: comfortable
  structure: "scrim -> sheet(handle_bar + icon + heading + description + primary_action + secondary_action)"

components:
  - id: COMP-MODALSHEET
    usage: "Bottom sheet explaining why push notification permission is needed"
    props:
      visible: true
      title: "Мэдэгдлийн зөвшөөрөл"
    variant: default

  - id: COMP-BUTTON
    usage: "Primary CTA to trigger the OS push notification permission dialog"
    props:
      label: "Зөвшөөрөх"
      variant: primary
      size: xl
    variant: primary

  - id: COMP-BUTTON
    usage: "Secondary action to skip notification permission"
    props:
      label: "Дараа хийх"
      variant: ghost
      size: md
    variant: ghost

states:
  - id: default
    description: "Permission primer shown explaining why notifications are important"
    components_visible: [bell_icon, heading, description, allow_button, skip_link]
    components_hidden: [granted_message, denied_message]

  - id: granted
    description: "Notification permission granted by the OS; screen auto-advances to home"
    components_visible: [bell_icon, granted_message]
    components_hidden: [heading, description, allow_button, skip_link, denied_message]

  - id: denied
    description: "Notification permission denied by the OS; fallback guidance shown"
    components_visible: [bell_icon, denied_message, settings_hint, continue_button]
    components_hidden: [heading, description, allow_button, skip_link, granted_message]

copy:
  - key: heading
    mn: "Мэдэгдлийн зөвшөөрөл"
    en: "Notification Permission"
    max_chars: 30

  - key: description
    mn: "Шинэ өргөдөл, захиалгын мэдээллийг цаг тухайд нь авахын тулд мэдэгдлийг зөвшөөрнө үү"
    en: "Allow notifications to get timely updates on applications and bookings"
    max_chars: 100

  - key: allow_button_label
    mn: "Зөвшөөрөх"
    en: "Allow"
    max_chars: 15

  - key: skip_label
    mn: "Дараа хийх"
    en: "Do it later"
    max_chars: 15

  - key: granted_message
    mn: "Мэдэгдэл зөвшөөрөгдлөө"
    en: "Notifications enabled"
    max_chars: 30

  - key: denied_message
    mn: "Мэдэгдлийн зөвшөөрөл хаагдсан"
    en: "Notification permission denied"
    max_chars: 40

  - key: settings_hint
    mn: "Тохиргооноос мэдэгдлийг нээх боломжтой"
    en: "You can enable notifications in Settings"
    max_chars: 55

  - key: continue_label
    mn: "Үргэлжлүүлэх"
    en: "Continue"
    max_chars: 15

api_endpoints: []

analytics_events:
  - event: "permission_primer_notifications_viewed"
    trigger: "Notification permission primer becomes visible"
  - event: "permission_notifications_allow_tapped"
    trigger: "User taps Allow button"
  - event: "permission_notifications_granted"
    trigger: "OS returns granted status for notifications"
  - event: "permission_notifications_denied"
    trigger: "OS returns denied status for notifications"
  - event: "permission_notifications_skipped"
    trigger: "User taps 'Do it later'"
  - event: "onboarding_flow_completed"
    trigger: "User exits notification primer and proceeds to home screen"

acceptance_criteria:
  - "Bottom sheet displays bell icon, explanation heading, and description"
  - "Allow button triggers the OS native push notification permission dialog"
  - "If role is CUSTOMER, screen replaces to My Tasks (SCR-CUST-001) after grant/skip"
  - "If role is TASKER, screen replaces to Task Feed (SCR-TASK-001) after grant/skip"
  - "If denied, fallback message shows with a hint to open device Settings"
  - "Skip link allows user to proceed without granting permission"
  - "This is the final onboarding step; completing it marks onboarding as done"
  - "Sheet has drag handle but is not dismissible by dragging (onboarding context)"
  - "No API calls are made on this screen"
  - "Notifications are critical for booking updates and application alerts"
