# Screen Spec: Browse — Task Feed
screen_id: SCR-TASK-001
name: 'Browse — Task Feed'
route: '/(tasker)/browse'
role: [tasker]
phase: '0-1'
traceability:
  status: validated
  screen_graph_node: SCR-TASK-001
  prd_refs:
    - REQ-P1-MATCH-01
    - REQ-P1-TASK-09
    - REQ-P1-COVER-02
    - REQ-P1-SAFE-04
    - NFR-API-01
  journey_refs:
    - JRN-TASK-02:step-1
    - JRN-TASK-02-A4
  scenario_refs:
    - SCN-TASK-007
    - SCN-TASK-008
    - SCN-TASK-012
    - SCN-TASK-013
    - SCN-NOTIF-001
template: feed_list
figma_page: 'Tasker/Browse Task Feed'
feature: 'task-browse'

layout:
  template: feed_list
  density: default
  structure: 'safe_area -> sticky_header(search_bar + filter_bar) -> scrollview(split_cards + trust_banner) -> pagination_footer'

components:
  - id: COMP-SEARCHBAR
    usage: 'Text search at top of feed for keyword filtering of task titles and descriptions'
    props:
      placeholder: 'Даалгавар хайх...'
      onFilterPress: true
    variant: with_filter

  - id: COMP-FILTERBAR
    usage: 'Horizontal scrolling category chips and distance filter below search bar; filters change the view only and do not gate application eligibility'
    props:
      filters: [category, distance]
      activeFilters: []
    variant: inline

  - id: COMP-SPLITCARD
    usage: 'Primary task card in feed — dark teal header with customer avatar + pricing summary, light body with task title, category, location, and time'
    props:
      headerContent: { avatar: 'customer_avatar', price: '₮45,000' }
      bodyContent:
        {
          title: 'Гэрийн цэвэрлэгээ',
          category: 'Цэвэрлэгээ',
          distance: '2.3 км',
          timeAgo: '15 минутын өмнө',
        }
      status: 'open'
      isUrgent: false
    variant: task

  - id: COMP-TRUSTBANNER
    usage: 'Trust messaging banner shown at top of feed — verified tasker count and completed bookings'
    props:
      verifiedCount: 128
      completedCount: 540
    variant: default

  - id: COMP-EMPTYSTATE
    usage: 'Shown when no open tasks match the current view filters'
    props:
      illustration: 'empty_tasks'
      headline: 'Одоогоор даалгавар байхгүй байна'
      description: 'Шүүлтүүрээ өөрчилж, эсвэл дараа дахин шалгана уу'
      ctaLabel: 'Шүүлтүүр цэвэрлэх'
    variant: no_results

  - id: COMP-LOADINGSKELETON
    usage: 'Skeleton placeholders matching SplitCard layout during initial load and pagination'
    props:
      variant: card
      count: 4
    variant: card

  - id: COMP-CATEGORYCHIP
    usage: 'Individual category filter chips within FilterBar for quick task filtering'
    props:
      category: 'Цэвэрлэгээ'
      isActive: false
    variant: inactive

states:
  - id: loading_initial
    description: 'First load of task feed — skeleton cards displayed while fetching from API'
    components_visible: [search_bar, filter_bar, loading_skeleton]
    components_hidden: [split_cards, empty_state, trust_banner, pagination_footer]

  - id: empty_activation
    description: 'No open tasks match the current category or distance view filters; activation empty state with guidance'
    components_visible: [search_bar, filter_bar, empty_state]
    components_hidden: [split_cards, loading_skeleton, pagination_footer, trust_banner]

  - id: populated
    description: 'Tasks loaded and displayed as SplitCard list with trust banner'
    components_visible: [search_bar, filter_bar, split_cards, trust_banner, pagination_footer]
    components_hidden: [empty_state, loading_skeleton]

  - id: loading_refresh
    description: 'Pull-to-refresh in progress — refresh indicator at top while existing cards remain visible'
    components_visible: [search_bar, filter_bar, split_cards, trust_banner, refresh_indicator]
    components_hidden: [empty_state, loading_skeleton]

  - id: loading_pagination
    description: 'Infinite scroll triggered — loading spinner at bottom of list while more tasks are fetched'
    components_visible:
      [search_bar, filter_bar, split_cards, trust_banner, pagination_footer_spinner]
    components_hidden: [empty_state, loading_skeleton]

  - id: filtering_category
    description: 'User selected a category chip — list filters with brief skeleton transition'
    components_visible: [search_bar, filter_bar_active, loading_skeleton]
    components_hidden: [split_cards, empty_state, trust_banner]

  - id: filtering_distance
    description: 'User adjusted distance filter — list re-filters with brief skeleton transition'
    components_visible: [search_bar, filter_bar_active, loading_skeleton]
    components_hidden: [split_cards, empty_state, trust_banner]

  - id: error_network
    description: 'Network request failed — error state with retry button'
    components_visible: [search_bar, filter_bar, error_message, retry_button]
    components_hidden: [split_cards, empty_state, loading_skeleton, trust_banner]

  - id: offline_cached
    description: 'Device is offline — offline banner shown with previously cached tasks if available'
    components_visible: [search_bar, filter_bar, offline_banner, cached_split_cards]
    components_hidden: [loading_skeleton, empty_state]

copy:
  - key: page_title
    mn: 'Даалгаврууд'
    en: 'Tasks'
    max_chars: 20

  - key: search_placeholder
    mn: 'Даалгавар хайх...'
    en: 'Search tasks...'
    max_chars: 25

  - key: filter_category_label
    mn: 'Ангилал'
    en: 'Category'
    max_chars: 15

  - key: filter_distance_label
    mn: 'Зай'
    en: 'Distance'
    max_chars: 10

  - key: empty_headline
    mn: 'Одоогоор даалгавар байхгүй байна'
    en: 'No tasks available right now'
    max_chars: 40

  - key: empty_description
    mn: 'Шүүлтүүрээ өөрчилж, эсвэл дараа дахин шалгана уу'
    en: 'Try adjusting your filters or check back later'
    max_chars: 60

  - key: empty_cta
    mn: 'Шүүлтүүр цэвэрлэх'
    en: 'Clear filters'
    max_chars: 20

  - key: empty_activation_headline
    mn: 'Таны шүүлтүүрт тохирох даалгавар алга'
    en: 'No tasks match your filters yet'
    max_chars: 40

  - key: empty_activation_description
    mn: 'Мэдэгдэл идэвхжүүлснээр шинэ даалгавар гарахад танд мэдэгдэнэ'
    en: 'Enable notifications to get alerted when new tasks appear'
    max_chars: 80

  - key: empty_activation_cta
    mn: 'Мэдэгдэл идэвхжүүлэх'
    en: 'Enable notifications'
    max_chars: 25

  - key: error_network
    mn: 'Интернэт холболтоо шалгана уу'
    en: 'Please check your internet connection'
    max_chars: 45

  - key: retry_button
    mn: 'Дахин оролдох'
    en: 'Retry'
    max_chars: 15

  - key: offline_banner
    mn: 'Офлайн байна. Хадгалсан даалгаврууд харагдаж байна.'
    en: 'You are offline. Showing cached tasks.'
    max_chars: 55

  - key: distance_km
    mn: '{distance} км'
    en: '{distance} km'
    max_chars: 10

  - key: time_ago
    mn: '{time} өмнө'
    en: '{time} ago'
    max_chars: 20

api_endpoints:
  - method: GET
    path: '/tasks'
    purpose: 'Fetch paginated list of open tasks with optional category and approximate-distance view filters'

analytics_events:
  - event: 'task_feed_viewed'
    trigger: 'Task Feed screen becomes visible'
  - event: 'task_feed_search'
    trigger: 'User enters text in search bar'
  - event: 'task_feed_filter_category'
    trigger: 'User taps a category chip to filter'
  - event: 'task_feed_filter_distance'
    trigger: 'User adjusts distance filter'
  - event: 'task_feed_filter_cleared'
    trigger: 'User clears all active filters'
  - event: 'task_card_tapped'
    trigger: 'User taps a task SplitCard to view detail'
  - event: 'task_feed_refreshed'
    trigger: 'User pulls to refresh the task feed'
  - event: 'task_feed_paginated'
    trigger: 'Infinite scroll triggers next page load'
  - event: 'task_feed_empty_state_viewed'
    trigger: 'Empty state is displayed to user'

acceptance_criteria:
  - 'Task feed displays open tasks as SplitCard components with dark teal header and light body'
  - 'Task cards show either posted budget or quote-request pricing state, depending on task pricing mode'
  - 'Search bar is sticky at top and supports keyword filtering of task titles'
  - 'Category chips in FilterBar are horizontally scrollable'
  - "Distance filter adjusts the visible list based on tasker's current location but does not change whether a verified tasker may apply"
  - 'Pull-to-refresh reloads the task list from the API'
  - 'Infinite scroll loads additional pages with footer spinner'
  - 'Empty activation state shows CTA to enable push notifications'
  - 'Loading state displays skeleton placeholders matching SplitCard layout'
  - 'Tapping a task card navigates to Task Detail (SCR-TASK-002)'
  - 'Network error shows retry button; tapping retry re-fetches tasks'
  - 'Offline state shows banner with cached tasks if available'
  - 'TrustBanner displays verified tasker count and completed booking count'
  - 'All text meets 16px minimum body size for Mongolian Cyrillic readability'
