# Screen Spec: Task Boost Options
screen_id: SCR-CUST-028
name: "Task Boost Options"
route: "/(customer)/tasks/:taskId/boost"
role: [customer]
phase: "2"
template: detail
figma_page: "Customer/Task Boost Options"
feature: "monetization"

layout:
  template: detail
  density: default
  structure: "safe_area -> nav_header(back + title) -> scrollview(task_summary + boost_cards + rules_notice) -> sticky_bottom_cta"

components:
  - id: COMP-CARD
    usage: "Task summary card and two boost option cards for Promoted and Urgent"
    props:
      onPress: "select_boost"
    variant: elevated

  - id: COMP-STATUSBADGE
    usage: "Inline label indicating selected boost type or already-active status"
    props:
      status: "open"
      size: sm
    variant: open

  - id: COMP-BUTTON
    usage: "Primary CTA to continue to payment for the selected boost"
    props:
      label: "Төлбөр рүү үргэлжлүүлэх"
      variant: primary
      size: lg
    variant: primary

  - id: COMP-BUTTON
    usage: "Secondary CTA to go back to task detail"
    props:
      label: "Буцах"
      variant: ghost
      size: md
    variant: ghost

  - id: COMP-LOADINGSKELETON
    usage: "Skeleton for task summary and boost cards while options load"
    props:
      variant: detail
      count: 1
    variant: detail

  - id: COMP-EMPTYSTATE
    usage: "Already-active or unavailable state when another overlapping boost cannot be purchased"
    props:
      illustration: "boost_locked"
      headline: "Идэвхтэй boost байна"
      ctaLabel: "Даалгавар руу буцах"
    variant: no_results

states:
  - id: loading_initial
    description: "Boost options and current task visibility state are loading"
    components_visible: [COMP-LOADINGSKELETON]
    components_hidden: [COMP-CARD, COMP-STATUSBADGE, COMP-BUTTON, COMP-EMPTYSTATE]

  - id: options_available
    description: "Both promoted and urgent options are shown with price, duration, and ranking effect"
    components_visible: [COMP-CARD, COMP-BUTTON.primary, COMP-BUTTON.ghost]
    components_hidden: [COMP-LOADINGSKELETON, COMP-EMPTYSTATE]

  - id: promoted_selected
    description: "Promoted option is selected and queued for payment"
    components_visible: [COMP-CARD, COMP-STATUSBADGE, COMP-BUTTON.primary, COMP-BUTTON.ghost]
    components_hidden: [COMP-LOADINGSKELETON, COMP-EMPTYSTATE]

  - id: urgent_selected
    description: "Urgent option is selected and queued for payment"
    components_visible: [COMP-CARD, COMP-STATUSBADGE, COMP-BUTTON.primary, COMP-BUTTON.ghost]
    components_hidden: [COMP-LOADINGSKELETON, COMP-EMPTYSTATE]

  - id: already_active
    description: "Task already has an active promoted or urgent boost and duplicate overlap is blocked"
    components_visible: [COMP-EMPTYSTATE, COMP-BUTTON.ghost]
    components_hidden: [COMP-LOADINGSKELETON, COMP-CARD, COMP-STATUSBADGE, COMP-BUTTON.primary]

  - id: error_network
    description: "Boost options failed to load"
    components_visible: [COMP-EMPTYSTATE.error, COMP-BUTTON.ghost]
    components_hidden: [COMP-LOADINGSKELETON, COMP-CARD, COMP-STATUSBADGE, COMP-BUTTON.primary]

copy:
  - key: nav_title
    mn: "Даалгаврын boost"
    en: "Task Boost"
    max_chars: 22

  - key: promoted_name
    mn: "Онцлох"
    en: "Promoted"
    max_chars: 12

  - key: urgent_name
    mn: "Яаралтай"
    en: "Urgent"
    max_chars: 12

  - key: promoted_price
    mn: "₮15,000 / 7 хоног"
    en: "₮15,000 / 7 days"
    max_chars: 24

  - key: urgent_price
    mn: "₮25,000 / 3 хоног"
    en: "₮25,000 / 3 days"
    max_chars: 24

  - key: cta_continue
    mn: "Төлбөр рүү үргэлжлүүлэх"
    en: "Continue to payment"
    max_chars: 28

  - key: overlap_notice
    mn: "Нэг даалгаварт нэгэн зэрэг давхцсан boost идэвхжүүлэх боломжгүй"
    en: "Only one overlapping boost can be active per task"
    max_chars: 80

api_endpoints:
  - method: GET
    path: "/tasks/:id/boost-options"
    purpose: "Fetch available promoted and urgent boost products plus active boost state for a task"

analytics_events:
  - event: "task_boost_options_viewed"
    trigger: "Boost options screen loads"
  - event: "task_boost_promoted_selected"
    trigger: "Customer selects the promoted listing option"
  - event: "task_boost_urgent_selected"
    trigger: "Customer selects the urgent boost option"

acceptance_criteria:
  - "Both visibility products are feature-gated behind promoted_listings_enabled"
  - "Promoted option shows 7-day duration and 'Онцлох' feed labeling effect"
  - "Urgent option shows 3-day duration and higher sort priority than promoted"
  - "Duplicate overlapping boosts are blocked and surfaced clearly"
  - "Continue CTA navigates to SCR-CUST-029 with selected boost product"
  - "Back button returns to SCR-CUST-009"
