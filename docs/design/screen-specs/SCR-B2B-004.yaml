# Screen Spec: Business Members
screen_id: SCR-B2B-004
name: "Business Members"
route: "/(customer)/business/accounts/:accountId/members"
role: [customer]
phase: "2"
template: detail
figma_page: "B2B/Business Members"
feature: "b2b"

layout:
  template: detail
  density: default
  structure: "safe_area -> nav_header(back + title) -> scrollview(member_rows) -> sticky_bottom_cta(invite_member)"

components:
  - id: COMP-LISTROW
    usage: "Rows for each account member showing role, phone, and edit affordance"
    props:
      title: "Бат"
      subtitle: "MANAGER"
      accessory: "chevron"
    variant: default

  - id: COMP-MODALSHEET
    usage: "Invite/edit member sheet with role picker"
    props:
      visible: false
      title: "Гишүүн нэмэх"
    variant: default

  - id: COMP-BUTTON
    usage: "Primary CTA to invite a new manager"
    props:
      label: "Гишүүн нэмэх"
      variant: primary
      size: lg
    variant: primary

  - id: COMP-EMPTYSTATE
    usage: "Empty state when only the owner exists"
    props:
      illustration: "members_empty"
      headline: "Нэмэлт гишүүн алга"
      ctaLabel: "Гишүүн нэмэх"
    variant: activation

  - id: COMP-LOADINGSKELETON
    usage: "Member list loading skeleton"
    props:
      variant: list
      count: 4
    variant: list

states:
  - id: loading_initial
    description: "Member list is loading"
    components_visible: [COMP-LOADINGSKELETON]
    components_hidden: [COMP-LISTROW, COMP-MODALSHEET, COMP-BUTTON, COMP-EMPTYSTATE]

  - id: empty
    description: "Only the owner exists and no manager members have been added"
    components_visible: [COMP-EMPTYSTATE, COMP-BUTTON.primary]
    components_hidden: [COMP-LOADINGSKELETON, COMP-LISTROW, COMP-MODALSHEET]

  - id: populated
    description: "Member list shows owner and managers"
    components_visible: [COMP-LISTROW, COMP-BUTTON.primary]
    components_hidden: [COMP-LOADINGSKELETON, COMP-EMPTYSTATE, COMP-MODALSHEET]

  - id: invite_sheet
    description: "Invite member sheet is open for phone entry and role assignment"
    components_visible: [COMP-LISTROW, COMP-BUTTON.primary, COMP-MODALSHEET]
    components_hidden: [COMP-LOADINGSKELETON, COMP-EMPTYSTATE]

  - id: role_updating
    description: "Existing member role is being updated"
    components_visible: [COMP-LISTROW, COMP-BUTTON.primary]
    components_hidden: [COMP-LOADINGSKELETON, COMP-EMPTYSTATE]

  - id: error_network
    description: "Member operations failed due to network error"
    components_visible: [COMP-LISTROW, COMP-BUTTON.primary]
    components_hidden: [COMP-LOADINGSKELETON]

copy:
  - key: nav_title
    mn: "Бизнесийн гишүүд"
    en: "Business Members"
    max_chars: 22

  - key: cta_add_member
    mn: "Гишүүн нэмэх"
    en: "Add member"
    max_chars: 16

  - key: role_owner
    mn: "Эзэмшигч"
    en: "Owner"
    max_chars: 12

  - key: role_manager
    mn: "Менежер"
    en: "Manager"
    max_chars: 12

  - key: empty_headline
    mn: "Нэмэлт гишүүн алга"
    en: "No additional members"
    max_chars: 28

  - key: tenant_notice
    mn: "Зөвхөн OWNER эсвэл MANAGER эрхтэй хэрэглэгчид энэ бүртгэлийг ашиглаж чадна"
    en: "Only OWNER and MANAGER members can use this account"
    max_chars: 82

api_endpoints:
  - method: GET
    path: "/business/accounts/:id/members"
    purpose: "List business account members"
  - method: POST
    path: "/business/accounts/:id/members"
    purpose: "Invite or add a new business account manager"
  - method: PUT
    path: "/business/accounts/:id/members/:memberId"
    purpose: "Update a business account member role"

analytics_events:
  - event: "business_members_viewed"
    trigger: "Member management screen loads"
  - event: "business_member_invite_started"
    trigger: "Invite member sheet opens"
  - event: "business_member_role_updated"
    trigger: "Member role update succeeds"

acceptance_criteria:
  - "OWNER and MANAGER roles are the only assignable membership roles"
  - "Member list is scoped to the selected business account only"
  - "Membership management remains tenant-isolated behind b2b_enabled"
