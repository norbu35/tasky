# Screen Spec: Booking Request — Accept/Decline
screen_id: SCR-TASK-017
name: 'Booking Request — Accept/Decline'
route: null
presentation:
  type: app_level_modal_sheet
  host_screen: current_tasker_context
  invocation: 'Shown from a selected-tasker notification or notification-center item during the four-hour response window'
role: [tasker]
phase: '0-1'
traceability:
  status: validated
  screen_graph_node: SCR-TASK-017
  prd_refs:
    - REQ-P1-BOOK-01
    - REQ-P1-BOOK-02
    - REQ-P1-BOOK-03
    - REQ-P1-BOOK-04
    - REQ-P1-PRICE-07
    - REQ-P1-NOTIF-02
    - REQ-P1-NOTIF-03
  journey_refs:
    - JRN-TASK-03:step-1
    - JRN-TASK-03:step-2
    - JRN-TASK-03-A1
    - JRN-TASK-03-A2
  scenario_refs:
    - SCN-BOOK-022
    - SCN-BOOK-023
    - SCN-BOOK-024
    - SCN-BOOK-025
    - SCN-BOOK-031
    - SCN-ANALYTICS-002
    - SCN-NOTIF-002
    - SCN-NOTIF-003
template: modal_sheet
figma_page: 'Tasker/Booking Request Accept Decline'
feature: 'booking'

layout:
  template: modal_sheet
  density: default
  structure: 'scrim -> sheet(handle_bar + title + request_details + response_window + action_buttons)'

components:
  - id: COMP-MODALSHEET
    usage: 'Bottom sheet for selected-tasker accept or decline flow'
    props:
      visible: true
      title: 'Захиалагч таныг сонголоо!'
    variant: default

  - id: COMP-BUTTON
    usage: 'Primary CTA to accept the booking request'
    props:
      label: 'Зөвшөөрөх'
      variant: primary
      size: xl
    variant: primary

  - id: COMP-BUTTON
    usage: 'Secondary CTA to decline the booking request'
    props:
      label: 'Татгалзах'
      variant: outline
      size: lg
    variant: outline

  - id: COMP-PROFILEAVATAR
    usage: 'Customer avatar shown in the booking request notification'
    props:
      imageUrl: 'customer_avatar_url'
      size: 'md'
      isVerified: false
    variant: md

states:
  - id: notification_received
    description: 'Selection notification received with task summary and the default four-hour response timer'
    components_visible:
      [
        handle_bar,
        notification_heading,
        task_summary,
        countdown_timer,
        accept_button,
        decline_button,
      ]
    components_hidden: [accepting_spinner, success_content, expired_content]

  - id: accepting
    description: 'Accept in progress'
    components_visible: [handle_bar, notification_heading, accepting_spinner, accepting_message]
    components_hidden: [accept_button, decline_button, countdown_timer, success_content]

  - id: accepted_booking_confirmed
    description: 'Booking request accepted and the booking is now confirmed'
    components_visible:
      [handle_bar, success_icon, accepted_heading, accepted_description, view_booking_button]
    components_hidden: [accept_button, decline_button, accepting_spinner, countdown_timer]

  - id: declined
    description: 'Booking request declined'
    components_visible: [handle_bar, declined_heading, declined_description, done_button]
    components_hidden: [accept_button, decline_button, countdown_timer, success_content]

  - id: expired_4h
    description: 'Four-hour response window expired'
    components_visible: [handle_bar, expired_heading, expired_description, done_button]
    components_hidden:
      [accept_button, decline_button, countdown_timer, accepting_spinner, success_content]

copy:
  - key: notification_heading
    mn: 'Захиалагч таныг сонголоо!'
    en: 'A customer selected you!'
    max_chars: 30

  - key: task_summary_label
    mn: 'Даалгавар'
    en: 'Task'
    max_chars: 10

  - key: countdown_label
    mn: 'Хариу өгөх хугацаа'
    en: 'Time remaining'
    max_chars: 20

  - key: countdown_format
    mn: '{hours}:{minutes}'
    en: '{hours}:{minutes}'
    max_chars: 17

  - key: accept_button
    mn: 'Зөвшөөрөх'
    en: 'Accept'
    max_chars: 20

  - key: decline_button
    mn: 'Татгалзах'
    en: 'Decline'
    max_chars: 12

  - key: accepting_message
    mn: 'Захиалгыг баталгаажуулж байна...'
    en: 'Processing...'
    max_chars: 35

  - key: accepted_heading
    mn: 'Амжилттай!'
    en: 'Success!'
    max_chars: 15

  - key: accepted_description
    mn: 'Захиалга баталгаажлаа. Дэлгэрэнгүйг одоо харах боломжтой.'
    en: 'Booking confirmed. You can now view the full booking details.'
    max_chars: 80

  - key: view_booking_button
    mn: 'Захиалга харах'
    en: 'View Booking'
    max_chars: 18

  - key: declined_heading
    mn: 'Татгалзсан'
    en: 'Declined'
    max_chars: 12

  - key: declined_description
    mn: 'Энэ захиалгыг авсангүй. Захиалагч өөр гүйцэтгэгч сонгоно.'
    en: 'You declined this request. The customer can choose another tasker.'
    max_chars: 70

  - key: expired_heading
    mn: 'Хугацаа дууслаа'
    en: 'Time Expired'
    max_chars: 18

  - key: expired_description
    mn: '4 цагийн хариу өгөх хугацаа дууссан тул хүсэлт хүчингүй боллоо.'
    en: 'The 4-hour response window has expired and the request is no longer active.'
    max_chars: 90

  - key: done_button
    mn: 'Ойлголоо'
    en: 'Got it'
    max_chars: 10

api_endpoints:
  - method: POST
    path: '/booking-intents/:id/confirm'
    purpose: 'Accept the booking request and create the confirmed booking'
  - method: POST
    path: '/booking-intents/:id/decline'
    purpose: 'Decline the booking request so the customer can choose another applicant'

analytics_events:
  - event: 'booking_request_viewed'
    trigger: 'Booking request sheet becomes visible'
  - event: 'booking_request_accepted'
    trigger: 'Tasker taps Accept'
  - event: 'booking_request_declined'
    trigger: 'Tasker taps Decline'
  - event: 'booking_request_expired'
    trigger: 'Four-hour response window expires without action'
  - event: 'booking_request_timer_viewed'
    trigger: 'Countdown timer starts with remaining time visible'

acceptance_criteria:
  - 'This is a bottom sheet overlay triggered by push notification, not a standalone route'
  - 'The default four-hour response timer is prominently displayed'
  - 'Accept confirms the booking and opens the tasker booking flow'
  - 'Decline closes the pending selection without confirming a booking and returns control to the customer so they can choose another applicant'
  - 'Expired state closes the request without creating a booking'
  - 'On accept success, dismissed to My Jobs (SCR-TASK-012)'
  - 'On decline or expiry, dismissed to My Jobs (SCR-TASK-012)'
  - 'Scrim overlay behind the sheet follows the modal_sheet template'
