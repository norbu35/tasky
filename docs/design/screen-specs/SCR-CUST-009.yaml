# Screen Spec: Task Detail (Customer)
screen_id: SCR-CUST-009
name: "Task Detail (Customer)"
route: "/(customer)/tasks/:taskId"
role: [customer]
phase: "0-1"
template: detail
figma_page: "Customer/Task Detail Customer"
feature: "tasks"

layout:
  template: detail
  density: default
  structure: "safe_area -> nav_header(back + title) -> scrollview(task_info + applicant_summary + status_actions) -> sticky_bottom_cta"

components:
  - id: COMP-STATUSBADGE
    usage: "Task status indicator (open, assigned, completed, cancelled, no_show)"
    props:
      status: "open"
      size: "md"
    variant: open

  - id: COMP-CARD
    usage: "Sections for task details, applicant summary, and booking info"
    props:
      onPress: null
    variant: outlined

  - id: COMP-PROFILEAVATAR
    usage: "Assigned Tasker avatar shown when task is in assigned/completed state"
    props:
      imageUrl: "{tasker_avatar}"
      size: "lg"
      isVerified: true
    variant: lg

  - id: COMP-TRUSTBANNER
    usage: "Trust metrics banner in the task detail (verified count, completion stats)"
    props:
      verifiedCount: 0
      completedCount: 0
    variant: default

  - id: COMP-BUTTON
    usage: "Context-dependent CTAs: View Applicants, Cancel, Message Tasker, Confirm Complete"
    props:
      label: "Хүсэлтүүдийг харах"
      variant: primary
      size: lg
    variant: primary

  - id: COMP-LOADINGSKELETON
    usage: "Detail-shaped skeleton placeholder during initial load"
    props:
      variant: detail
      count: 1
    variant: detail

  - id: COMP-TOAST
    usage: "Error toast for network failures"
    props:
      message: "Алдаа гарлаа"
      variant: error
      duration: 6000
    variant: error

states:
  - id: loading_initial
    description: "GET /tasks/:id in progress; skeleton placeholder shown"
    components_visible: [COMP-LOADINGSKELETON]
    components_hidden: [COMP-STATUSBADGE, COMP-CARD, COMP-PROFILEAVATAR, COMP-TRUSTBANNER, COMP-BUTTON, COMP-TOAST]

  - id: open_no_applicants
    description: "Task is OPEN with zero applicants; shows task info and waiting message"
    components_visible: [COMP-STATUSBADGE, COMP-CARD, COMP-BUTTON]
    components_hidden: [COMP-PROFILEAVATAR, COMP-LOADINGSKELETON, COMP-TOAST]

  - id: open_has_applicants
    description: "Task is OPEN with 1+ applicants; shows applicant count badge and View Applicants CTA"
    components_visible: [COMP-STATUSBADGE, COMP-CARD, COMP-TRUSTBANNER, COMP-BUTTON]
    components_hidden: [COMP-PROFILEAVATAR, COMP-LOADINGSKELETON, COMP-TOAST]

  - id: assigned
    description: "Task is ASSIGNED; shows assigned Tasker info, booking details, and Message Tasker CTA"
    components_visible: [COMP-STATUSBADGE, COMP-CARD, COMP-PROFILEAVATAR, COMP-TRUSTBANNER, COMP-BUTTON]
    components_hidden: [COMP-LOADINGSKELETON, COMP-TOAST]

  - id: tasker_marked_done
    description: "Tasker has marked task as done; Confirm Complete CTA shown prominently"
    components_visible: [COMP-STATUSBADGE, COMP-CARD, COMP-PROFILEAVATAR, COMP-BUTTON]
    components_hidden: [COMP-LOADINGSKELETON, COMP-TOAST]

  - id: completed
    description: "Task is COMPLETED; final summary shown with review prompt or rebook option"
    components_visible: [COMP-STATUSBADGE, COMP-CARD, COMP-PROFILEAVATAR]
    components_hidden: [COMP-LOADINGSKELETON, COMP-TOAST]

  - id: cancelled
    description: "Task is CANCELLED; shows cancellation info with no active CTAs"
    components_visible: [COMP-STATUSBADGE, COMP-CARD]
    components_hidden: [COMP-PROFILEAVATAR, COMP-TRUSTBANNER, COMP-LOADINGSKELETON, COMP-BUTTON, COMP-TOAST]

  - id: no_show
    description: "Task ended as NO_SHOW; shows no-show status and relevant info"
    components_visible: [COMP-STATUSBADGE, COMP-CARD]
    components_hidden: [COMP-PROFILEAVATAR, COMP-TRUSTBANNER, COMP-LOADINGSKELETON, COMP-BUTTON, COMP-TOAST]

  - id: error_network
    description: "GET /tasks/:id failed; error toast with retry"
    components_visible: [COMP-TOAST]
    components_hidden: [COMP-STATUSBADGE, COMP-CARD, COMP-PROFILEAVATAR, COMP-TRUSTBANNER, COMP-LOADINGSKELETON]

copy:
  - key: page_title
    mn: "Даалгаврын дэлгэрэнгүй"
    en: "Task Detail"
    max_chars: 25

  - key: section_details
    mn: "Дэлгэрэнгүй"
    en: "Details"
    max_chars: 15

  - key: section_location
    mn: "Байршил"
    en: "Location"
    max_chars: 15

  - key: section_schedule
    mn: "Хуваарь"
    en: "Schedule"
    max_chars: 15

  - key: section_budget
    mn: "Төсөв"
    en: "Budget"
    max_chars: 15

  - key: section_applicants
    mn: "Хүсэлтүүд"
    en: "Applications"
    max_chars: 15

  - key: applicant_count
    mn: "{count} хүсэлт ирсэн"
    en: "{count} applications received"
    max_chars: 30

  - key: no_applicants_yet
    mn: "Одоогоор хүсэлт ирээгүй байна. Гүйцэтгэгчид хүсэлт илгээх болно"
    en: "No applications yet. Taskers will apply soon"
    max_chars: 80

  - key: assigned_tasker
    mn: "Томилогдсон гүйцэтгэгч"
    en: "Assigned Tasker"
    max_chars: 25

  - key: tasker_marked_done_prompt
    mn: "Гүйцэтгэгч ажил дууслаа гэж мэдэгдлээ. Баталгаажуулна уу"
    en: "Tasker has marked the task as done. Please confirm completion"
    max_chars: 80

  - key: payment_note
    mn: "Төлбөрийг гүйцэтгэгчтэй шууд тохиролцоно"
    en: "Payment is arranged directly with the Tasker"
    max_chars: 60

  - key: cta_view_applicants
    mn: "Хүсэлтүүдийг харах"
    en: "View Applicants"
    max_chars: 20

  - key: cta_cancel_task
    mn: "Даалгавар цуцлах"
    en: "Cancel Task"
    max_chars: 20

  - key: cta_message_tasker
    mn: "Зурвас илгээх"
    en: "Message Tasker"
    max_chars: 20

  - key: cta_confirm_complete
    mn: "Дууссанг баталгаажуулах"
    en: "Confirm Complete"
    max_chars: 25

  - key: error_network
    mn: "Даалгаврыг ачаалахад алдаа гарлаа"
    en: "Failed to load task detail"
    max_chars: 40

api_endpoints:
  - method: GET
    path: "/tasks/:id"
    purpose: "Fetch task detail including status, applicant count, assigned Tasker info"
  - method: PUT
    path: "/tasks/:id/complete"
    purpose: "Mark task as completed (triggered from confirm completion flow)"
  - method: DELETE
    path: "/tasks/:id"
    purpose: "Cancel an open task"

analytics_events:
  - event: "task_detail_viewed"
    trigger: "Screen becomes visible; includes task_id and current status"
  - event: "view_applicants_tapped"
    trigger: "User taps View Applicants; includes task_id and applicant_count"
  - event: "cancel_task_tapped"
    trigger: "User taps Cancel Task"
  - event: "message_tasker_tapped"
    trigger: "User taps Message Tasker from assigned task detail"
  - event: "confirm_complete_tapped"
    trigger: "User taps Confirm Complete when Tasker has marked done"

acceptance_criteria:
  - "Task detail displays category, description/scope summary, photos, approximate location, schedule (YYYY.MM.DD format), and budget (₮ format)"
  - "StatusBadge shows current task status with correct color mapping"
  - "OPEN state with no applicants shows waiting message"
  - "OPEN state with applicants shows count badge and View Applicants CTA navigating (push) to SCR-CUST-011"
  - "ASSIGNED state shows assigned Tasker profile with avatar, name, verification badge, and rating"
  - "ASSIGNED state shows Message Tasker CTA navigating (push) to SCR-SHARED-010"
  - "Tasker marked done state shows prominent Confirm Complete CTA"
  - "Cancel CTA opens modal sheet SCR-CUST-010 for cancellation confirmation"
  - "COMPLETED state shows final task summary"
  - "CANCELLED and NO_SHOW states show terminal information with no active CTAs"
  - "Payment note per REQ-PAY-03 visible in open/assigned states"
  - "Back button pops to My Tasks SCR-CUST-001"
  - "Network error shows error toast with retry"
  - "All copy renders correctly in Mongolian Cyrillic at 16px minimum body size"
