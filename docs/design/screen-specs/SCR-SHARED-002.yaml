# Screen Spec: Auth — Login
screen_id: SCR-SHARED-002
name: 'Auth — Login'
route: '/auth/login'
role: [customer, tasker]
phase: '0-1'
traceability:
  status: validated
  screen_graph_node: SCR-SHARED-002
  prd_refs:
    - REQ-P1-AUTH-01
    - REQ-P1-AUTH-02
    - REQ-P1-AUTH-03
    - REQ-P1-AUTH-04
    - REQ-P1-AUTH-05
    - REQ-P1-AUTH-06
  journey_refs:
    - JRN-SHARED-01:step-2
    - JRN-SHARED-01-A1
  scenario_refs:
    - SCN-AUTH-004
    - SCN-AUTH-005
    - SCN-AUTH-007
    - SCN-AUTH-008
    - SCN-AUTH-012
    - SCN-AUTH-013
    - SCN-AUTH-014
    - SCN-AUTH-015
    - SCN-SMOKE-001
template: auth
figma_page: 'Shared/Auth Login'
feature: 'auth'

layout:
  template: auth
  density: comfortable
  structure: 'safe_area -> centered_content(logo + heading + description + facebook_login_button) -> bottom_links(terms + privacy)'

components:
  - id: COMP-BUTTON
    usage: 'Primary CTA for Facebook login'
    props:
      label: 'Facebook-ээр нэвтрэх'
      variant: primary
      size: xl
      loading: false
      icon: 'facebook'
      iconPosition: 'left'
    variant: primary

  - id: COMP-LANGUAGESWITCHER
    usage: 'Language toggle at top-right corner for mn/en switching'
    props:
      currentLang: 'mn'
    variant: default

states:
  - id: default
    description: 'Login screen displayed with Facebook login button'
    components_visible:
      [logo, heading, description, facebook_button, language_switcher, terms_link, privacy_link]
    components_hidden: []

  - id: facebook_loading
    description: 'Facebook OAuth in progress after user taps the Facebook login button'
    components_visible: [logo, heading, facebook_button_loading, language_switcher]
    components_hidden: [description, terms_link, privacy_link]

  - id: error_auth_failed
    description: 'Authentication failed due to server error or invalid credentials'
    components_visible:
      [logo, heading, description, facebook_button, error_message, language_switcher]
    components_hidden: []

  - id: error_network
    description: 'Network error prevents authentication request from completing'
    components_visible:
      [
        logo,
        heading,
        description,
        facebook_button,
        network_error_message,
        retry_hint,
        language_switcher,
      ]
    components_hidden: []

  - id: error_facebook_unavailable
    description: 'Facebook SDK unavailable or user cancelled Facebook OAuth flow'
    components_visible:
      [logo, heading, description, facebook_button_retry, facebook_error_message, language_switcher]
    components_hidden: []

  - id: offline
    description: 'Device is offline; login actions disabled with offline banner'
    components_visible:
      [logo, heading, description, facebook_button_disabled, offline_banner, language_switcher]
    components_hidden: []

copy:
  - key: heading
    mn: 'Tasky-д тавтай морил'
    en: 'Welcome to Tasky'
    max_chars: 30

  - key: description
    mn: 'Найдвартай гүйцэтгэгчтэй холбогдож, ажлаа хялбар захиалаарай'
    en: 'Connect with trusted taskers and book tasks easily'
    max_chars: 80

  - key: facebook_button_label
    mn: 'Facebook-ээр нэвтрэх'
    en: 'Login with Facebook'
    max_chars: 25

  - key: error_auth_failed
    mn: 'Нэвтрэх боломжгүй байна. Дахин оролдоно уу.'
    en: 'Login failed. Please try again.'
    max_chars: 50

  - key: error_facebook_unavailable
    mn: 'Facebook холболт амжилтгүй боллоо'
    en: 'Facebook connection failed'
    max_chars: 40

  - key: error_network
    mn: 'Интернэт холболтоо шалгана уу'
    en: 'Please check your internet connection'
    max_chars: 45

  - key: offline_banner
    mn: 'Офлайн байна'
    en: 'You are offline'
    max_chars: 20

  - key: terms_link
    mn: 'Үйлчилгээний нөхцөл'
    en: 'Terms of Service'
    max_chars: 25

  - key: privacy_link
    mn: 'Нууцлалын бодлого'
    en: 'Privacy Policy'
    max_chars: 20

api_endpoints:
  - method: POST
    path: '/auth/facebook'
    purpose: 'Authenticate user via Facebook OAuth token'

analytics_events:
  - event: 'login_screen_viewed'
    trigger: 'Login screen becomes visible'
  - event: 'facebook_login_tapped'
    trigger: 'User taps the Facebook login button'
  - event: 'facebook_login_success'
    trigger: 'Facebook OAuth completes successfully'
  - event: 'facebook_login_failed'
    trigger: 'Facebook OAuth fails or user cancels'
  - event: 'language_switched'
    trigger: 'User toggles language between mn and en'

acceptance_criteria:
  - 'Facebook login button is always visible in the default state'
  - 'Tapping Facebook button shows loading state on the button with spinner replacing label'
  - 'On successful Facebook auth for a new user, the app navigates to Onboarding Carousel (SCR-SHARED-005)'
  - 'On successful Facebook auth for a returning customer, the app navigates to My Tasks (SCR-CUST-001)'
  - 'On successful Facebook auth for a returning tasker, the app navigates to Task Feed (SCR-TASK-001)'
  - 'Facebook error shows specific error message with retry option'
  - 'Network error shows message advising user to check connection'
  - 'Language switcher toggles between Mongolian and English'
  - 'Terms of Service and Privacy Policy links are visible and tappable'
  - 'All error messages display inline, not as toasts'
  - 'Offline state disables login buttons and shows offline banner'
