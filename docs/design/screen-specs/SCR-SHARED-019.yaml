# Screen Spec: Review Hard Lock
screen_id: SCR-SHARED-019
name: 'Review Hard Lock'
route: '/(shared)/review/hard-lock'
presentation:
  type: route_backed_full_screen
  invocation: 'Shown when unresolved review debt blocks a post or apply action'
role: [customer, tasker]
phase: '0-1'
traceability:
  status: validated
  screen_graph_node: SCR-SHARED-019
  prd_refs:
    - REQ-P1-SAFE-07
    - REQ-P1-SAFE-08
  journey_refs:
    - JRN-SHARED-07-A2
  scenario_refs:
    - SCN-REVIEW-005
    - SCN-REVIEW-006
template: error_state
figma_page: 'Shared/Review Hard Lock'
feature: 'reviews'

layout:
  template: error_state
  density: comfortable
  structure: 'safe_area -> centered(lock_icon + title + body_text + reason_badge + submit_review_cta)'

components:
  - id: COMP-EMPTYSTATE
    usage: 'Full-screen blocker with lock illustration, explanation text, and CTA to submit review'
    props:
      illustration: 'lock_review'
      headline: 'Хаагдсан'
      description: 'Сэтгэгдлээ бичих хүртэл энэ үйлдлийг хийх боломжгүй'
      ctaLabel: 'Сэтгэгдэл бичих'
      onCtaPress: 'navigateToReviewForm'
    variant: error

  - id: COMP-BUTTON
    usage: 'Primary CTA to navigate to the review form to resolve the lock'
    props:
      label: 'Сэтгэгдэл бичих'
      variant: primary
      size: lg
    variant: primary

  - id: COMP-STATUSBADGE
    usage: 'Badge showing pending review debt'
    props:
      status: 'cancelled'
      size: sm
    variant: cancelled

states:
  - id: locked_review_debt
    description: 'User has at least one unresolved owed review; blocks posting and applying until the owed review is submitted'
    components_visible: [COMP-EMPTYSTATE, COMP-BUTTON, COMP-STATUSBADGE]
    components_hidden: []

copy:
  - key: title_review_debt
    mn: 'Сэтгэгдэл дутуу'
    en: 'Missing reviews'
    max_chars: 25

  - key: body_review_debt
    mn: 'Танд бичээгүй сэтгэгдэл байна. Шинэ даалгавар нийтлэх эсвэл ажилд орохын өмнө сэтгэгдлээ бичнэ үү.'
    en: 'You have a pending review. Submit it before posting a new task or applying to a job.'
    max_chars: 160

  - key: badge_review_debt
    mn: 'Дутуу сэтгэгдэл'
    en: 'Pending review'
    max_chars: 20

  - key: cta_submit_review
    mn: 'Сэтгэгдэл бичих'
    en: 'Submit Review'
    max_chars: 20

api_endpoints: []

analytics_events:
  - event: 'review_hard_lock_shown'
    trigger: 'Hard lock screen appears with lock_reason: review_debt'
  - event: 'review_hard_lock_cta_tapped'
    trigger: "User taps 'Submit Review' CTA to navigate to review form"

acceptance_criteria:
  - 'Full-screen blocker prevents navigation to task posting or job application screens only'
  - 'Lock screen appears when user has unresolved review debt and tries to post/apply'
  - 'Lock screen is not triggered solely by open disputes or investigations'
  - 'Pending review debt shows a specific title, explanation body, and reason badge'
  - "Tapping 'Сэтгэгдэл бичих' navigates (push) to SCR-SHARED-017 with the pending booking_id"
  - 'Lock screen cannot bypass the protected post/apply action except via the review CTA'
  - 'Uses comfortable density for emotional weight and breathing room'
  - 'Lock icon illustration is centered above the text content'
  - 'This is a route-backed full-screen blocker that intercepts navigation to protected screens'
  - 'After review is successfully submitted, the lock is released and user returns to their intended destination'
