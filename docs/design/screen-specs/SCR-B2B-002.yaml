# Screen Spec: Business Account Editor
screen_id: SCR-B2B-002
name: "Business Account Editor"
route: "/(customer)/business/accounts/:accountId/edit"
role: [customer]
phase: "2"
template: form_wizard
figma_page: "B2B/Business Account Editor"
feature: "b2b"

layout:
  template: form_wizard
  density: default
  structure: "safe_area -> nav_header(back + title) -> scrollview(account_fields + management_links) -> bottom_nav(cancel + save)"

components:
  - id: COMP-FORMFIELD
    usage: "Wraps account name, billing day, and notes fields"
    props:
      label: "Бизнесийн нэр"
      required: true
    variant: default

  - id: COMP-INPUT
    usage: "Text inputs for account name and billing metadata"
    props:
      value: "Nomad Host LLC"
      placeholder: "Бизнесийн нэр"
      maxLength: 80
    variant: default

  - id: COMP-LISTROW
    usage: "Navigation rows to manage locations and members"
    props:
      title: "Байршлууд"
      accessory: "chevron"
    variant: default

  - id: COMP-BUTTON
    usage: "Primary save button"
    props:
      label: "Хадгалах"
      variant: primary
      size: lg
    variant: primary

  - id: COMP-BUTTON
    usage: "Secondary cancel button"
    props:
      label: "Болих"
      variant: ghost
      size: lg
    variant: ghost

  - id: COMP-TOAST
    usage: "Success or error toast on save"
    props:
      message: "Бизнес бүртгэл хадгалагдлаа"
      variant: success
    variant: success

states:
  - id: create_default
    description: "Empty create form for a new business account"
    components_visible: [COMP-FORMFIELD, COMP-INPUT, COMP-BUTTON.primary, COMP-BUTTON.ghost]
    components_hidden: [COMP-LISTROW, COMP-TOAST]

  - id: edit_default
    description: "Existing business account data is loaded for editing"
    components_visible: [COMP-FORMFIELD, COMP-INPUT, COMP-LISTROW, COMP-BUTTON.primary, COMP-BUTTON.ghost]
    components_hidden: [COMP-TOAST]

  - id: saving
    description: "Create or update request is in flight"
    components_visible: [COMP-FORMFIELD, COMP-INPUT, COMP-LISTROW, COMP-BUTTON.primary, COMP-BUTTON.ghost]
    components_hidden: [COMP-TOAST]

  - id: success
    description: "Business account save completed successfully"
    components_visible: [COMP-TOAST]
    components_hidden: []

  - id: validation_error
    description: "Required fields failed validation"
    components_visible: [COMP-FORMFIELD, COMP-INPUT, COMP-LISTROW, COMP-BUTTON.primary, COMP-BUTTON.ghost]
    components_hidden: [COMP-TOAST]

  - id: error_network
    description: "Create or update request failed"
    components_visible: [COMP-FORMFIELD, COMP-INPUT, COMP-LISTROW, COMP-BUTTON.primary, COMP-BUTTON.ghost, COMP-TOAST]
    components_hidden: []

copy:
  - key: nav_title_create
    mn: "Бизнес бүртгэх"
    en: "Create Business Account"
    max_chars: 24

  - key: nav_title_edit
    mn: "Бизнес засах"
    en: "Edit Business Account"
    max_chars: 22

  - key: label_name
    mn: "Бизнесийн нэр"
    en: "Business name"
    max_chars: 22

  - key: label_billing_day
    mn: "Төлбөрийн өдөр"
    en: "Billing day"
    max_chars: 20

  - key: cta_save
    mn: "Хадгалах"
    en: "Save"
    max_chars: 12

  - key: cta_manage_locations
    mn: "Байршил удирдах"
    en: "Manage locations"
    max_chars: 22

api_endpoints:
  - method: POST
    path: "/business/accounts"
    purpose: "Create a business account for a customer owner"
  - method: PUT
    path: "/business/accounts/:id"
    purpose: "Update an existing business account"

analytics_events:
  - event: "business_account_editor_viewed"
    trigger: "Editor screen becomes visible"
  - event: "business_account_saved"
    trigger: "Business account create or update succeeds"
  - event: "business_account_locations_tapped"
    trigger: "User opens location management from the editor"

acceptance_criteria:
  - "Business account CRUD is feature-gated behind b2b_enabled"
  - "Owner remains a CUSTOMER role and cannot be changed from this screen"
  - "Locations and members are managed through linked subflows, not embedded parallel forms"
  - "Successful save returns to SCR-B2B-001 with updated account data"
