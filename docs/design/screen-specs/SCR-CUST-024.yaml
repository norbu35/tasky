# Screen Spec: Dispute — Raise
screen_id: SCR-CUST-024
name: 'Dispute — Raise'
route: '/(customer)/bookings/:bookingId/dispute'
role: [customer]
phase: '0-1'
traceability:
  status: validated
  screen_graph_node: SCR-CUST-024
  prd_refs:
    - REQ-P1-SAFE-14
    - REQ-P1-SAFE-15
    - REQ-P1-SAFE-16
    - REQ-P1-BOOK-28
  journey_refs:
    - JRN-CUST-06:step-2
    - JRN-CUST-06-A1
  scenario_refs:
    - SCN-DISPUTE-001
    - SCN-DISPUTE-002
    - SCN-DISPUTE-003
    - SCN-DISPUTE-004
    - SCN-DISPUTE-005
template: form_wizard
figma_page: 'Customer/Dispute Raise'
feature: 'dispute'

layout:
  template: form_wizard
  density: default
  structure: 'safe_area -> nav_header(back + title) -> scrollview(booking_reference + reason_selector + evidence_upload + description) -> bottom_nav(back + submit)'

components:
  - id: COMP-FORMFIELD
    usage: 'Wrapper for dispute reason selection, evidence upload section, and written description'
    props:
      label: 'Шалтгаан'
      required: true
    variant: default

  - id: COMP-INPUT
    usage: 'Written timeline/description text area for dispute details'
    props:
      placeholder: 'Асуудлын дэлгэрэнгүй тайлбар...'
      maxLength: 500
    variant: multiline

  - id: COMP-PHOTOPICKER
    usage: 'Evidence photo upload for disputes that require supporting artifacts under the launch trust policy'
    props:
      photos: []
      maxPhotos: 5
    variant: default

  - id: COMP-BUTTON
    usage: 'Submit dispute button and back button'
    props:
      label: 'Маргаан илгээх'
      variant: primary
      size: lg
      loading: false
    variant: primary

  - id: COMP-TOAST
    usage: 'Success toast after dispute submission or error toast on failure'
    props:
      message: 'Маргаан амжилттай илгээлээ'
      variant: success
    variant: success

states:
  - id: default
    description: 'Form shown with booking reference at top, reason selector, evidence upload area, and description field. Evidence can be attached immediately or added during the grace path'
    components_visible: [COMP-FORMFIELD, COMP-INPUT, COMP-PHOTOPICKER, COMP-BUTTON]
    components_hidden: [COMP-TOAST]

  - id: evidence_photo
    description: 'User is uploading photo evidence; upload progress shown per photo'
    components_visible: [COMP-FORMFIELD, COMP-INPUT, COMP-PHOTOPICKER, COMP-BUTTON]
    components_hidden: [COMP-TOAST]

  - id: evidence_chat
    description: 'User selects chat excerpt as evidence; chat excerpt selector shown'
    components_visible: [COMP-FORMFIELD, COMP-INPUT, COMP-BUTTON]
    components_hidden: [COMP-PHOTOPICKER, COMP-TOAST]

  - id: evidence_text
    description: 'User writes a text-based timeline as evidence; description field active'
    components_visible: [COMP-FORMFIELD, COMP-INPUT, COMP-BUTTON]
    components_hidden: [COMP-PHOTOPICKER, COMP-TOAST]

  - id: submitting
    description: 'Dispute submission in progress via POST /disputes; submit button in loading state'
    components_visible: [COMP-FORMFIELD, COMP-INPUT, COMP-PHOTOPICKER, COMP-BUTTON]
    components_hidden: [COMP-TOAST]

  - id: success
    description: 'Dispute submitted successfully; navigates to Dispute Status screen'
    components_visible: [COMP-TOAST]
    components_hidden: [COMP-FORMFIELD, COMP-INPUT, COMP-PHOTOPICKER, COMP-BUTTON]

  - id: evidence_grace
    description: 'User submits without an evidence artifact; dispute opens in evidence-needed grace state with deadline notice'
    components_visible: [COMP-FORMFIELD, COMP-INPUT, COMP-PHOTOPICKER, COMP-BUTTON]
    components_hidden: [COMP-TOAST]

  - id: error_network
    description: 'Network error during submission; error toast with retry'
    components_visible: [COMP-FORMFIELD, COMP-INPUT, COMP-PHOTOPICKER, COMP-BUTTON, COMP-TOAST]
    components_hidden: []

copy:
  - key: page_title
    mn: 'Асуудал мэдэгдэх'
    en: 'Report Issue'
    max_chars: 20

  - key: section_booking_ref
    mn: 'Захиалгын мэдээлэл'
    en: 'Booking Reference'
    max_chars: 25

  - key: label_reason
    mn: 'Асуудлын шалтгаан'
    en: 'Issue Type'
    max_chars: 20

  - key: label_evidence
    mn: 'Нотлох баримт'
    en: 'Evidence'
    max_chars: 20

  - key: evidence_helper
    mn: 'Зураг, чатын хэсэг, эсвэл бичгэн тайлбар нэмнэ үү. Одоо нэмээгүй бол сануулах хугацаанд нэмж болно'
    en: 'Add a photo, chat excerpt, or written timeline. If you cannot add evidence now, you may add it within 24 hours after the evidence reminder'
    max_chars: 130

  - key: label_description
    mn: 'Дэлгэрэнгүй тайлбар'
    en: 'Description'
    max_chars: 25

  - key: placeholder_description
    mn: 'Асуудлын дэлгэрэнгүй тайлбар...'
    en: 'Describe the issue in detail...'
    max_chars: 50

  - key: evidence_photo_label
    mn: 'Зураг нэмэх'
    en: 'Add Photo'
    max_chars: 20

  - key: evidence_chat_label
    mn: 'Чатын хэсэг сонгох'
    en: 'Select Chat Excerpt'
    max_chars: 25

  - key: evidence_text_label
    mn: 'Бичгэн тайлбар'
    en: 'Written Timeline'
    max_chars: 20

  - key: cta_submit
    mn: 'Маргаан илгээх'
    en: 'Submit Dispute'
    max_chars: 20

  - key: cta_back
    mn: 'Буцах'
    en: 'Back'
    max_chars: 20

  - key: evidence_grace_notice
    mn: 'Нотлох баримтгүй илгээвэл сануулах хугацаанд баримт нэмэх шаардлагатай'
    en: 'If you submit without evidence, you must add evidence within 24 hours after the evidence reminder'
    max_chars: 110

  - key: toast_success
    mn: 'Маргаан амжилттай илгээлээ'
    en: 'Dispute submitted successfully'
    max_chars: 40

  - key: toast_error
    mn: 'Маргаан илгээхэд алдаа гарлаа'
    en: 'Failed to submit dispute'
    max_chars: 40

  - key: evidence_deadline_note
    mn: 'Сануулах хугацааны дараа нотлох баримт ирүүлээгүй бол маргаан хангалтгүй баримттайгаар хаагдаж болно'
    en: 'A dispute may close as insufficient evidence if evidence is not provided 24 hours after the evidence reminder'
    max_chars: 120

  - key: eligibility_note
    mn: 'Маргаан нээх боломжтой: ASSIGNED төлөвт эсвэл дууссаны дараах зөвшөөрөгдсөн хугацаанд'
    en: 'Disputes can be opened during ASSIGNED status or within 24 hours after completion'
    max_chars: 100

api_endpoints:
  - method: POST
    path: '/disputes'
    purpose: 'Submit a new dispute with reason, evidence artifacts, and description'

analytics_events:
  - event: 'dispute_raise_viewed'
    trigger: 'Dispute form screen becomes visible'
  - event: 'dispute_evidence_photo_added'
    trigger: 'User uploads a photo as evidence'
  - event: 'dispute_evidence_chat_selected'
    trigger: 'User selects a chat excerpt as evidence'
  - event: 'dispute_evidence_text_entered'
    trigger: 'User writes text-based evidence'
  - event: 'dispute_submitted'
    trigger: 'User taps submit and POST /disputes is sent'
  - event: 'dispute_submitted_without_evidence'
    trigger: 'User submits into the evidence-needed grace path without an evidence artifact'
  - event: 'dispute_submit_error'
    trigger: 'Network error during dispute submission'

acceptance_criteria:
  - 'Disputes can only be raised when booking is ASSIGNED or within 24 hours after completion'
  - 'Submitting with evidence attaches at least one artifact: photo, chat excerpt, or written timeline'
  - 'Submitting without evidence is allowed only as the evidence-needed grace path and shows the 24-hour-after-reminder deadline notice'
  - 'Photo evidence uses presigned URL upload with per-photo progress'
  - 'Chat excerpt selection allows highlighting relevant message range'
  - 'Written timeline has 500 character limit'
  - 'Submit button sends POST /disputes with evidence artifacts when present, or a grace-path marker when evidence is absent, and enters loading state'
  - 'On success, navigates via replace to Dispute Status (SCR-CUST-025)'
  - 'Evidence note warns that a dispute may close as insufficient evidence if follow-up evidence is not provided within 24 hours after the evidence reminder'
  - 'Back button navigates via pop to Booking Detail (SCR-CUST-017)'
  - 'Network error shows error toast with retry'
  - 'All copy renders correctly in Mongolian Cyrillic at 16px minimum body size'
