<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--color-background); font-family: var(--font-sans); padding: 20px; }
.section { margin-bottom: 18px; }
.label { font-size: 10px; font-weight: 600; color: var(--color-text-tertiary); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 10px; }
/* Spacing */
.sp-row { display: flex; align-items: flex-end; gap: 8px; flex-wrap: wrap; }
.sp-item { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.sp-bar { background: var(--tasky-sky); border-radius: 2px; width: 28px; }
.sp-tag { font-size: 9px; color: var(--color-text-tertiary); }
/* Radius */
.rad-row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.rad-item { display: flex; flex-direction: column; align-items: center; gap: 5px; }
.rad-box { width: 44px; height: 36px; background: var(--tasky-ink); }
.rad-tag { font-size: 9px; color: var(--color-text-tertiary); }
</style>
</head>
<body>
  <div class="section">
    <div class="label">Spacing — 4px base unit</div>
    <div class="sp-row">
      <div class="sp-item"><div class="sp-bar" style="height:4px"></div><div class="sp-tag">1 / 4px</div></div>
      <div class="sp-item"><div class="sp-bar" style="height:8px"></div><div class="sp-tag">2 / 8px</div></div>
      <div class="sp-item"><div class="sp-bar" style="height:12px"></div><div class="sp-tag">3 / 12px</div></div>
      <div class="sp-item"><div class="sp-bar" style="height:16px"></div><div class="sp-tag">4 / 16px</div></div>
      <div class="sp-item"><div class="sp-bar" style="height:20px"></div><div class="sp-tag">5 / 20px</div></div>
      <div class="sp-item"><div class="sp-bar" style="height:24px"></div><div class="sp-tag">6 / 24px</div></div>
      <div class="sp-item"><div class="sp-bar" style="height:32px"></div><div class="sp-tag">8 / 32px</div></div>
      <div class="sp-item"><div class="sp-bar" style="height:40px"></div><div class="sp-tag">10 / 40px</div></div>
      <div class="sp-item"><div class="sp-bar" style="height:48px"></div><div class="sp-tag">12 / 48px</div></div>
      <div class="sp-item"><div class="sp-bar" style="height:64px"></div><div class="sp-tag">16 / 64px</div></div>
    </div>
  </div>
  <div class="section">
    <div class="label">Border Radius</div>
    <div class="rad-row">
      <div class="rad-item"><div class="rad-box" style="border-radius:0"></div><div class="rad-tag">none / 0</div></div>
      <div class="rad-item"><div class="rad-box" style="border-radius:6px"></div><div class="rad-tag">xs / 6px</div></div>
      <div class="rad-item"><div class="rad-box" style="border-radius:8px"></div><div class="rad-tag">sm / 8px</div></div>
      <div class="rad-item"><div class="rad-box" style="border-radius:12px"></div><div class="rad-tag">md / 12px</div></div>
      <div class="rad-item"><div class="rad-box" style="border-radius:16px"></div><div class="rad-tag">lg / 16px</div></div>
      <div class="rad-item"><div class="rad-box" style="border-radius:9999px;width:60px"></div><div class="rad-tag">full</div></div>
    </div>
  </div>
</body>
</html>
