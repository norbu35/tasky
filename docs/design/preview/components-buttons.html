<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--color-background); font-family: var(--font-sans); padding: 20px 24px; display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-start; }
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  border-radius: var(--radius-sm); border: none; cursor: pointer;
  font-family: var(--font-sans); font-weight: 700; font-size: 16px;
  line-height: 1; padding: 0 20px; height: 48px; transition: opacity var(--duration-fast);
  box-shadow: var(--shadow-fab);
}
.btn:active { opacity: 0.85; transform: scale(0.98); }
.btn-primary { background: var(--tasky-ink); color: white; }
.btn-secondary { background: var(--tasky-sun); color: white; }
.btn-outline { background: transparent; color: var(--tasky-ink); border: 1.5px solid var(--tasky-line); box-shadow: none; }
.btn-ghost { background: transparent; color: var(--tasky-ink); box-shadow: none; }
.btn-danger { background: var(--tasky-danger); color: white; }
.btn-sm { height: 40px; font-size: 14px; padding: 0 14px; border-radius: var(--radius-sm); }
.btn-lg { height: 56px; font-size: 16px; padding: 0 28px; border-radius: var(--radius-sm); }
.btn-disabled { background: var(--tasky-ink); color: white; opacity: 0.4; cursor: not-allowed; box-shadow: none; }
.separator { width: 100%; height: 1px; background: var(--tasky-line); margin: 4px 0; }
</style>
</head>
<body>
  <button class="btn btn-primary">Өргөдөл харах</button>
  <button class="btn btn-secondary">₮ Хөлс тогтоох</button>
  <button class="btn btn-outline">Цуцлах</button>
  <button class="btn btn-ghost">Дэлгэрэнгүй</button>
  <button class="btn btn-danger">Устгах</button>
  <div class="separator"></div>
  <button class="btn btn-primary btn-sm">sm button</button>
  <button class="btn btn-primary">default button</button>
  <button class="btn btn-primary btn-lg">lg button</button>
  <button class="btn btn-disabled" disabled>disabled</button>
</body>
</html>
