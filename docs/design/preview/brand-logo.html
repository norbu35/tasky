<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--color-background); font-family: var(--font-sans); padding: 24px; display: flex; gap: 24px; align-items: flex-start; flex-wrap: wrap; }

/* Logo lockup */
.logo-lockup { display: flex; flex-direction: column; gap: 12px; }
.logo-box { position: relative; width: 80px; height: 80px; }
.logo-halo { position: absolute; top: -8px; left: -8px; width: 96px; height: 96px; border-radius: 12px; background: rgba(253,206,106,0.2); }
.logo-icon-bg { position: relative; width: 80px; height: 80px; border-radius: 10px; background: #002444; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 24px rgba(0,36,68,0.3); }
.wordmark { font-family: var(--font-display); font-weight: 700; font-size: 28px; color: #102638; letter-spacing: -0.02em; }

/* Divider */
.divider { width: 1px; background: var(--tasky-line); align-self: stretch; }

/* Check mark demos */
.check-demos { display: flex; flex-direction: column; gap: 14px; }
.check-row { display: flex; align-items: center; gap: 12px; }
.check-label { font-size: 12px; color: var(--tasky-text-tertiary); }
</style>
</head>
<body>
  <!-- Logo -->
  <div class="logo-lockup">
    <div class="logo-box">
      <div class="logo-halo"></div>
      <div class="logo-icon-bg">
        <img src="../assets/logo-icon.svg" width="40" height="40" style="filter: brightness(0) invert(1)">
      </div>
    </div>
    <div class="wordmark">Tasky</div>
  </div>

  <div class="divider"></div>

  <!-- Hand-drawn check variants -->
  <div class="check-demos">
    <!-- Standard -->
    <div class="check-row">
      <svg width="36" height="36" viewBox="0 0 36 36" fill="none">
        <polyline points="6,18 14,26 30,10" stroke="#469178" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="check-label">Standard (3.5px)</span>
    </div>
    <!-- Inline -->
    <div class="check-row">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
        <polyline points="4,11 9,16 18,6" stroke="#469178" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="check-label">Inline (2.5px)</span>
    </div>
    <!-- Emphasis (double stroke) -->
    <div class="check-row">
      <svg width="36" height="36" viewBox="0 0 36 36" fill="none">
        <polyline points="6,18 14,26 30,10" stroke="#469178" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        <polyline points="6,18 14,26 30,10" stroke="#469178" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>
      </svg>
      <span class="check-label">Emphasis (double stroke)</span>
    </div>
  </div>
</body>
</html>
