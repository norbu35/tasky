<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--color-background); font-family: var(--font-sans); padding: 20px; display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-start; }

.badge {
  display: inline-flex; align-items: center; gap: 5px;
  border-radius: var(--radius-full); padding: 3px 10px;
  font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em;
}
.badge-verified { background: var(--tasky-verified); color: white; }
.badge-pending  { background: var(--tasky-sky); color: white; }
.badge-open     { background: var(--tasky-status-open); color: var(--tasky-status-open-fg); }
.badge-assigned { background: var(--tasky-status-assigned); color: white; }
.badge-completed{ background: var(--tasky-verified); color: white; }
.badge-cancelled{ background: var(--tasky-subtle); color: var(--tasky-muted-text); }
.badge-danger   { background: var(--tasky-danger); color: white; }

.chip {
  display: inline-flex; align-items: center;
  border-radius: var(--radius-full); padding: 6px 14px;
  font-size: 13px; font-weight: 600; border: 1.5px solid transparent;
  cursor: pointer;
}
.chip-active   { background: var(--tasky-ink); color: white; }
.chip-inactive { background: var(--tasky-subtle); color: var(--tasky-ink); border-color: var(--tasky-line); }

.separator { width: 100%; height: 1px; background: var(--tasky-line); margin: 4px 0; }
</style>
</head>
<body>
  <span class="badge badge-verified">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
    Баталгаажсан
  </span>
  <span class="badge badge-pending">Хянагдаж байна</span>
  <div class="separator"></div>
  <span class="badge badge-open">Нээлттэй</span>
  <span class="badge badge-assigned">Хуваарилагдсан</span>
  <span class="badge badge-completed">Дууссан</span>
  <span class="badge badge-cancelled">Цуцлагдсан</span>
  <span class="badge badge-danger">No-show</span>
  <div class="separator"></div>
  <span class="chip chip-active">Бүгд</span>
  <span class="chip chip-inactive">Цэвэрлэгээ</span>
  <span class="chip chip-inactive">Засвар</span>
  <span class="chip chip-inactive">Зөөвөрлөлт</span>
</body>
</html>
