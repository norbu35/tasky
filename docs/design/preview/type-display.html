<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--color-background); padding: 20px 24px; }
.row { display: flex; align-items: baseline; gap: 16px; padding: 10px 0; border-bottom: 1px solid var(--tasky-line); }
.row:last-child { border-bottom: none; }
.meta { width: 90px; flex-shrink: 0; font-family: var(--font-sans); font-size: 10px; color: var(--color-text-tertiary); line-height: 1.4; }
</style>
</head>
<body>
  <div class="row">
    <div class="meta">Manrope 700<br>30px / -0.01em</div>
    <div class="t-hero">Даалгаврууд</div>
  </div>
  <div class="row">
    <div class="meta">Manrope 700<br>24px / -0.01em</div>
    <div class="t-heading">Tasky-д тавтай морил</div>
  </div>
  <div class="row">
    <div class="meta">Manrope 600<br>20px</div>
    <div class="t-title">Гүйцэтгэгч хайх</div>
  </div>
  <div class="row">
    <div class="meta">Manrope 600<br>18px</div>
    <div class="t-subtitle">Цэвэрлэгээ · ₮80,000</div>
  </div>
</body>
</html>
