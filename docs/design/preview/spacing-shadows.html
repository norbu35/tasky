<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #E8E6E1; font-family: var(--font-sans); padding: 24px; display: flex; gap: 20px; align-items: flex-start; flex-wrap: wrap; }
.demo { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.box { width: 80px; height: 60px; background: white; border-radius: 12px; }
.lbl { font-size: 10px; color: #808D99; text-align: center; }
</style>
</head>
<body>
  <div class="demo">
    <div class="box" style="box-shadow: 0 1px 2px rgba(0,0,0,0.05)"></div>
    <div class="lbl">card<br>0 1px 2px / 5%</div>
  </div>
  <div class="demo">
    <div class="box" style="box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -2px rgba(0,0,0,0.05)"></div>
    <div class="lbl">elevated<br>0 4px 6px / 10%</div>
  </div>
  <div class="demo">
    <div class="box" style="box-shadow: 0 4px 6px -4px rgba(0,0,0,0.1), 0 10px 15px -3px rgba(0,0,0,0.1)"></div>
    <div class="lbl">fab<br>0 10px 15px / 10%</div>
  </div>
  <div class="demo">
    <div class="box" style="box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25)"></div>
    <div class="lbl">deep<br>0 25px 50px / 25%</div>
  </div>
  <div class="demo">
    <div class="box" style="box-shadow: 0 -4px 24px rgba(26,28,26,0.04)"></div>
    <div class="lbl">nav (up)<br>0 -4px 24px / 4%</div>
  </div>
</body>
</html>
