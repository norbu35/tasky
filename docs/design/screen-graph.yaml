nodes:
  SCR-SHARED-001:
    label: Splash
    edges:
      - to: SCR-SHARED-002
        type: replace
        guard: no valid JWT
      - to: SCR-CUST-001
        type: replace
        guard: valid JWT, role == CUSTOMER
      - to: SCR-TASK-001
        type: replace
        guard: valid JWT, role == TASKER
    data_deps:
      - jwt_token
      - user_role
  SCR-SHARED-002:
    label: Login
    edges:
      - to: SCR-SHARED-005
        type: replace
        guard: auth success, new user
      - to: SCR-CUST-001
        type: replace
        guard: auth success, returning customer
      - to: SCR-TASK-001
        type: replace
        guard: auth success, returning tasker
    data_deps:
      - facebook_token
  SCR-SHARED-005:
    label: Onboarding Carousel
    edges:
      - to: SCR-SHARED-006
        type: replace
        guard: carousel completed or skipped
    data_deps: []
  SCR-SHARED-006:
    label: Role Selection
    edges:
      - to: SCR-SHARED-009
        type: replace
        guard: role selected
    data_deps:
      - selected_role
  SCR-SHARED-007:
    label: Permission — Camera
    edges:
      - to: SCR-SHARED-008
        type: replace
        guard: granted or skipped
    data_deps: []
    note: 'Used inline at first camera access point (SCR-CUST-004, SCR-TASK-005, SCR-SHARED-013), not in onboarding flow'
  SCR-SHARED-008:
    label: Permission — Location
    edges:
      - to: SCR-SHARED-009
        type: replace
        guard: granted or skipped
    data_deps: []
    note: 'Used inline at first location access point (SCR-CUST-005), not in onboarding flow'
  SCR-SHARED-009:
    label: Permission — Notifications
    edges:
      - to: SCR-CUST-001
        type: replace
        guard: role == CUSTOMER
      - to: SCR-TASK-001
        type: replace
        guard: role == TASKER
    data_deps:
      - user_role
  SCR-SHARED-010:
    label: Conversation List
    edges:
      - to: SCR-SHARED-011
        type: push
        guard: conversation selected
    data_deps:
      - user_id
    tab: inbox
  SCR-SHARED-011:
    label: Chat Detail
    edges:
      - to: SCR-SHARED-010
        type: pop
        guard: back
      - to: SCR-CUST-013
        type: push
        guard: tap counterparty avatar, role == customer
      - to: SCR-CUST-009
        type: push
        guard: tap task reference
    data_deps:
      - conversation_id
      - messages
  SCR-SHARED-012:
    label: My Profile
    edges:
      - to: SCR-SHARED-013
        type: push
        guard: tap edit
      - to: SCR-SHARED-014
        type: push
        guard: tap settings
      - to: SCR-TASK-016
        type: push
        guard: tap stats, role == tasker
    data_deps:
      - user_id
      - profile
    tab: profile
  SCR-SHARED-013:
    label: Edit Profile
    edges:
      - to: SCR-SHARED-012
        type: pop
        guard: save success or cancel
    data_deps:
      - user_id
      - profile
  SCR-SHARED-014:
    label: Settings
    edges:
      - to: SCR-SHARED-012
        type: pop
        guard: back
      - to: SCR-SHARED-015
        type: modal
        guard: tap delete account
      - to: SCR-TASK-003
        type: push
        guard: role switch to tasker, not verified
      - to: SCR-INFRA-004
        type: push
        guard: tap terms
      - to: SCR-INFRA-005
        type: push
        guard: tap help
      - to: SCR-TASK-018
        type: push
        guard: tap privacy
    data_deps:
      - user_settings
      - service_area_preferences
  SCR-SHARED-015:
    label: Account Deletion
    edges:
      - to: SCR-SHARED-014
        type: dismiss
        guard: cancel or blocked
      - to: SCR-SHARED-002
        type: replace
        guard: deletion confirmed
    data_deps:
      - active_bookings_count
      - open_disputes_count
  SCR-SHARED-016:
    label: Notification Center
    edges:
      - to: SCR-CUST-009
        type: push
        guard: tap task notification
      - to: SCR-CUST-017
        type: push
        guard: tap booking notification
      - to: SCR-TASK-002
        type: push
        guard: tap task notification, role == tasker
      - to: SCR-TASK-013
        type: push
        guard: tap booking notification, role == tasker
      - to: SCR-TASK-017
        type: modal
        guard: tap selected-tasker booking request notification, role == tasker, booking intent active
      - to: SCR-CUST-025
        type: push
        guard: tap dispute notification
    data_deps:
      - notifications
      - booking_intent_id
  SCR-SHARED-017:
    label: Review Form
    edges:
      - to: SCR-CUST-017
        type: pop
        guard: submitted, role == customer
      - to: SCR-TASK-013
        type: pop
        guard: submitted, role == tasker
    data_deps:
      - booking_id
      - counterparty_profile
    note: Shows three role-specific star categories and labels the text field as optional
  SCR-SHARED-018:
    label: Review Reminder
    edges:
      - to: SCR-SHARED-017
        type: push
        guard: tap 'Review Now'
    data_deps:
      - booking_id
    note: Bottom sheet overlay
  SCR-SHARED-019:
    label: Review Hard Lock
    edges:
      - to: SCR-SHARED-017
        type: push
        guard: tap 'Submit Review'
    data_deps:
      - pending_review_booking_id
      - lock_reason
    note: Blocks all posting/applying until resolved
  SCR-SHARED-020:
    label: Suspended Account
    edges:
      - to: SCR-CUST-001
        type: replace
        guard: suspension expired
      - to: SCR-TASK-001
        type: replace
        guard: suspension expired, role == tasker
    data_deps:
      - suspension_expiry
      - appeal_status
  SCR-SHARED-021:
    label: Banned Account
    edges: []
    data_deps:
      - ban_reason
    note: Terminal screen — no outgoing edges
  SCR-INFRA-001:
    label: Network Error
    edges: []
    data_deps:
      - cached_content
  SCR-INFRA-002:
    label: App Update
    edges: []
    data_deps:
      - min_version
      - current_version
  SCR-INFRA-003:
    label: Session Expired
    edges:
      - to: SCR-SHARED-002
        type: replace
        guard: tap re-login
    data_deps: []
  SCR-INFRA-004:
    label: Terms of Service
    edges: []
    data_deps: []
  SCR-INFRA-005:
    label: Help & Support
    edges: []
    data_deps: []
  SCR-CUST-001:
    label: My Tasks
    edges:
      - to: SCR-CUST-002
        type: push
        guard: tap FAB
      - to: SCR-CUST-009
        type: push
        guard: tap task card
      - to: SCR-SHARED-016
        type: push
        guard: tap notifications bell
    data_deps:
      - user_tasks
    tab: my_tasks
  SCR-CUST-002:
    label: Category Selection
    edges:
      - to: SCR-CUST-003
        type: push
        guard: category selected
      - to: SCR-CUST-001
        type: pop
        guard: back
    data_deps:
      - categories
  SCR-CUST-003:
    label: Intake Form
    edges:
      - to: SCR-CUST-004
        type: push
        guard: form valid
      - to: SCR-CUST-002
        type: pop
        guard: back
    data_deps:
      - category_id
      - intake_schema
  SCR-CUST-004:
    label: Photo Upload
    edges:
      - to: SCR-CUST-005
        type: push
        guard: photos uploaded or skipped
      - to: SCR-CUST-003
        type: pop
        guard: back
    data_deps:
      - photo_upload_urls
  SCR-CUST-007:
    label: Review & Submit
    edges:
      - to: SCR-CUST-008
        type: replace
        guard: submit success
      - to: SCR-CUST-006
        type: pop
        guard: back
    data_deps:
      - job_scope_summary
      - task_draft
  SCR-CUST-005:
    label: Location Pin
    edges:
      - to: SCR-CUST-006
        type: push
        guard: location set
      - to: SCR-CUST-004
        type: pop
        guard: back
    data_deps:
      - location_lat
      - location_lng
      - location_text
  SCR-CUST-006:
    label: Schedule & Pricing
    edges:
      - to: SCR-CUST-007
        type: push
        guard: schedule and pricing set
      - to: SCR-CUST-005
        type: pop
        guard: back
    data_deps:
      - scheduled_at
      - budget
      - task_draft
  SCR-CUST-008:
    label: Task Posted Success
    edges:
      - to: SCR-CUST-009
        type: replace
        guard: tap 'View Task'
      - to: SCR-CUST-001
        type: replace
        guard: tap 'Done'
    data_deps:
      - task_id
  SCR-CUST-009:
    label: Task Detail (Customer)
    edges:
      - to: SCR-CUST-011
        type: push
        guard: tap 'View Applicants', status == OPEN
      - to: SCR-CUST-010
        type: modal
        guard: tap 'Cancel'
      - to: SCR-CUST-017
        type: push
        guard: tap booking section, status == ASSIGNED
      - to: SCR-SHARED-011
        type: push
        guard: tap 'Message Tasker', status == ASSIGNED
      - to: SCR-CUST-001
        type: pop
        guard: back
    data_deps:
      - task_id
      - task_detail
      - applicant_count
  SCR-CUST-010:
    label: Task Cancel Confirmation
    edges:
      - to: SCR-CUST-009
        type: dismiss
        guard: cancel aborted
      - to: SCR-CUST-001
        type: replace
        guard: cancellation confirmed
    data_deps:
      - task_id
  SCR-CUST-011:
    label: Applicants List
    edges:
      - to: SCR-CUST-013
        type: push
        guard: tap applicant profile
      - to: SCR-CUST-014
        type: push
        guard: tap 'Select'
      - to: SCR-CUST-012
        type: modal
        guard: selected tasker declines or response window expires
      - to: SCR-CUST-009
        type: pop
        guard: back
    data_deps:
      - task_id
      - applications
  SCR-CUST-012:
    label: Applicant Timeout/Decline
    edges:
      - to: SCR-CUST-011
        type: dismiss
        guard: tap 'Select Next'
    data_deps:
      - declined_application_id
  SCR-CUST-013:
    label: Tasker Public Profile
    edges:
      - to: SCR-CUST-011
        type: pop
        guard: back
    data_deps:
      - tasker_id
      - tasker_profile
      - reviews
  SCR-CUST-014:
    label: Booking Request Confirmation
    edges:
      - to: SCR-CUST-015
        type: replace
        guard: booking request sent
      - to: SCR-CUST-011
        type: pop
        guard: back
    data_deps:
      - task_id
      - applicant_id
      - liability_disclaimer
  SCR-CUST-015:
    label: Selection Sent Success
    edges:
      - to: SCR-CUST-009
        type: replace
        guard: tap 'View Task'
      - to: SCR-CUST-001
        type: replace
        guard: tap 'Done'
    data_deps:
      - task_id
      - booking_intent_id
  SCR-CUST-016:
    label: Customer Bookings List
    edges:
      - to: SCR-CUST-017
        type: push
        guard: tap booking card
    data_deps:
      - user_bookings
    tab: bookings
  SCR-CUST-017:
    label: Booking Detail (Customer)
    edges:
      - to: SCR-CUST-018
        type: modal
        guard: tap 'Confirm Complete', tasker_marked_done
      - to: SCR-CUST-019
        type: push
        guard: tap 'Timeline'
      - to: SCR-CUST-020
        type: push
        guard: tap 'Reschedule'
      - to: SCR-CUST-021
        type: modal
        guard: no-show flag available
      - to: SCR-CUST-022
        type: modal
        guard: tap 'Cancel Booking'
      - to: SCR-CUST-024
        type: push
        guard: tap 'Report Issue'
      - to: SCR-SHARED-011
        type: push
        guard: tap 'Message'
      - to: SCR-CUST-013
        type: push
        guard: tap Tasker profile
      - to: SCR-CUST-016
        type: pop
        guard: back
    data_deps:
      - booking_id
      - booking_detail
      - tasker_profile
  SCR-CUST-018:
    label: Confirm Completion
    edges:
      - to: SCR-SHARED-017
        type: replace
        guard: completion confirmed
      - to: SCR-CUST-017
        type: dismiss
        guard: cancel
    data_deps:
      - booking_id
  SCR-CUST-019:
    label: Booking Timeline
    edges:
      - to: SCR-CUST-017
        type: pop
        guard: back
    data_deps:
      - booking_id
      - timeline_events
  SCR-CUST-020:
    label: Reschedule
    edges:
      - to: SCR-CUST-017
        type: pop
        guard: request sent or back
    data_deps:
      - booking_id
      - current_schedule
  SCR-CUST-021:
    label: No-Show Flag
    edges:
      - to: SCR-CUST-017
        type: dismiss
        guard: flagged or dismissed
    data_deps:
      - booking_id
      - schedule_start
      - last_checkin
  SCR-CUST-022:
    label: Booking Cancel (Customer)
    edges:
      - to: SCR-CUST-017
        type: dismiss
        guard: cancel aborted
      - to: SCR-CUST-016
        type: replace
        guard: cancellation confirmed
    data_deps:
      - booking_id
      - hours_to_schedule
  SCR-CUST-024:
    label: Dispute — Raise
    edges:
      - to: SCR-CUST-025
        type: replace
        guard: dispute submitted
      - to: SCR-CUST-017
        type: pop
        guard: back
    data_deps:
      - booking_id
      - evidence_artifacts
  SCR-CUST-025:
    label: Dispute — Status
    edges:
      - to: SCR-CUST-017
        type: pop
        guard: back
    data_deps:
      - dispute_id
      - dispute_status
  SCR-TASK-001:
    label: Task Feed
    edges:
      - to: SCR-TASK-002
        type: push
        guard: tap task card
      - to: SCR-SHARED-016
        type: push
        guard: tap notifications
    data_deps:
      - open_tasks
      - filters
    tab: browse
  SCR-TASK-002:
    label: Task Detail (Tasker)
    edges:
      - to: SCR-TASK-011
        type: modal
        guard: tap 'Apply', verified
      - to: SCR-TASK-003
        type: push
        guard: tap 'Apply', unverified
      - to: SCR-TASK-001
        type: pop
        guard: back
    data_deps:
      - task_id
      - task_detail
      - verification_status
      - application_count
  SCR-TASK-003:
    label: Verification Gate
    edges:
      - to: SCR-TASK-004
        type: push
        guard: tap 'Get Verified'
      - to: SCR-TASK-002
        type: pop
        guard: back
    data_deps: []
  SCR-TASK-004:
    label: Verification Consent
    edges:
      - to: SCR-TASK-005
        type: push
        guard: consent accepted
      - to: SCR-TASK-003
        type: pop
        guard: back
    data_deps: []
  SCR-TASK-005:
    label: ID Upload
    edges:
      - to: SCR-TASK-010
        type: replace
        guard: all 3 uploads complete, submitted
      - to: SCR-TASK-004
        type: pop
        guard: back
    data_deps:
      - id_front_key
      - id_back_key
      - selfie_key
  SCR-TASK-007:
    label: Verification Pending
    edges:
      - to: SCR-TASK-008
        type: replace
        guard: admin approved (push notification)
      - to: SCR-TASK-009
        type: replace
        guard: admin rejected (push notification)
      - to: SCR-TASK-001
        type: pop
        guard: back
    data_deps:
      - verification_status
      - verification_queue_status
  SCR-TASK-008:
    label: Verification Approved
    edges:
      - to: SCR-TASK-001
        type: replace
        guard: tap 'Start Browsing'
    data_deps: []
  SCR-TASK-009:
    label: Verification Rejected
    edges:
      - to: SCR-TASK-005
        type: push
        guard: tap 'Resubmit'
      - to: SCR-TASK-001
        type: pop
        guard: back
    data_deps:
      - rejection_reason
  SCR-TASK-010:
    label: Verification Submitted
    edges:
      - to: SCR-TASK-007
        type: replace
        guard: tap 'Continue'
    data_deps: []
  SCR-TASK-011:
    label: Application Sent
    edges:
      - to: SCR-TASK-001
        type: replace
        guard: tap 'Browse More'
      - to: SCR-TASK-002
        type: dismiss
        guard: tap 'View Task'
    data_deps:
      - application_id
  SCR-TASK-012:
    label: My Jobs
    edges:
      - to: SCR-TASK-013
        type: push
        guard: tap booking card
    data_deps:
      - tasker_bookings
    tab: my_jobs
  SCR-TASK-013:
    label: Booking Detail (Tasker)
    edges:
      - to: SCR-TASK-015
        type: modal
        guard: tap 'Cancel'
      - to: SCR-TASK-014
        type: modal
        guard: no-show flag available
      - to: SCR-SHARED-011
        type: push
        guard: tap 'Message'
      - to: SCR-TASK-013
        type: replace
        guard: tap 'Mark Done', API success updates booking state
      - to: SCR-TASK-013
        type: modal
        guard: tap 'Reschedule' or respond to reschedule request
      - to: SCR-SHARED-017
        type: push
        guard: tap 'Leave Review', after review debt exists
      - to: SCR-TASK-012
        type: pop
        guard: back
    data_deps:
      - booking_id
      - booking_detail
      - exact_address
      - current_schedule
      - reschedule_requests
  SCR-TASK-014:
    label: No-Show Flag (Tasker)
    edges:
      - to: SCR-TASK-013
        type: dismiss
        guard: flagged or dismissed
    data_deps:
      - booking_id
      - schedule_start
  SCR-TASK-015:
    label: Booking Cancel (Tasker)
    edges:
      - to: SCR-TASK-013
        type: dismiss
        guard: cancel aborted
      - to: SCR-TASK-012
        type: replace
        guard: cancellation confirmed
    data_deps:
      - booking_id
      - tasker_cancel_count_30d
  SCR-TASK-016:
    label: Tasker Reputation & Reliability
    edges:
      - to: SCR-SHARED-012
        type: pop
        guard: back
    data_deps:
      - tasker_stats
  SCR-TASK-017:
    label: Booking Request
    edges:
      - to: SCR-TASK-012
        type: dismiss
        guard: accepted
      - to: SCR-TASK-012
        type: dismiss
        guard: declined or expired
    data_deps:
      - booking_intent_id
      - task_id
  SCR-TASK-018:
    label: Privacy Policy
    edges: []
    data_deps: []
tab_bars:
  customer:
    tabs:
      - id: my_tasks
        label_mn: Даалгаврууд
        label_en: My Tasks
        icon: tasks
        root: SCR-CUST-001
      - id: bookings
        label_mn: Захиалгууд
        label_en: Bookings
        icon: calendar
        root: SCR-CUST-016
      - id: inbox
        label_mn: Чат
        label_en: Inbox
        icon: chat
        root: SCR-SHARED-010
      - id: profile
        label_mn: Профайл
        label_en: Profile
        icon: person
        root: SCR-SHARED-012
  tasker:
    tabs:
      - id: browse
        label_mn: Хайх
        label_en: Browse
        icon: search
        root: SCR-TASK-001
      - id: my_jobs
        label_mn: Ажлууд
        label_en: My Jobs
        icon: briefcase
        root: SCR-TASK-012
      - id: inbox
        label_mn: Чат
        label_en: Inbox
        icon: chat
        root: SCR-SHARED-010
      - id: profile
        label_mn: Профайл
        label_en: Profile
        icon: person
        root: SCR-SHARED-012
deep_links:
  - notification: new_applicant
    target: SCR-CUST-011
    params:
      - task_id
  - notification: booking_confirmed
    target: SCR-CUST-017
    params:
      - booking_id
  - notification: tasker_marked_done
    target: SCR-CUST-017
    params:
      - booking_id
  - notification: new_message
    target: SCR-SHARED-011
    params:
      - conversation_id
  - notification: verification_approved
    target: SCR-TASK-008
    params: []
  - notification: verification_rejected
    target: SCR-TASK-009
    params: []
  - notification: booking_request_selected
    target: SCR-TASK-017
    params:
      - booking_intent_id
      - task_id
  - notification: no_show_reminder
    target: SCR-CUST-021
    params:
      - booking_id
  - notification: review_reminder
    target: SCR-SHARED-017
    params:
      - booking_id
  - notification: dispute_update
    target: SCR-CUST-025
    params:
      - dispute_id
  - notification: reschedule_request
    target: SCR-CUST-020
    params:
      - booking_id
validation:
  total_nodes: 65
  dead_ends: 1
  orphans: 0
  all_screens_in_inventory: true
