                  minimum: 1
                  maximum: 5
                punctuality_rating:
                  type: integer
                  minimum: 1
                  maximum: 5
                communication_rating:
                  type: integer
                  minimum: 1
                  maximum: 5
                clarity_rating:
                  type: integer
                  minimum: 1
                  maximum: 5
