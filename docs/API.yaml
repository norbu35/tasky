              properties:
                category_id:
                  type: string
                  format: uuid
      responses:
        '201':
          description: Draft created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskDraft'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Category inactive or schema mismatch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /tasks/drafts/{id}:
    get:
      tags:
        - Tasks
      summary: Get task draft
      operationId: getTaskDraft
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Draft details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskDraft'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Exact address is locked for current user/state (`ADDRESS_LOCKED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
        - Tasks
      summary: Update task draft
      operationId: updateTaskDraft
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
