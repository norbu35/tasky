        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                intake_answers:
                  type: object
                  additionalProperties: true
                summary_draft:
                  type: string
                  nullable: true
                location_lat:
                  type: number
                  format: double
                  nullable: true
                location_lng:
                  type: number
                  format: double
                  nullable: true
                location_text:
                  type: string
                  nullable: true
                  maxLength: 500
      responses:
        '200':
          description: Draft updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskDraft'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /tasks/photos/upload-url:
    post:
      tags:
        - Tasks
      summary: Get presigned URL for pre-create task photo upload
      description: |
        Returns a presigned URL to upload a task photo directly to S3/MinIO before task creation.
        Upload keys can be submitted in `photo_keys` during `POST /tasks`.
      operationId: getTaskPreCreatePhotoUploadUrl
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - content_type
              properties:
                content_type:
                  type: string
                  example: image/jpeg
      responses:
        '200':
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresignedUrlResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /tasks:
    get:
      tags:
        - Tasks
      summary: List open tasks
      description: |
        Returns a paginated list of OPEN tasks. Supports filtering by category and
        geospatial radius search. Location data is fuzzed for privacy.
      operationId: listTasks
      security:
        - BearerAuth: []
      parameters:
        - name: category
          in: query
          description: Filter by category ID.
          schema:
            type: string
            format: uuid
        - name: lat
          in: query
          description: Latitude for radius search.
          schema:
            type: number
            format: double
        - name: lng
          in: query
          description: Longitude for radius search.
          schema:
            type: number
            format: double
        - name: radius_km
          in: query
          description: Search radius in kilometers (default 10, max 50).
          schema:
            type: number
            format: double
            default: 10
            maximum: 50
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Paginated list of open tasks.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - cursor
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PublicTask'
                  cursor:
                    $ref: '#/components/schemas/CursorPagination'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
        - Tasks
      summary: Create a new task
      description: |
        Creates a new task in OPEN status using schema-driven intake payload.
        Deterministic scope summary generation runs before final submit; if generation fails,
        server falls back to canonical key-value summary and still returns success.
        Only authenticated customers can create tasks.
      operationId: createTask
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
      responses:
        '201':
          description: Task created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /tasks/mine:
    get:
      tags:
        - Tasks
      summary: List my task ads/history
      description: |
        Returns authenticated user's task list with full task details.
        - `role=customer`: tasks created by the authenticated user.
        - `role=tasker`: tasks where the authenticated user has booking history as a tasker.
      operationId: listMyTasks
      security:
        - BearerAuth: []
      parameters:
        - name: role
          in: query
          description: View scope for task history.
          schema:
            type: string
            enum:
              - customer
              - tasker
            default: customer
        - name: status
          in: query
          description: Filter by task status.
          schema:
            type: string
            enum:
              - OPEN
              - ASSIGNED
              - COMPLETED
              - CANCELLED
              - NO_SHOW
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Paginated list of tasks for authenticated user scope.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - cursor
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Task'
                  cursor:
                    $ref: '#/components/schemas/CursorPagination'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /tasks/mine/recent-locations:
    get:
      tags:
        - Tasks
      summary: Recent distinct task locations
      description: |
        Returns up to 3 of the authenticated customer's most recent distinct task
        locations, deduplicated by proximity (~200 m). Used to populate location
        presets in the task creation wizard.
      operationId: listMyRecentLocations
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of recent distinct locations (may be empty).
          content:
            application/json:
              schema:
                type: object
                required:
                  - locations
                properties:
                  locations:
                    type: array
                    maxItems: 3
                    items:
                      $ref: '#/components/schemas/RecentLocation'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /tasks/{id}:
    get:
      tags:
        - Tasks
      summary: Get task details
      description: |
        Returns full task details. Exact location is only visible to the task owner
        and the booked tasker. Other users see approximate location only.
      operationId: getTask
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Task details.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Task'
                  - $ref: '#/components/schemas/PublicTask'
                description: |
                  Returns role-scoped task details.
                  - Owners and booked taskers receive full `Task` (exact location fields populated).
                  - Other authorized users receive redacted `PublicTask` (approximate location only).
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
        - Tasks
      summary: Update a task
      description: |
        Updates a task. Only the task owner can update, and only while the task is in OPEN status.
      operationId: updateTask
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskRequest'
      responses:
        '200':
          description: Task updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Task is not in OPEN status and cannot be updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /tasks/{id}/cancel:
    post:
      tags:
        - Tasks
      summary: Cancel a task
      description: |
        Cancels an OPEN task. Only the task owner can cancel.
        If the task has an active booking, use the booking cancellation endpoint instead.
      operationId: cancelTask
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Task cancelled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Task cannot be cancelled in its current status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /tasks/{id}/photos/upload-url:
    post:
      tags:
        - Tasks
      summary: Get presigned URL for task photo upload
      description: |
        Returns a presigned URL to upload a task photo directly to S3/MinIO.
        Maximum 3 photos per task.
      operationId: getTaskPhotoUploadUrl
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - content_type
              properties:
                content_type:
                  type: string
                  example: image/jpeg
      responses:
        '200':
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresignedUrlResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /tasks/{id}/applications:
    post:
      tags:
        - Applications
      summary: Apply to a task
      description: |
        Tasker applies to an OPEN task. Only verified taskers can apply.
        The current live contract captures a short application note only.
        Phase 1 launch UX does not expose open-ended pre-booking chat.
        PRD v2.0 requires a later contract remediation to add structured pricing-response fields.
      operationId: applyToTask
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - message
              properties:
                message:
                  type: string
                  minLength: 1
                  maxLength: 500
                  description: Short application note. Current live contract does not yet model structured pricing response data.
      responses:
        '201':
          description: Application submitted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskApplication'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: User is not a verified tasker.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Tasker already applied or task is not OPEN.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                applicationCap:
                  summary: Application cap reached
                  value:
                    code: APPLICATION_CAP_REACHED
                    message: Maximum number of applications reached for this task.
                    trace_id: abc-123
    get:
      tags:
        - Applications
      summary: List applications for a task
      description: |
        Returns paginated list of applications for a task.
        Only the task owner can view all applications.
      operationId: listTaskApplications
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Paginated list of applications.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - cursor
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/TaskApplication'
                  cursor:
                    $ref: '#/components/schemas/CursorPagination'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /tasks/{id}/applications/{applicationId}/accept:
    post:
      tags:
        - Applications
      summary: Select a tasker's application
      description: |
        Customer selects a tasker's application. This creates a pending booking intent and marks the
        application as `SELECTED`.
        Requires `liability_disclaimer_accepted=true`.
        The selected tasker then has the default 4-hour response window to confirm or decline.
        Other applications remain available until a booking is confirmed.
        Requires Idempotency-Key header.
      operationId: selectApplication
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
        - name: applicationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - liability_disclaimer_accepted
              properties:
                liability_disclaimer_accepted:
                  type: boolean
                  description: Must be `true` to create the booking request.
                  enum:
                    - true
      responses:
        '201':
          description: Booking intent created for the selected application.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingIntent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Application already processed, selection already pending, or task is not OPEN.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Liability disclaimer not accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /tasks/{id}/booking-intents:
    post:
      tags:
        - Bookings
      summary: Create booking intent for non-application confirmation sources
      description: |
        Creates a booking intent for a customer-owned OPEN task.
        `REBOOK` is the only active non-application source in the current contract.
      operationId: createBookingIntent
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - source
                - tasker_id
              properties:
                source:
                  type: string
                  enum:
                    - REBOOK
                tasker_id:
                  type: string
                  format: uuid
                original_booking_id:
                  type: string
                  format: uuid
                  nullable: true
                offer_id:
                  type: string
                  format: uuid
                  nullable: true
      responses:
        '201':
          description: Booking intent created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingIntent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Task or source constraints not satisfiable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /bookings:
    get:
      tags:
        - Bookings
      summary: List my bookings
      description: |
        Returns paginated list of bookings for the authenticated user.
        Filter by role (as customer or tasker) and booking status.
      operationId: listBookings
      security:
        - BearerAuth: []
      parameters:
        - name: role
          in: query
          description: View bookings as customer or tasker.
          schema:
            type: string
            enum:
              - customer
              - tasker
        - name: status
          in: query
          description: Filter by booking status.
          schema:
            type: string
            enum:
              - ASSIGNED
              - COMPLETED
              - CANCELLED
              - NO_SHOW
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Paginated list of bookings.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - cursor
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Booking'
                  cursor:
                    $ref: '#/components/schemas/CursorPagination'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /bookings/{id}:
    get:
      tags:
        - Bookings
      summary: Get booking details
      description: Returns full booking details. Only accessible by the booking's customer or tasker.
      operationId: getBooking
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Booking details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /bookings/{id}/schedule-events:
    get:
      tags:
        - Bookings
      summary: List booking schedule events
      description: Returns immutable reschedule timeline events for auditability.
      operationId: listBookingScheduleEvents
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Schedule events.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/BookingScheduleEvent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /bookings/{id}/cancel:
    post:
      tags:
        - Bookings
      summary: Cancel a booking
      description: |
        Cancels an active booking. Cancellation policy applies:
        - Customer: Free cancellation > 4 hours before scheduled_at. Late cancellation is recorded as a reliability incident.
        - Tasker: Task reverts to OPEN. Strike recorded. Suspension thresholds/durations are managed by admin moderation policy.
        Requires Idempotency-Key header.
      operationId: cancelBooking
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  description: Optional cancellation reason. Taskers can use "Safety/Fraud" to bypass strikes.
      responses:
        '200':
          description: Booking cancelled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Booking cannot be cancelled in its current status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /bookings/{id}/complete:
    post:
      tags:
        - Bookings
      summary: Mark booking as complete
      description: |
        Customer marks an ASSIGNED booking as complete. This triggers:
        - Booking status -> COMPLETED
        - Task status -> COMPLETED
        Requires Idempotency-Key header.
      operationId: completeBooking
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      responses:
        '200':
          description: Booking completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Booking is not in ASSIGNED status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /bookings/{id}/reschedule:
    post:
      tags:
        - Bookings
      summary: Request booking reschedule
      description: |
        Either booking party may request a reschedule while booking is ASSIGNED.
        Counterparty accepts/declines in-app. Policy timers always reference the latest accepted schedule.
        Requires Idempotency-Key header.
      operationId: requestBookingReschedule
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - proposed_scheduled_at
              properties:
                proposed_scheduled_at:
                  type: string
                  format: date-time
                reason:
                  type: string
                  nullable: true
                  maxLength: 1000
      responses:
        '201':
          description: Reschedule request created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingScheduleEvent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Booking is not in ASSIGNED status or proposed time invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /bookings/{id}/reschedule/{eventId}/respond:
    post:
      tags:
        - Bookings
      summary: Accept or decline reschedule request
      description: Responds to a pending reschedule request. Accepted response updates canonical schedule.
      operationId: respondBookingReschedule
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - action
              properties:
                action:
                  type: string
                  enum:
                    - ACCEPT
                    - DECLINE
      responses:
        '200':
          description: Reschedule request responded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingScheduleEvent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Request already finalized or booking not eligible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /bookings/{id}/no-show/flag:
    post:
      tags:
        - Bookings
      summary: Flag and adjudicate no-show
      description: |
        No-show adjudication follows deterministic rules:
        reminder at scheduled +10m; no-show flag eligibility at +15m; rejected if either party
        posted a status/check-in in trailing 30 minutes or a newer accepted reschedule supersedes schedule.
        On success, both booking and linked task transition to NO_SHOW in one transaction.
        Requires Idempotency-Key header.
      operationId: flagNoShow
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      responses:
        '200':
          description: No-show confirmed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: No-show rules not satisfied (`NO_SHOW_NOT_ELIGIBLE`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /bookings/{id}/mark-done:
    post:
      tags:
        - Bookings
      summary: Tasker marks booking as done
      description: |
        Tasker signals that work is finished while booking remains active.
        Customer is notified to review and finalize booking completion.
        Requires Idempotency-Key header.
      operationId: markBookingDone
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      responses:
        '200':
          description: Booking marked done by tasker.
          content:
            application/json:
              schema:
                type: object
                required:
                  - booking
                  - tasker_marked_done_at
                properties:
                  booking:
                    $ref: '#/components/schemas/Booking'
                  tasker_marked_done_at:
                    type: string
                    format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Booking is not in ASSIGNED status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /bookings/{id}/rebook:
    post:
      tags:
        - Bookings
      summary: Rebook from completed booking
      description: |
        Creates a new OPEN task prefilled from a completed booking (same category, location, budget).
        Intake answers use the current active schema version.
      operationId: rebookFromBooking
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '201':
          description: New task created from completed booking.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Booking is not in COMPLETED status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /booking-intents/{id}:
    get:
      tags:
        - Bookings
      summary: Get booking intent
      description: Returns booking intent details for the owner or the selected tasker.
      operationId: getBookingIntent
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Booking intent details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingIntent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /booking-intents/{id}/confirm:
    post:
      tags:
        - Bookings
      summary: Tasker confirms booking intent
      description: |
        The selected tasker confirms a pending booking intent within the default 4-hour response window.
        This creates an ASSIGNED booking and closes the remaining applications for the task.
        Requires Idempotency-Key header.
      operationId: confirmBookingIntent
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      responses:
        '200':
          description: Booking created from intent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Intent or task status does not allow confirmation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /booking-intents/{id}/decline:
    post:
      tags:
        - Bookings
      summary: Tasker declines booking intent
      description: |
        The selected tasker declines a pending booking intent.
        The customer can then return to the applicant list and choose another tasker.
      operationId: declineBookingIntent
      x-tasky-status: deferred
      x-tasky-target-phase: phase_2
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      responses:
        '200':
          description: Booking intent declined.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingIntent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Intent is not pending or already resolved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /payments/bookings/{id}/initiate:
    post:
      tags:
        - Payments
      summary: Initiate QPay payment for a booking
      description: |
        Phase-gated endpoint. Enabled only when the current rollout phase activates this feature.
        Generates a QPay payment link and QR code for the booking.
        The booking must be in ASSIGNED status and monetization must be enabled.
        Requires Idempotency-Key header.
        Requires explicit liability disclaimer acceptance.
      operationId: initiatePayment
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - liability_disclaimer_accepted
              properties:
                liability_disclaimer_accepted:
                  type: boolean
                  description: Must be `true` to initiate payment.
                  enum:
                    - true
      responses:
        '200':
          description: Payment link generated.
          content:
            application/json:
              schema:
                type: object
                required:
                  - payment_url
                  - qr_code
                properties:
                  payment_url:
                    type: string
                    format: uri
                    description: QPay deeplink URL for app-to-app payment.
                  qr_code:
                    type: string
                    description: Base64-encoded QR code image for scanning.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Booking is not eligible for payment initiation or payment already initiated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Monetization feature is disabled for the current rollout phase.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /payments/qpay/callback:
    post:
      tags:
        - Payments
      summary: QPay payment webhook callback
      security: []
      description: |
        Phase-gated endpoint. Enabled only when the current rollout phase activates this feature.
        Receives payment confirmation from QPay. No Bearer auth — secured via signature verification.
        On successful payment: booking status may be updated per monetization state machine.
        Must be idempotent (handle duplicate callbacks gracefully).
      operationId: qpayCallback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: QPay callback payload. Schema defined by QPay integration.
              required:
                - payment_id
                - status
                - timestamp
                - signature
              properties:
                payment_id:
                  type: string
                object_type:
                  type: string
                  enum:
                    - BOOKING_ESCROW
                    - CREDIT_PACK
                object_id:
                  type: string
                  description: Booking ID or credit purchase intent ID passed during payment initiation.
                amount:
                  type: integer
                status:
                  type: string
                timestamp:
                  type: integer
                  format: int64
                  description: Unix epoch seconds, included in HMAC payload.
                signature:
                  type: string
                  description: HMAC signature for verification.
      responses:
        '200':
          description: Callback processed successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
        '400':
          description: Invalid callback payload or signature.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Monetization feature is disabled for the current rollout phase.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /wallet:
    get:
