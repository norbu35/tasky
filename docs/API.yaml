                  enum:
                    - DRAFT
                    - CANARY
                    - ACTIVE
      responses:
        '201':
          description: Schema version created.
          content:
            application/json:
              schema:
                type: object
                required:
                  - version
                  - status
                properties:
                  version:
                    type: integer
                  status:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/categories/{id}/schemas/{version}/activate:
    post:
      tags:
        - Admin
      summary: Activate or rollback category schema version
      operationId: adminActivateCategorySchema
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
        - name: version
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - mode
              properties:
                mode:
                  type: string
                  enum:
                    - CANARY
                    - ACTIVE
                    - ROLLBACK_TO_LAST_KNOWN_GOOD
      responses:
        '200':
          description: Schema activation state updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    type: integer
                  status:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
