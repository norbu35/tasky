      responses:
        '200':
          description: Paginated list of active categories.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - cursor
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Category'
                  cursor:
                    $ref: '#/components/schemas/CursorPagination'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /tasks/drafts:
    post:
      tags:
        - Tasks
      summary: Create task draft
      description: |
        Creates a draft bound to the currently active category intake schema version.
        Submit-time validation must use this bound version even if a newer schema is activated later.
      operationId: createTaskDraft
      security:
        - BearerAuth: []
