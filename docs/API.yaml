      summary: Concierge assign task to tasker (Phase 0-1)
      description: |
        Founder/admin manual dispatch fallback for low-liquidity periods.
        Creates booking assignment if target tasker is eligible and verified.
        Requires Idempotency-Key header.
      operationId: adminConciergeAssignTask
      security:
        - BearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ tasker_id, override_reason, liability_disclaimer_accepted ]
              properties:
                tasker_id:
                  type: string
                  format: uuid
                override_reason:
                  type: string
                  minLength: 3
                  maxLength: 500
                liability_disclaimer_accepted:
                  type: boolean
                  enum: [ true ]
      responses:
        '200':
          description: Concierge assignment completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Task not eligible for assignment or tasker not eligible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

