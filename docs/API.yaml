  /bookings/{id}/disputes:
    post:
      tags:
        - Disputes
      summary: Raise a dispute
      description: |
        Either booking party (customer or tasker) may raise a dispute.
        Allowed states:
        - ASSIGNED booking (in-progress)
        - COMPLETED booking within 24 hours of completion
        Raising a dispute blocks booking closure actions until admin resolution.
        Requires Idempotency-Key header.
      operationId: raiseDispute
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reason
                - evidence
              properties:
                reason:
                  type: string
                  minLength: 10
                  maxLength: 2000
                evidence:
                  type: array
                  minItems: 1
                  items:
                    $ref: '#/components/schemas/DisputeEvidence'
      responses:
        '201':
          description: Dispute raised.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dispute'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Dispute already raised or booking status/timing does not allow disputes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /disputes/{id}:
    get:
