    post:
      tags: [ Admin ]
      summary: Resolve a dispute
      description: |
        Admin resolves a dispute by selecting customer-favor, tasker-favor, or escalation outcome.
        Later rollout phases may extend this endpoint with refund/release amount handling.
        Requires Idempotency-Key header.
      operationId: adminResolveDispute
      security:
        - BearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ resolution ]
              properties:
                resolution:
                  type: string
                  enum: [ RESOLVE_CUSTOMER, RESOLVE_TASKER, ESCALATE ]
