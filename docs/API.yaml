      responses:
        '200':
          description: Auth scope confirmed.
          content:
            application/json:
              schema:
                type: object
                required:
                  - role
                  - userId
                properties:
                  role:
                    type: string
                    example: ADMIN
                  userId:
                    type: string
                    format: uuid
        '401':
