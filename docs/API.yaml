  /admin/outbox/summary:
    get:
      tags:
        - Admin
      summary: Outbox event summary
      description: Returns counts of outbox events by status (pending, failed, processed, processing).
      operationId: adminOutboxSummary
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Outbox summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutboxSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/outbox/events:
    get:
      tags:
        - Admin
      summary: List outbox events
      description: Paginated list of outbox events filtered by status.
      operationId: adminListOutboxEvents
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - PENDING
              - FAILED
              - PROCESSED
              - PROCESSING
            default: FAILED
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 200
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        '200':
          description: Paginated list of outbox events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutboxEventPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/outbox/events/{id}:
    get:
      tags:
        - Admin
      summary: Get outbox event detail
      description: Returns a single outbox event by ID.
      operationId: adminGetOutboxEvent
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Outbox event detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutboxEvent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/outbox/events/{id}/replay:
    post:
      tags:
        - Admin
      summary: Replay outbox event
      description: Resets a FAILED outbox event to PENDING so the processor will retry it.
      operationId: adminReplayOutboxEvent
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Event replay initiated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  eventId:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Event is not in FAILED status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /admin/outbox/events/replay-all:
    post:
      tags:
        - Admin
      summary: Replay all failed outbox events
      description: Resets all FAILED outbox events to PENDING for bulk retry.
      operationId: adminReplayAllOutboxEvents
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Bulk replay initiated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  replayed_count:
                    type: integer
                  total_failed:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /location/reverse-geocode:
    get:
      tags:
        - Location
      summary: Reverse geocode coordinates to district-level address
      description: |
        Returns the nearest UB district name and centroid for the provided
        coordinates. Used to populate the location label on the task-post form.
      operationId: reverseGeocode
      security:
        - BearerAuth: []
      parameters:
        - name: lat
          in: query
          required: true
          schema:
            type: number
            format: double
            minimum: -90
            maximum: 90
        - name: lng
          in: query
          required: true
          schema:
            type: number
            format: double
            minimum: -180
            maximum: 180
      responses:
        '200':
          description: District-level address resolved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReverseGeocodeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /location/search:
    get:
      tags:
        - Location
      summary: Search locations by name fragment
      description: |
        Returns matching UB districts for the query string. Used to power the
        address auto-complete on the task-post form.
      operationId: searchLocations
      security:
        - BearerAuth: []
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
        - name: bias_lat
          in: query
          required: false
          schema:
            type: number
            format: double
        - name: bias_lng
          in: query
          required: false
          schema:
            type: number
            format: double
      responses:
        '200':
          description: Search results returned (may be empty).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationSearchResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
