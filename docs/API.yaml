  /wallet/payouts:
    post:
      tags:
        - Wallet
      summary: Request payout
      description: |
        Phase-gated endpoint.
        Tasker requests a payout from their wallet balance to a bank account.
        Payouts are processed by admin on Tuesdays and Fridays.
        Requires Idempotency-Key header.
      operationId: requestPayout
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - amount
                - bank_name
                - bank_account
              properties:
                amount:
                  type: integer
                  minimum: 10000
                  description: Payout amount in MNT. Minimum 10,000 MNT.
                bank_name:
                  type: string
                  example: Хаан банк
                bank_account:
                  type: string
                  example: '5012345678'
      responses:
        '201':
          description: Payout request created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayoutRequest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Insufficient balance or existing pending payout.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Monetization feature is disabled for the current rollout phase.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /bookings/{id}/reviews:
    post:
      tags:
        - Reviews
      summary: Submit a review
      description: |
        Submit a review for a COMPLETED booking. Both customer and tasker can review each other.
        Each party can only submit one review per booking.
      operationId: submitReview
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: |
                Role-specific validation: customers must provide quality + punctuality + communication; taskers must provide clarity + respectfulness + punctuality.
              required:
                - punctuality_rating
              properties:
                quality_rating:
                  type: integer
                  minimum: 1
                  maximum: 5
                punctuality_rating:
                  type: integer
                  minimum: 1
                  maximum: 5
                communication_rating:
                  type: integer
                  minimum: 1
                  maximum: 5
                clarity_rating:
                  type: integer
                  minimum: 1
                  maximum: 5
                respectfulness_rating:
                  type: integer
                  minimum: 1
                  maximum: 5
                comment:
                  type: string
                  maxLength: 1000
                  nullable: true
      responses:
        '201':
          description: Review submitted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Review already submitted for this booking or booking is not COMPLETED.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
