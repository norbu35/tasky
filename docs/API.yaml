          type: string
          example: MNT
    LedgerEntry:
      type: object
      required:
        - id
        - amount
        - type
        - description
        - created_at
      properties:
        id:
          type: string
          format: uuid
        amount:
          type: integer
          description: Signed amount in MNT. Positive = credit, negative = debit.
        type:
          type: string
          enum:
            - DEPOSIT
            - FEE
            - PAYOUT
            - REFUND
        reference_id:
          type: string
          format: uuid
          nullable: true
          description: Related booking or payout ID.
        description:
          type: string
          example: 'Цэвэрлэгээ ажил #1234 — орлого'
        created_at:
          type: string
          format: date-time
    PayoutRequest:
      type: object
      required:
        - id
        - amount
        - bank_name
        - bank_account
        - status
        - created_at
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        amount:
          type: integer
          description: Payout amount in MNT.
        bank_name:
          type: string
          example: Хаан банк
        bank_account:
          type: string
          example: '5012345678'
        status:
          type: string
          enum:
            - PENDING
            - PROCESSED
            - REJECTED
        created_at:
          type: string
          format: date-time
        processed_at:
          type: string
          format: date-time
          nullable: true
    PendingReview:
      type: object
      required:
        - id
        - booking_id
        - user_id
        - status
        - triggered_at
      properties:
        id:
          type: string
          format: uuid
        booking_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - PENDING
            - REMINDED_24H
            - REMINDED_72H
            - COMPLETED
            - EXPIRED
        triggered_at:
          type: string
          format: date-time
        resolved_at:
          type: string
          format: date-time
          nullable: true
        investigation_active:
          type: boolean
    Review:
      type: object
      required:
        - id
        - booking_id
        - reviewer_id
        - reviewee_id
        - punctuality_rating
        - created_at
      properties:
        id:
          type: string
          format: uuid
        booking_id:
          type: string
          format: uuid
        reviewer_id:
          type: string
          format: uuid
        reviewer:
          $ref: '#/components/schemas/Profile'
        reviewee_id:
          type: string
          format: uuid
        quality_rating:
          type: integer
          minimum: 1
          maximum: 5
        punctuality_rating:
          type: integer
          minimum: 1
          maximum: 5
        communication_rating:
          type: integer
          minimum: 1
          maximum: 5
        clarity_rating:
          type: integer
          minimum: 1
          maximum: 5
        respectfulness_rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
    Dispute:
      type: object
      required:
        - id
        - booking_id
        - raised_by
        - reason
        - status
        - created_at
      properties:
        id:
          type: string
          format: uuid
        booking_id:
          type: string
          format: uuid
        booking:
          $ref: '#/components/schemas/Booking'
        raised_by:
          type: string
          format: uuid
        reason:
          type: string
        status:
          type: string
          enum:
            - OPEN
            - RESOLVED_TASKER
            - RESOLVED_CUSTOMER
            - ESCALATED
            - CLOSED_INSUFFICIENT_EVIDENCE
        resolution_action:
          type: string
          enum:
            - RESOLVE_CUSTOMER
            - RESOLVE_TASKER
            - ESCALATE
            - REFUND
            - RELEASE
          nullable: true
        wrongful_party_user_id:
          type: string
          format: uuid
          nullable: true
        resolution_amount:
          type: integer
          nullable: true
        resolution_notes:
          type: string
          nullable: true
        evidence:
          type: array
          items:
            $ref: '#/DisputeEvidence'
        created_at:
          type: string
          format: date-time
        resolved_at:
          type: string
          format: date-time
          nullable: true
    DisputeEvidence:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - CHAT_EXCERPT
            - PHOTO
            - WRITTEN_TIMELINE
        storage_key:
          type: string
          nullable: true
        text_payload:
          type: string
          nullable: true
    Conversation:
      type: object
      required:
        - id
        - task_id
        - counterparty_id
        - counterparty_name
        - unread_count
        - created_at
      properties:
        id:
          type: string
          format: uuid
        task_id:
          type: string
          format: uuid
        task_title:
          type: string
          nullable: true
          description: Truncated task description for display.
        counterparty_id:
          type: string
          format: uuid
        counterparty_name:
          type: string
        counterparty_avatar_url:
          type: string
          format: uri
          nullable: true
        counterparty_last_active_at:
          type: string
          format: date-time
          nullable: true
        last_message_content:
          type: string
          nullable: true
          description: Truncated last message content.
        last_message_at:
          type: string
          format: date-time
          nullable: true
        unread_count:
          type: integer
          description: Always 0 until read-receipt tracking is implemented.
        created_at:
          type: string
          format: date-time
    Message:
      type: object
      required:
        - id
        - conversation_id
        - sender_id
        - content
        - created_at
      properties:
        id:
          type: string
          format: uuid
        conversation_id:
          type: string
          format: uuid
        sender_id:
          type: string
          format: uuid
        content:
          type: string
        phone_number_flagged:
          type: boolean
          nullable: true
        content_hash:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
    FeatureToggle:
      type: object
      required:
        - feature_name
        - is_enabled
        - updated_at
      properties:
        feature_name:
          type: string
          enum:
            - lead_fee_enabled
            - subscription_enabled
            - escrow_enabled
            - ai_scope_summary_enabled
          description: Seeded feature toggle names; current runtime consumer status varies by toggle. Future-facing names such as `promoted_listings_enabled` and `b2b_enabled` are not part of the current API toggle enum because this sweep found no confirmed seeded runtime support for them.
        is_enabled:
          type: boolean
        updated_by:
          type: string
          format: uuid
          nullable: true
        updated_at:
          type: string
          format: date-time
    ReverseGeocodeResponse:
      type: object
      required:
        - formatted_address
        - district
        - approximate_lat
        - approximate_lng
      properties:
        formatted_address:
          type: string
        district:
          type: string
        district_mn:
          type: string
          nullable: true
        approximate_lat:
          type: number
          format: double
        approximate_lng:
          type: number
          format: double
    LocationSearchResponse:
      type: object
      required:
        - results
      properties:
        results:
          type: array
          items:
            $ref: '#/LocationSearchResult'
    OutboxSummary:
      type: object
      required:
        - pending
        - failed
        - processed
        - processing
      properties:
        pending:
          type: integer
        failed:
          type: integer
        processed:
          type: integer
        processing:
          type: integer
    OutboxEvent:
      type: object
      required:
        - id
        - event_type
        - status
      properties:
        id:
          type: string
          format: uuid
        event_type:
          type: string
        aggregate_type:
          type: string
        aggregate_id:
          type: string
          format: uuid
          nullable: true
        payload:
          type: string
          description: JSON payload
        status:
          type: string
          enum:
            - PENDING
            - PROCESSING
            - PROCESSED
            - FAILED
        attempts:
          type: integer
        available_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        processed_at:
          type: string
          format: date-time
          nullable: true
        last_error:
          type: string
          nullable: true
        correlation_id:
          type: string
          nullable: true
        trace_id:
          type: string
          nullable: true
        causation_id:
          type: string
          nullable: true
        command_id:
          type: string
          nullable: true
        workflow_id:
          type: string
          nullable: true
        actor_id:
          type: string
          nullable: true
        locale:
          type: string
          nullable: true
        platform:
          type: string
          nullable: true
    OutboxEventPage:
      type: object
      required:
        - events
        - total
        - offset
        - limit
      properties:
        events:
          type: array
          items:
            $ref: '#/OutboxEvent'
        total:
          type: integer
        offset:
          type: integer
        limit:
          type: integer
    LocationSearchResult:
      type: object
      required:
        - formatted_address
        - lat
        - lng
      properties:
        formatted_address:
          type: string
        lat:
          type: number
          format: double
        lng:
          type: number
          format: double
        district:
          type: string
          nullable: true
    AdminDisputeDetail:
      type: object
      required:
        - dispute
        - booking
        - evidence_messages
      properties:
        dispute:
          type: object
          additionalProperties: true
        booking:
          type: object
          additionalProperties: true
        conversation_id:
          type: string
          nullable: true
        evidence_messages:
          type: array
          items: {}
    CategorySchemaVersion:
      type: object
      required:
        - version
        - status
        - schema_json
        - created_at
      properties:
        version:
          type: integer
        status:
          type: string
        schema_json:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
    AdminCategoryPayload:
      type: object
      required:
        - name
        - name_mn
        - icon_url
        - sort_order
        - intake_enabled
      properties:
        name:
          type: string
        name_mn:
          type: string
        icon_url:
          type: string
          format: uri
        sort_order:
          type: integer
        intake_enabled:
          type: boolean
        is_active:
          type: boolean
  responses:
    BadRequest:
      description: Invalid request parameters or body.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid authentication token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: |
        Insufficient permissions or policy gate active for this action.
        Common codes: `FORBIDDEN`, `VERIFICATION_REQUIRED`, `OTP_MIGRATION_REQUIRED`, `ADDRESS_LOCKED`, `USER_BANNED`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Requested resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Conflict with current resource state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Rate limit exceeded.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
paths:
  /system/version:
    get:
      tags:
        - System
      summary: API version and status
      description: Returns application name, API version, and a localized status string. No authentication required.
      operationId: getSystemVersion
      security: []
      responses:
        '200':
          description: Version info
          content:
            application/json:
              schema:
                type: object
                properties:
                  application:
                    type: string
                    example: tasky-server
                  api_version:
                    type: string
                    example: v1
                  status_localized:
                    type: string
                    example: OK
                  timestamp_utc:
                    type: string
                    format: date-time
  /auth/facebook:
    post:
      tags:
        - Auth
      summary: Authenticate with Facebook OAuth
      description: |
        Validates a Facebook user access token and returns JWT tokens.
        Phase 0-1: primary authentication endpoint.
        Phase 2+: available only for legacy identity linkage/migration flows.
        Phase 0-1 behavior: creates a new user when `facebook_id` has not been seen before.
        Phase 2+ behavior: does not create new users from Facebook-only identity.
      operationId: loginWithFacebook
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - access_token
              properties:
                access_token:
                  type: string
                  description: Facebook user access token from the client SDK.
                  example: EAABsbCS1...
      responses:
        '200':
          description: Authentication successful.
          content:
            application/json:
              schema:
                type: object
                required:
                  - access_token
                  - refresh_token
                  - user
                properties:
                  access_token:
                    type: string
                  refresh_token:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Invalid or mismatched Facebook token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: In Phase 2+, Facebook-only signup is disabled for new users.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          description: OAuth provider unavailable in Phase 0-1 (`AUTH_PROVIDER_UNAVAILABLE`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/facebook/status:
    get:
      tags:
        - Auth
      summary: Facebook OAuth circuit breaker status
      description: |
        Returns the current state of the Facebook OAuth circuit breaker.
        Used by the web auth page to surface outage banners when the Facebook
        OAuth provider is degraded or unavailable.
      operationId: getFacebookStatus
      security: []
      responses:
        '200':
          description: Circuit breaker state.
          content:
            application/json:
              schema:
                type: object
                required:
                  - available
                  - state
                properties:
                  available:
                    type: boolean
                  state:
                    type: string
                    enum:
                      - CLOSED
                      - OPEN
                      - HALF_OPEN
  /auth/logout:
    post:
      tags:
        - Auth
      summary: Logout and revoke access token
      description: |
        Revokes the current access token. The token cannot be used after this call.
      operationId: logout
      responses:
        '204':
          description: Token revoked successfully.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/otp/request:
    post:
      tags:
        - Auth
      summary: Request OTP code
      description: |
        Sends a one-time password (OTP) to a phone number.
        Phase 2+ endpoint used for primary phone authentication and Facebook-user migration.
      operationId: requestOtp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - phone_number
              properties:
                phone_number:
                  type: string
                  example: '+97699001122'
      responses:
        '202':
          description: OTP request accepted.
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                properties:
                  message:
                    type: string
                    example: OTP sent
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: OTP authentication disabled for current rollout phase (`FEATURE_DISABLED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/otp/verify:
    post:
      tags:
        - Auth
      summary: Verify OTP and authenticate
      description: |
        Verifies OTP code and issues JWT tokens.
        In Phase 2+, this is the primary auth endpoint for new users and migrated Facebook users.
      operationId: verifyOtp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - phone_number
                - otp_code
              properties:
                phone_number:
                  type: string
                  example: '+97699001122'
                otp_code:
                  type: string
                  example: '123456'
                facebook_access_token:
                  type: string
                  nullable: true
                  description: Optional token used during Phase 2 migration to link prior Facebook identity.
      responses:
        '200':
          description: Authentication successful.
          content:
            application/json:
              schema:
                type: object
                required:
                  - access_token
                  - refresh_token
                  - user
                properties:
                  access_token:
                    type: string
                  refresh_token:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Invalid or expired OTP code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: OTP authentication disabled for current rollout phase (`FEATURE_DISABLED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/dev/login:
    post:
      tags:
        - Auth
      summary: Dev login (development only)
      description: |
        Authenticate with a phone number and role without SMS OTP.
        Only available when `tasky.dev-auth.enabled=true`. Never enabled in production.
      operationId: devLogin
      x-tasky-status: deferred
      x-tasky-target-phase: phase_2
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - phone
                - role
              properties:
                phone:
                  type: string
                  format: phone
                role:
                  type: string
                  enum:
                    - CUSTOMER
                    - TASKER
                    - ADMIN
      responses:
        '200':
          description: Auth session with tokens.
          content:
            application/json:
              schema:
                type: object
                required:
                  - access_token
                  - refresh_token
                  - user
                properties:
                  access_token:
                    type: string
                  refresh_token:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
  /auth/token/refresh:
    post:
      tags:
        - Auth
      summary: Refresh access token
      description: Exchange a valid refresh token for a new token pair.
      operationId: refreshToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refresh_token
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: Tokens refreshed successfully.
          content:
            application/json:
              schema:
                type: object
                required:
                  - access_token
                  - refresh_token
                properties:
                  access_token:
                    type: string
                  refresh_token:
                    type: string
        '401':
          description: Invalid or expired refresh token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /users/me:
    get:
      tags:
        - Users
      summary: Get current user profile
      description: Returns the full profile of the authenticated user.
      operationId: getMyProfile
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags:
        - Users
      summary: Update current user profile
      description: Updates profile fields for the authenticated user.
      operationId: updateMyProfile
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                full_name:
                  type: string
                  minLength: 1
                  maxLength: 100
                avatar_url:
                  type: string
                  format: uri
                  nullable: true
                bio:
                  type: string
                  maxLength: 200
      responses:
        '200':
          description: Profile updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags:
        - Users
      summary: Request account deletion
      description: |
        Marks the account for deletion. Identity data is anonymized after 90-day retention period.
      operationId: requestAccountDeletion
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Account deletion requested.
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                properties:
                  message:
                    type: string
                    example: Account deletion requested. Data will be removed after 90-day retention period.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /users/me/role/tasker:
    post:
      tags:
        - Users
      summary: Activate tasker role
      description: |
        Requests role transition from CUSTOMER to TASKER.
        Verification status remains pending until admin approval.
      operationId: activateTaskerRole
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Role updated to TASKER.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: User is already TASKER or ADMIN.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /users/me/avatar/upload-url:
    post:
      tags:
        - Users
      summary: Get presigned URL for avatar upload
      description: |
        Returns a presigned URL to upload an avatar image directly to S3/MinIO.
        URLs are constrained to image/jpeg, image/png, and image/webp with a 5MB max size.
        After uploading, use the returned `storage_key` to update the profile.
      operationId: getAvatarUploadUrl
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - content_type
              properties:
                content_type:
                  type: string
                  description: MIME type of the file.
                  enum:
                    - image/jpeg
                    - image/png
                    - image/webp
                  example: image/jpeg
      responses:
        '200':
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresignedUrlResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /users/me/stats:
    get:
      tags:
        - Users
      summary: Get current user stats
      description: Returns aggregate statistics for the authenticated user.
      operationId: getMyStats
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User statistics.
          content:
            application/json:
              schema:
                type: object
                required:
                  - completed_tasks
                  - rating_avg
                properties:
                  completed_tasks:
                    type: integer
                    example: 12
                  rating_avg:
                    type: number
                    format: double
                    example: 4.8
                  last_active_at:
                    type: string
                    format: date-time
                    nullable: true
                  joined_at:
                    type: string
                    format: date-time
                    nullable: true
        '401':
          $ref: '#/components/responses/Unauthorized'
  /verification/upload-url:
    post:
      tags:
        - Verification
      summary: Get presigned URL for verification image upload
      description: |
        Returns a presigned URL to upload government ID images used in verification submission.
      operationId: getVerificationUploadUrl
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - content_type
              properties:
                content_type:
                  type: string
                  description: MIME type of the verification image (e.g. image/jpeg, image/png).
                  example: image/jpeg
      responses:
        '200':
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresignedUrlResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /verification/submit:
    post:
      tags:
        - Verification
      summary: Submit ID verification
      description: |
        Tasker submits government ID photos for manual verification.
        The storage keys must reference previously uploaded files via presigned URL.
      operationId: submitVerification
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id_card_front_key
                - id_card_back_key
                - consent_policy_version
                - consent_accepted
              properties:
                id_card_front_key:
                  type: string
                  description: Storage key of the uploaded ID card front image.
                id_card_back_key:
                  type: string
                  description: Storage key of the uploaded ID card back image.
                consent_policy_version:
                  type: string
                  description: Policy version accepted by the user before identity upload.
                consent_accepted:
                  type: boolean
                  enum:
                    - true
      responses:
        '200':
          description: Verification submitted successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationStatus'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Verification already submitted or approved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /verification/status:
    get:
      tags:
        - Verification
      summary: Check verification status
      description: Returns the current verification status for the authenticated user.
      operationId: getVerificationStatus
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Current verification status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /categories:
    get:
