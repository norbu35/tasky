  /notifications/devices:
    post:
      tags:
        - Notifications
      summary: Register push notification device
      description: Registers a device token for push notifications. Overwrites existing token for the same device.
      operationId: registerDevice
      security:
        - BearerAuth: []
      requestBody:
        required: true
